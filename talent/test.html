<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prueba de los 30 Segundos | Studio 42 Talent</title>
    
    <!-- Tipografías e Iconos idénticos a Talent -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --color-silver: #c4c4c4;
            --color-silver-light: #ffffff;
            --color-silver-dark: #8e8e93;
            --color-silver-glow: rgba(196, 196, 196, 0.4);
            --bg-dark: #07080b;
            --bg-card: rgba(13, 15, 21, 0.95);
            --surface-inner: #10131B;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-silver: rgba(196, 196, 196, 0.45);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            background-color: var(--bg-dark);
            color: #E2E8F0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 14px;
            overflow-x: hidden !important;
            background-image: radial-gradient(rgba(196, 196, 196, 0.12) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }

        .text-silver-gradient {
            background: linear-gradient(135deg, #FFFFFF 0%, #F1F5F9 40%, #E2E8F0 70%, #CBD5E1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 14px rgba(255, 255, 255, 0.25));
        }

        .card-titanium {
            width: 100%;
            max-width: 580px;
            background: linear-gradient(180deg, rgba(22, 25, 34, 0.96) 0%, rgba(11, 13, 18, 0.98) 100%);
            border: 1px solid var(--border-silver);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.98), 0 0 45px -5px rgba(196, 196, 196, 0.25);
            backdrop-filter: blur(20px);
            position: relative;
        }

        .bot-container {
            background: var(--surface-inner);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 22px 18px;
            margin-top: 20px;
            min-height: 370px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background-color: #1A1E27;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #94A3B8 0%, #FFFFFF 100%);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            width: 12.5%;
            transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-option {
            background: rgba(26, 30, 41, 0.7);
            border: 1px solid var(--border-subtle);
            color: #F1F5F9;
            padding: 15px 16px;
            border-radius: 14px;
            font-size: 0.88rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s ease;
            line-height: 1.45;
        }

        .btn-option:hover, .btn-option:active {
            border-color: #FFFFFF;
            background: rgba(38, 44, 60, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 255, 255, 0.15);
        }

        .input-field {
            background-color: #161A23;
            border: 1px solid var(--border-subtle);
            color: #FFFFFF;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 0.88rem;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #FFFFFF;
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.2);
            background-color: #1C2230;
        }

        .btn-silver-submit {
            background: linear-gradient(135deg, #FFFFFF 0%, #F1F5F9 25%, #CBD5E1 60%, #94A3B8 100%);
            color: #07080B;
            font-weight: 900;
            letter-spacing: 0.8px;
            padding: 16px;
            border-radius: 14px;
            font-size: 0.88rem;
            text-transform: uppercase;
            box-shadow: 0 6px 22px rgba(196, 196, 196, 0.35);
            cursor: pointer;
            transition: all 0.25s ease;
            width: 100%;
            margin-top: 8px;
        }

        .btn-silver-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(241, 245, 249, 0.55);
            filter: brightness(1.08);
        }

        .btn-retry {
            background-color: transparent;
            color: #FFFFFF;
            border: 1px solid var(--border-silver);
            padding: 13px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.84rem;
            cursor: pointer;
            margin-top: 16px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-retry:hover {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: #FFFFFF;
        }

        .badge-titanium {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-subtle);
            color: #94A3B8;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
        }
        .badge-titanium span { color: #FFFFFF; }
    </style>
</head>
<body>

<div class="card-titanium">
    <!-- CABECERA DE IMPACTO TITANIUM -->
    <div class="text-center mb-6">
        <div class="inline-flex items-center gap-2 bg-white/5 border border-white/20 px-3.5 py-1 rounded-full mb-3 backdrop-blur-md">
            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
            <span class="text-zinc-200 font-bold text-[10px] uppercase tracking-widest">Filtro de Admisión // Closers Studio 42</span>
        </div>
        
        <h1 class="font-display text-2xl sm:text-3xl font-black text-white tracking-tight mb-2">
            La Prueba de los <span class="text-silver-gradient">30 Segundos</span>
        </h1>
        <p class="text-xs text-zinc-400 font-light max-w-md mx-auto leading-relaxed">
            Evaluación técnica y comercial directa para representación de hardware NFC en Logroño y universidades.
        </p>
    </div>

    <!-- CONTENEDOR DEL TEST EVALUADOR -->
    <div class="bot-container" id="botBox">
        <div>
            <div class="flex justify-between items-center mb-2.5 text-xs font-mono font-bold tracking-wider">
                <span id="stepText" class="text-zinc-300">PREGUNTA 1 DE 8</span>
                <span id="percentText" class="text-cyan-300">12%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div id="quizContent"></div>
        </div>
    </div>

    <!-- PIE DE TARJETA ESTILO TALENT -->
    <footer class="mt-7 pt-5 border-t border-white/10 flex flex-col items-center gap-3.5">
        <div class="flex justify-center gap-2 flex-wrap">
            <div class="badge-titanium"><span>⚡</span> Demos 10s</div>
            <div class="badge-titanium"><span>💰</span> 40€ a 150€ / Cierre</div>
            <div class="badge-titanium"><span>📍</span> Cobro en el Día</div>
        </div>
        <div class="text-[11px] text-zinc-500 text-center font-light">
            <strong class="text-zinc-300">Studio 42</strong> © 2026 — Dirección de Talento & Expansión
        </div>
    </footer>
</div>

<script>
    const CONFIG = {
        agencyEmail: "ceo@studio42.es", // Correo oficial configurado
        totalQuestions: 8
    };

    let currentStep = 0;
    let userData = {
        q1: '', q2: '', q3: '', q4: '', q5: '', q6: '', q7: '', q8: '',
        nombre: '', telefono: '', email: '', universidad: '', perfil: ''
    };

    const questions = [
        {
            title: "1. ¿Cuál es tu situación administrativa actual para colaborar y generar ingresos?",
            options: [
                { text: "💼 Ya soy autónomo / profesional con capacidad de facturar mis comisiones", val: "Autónomo Activo", valid: true },
                { text: "🚀 Busco empezar como captador/embajador a prueba y formalizarme al consolidar ventas", val: "Captador Inicial", valid: true }
            ]
        },
        {
            title: "2. Nuestra solución requiere entrar a locales y hacer demostraciones. ¿Tienes soltura?",
            options: [
                { text: "😊 Sí, tengo agilidad para entrar, hablar con dueños/encargados y mostrar el producto", val: "Visita Presencial", valid: true },
                { text: "🖥️ No, únicamente acepto tareas remotas por ordenador o llamadas frías", val: "Solo Remoto", valid: false }
            ]
        },
        {
            title: "3. Vendemos hardware real (NFC y metacrilato) conectado a la nube. ¿Qué opinas de las demos de 10s?",
            options: [
                { text: "🔥 Es la clave. Apoyar la muestra en mostrador y que acerquen el móvil vende solo", val: "Demo Interactiva 10s", valid: true },
                { text: "📄 Prefiero repartir folletos de papel y esperar sentado a que llamen", val: "Folleto Pasivo", valid: false }
            ]
        },
        {
            title: "4. Facilitamos polo corporativo con chip NFC en la manga. ¿Qué valor le das a la imagen?",
            options: [
                { text: "👕 Fundamental. La estética tecnológica y la autoridad facilitan cerrar tratos", val: "Imagen Alta", valid: true },
                { text: "🤷 Me da igual, no creo que la presencia afecte a la confianza del cliente", val: "Imagen Baja", valid: false }
            ]
        },
        {
            title: "5. Studio 42 asume la fabricación técnica, software y soporte. ¿Qué te parece esta división?",
            options: [
                { text: "🛡️ Impecable. La agencia blinda el producto y yo me dedico a cerrar y cobrar", val: "Enfoque Comercial", valid: true },
                { text: "🛠️ Prefiero encargarme yo del soporte informático y programar las etiquetas", val: "Enfoque Técnico", valid: false }
            ]
        },
        {
            title: "6. Llegas a un local con gente y el encargado te dice: 'No tengo tiempo ahora'. ¿Cómo reaccionas?",
            options: [
                { text: "⚡ 'Solo 10 segundos: acerca tu móvil aquí. Si no te impresiona, me voy al instante'", val: "Proactivo 10s", valid: true },
                { text: "😔 Me doy media vuelta pidiendo perdón y descarto el establecimiento", val: "Abandono Pasivo", valid: false }
            ]
        },
        {
            title: "7. Cobras tu comisión directa vinculada al cierre de cada pedido. ¿Cómo valoras esta liquidez?",
            options: [
                { text: "💰 Excelente. Dinero directo por resultado que premia mi ritmo de visitas diario", val: "Liquidez Ágil", valid: true },
                { text: "📅 Prefiero esperar semanas o cierres de trimestre para cobrar incentivos", val: "Pago Diferido", valid: false }
            ]
        },
        {
            title: "8. Los clientes pueden renovar software o ampliar sedes. ¿Te interesa construir cartera?",
            options: [
                { text: "🌐 Sí, busco ganar hoy en mano pero también generar relaciones a largo plazo", val: "Visión Cartera", valid: true },
                { text: "💸 Solo me interesa hacer una venta rápida y olvidarme del cliente para siempre", val: "Cierre Único", valid: false }
            ]
        }
    ];

    function renderStep() {
        const quizContent = document.getElementById('quizContent');
        const progressFill = document.getElementById('progressFill');
        const stepText = document.getElementById('stepText');
        const percentText = document.getElementById('percentText');

        if (currentStep < questions.length) {
            const q = questions[currentStep];
            const percent = Math.round(((currentStep + 1) / CONFIG.totalQuestions) * 100);
            
            stepText.innerText = `PREGUNTA ${currentStep + 1} DE ${CONFIG.totalQuestions}`;
            percentText.innerText = `${percent}%`;
            progressFill.style.width = `${percent}%`;

            let html = `<div class="text-sm sm:text-base font-bold text-white mb-4 leading-snug">${q.title}</div><div class="flex flex-col gap-2.5">`;
            q.options.forEach((opt) => {
                html += `<button class="btn-option" onclick="handleOptionSelection(${opt.valid}, '${opt.val}')">${opt.text}</button>`;
            });
            html += `</div>`;
            quizContent.innerHTML = html;
        } else {
            stepText.innerText = "PRUEBA SUPERADA";
            percentText.innerText = "100%";
            progressFill.style.width = "100%";
            
            quizContent.innerHTML = `
                <div class="text-sm sm:text-base font-bold text-white mb-2 leading-snug">🎯 Perfil 100% Compatible con Studio 42</div>
                <p class="text-xs text-zinc-400 mb-4 font-light">Has superado la validación. Ingresa tus datos para registrar tu candidatura formal y agendar la entrega de tu kit oficial:</p>
                <div class="flex flex-col gap-2.5">
                    <input type="text" id="inputNombre" class="input-field" placeholder="Nombre y Apellidos" autocomplete="name" required>
                    <input type="tel" id="inputTel" class="input-field" placeholder="Teléfono / WhatsApp de contacto" autocomplete="tel" required>
                    <input type="email" id="inputEmail" class="input-field" placeholder="Correo Electrónico" autocomplete="email" required>
                    <input type="text" id="inputUni" class="input-field" placeholder="Universidad / Ciudad de residencia" required>
                    <select id="inputPerfil" class="input-field" required>
                        <option value="" disabled selected>Selecciona tu perfil de colaboración</option>
                        <option value="Autónomo con RETA / Agente Comercial">Ya soy Autónomo / Agente Comercial</option>
                        <option value="Estudiante / Captador Inicial a Prueba">Estudiante / Captador Inicial a Prueba</option>
                    </select>
                    <button class="btn-silver-submit" onclick="submitCandidaturaEmail()">ENVIAR CANDIDATURA A DIRECCIÓN</button>
                </div>
            `;
        }
    }

    function handleOptionSelection(isValid, value) {
        if (!isValid) {
            const quizContent = document.getElementById('quizContent');
            quizContent.innerHTML = `
                <div class="text-center py-6">
                    <div class="text-3xl mb-3">⚠️</div>
                    <div class="text-base font-bold text-white mb-2">Perfil Fuera de Alcance</div>
                    <p class="text-xs text-zinc-400 font-light leading-relaxed max-w-sm mx-auto mb-4">
                        En Studio 42 buscamos personas con enfoque comercial activo para demostraciones presenciales y cobro ágil por comisión directa en Logroño.
                    </p>
                    <button class="btn-retry" onclick="renderStep()">Rectificar respuesta</button>
                </div>
            `;
            return;
        }

        const keys = ['q1', 'q2', 'q3', 'q4', 'q5', 'q6', 'q7', 'q8'];
        userData[keys[currentStep]] = value;
        currentStep++;
        renderStep();
    }

    function submitCandidaturaEmail() {
        const nombre = document.getElementById('inputNombre').value.trim();
        const tel = document.getElementById('inputTel').value.trim();
        const email = document.getElementById('inputEmail').value.trim();
        const uni = document.getElementById('inputUni').value.trim();
        const perfilSelect = document.getElementById('inputPerfil');
        const perfil = perfilSelect ? perfilSelect.value : userData.q1;

        if (!nombre || !tel || !email || !uni || !perfil) {
            alert("Por favor, completa todos los campos (incluyendo tu perfil de colaboración) para tramitar tu solicitud.");
            return;
        }

        const asunto = encodeURIComponent(`Candidatura Closer Talent - ${nombre} (${uni})`);
        const cuerpo = encodeURIComponent(
            `NUEVA CANDIDATURA DE CLOSER TALENT - STUDIO 42\n\n` +
            `DATOS DEL ASPIRANTE:\n` +
            `• Nombre: ${nombre}\n` +
            `• Teléfono/WhatsApp: ${tel}\n` +
            `• Correo: ${email}\n` +
            `• Universidad / Ubicación: ${uni}\n` +
            `• Modalidad Administrativa: ${perfil}\n\n` +
            `RESULTADOS DEL TEST:\n` +
            `• Puntuación: 8/8 Respuestas Compatibles (Aprobado)\n` +
            `• Tipo de Respuesta Q1: ${userData.q1}\n` +
            `• Enfoque: Venta presencial B2B + Comisiones en el día + Demo 10s\n\n` +
            `El aspirante ha superado la prueba de los 30 segundos y solicita cita presencial para entrega de polo corporativo y muestras físicas.`
        );

        const mailtoUrl = `mailto:${CONFIG.agencyEmail}?subject=${asunto}&body=${cuerpo}`;

        const quizContent = document.getElementById('quizContent');
        quizContent.innerHTML = `
            <div class="text-center py-6">
                <div class="text-3xl mb-3 text-cyan-300"><i class="fa-solid fa-paper-plane"></i></div>
                <div class="text-base font-bold text-white mb-2">Candidatura Registrada</div>
                <p class="text-xs text-zinc-400 font-light mb-4">
                    Abriendo tu cliente de correo para transferir tu ficha técnica a Dirección...
                </p>
                <button class="btn-retry" onclick="window.location.href='${mailtoUrl}'">
                    Pulsa aquí si tu gestor de correo no se abrió automáticamente
                </button>
            </div>
        `;

        setTimeout(() => {
            window.location.href = mailtoUrl;
        }, 800);
    }

    renderStep();
</script>

</body>
</html>

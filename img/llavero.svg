<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Llavero Studio 42 Smart Drop en acabado titanio con isotipo del cohete">
  <title>Llavero Studio 42 Smart Drop · acabado titanio con isotipo grabado</title>
  <defs>
    <!-- Fondo gris exacto de las fotos de producto -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4c4c4"/>
      <stop offset="1" stop-color="#c4c4c4"/>
    </linearGradient>
    <!-- Cuerpo del llavero: gota alargada en inyección 3D con acabado titanio pulido -->
    <linearGradient id="body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f5f7fa"/>
      <stop offset=".18" stop-color="#d4d9e0"/>
      <stop offset=".48" stop-color="#8e8e93"/>
      <stop offset=".72" stop-color="#484b52"/>
      <stop offset="1" stop-color="#1a1b1f"/>
    </linearGradient>
    <linearGradient id="bodyRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset=".7" stop-color="#000000" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".6"/>
    </linearGradient>
    <radialGradient id="specular" cx=".32" cy=".28" r=".45">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Argolla cromada -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset=".5" stop-color="#8e8e93"/>
      <stop offset="1" stop-color="#2a2c30"/>
    </linearGradient>
    <!-- Zona de contacto NFC -->
    <radialGradient id="nfcGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Sombra bajo el llavero -->
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000000" stop-opacity=".45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Grabado láser suave para el isotipo -->
    <filter id="engrave" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- Fondo gris producto -->
  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- Sombra proyectada bajo el llavero -->
  <ellipse cx="500" cy="870" rx="300" ry="36" fill="url(#shadow)"/>

  <!-- Argolla metálica -->
  <g transform="translate(500 170)">
    <circle r="78" fill="none" stroke="url(#ring)" stroke-width="22"/>
    <circle r="78" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity=".4"/>
    <circle r="88" fill="none" stroke="#000000" stroke-width="1" stroke-opacity=".3"/>
    <!-- Pasador -->
    <rect x="-9" y="60" width="18" height="60" rx="4" fill="url(#ring)"/>
  </g>

  <!-- Cuerpo del llavero: gota pulida en inyección 3D -->
  <g transform="translate(500 540)">
    <!-- Silueta principal -->
    <path d="
      M 0,-240
      C 160,-240 260,-120 260,30
      C 260,210 150,310 0,310
      C -150,310 -260,210 -260,30
      C -260,-120 -160,-240 0,-240 Z"
      fill="url(#body)"
      stroke="url(#bodyRim)" stroke-width="4"/>

    <!-- Chaflán interior superior (acabado "proceso 3D") -->
    <path d="
      M 0,-215
      C 140,-215 230,-105 230,30
      C 230,200 140,285 0,285
      C -140,285 -230,200 -230,30
      C -230,-105 -140,-215 0,-215 Z"
      fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>

    <!-- Brillo especular -->
    <path d="
      M -170,-150
      C -40,-230 150,-200 220,-80
      C 180,-130 60,-160 -60,-110
      C -140,-70 -170,-10 -170,30
      Z" fill="url(#specular)"/>

    <!-- Zona NFC marcada en relieve suave -->
    <circle cx="0" cy="30" r="150" fill="none" stroke="#000000" stroke-opacity=".2" stroke-width="1.5"/>
    <circle cx="0" cy="30" r="150" fill="url(#nfcGlow)"/>

    <!-- Isotipo Studio 42 grabado por láser (cohete) -->
    <g filter="url(#engrave)" opacity=".55">
      <!-- Cuerpo del cohete -->
      <path d="M 0,-90 C 32,-90 54,-62 54,-20 L 54,70 C 54,98 32,120 0,120 C -32,120 -54,98 -54,70 L -54,-20 C -54,-62 -32,-90 0,-90 Z" fill="#0b0b0e"/>
      <!-- Ventana -->
      <circle cx="0" cy="-10" r="22" fill="#f4f6f9"/>
      <circle cx="0" cy="-10" r="22" fill="none" stroke="#0b0b0e" stroke-width="3"/>
      <!-- Aletas -->
      <path d="M -54,30 L -84,100 L -54,90 Z" fill="#0b0b0e"/>
      <path d="M 54,30 L 84,100 L 54,90 Z" fill="#0b0b0e"/>
      <!-- Llama -->
      <path d="M -18,120 L 0,170 L 18,120 Z" fill="#0b0b0e"/>
    </g>

    <!-- Textura metal cepillado en vertical -->
    <g opacity=".08">
      <path d="M -200,-200 L -200,280" stroke="#ffffff" stroke-width="1"/>
      <path d="M -150,-220 L -150,290" stroke="#ffffff" stroke-width="1"/>
      <path d="M -100,-230 L -100,295" stroke="#ffffff" stroke-width="1"/>
      <path d="M  -50,-235 L  -50,300" stroke="#ffffff" stroke-width="1"/>
      <path d="M   50,-235 L   50,300" stroke="#000000" stroke-width="1"/>
      <path d="M  100,-230 L  100,295" stroke="#000000" stroke-width="1"/>
      <path d="M  150,-220 L  150,290" stroke="#000000" stroke-width="1"/>
      <path d="M  200,-200 L  200,280" stroke="#000000" stroke-width="1"/>
    </g>

    <!-- Marca grabada -->
    <text x="0" y="235" text-anchor="middle" font-family="Inter Display, Inter, Arial, sans-serif" font-weight="800" font-size="22" fill="#0b0b0e" opacity=".65" letter-spacing="4">STUDIO 42</text>

    <!-- Pequeño símbolo NFC (ondas) -->
    <g transform="translate(-110 -140)" opacity=".55" stroke="#0b0b0e" fill="none" stroke-width="3" stroke-linecap="round">
      <path d="M 0,22 Q 0,0 22,0"/>
      <path d="M -8,30 Q -8,-8 30,-8"/>
      <circle cx="-4" cy="26" r="2" fill="#0b0b0e"/>
    </g>
  </g>
</svg>

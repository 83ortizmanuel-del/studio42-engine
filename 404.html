<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Studio 42 Engine Router</title>
    <script>
      const path = window.location.pathname;
      const search = window.location.search;

      // Si la URL intenta acceder a Comercios (/c/)
      if (path.includes('/c/')) {
          window.location.replace('/engine/c/index.html' + search);
      } 
      // Si la URL intenta acceder a AURA (/v/)
      else if (path.includes('/v/')) {
          window.location.replace('/engine/v/index.html' + search);
      } 
      // Si es cualquier otra ruta, manda a la raíz comercial con sus parámetros
      else {
          window.location.replace('/engine/c/index.html' + search);
      }
    </script>
  </head>
  <body>
  </body>
</html>

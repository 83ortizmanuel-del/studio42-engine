<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Studio 42 Engine Router</title>
    <script>
      const path = window.location.pathname;
      const search = window.location.search;

      // Redirección para Comercios (/c/)
      if (path.includes('/c/')) {
          window.location.replace('/c/index.html' + search);
      } 
      // Redirección para AURA (/v/)
      else if (path.includes('/v/')) {
          window.location.replace('/v/index.html' + search);
      } 
      // Si la ruta no coincide, enviar a la plantilla comercial principal
      else {
          window.location.replace('/c/index.html' + search);
      }
    </script>
  </head>
  <body>
  </body>
</html>

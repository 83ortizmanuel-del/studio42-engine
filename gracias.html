<!DOCTYPE html>

body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(800px 500px at 50% -10%,rgba(160,170,190,.18),transparent 60%),#07080b;color:#f4f6f9;font:400 1rem/1.6 "Inter",system-ui,sans-serif}

<body>

<script>

if(c)document.getElementById('ver').href='/c/?cod='+c;

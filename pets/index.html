<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pet Pass · Studio 42 Phygital · Chapa NFC con la ficha completa de tu mascota</title>
    <meta name="description" content="Pet Pass de Studio 42: la chapa NFC phygital que lleva al collar de tu mascota la ficha completa — datos, veterinario, vacunas, medicación, agenda y modo mascota perdida. El dueño edita con PIN, los demás solo leen.">
    <meta name="theme-color" content="#07080b">
    <link rel="canonical" href="https://studio42.es/pets/">
    <link rel="icon" href="../img/logo.webp" type="image/webp">
    <style>
        @font-face { font-family: "Inter"; font-weight: 400; font-display: swap; src: url("../fonts/Inter-Regular.woff") format("woff"); }
        @font-face { font-family: "Inter"; font-weight: 600; font-display: swap; src: url("../fonts/Inter-SemiBold.woff") format("woff"); }
        @font-face { font-family: "Inter Display"; font-weight: 800; font-display: swap; src: url("../fonts/InterDisplay-ExtraBold.woff") format("woff"); }
        :root { --ink:#07080b; --ink-2:#101216; --line:rgba(196,196,196,.18); --ti:#d5d9e0; --ti-grad:linear-gradient(135deg,#fff 0%,#e6eaf0 22%,#c4c4c4 48%,#8e8e93 74%,#d9dde3 100%); --bone:#f4f6f9; --muted:#9ea3ab; --wa:#25d366; --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444; --f-d:"Inter Display",system-ui,sans-serif; --f-b:"Inter",system-ui,-apple-system,sans-serif; }
        *,*::before,*::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body { margin: 0; min-height: 100vh; background: radial-gradient(1000px 500px at 50% -10%, rgba(150,160,180,.14), transparent 60%), var(--ink); color: var(--bone); font: 400 1rem/1.6 var(--f-b); }
        a { color: inherit; }
        .wrap { width: min(100% - 2rem, 720px); margin: 0 auto; padding: 1.6rem 0 5rem; }
        /* Cabecera */
        .top { display: flex; align-items: center; gap: .8rem; padding: .6rem 0 1.2rem; }
        .top img { width: 36px; height: 36px; filter: drop-shadow(0 0 6px rgba(217,160,45,.4)); }
        .top .brand { font: 800 1.1rem var(--f-d); }
        .top .powered { margin-left: auto; font-size: .76rem; color: var(--muted); text-decoration: none; text-align: right; }
        .top .powered strong { color: var(--bone); display: block; }
        .top .powered:hover { color: var(--bone); }

        /* MODO PERDIDA: banner urgente arriba */
        .perdida-banner { background: linear-gradient(135deg, #991b1b, #ef4444); color: #fff; padding: 1.2rem 1.3rem; border-radius: 16px; margin-bottom: 1.4rem; animation: urgent 2.4s ease-in-out infinite; }
        .perdida-banner .titulo { font: 800 1.2rem var(--f-d); display: flex; align-items: center; gap: .6rem; }
        .perdida-banner p { margin: .4rem 0 0; font-size: .95rem; }
        .perdida-banner .recompensa { margin-top: .6rem; display: inline-block; background: rgba(255,255,255,.2); padding: .3rem .7rem; border-radius: 999px; font-weight: 700; font-size: .88rem; }
        @keyframes urgent { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); } 50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } }

        /* Entregado por (partner) */
        .by-partner { display: flex; align-items: center; gap: .6rem; padding: .6rem .85rem; margin-bottom: 1rem; background: rgba(220,228,240,.05); border: 1px solid var(--line); border-radius: 12px; font-size: .82rem; color: var(--muted); }
        .by-partner strong { color: var(--bone); }
        .by-partner img { width: 28px; height: 28px; border-radius: 6px; object-fit: contain; background: #fff; padding: 2px; }

        /* Tarjeta cabecera mascota */
        .hero { background: linear-gradient(165deg, rgba(255,255,255,.08), rgba(220,228,240,.03) 70%); border: 1px solid var(--line); border-radius: 20px; padding: 1.4rem; display: grid; gap: 1rem; grid-template-columns: 92px 1fr; align-items: center; margin-bottom: 1.4rem; }
        .hero .foto { width: 92px; height: 92px; border-radius: 50%; background: var(--ti-grad); display: grid; place-items: center; font: 800 1.6rem var(--f-d); color: #0b0c0f; overflow: hidden; }
        .hero .foto img { width: 100%; height: 100%; object-fit: cover; }
        .hero h1 { margin: 0; font: 800 1.5rem/1.1 var(--f-d); letter-spacing: -.02em; }
        .hero .meta { margin-top: .3rem; font-size: .88rem; color: var(--muted); }
        .hero .tag-tipo { display: inline-block; padding: .18rem .55rem; border-radius: 999px; background: rgba(220,228,240,.14); font: 700 .7rem var(--f-b); letter-spacing: .04em; margin-right: .3rem; text-transform: uppercase; }
        .hero .state { display: inline-flex; align-items: center; gap: .4rem; margin-top: .55rem; padding: .25rem .6rem; border-radius: 999px; font: 700 .7rem var(--f-b); letter-spacing: .04em; }
        .state.on { background: rgba(34,197,94,.14); color: #86efac; }

        /* Próxima cita destacada */
        .next-apt { background: linear-gradient(135deg, rgba(96,165,250,.12), rgba(220,228,240,.04)); border: 1px solid rgba(96,165,250,.3); border-radius: 14px; padding: 1rem 1.2rem; margin-bottom: 1.1rem; display: flex; align-items: center; gap: 1rem; }
        .next-apt .ico-cita { width: 44px; height: 44px; background: rgba(96,165,250,.2); border-radius: 10px; display: grid; place-items: center; color: #93c5fd; flex: none; }
        .next-apt .ico-cita svg { width: 24px; height: 24px; }
        .next-apt .label { font: 700 .72rem var(--f-b); color: #93c5fd; letter-spacing: .06em; text-transform: uppercase; }
        .next-apt .fecha { font: 800 1.05rem var(--f-d); margin-top: .1rem; }
        .next-apt .motivo { font-size: .88rem; color: var(--muted); }

        /* Sección */
        .card { background: var(--ink-2); border: 1px solid var(--line); border-radius: 18px; padding: 1.3rem; margin-bottom: 1.1rem; }
        .card h2 { margin: 0 0 .9rem; font: 800 1.08rem var(--f-d); letter-spacing: .01em; display: flex; align-items: center; gap: .55rem; }
        .card h2 svg { width: 20px; height: 20px; color: var(--ti); flex: none; }
        .row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: .55rem 0; border-top: 1px solid var(--line); font-size: .95rem; }
        .row:first-of-type { border-top: 0; }
        .row .k { color: var(--muted); font-size: .84rem; }
        .row .v { font-weight: 600; text-align: right; }
        .pills { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .3rem; }
        .pill { display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .6rem; border-radius: 999px; font: 600 .76rem var(--f-b); border: 1px solid var(--line); }
        .pill.alert { background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.3); color: #fca5a5; }
        .pill.ok { background: rgba(34,197,94,.1); border-color: rgba(34,197,94,.3); color: #86efac; }

        /* Botones */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; font: 600 .92rem var(--f-b); padding: .85rem 1.2rem; border-radius: 14px; border: 1.5px solid transparent; cursor: pointer; min-height: 48px; text-decoration: none; width: 100%; transition: filter .2s, border-color .2s, background .2s; }
        .btn-primary { background: var(--ti-grad); color: #0b0c0f; }
        .btn-primary:hover { filter: brightness(1.07); }
        .btn-ghost { border-color: rgba(220,228,240,.3); color: var(--bone); background: transparent; }
        .btn-ghost:hover { border-color: #cfd4dc; background: rgba(220,228,240,.06); }
        .btn-danger { background: rgba(239,68,68,.12); color: #fca5a5; border-color: rgba(239,68,68,.4); }
        .btn-grid { display: grid; gap: .6rem; margin-top: 1rem; }
        .btn-wa { background: #25d366; color: #053f1b; }
        .btn-call { background: #22c55e; color: #052e1a; }

        /* Medicación programada */
        .med { padding: .9rem 0; border-top: 1px solid var(--line); }
        .med:first-child { border-top: 0; }
        .med .nombre { font-weight: 700; }
        .med .meta { font-size: .85rem; color: var(--muted); margin-top: .15rem; }
        .med .dosis { display: inline-block; margin-top: .25rem; padding: .15rem .5rem; background: rgba(220,228,240,.08); border-radius: 6px; font-size: .78rem; }

        /* Visitas / peso */
        .visita { padding: .9rem 0; border-top: 1px solid var(--line); display: grid; gap: .3rem; }
        .visita:first-child { border-top: 0; }
        .visita .fecha { font: 700 .78rem var(--f-b); color: var(--ti); letter-spacing: .04em; text-transform: uppercase; }
        .visita .motivo { font-weight: 600; }
        .visita .nota { font-size: .9rem; color: var(--muted); }
        .vacio { color: var(--muted); font-size: .9rem; padding: .8rem 0; }

        /* Gráfico simple de peso */
        .peso-chart { display: flex; align-items: flex-end; gap: .4rem; height: 90px; margin-top: .9rem; padding: 0 .2rem .4rem; border-bottom: 1px solid var(--line); }
        .peso-bar { flex: 1; background: linear-gradient(180deg, #cfd4dc, #8e8e93); border-radius: 4px 4px 0 0; position: relative; min-height: 10px; }
        .peso-bar::after { content: attr(data-v); position: absolute; top: -1.2rem; left: 50%; transform: translateX(-50%); font: 700 .7rem var(--f-b); color: var(--ti); }
        .peso-labels { display: flex; gap: .4rem; margin-top: .5rem; }
        .peso-label { flex: 1; text-align: center; font-size: .68rem; color: var(--muted); }

        /* Formularios panel */
        label { display: block; font: 700 .76rem var(--f-b); letter-spacing: .04em; color: var(--muted); margin: 1rem 0 .35rem; text-transform: uppercase; }
        input[type=text], input[type=tel], input[type=date], input[type=password], input[type=number], input[type=url], textarea, select { width: 100%; background: var(--ink); color: var(--bone); border: 1.5px solid var(--line); border-radius: 10px; padding: .75rem .85rem; font: 400 .95rem var(--f-b); min-height: 46px; }
        textarea { min-height: 80px; resize: vertical; }
        input:focus, textarea:focus, select:focus { outline: 2px solid var(--ti); outline-offset: 2px; }
        .grid-2 { display: grid; gap: .6rem; }
        @media (min-width: 540px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
        .toggle { display: flex; align-items: center; justify-content: space-between; padding: .9rem; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; gap: 1rem; margin-top: .5rem; }
        .toggle .lbl { font-weight: 600; }
        .toggle .sw { width: 46px; height: 26px; background: var(--ink); border: 1.5px solid var(--line); border-radius: 999px; position: relative; flex: none; transition: background .2s, border-color .2s; }
        .toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
        .toggle.on .sw { background: rgba(239,68,68,.3); border-color: #ef4444; }
        .toggle.on .sw::after { transform: translateX(20px); background: #fca5a5; }

        /* Modal panel edición */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.84); z-index: 50; display: none; padding: 1rem; overflow: auto; }
        .modal.on { display: block; }
        .modal-box { background: var(--ink-2); border: 1px solid var(--line); border-radius: 20px; max-width: 640px; margin: 1rem auto; padding: 1.5rem; }
        .modal-box h2 { margin: 0 0 .5rem; font: 800 1.3rem var(--f-d); }
        .modal-box p.lead { color: var(--muted); font-size: .9rem; margin: 0 0 1rem; }
        .close { background: transparent; border: 1px solid var(--line); color: var(--bone); width: 40px; height: 40px; border-radius: 50%; float: right; cursor: pointer; font-size: 1.1rem; }
        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: .35rem; margin: 1rem 0; }
        .tab { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: .55rem .3rem; border-radius: 10px; cursor: pointer; font: 600 .76rem var(--f-b); min-height: 40px; }
        .tab.on { background: rgba(220,228,240,.14); color: var(--bone); border-color: #cfd4dc; }
        .tab-pane { display: none; }
        .tab-pane.on { display: block; }
        .add-row { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
        .add-row input, .add-row select { flex: 1 1 100px; min-height: 42px; min-width: 0; }
        .add-btn { background: var(--ti); color: #0b0c0f; border: none; border-radius: 10px; padding: 0 1rem; font-weight: 700; cursor: pointer; min-height: 42px; flex: none; }
        .list-item { background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: .7rem .9rem; margin-top: .5rem; display: flex; align-items: start; justify-content: space-between; gap: .7rem; }
        .list-item .main { flex: 1; min-width: 0; }
        .list-item strong { display: block; }
        .list-item small { color: var(--muted); font-size: .82rem; display: block; }
        .del { background: transparent; border: 1px solid rgba(239,68,68,.3); color: #fca5a5; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; flex: none; }
        .sub-section { margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid var(--line); }
        .sub-section h3 { margin: 0 0 .5rem; font-size: .95rem; font-weight: 700; }

        /* Toast */
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--ink-2); color: var(--bone); border: 1px solid #cfd4dc; padding: .8rem 1.2rem; border-radius: 999px; font: 600 .9rem var(--f-b); box-shadow: 0 20px 40px rgba(0,0,0,.5); z-index: 60; transition: transform .3s; max-width: 90vw; }
        .toast.on { transform: translateX(-50%) translateY(0); }

        /* Botón fijo del dueño */
        .fab { position: fixed; right: 16px; bottom: 16px; background: var(--ti-grad); color: #0b0c0f; border: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; box-shadow: 0 20px 40px rgba(0,0,0,.5); z-index: 40; transition: transform .2s; }
        .fab:hover { transform: scale(1.08); }
        .fab svg { width: 22px; height: 22px; }

        .loading { text-align: center; padding: 3rem 0; color: var(--muted); }
        .error { text-align: center; padding: 2rem; background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.3); border-radius: 14px; color: #fca5a5; }
        .footer-mini { margin-top: 2rem; text-align: center; font-size: .78rem; color: var(--muted); }
        .footer-mini a { color: var(--ti); text-decoration: none; }
        @media (max-width: 420px) { .hero { grid-template-columns: 72px 1fr; padding: 1.1rem; } .hero .foto { width: 72px; height: 72px; } .tabs { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <div class="wrap" id="wrap">
        <header class="top">
            <img src="../img/logo.webp" alt="">
            <span class="brand">Studio 42</span>
            <a class="powered" href="https://studio42.es/pets/clinicas/"><strong>Pet Pass</strong>Identidad phygital para mascotas</a>
        </header>
        <div id="app"><p class="loading">Cargando ficha de la mascota…</p></div>
        <div class="footer-mini">Chapa fabricada por <a href="https://studio42.es">Studio 42</a> · Agencia phygital en Logroño</div>
    </div>

    <button class="fab" id="fab" aria-label="Panel del dueño" title="Panel del dueño">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </button>

    <!-- Modal panel del dueño -->
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
        <div class="modal-box">
            <button class="close" id="m-close" aria-label="Cerrar">×</button>
            <h2 id="m-title">Panel del dueño</h2>
            <p class="lead" id="m-lead">Introduce el PIN para desbloquear la edición.</p>
            <div id="m-body"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    (function () {
        'use strict';
        var $ = function (s) { return document.querySelector(s); };
        var $$ = function (s) { return [].slice.call(document.querySelectorAll(s)); };
        var app = $('#app');
        var LS_KEY, LS_LOCK_KEY, data, locked = true;

        var params = new URLSearchParams(location.search);
        var id = params.get('id') || 'demo';
        LS_KEY = 's42_pet_' + id;
        LS_LOCK_KEY = 's42_pet_lock_' + id;

        fetch(id + '.json', { cache: 'no-cache' })
            .then(function (r) { if (!r.ok) throw new Error('No existe la ficha ' + id); return r.json(); })
            .then(function (base) {
                data = base;
                try { var saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (saved) data = saved; } catch (e) {}
                try { var l = localStorage.getItem(LS_LOCK_KEY); if (l !== null) locked = l === '1'; } catch (e) {}
                normalizar();
                render();
            })
            .catch(function (e) {
                app.innerHTML = '<div class="error"><strong>No se encuentra la ficha.</strong><br>' + e.message + '<br><br>Prueba con <a href="?id=demo" style="color:#cfd4dc">?id=demo</a>.</div>';
            });

        function normalizar() {
            if (!data.modoPerdida) data.modoPerdida = { activo: false, mensaje: '', recompensa: '' };
            if (!data.medicacion) data.medicacion = [];
            if (!data.pesos) data.pesos = [];
            if (!data.vacunas) data.vacunas = [];
            if (!data.visitas) data.visitas = [];
            if (!data.vet) data.vet = {};
            if (!data.peluqueria) data.peluqueria = {};
            if (!data.seguro) data.seguro = {};
            if (!data.proximaCita) data.proximaCita = {};
            if (!data.entregadoPor) data.entregadoPor = {};
            if (!data.tipo) data.tipo = 'perro';
        }

        function render() {
            document.title = (data.nombre || 'Pet Pass') + ' · Studio 42 Pet Pass';
            var dog = data;
            var html = '';

            // MODO PERDIDA
            if (dog.modoPerdida && dog.modoPerdida.activo) {
                html += '<div class="perdida-banner">';
                html += '<div class="titulo">🚨 ' + esc(dog.nombre || 'Esta mascota') + ' está perdida</div>';
                html += '<p>' + esc(dog.modoPerdida.mensaje || 'Avisa al dueño cuanto antes.') + '</p>';
                if (dog.modoPerdida.recompensa) html += '<div class="recompensa">Recompensa: ' + esc(dog.modoPerdida.recompensa) + '</div>';
                html += '</div>';
            }

            // Entregado por (partner)
            if (dog.entregadoPor && dog.entregadoPor.nombre) {
                html += '<div class="by-partner">';
                if (dog.entregadoPor.logoUrl) html += '<img src="' + esc(dog.entregadoPor.logoUrl) + '" alt="">';
                html += '<div>' + esc(dog.entregadoPor.mensaje || 'Chapa entregada por') + ' <strong>' + esc(dog.entregadoPor.nombre) + '</strong></div>';
                html += '</div>';
            }

            // Cabecera mascota
            html += '<div class="hero">';
            html += '  <div class="foto">' + (dog.fotoUrl ? '<img src="' + esc(dog.fotoUrl) + '" alt="">' : esc((dog.nombre || '?').charAt(0))) + '</div>';
            html += '  <div>';
            html += '    <h1>' + esc(dog.nombre || 'Sin nombre') + '</h1>';
            var metaBits = [dog.raza, dog.sexo, dog.color, dog.fechaNac].filter(Boolean);
            html += '    <div><span class="tag-tipo">' + esc(dog.tipo || 'mascota') + '</span><span style="font-size:.86rem;color:var(--muted)">' + esc(metaBits.join(' · ')) + '</span></div>';
            if (!dog.modoPerdida.activo) html += '<span class="state on">● Ficha ' + (locked ? 'activa' : 'edición abierta') + '</span>';
            html += '  </div></div>';

            // Próxima cita destacada
            if (dog.proximaCita && dog.proximaCita.fecha) {
                html += '<div class="next-apt">';
                html += '  <div class="ico-cita"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></div>';
                html += '  <div><div class="label">Próxima cita</div><div class="fecha">' + formatearFecha(dog.proximaCita.fecha) + '</div><div class="motivo">' + esc(dog.proximaCita.motivo || '') + (dog.proximaCita.clinica ? ' · ' + esc(dog.proximaCita.clinica) : '') + '</div></div>';
                html += '</div>';
            }

            // SOS: botones principales
            if (dog.contactoNombre || dog.contactoTelefono) {
                html += '<div class="card">';
                html += '<h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9a2 2 0 0 1 3.4 0l8 13.9A2 2 0 0 1 20 21H4a2 2 0 0 1-1.7-3.2z"/><path d="M12 9v5M12 17v.5"/></svg>¿Encontraste a ' + esc(dog.nombre || 'esta mascota') + '?</h2>';
                html += '<p style="color:var(--muted);font-size:.9rem;margin:.2rem 0 .9rem">Avisa al dueño. Normalmente responde en minutos.</p>';
                html += '<div class="btn-grid">';
                if (dog.contactoTelefono) html += '<a class="btn btn-call" href="tel:' + esc(dog.contactoTelefono) + '">📞 Llamar a ' + esc(dog.contactoNombre || 'el dueño') + '</a>';
                if (dog.contactoWhatsapp) {
                    var msg = encodeURIComponent('¡Hola! Acabo de escanear la chapa de ' + (dog.nombre || 'tu mascota') + ' y la tengo conmigo. ¿Cómo coordinamos?');
                    html += '<a class="btn btn-wa" href="https://wa.me/' + esc(dog.contactoWhatsapp.replace(/[^0-9]/g, '')) + '?text=' + msg + '" target="_blank" rel="noopener">💬 Avisar por WhatsApp</a>';
                }
                html += '<button class="btn btn-ghost" onclick="PETS.compartirUbicacion()">📍 Enviar mi ubicación GPS al dueño</button>';
                if (dog.contactoRespaldoTelefono) html += '<a class="btn btn-ghost" href="tel:' + esc(dog.contactoRespaldoTelefono) + '">Contacto de respaldo · ' + esc(dog.contactoRespaldoNombre || '') + '</a>';
                html += '</div></div>';
            }

            // Alertas críticas

        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
        function formatearFecha(f) {
            if (!f) return '';
            var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(f);
            if (!m) return esc(f);
            var meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
            return m[3] + ' ' + meses[+m[2]-1] + ' ' + m[1];
        }

        var modal = $('#modal'), mBody = $('#m-body'), mLead = $('#m-lead'), mTitle = $('#m-title');

        function abrirPanel() { if (locked) pedirPIN(); else mostrarEditor(); modal.classList.add('on'); }
        function cerrar() { modal.classList.remove('on'); }

        function pedirPIN() {
            mTitle.textContent = 'Panel del dueño';
            mLead.textContent = 'Introduce el PIN para desbloquear la edición. Mientras esté bloqueada, cualquiera que escanee la chapa solo puede leer.';
            mBody.innerHTML =
                '<label for="pin">PIN de 4 a 6 dígitos</label>' +
                '<input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">' +
                '<p id="pin-err" style="color:#fca5a5;font-size:.85rem;margin:.5rem 0 0;display:none">PIN incorrecto. Prueba otra vez.</p>' +
                '<div class="btn-grid" style="margin-top:1.1rem"><button class="btn btn-primary" id="pin-ok">Desbloquear</button></div>' +
                '<p style="color:var(--muted);font-size:.78rem;margin-top:1rem;text-align:center">¿Olvidaste el PIN? Escribe por WhatsApp a +34 672 294 962.</p>';
            setTimeout(function () { $('#pin').focus(); }, 50);
            $('#pin-ok').addEventListener('click', function () {
                var pin = $('#pin').value; if (!pin) return;
                sha256(pin).then(function (h) {
                    if (h === data.pinHash) {
                        locked = false; try { localStorage.setItem(LS_LOCK_KEY, '0'); } catch (e) {}
                        mostrarEditor(); render(); toast('Panel desbloqueado');
                    } else { $('#pin-err').style.display = 'block'; $('#pin').value = ''; $('#pin').focus(); }
                });
            });
            $('#pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#pin-ok').click(); });
        }

        function pintarVisitas() {
            var box = $('#nv-list'); if (!box) return; box.innerHTML = '';
            if (!data.visitas.length) { box.innerHTML = '<p class="vacio">Todavía no hay visitas.</p>'; return; }
            data.visitas.slice().reverse().forEach(function (v, idx) {
                var realIdx = data.visitas.length - 1 - idx;
                var el = document.createElement('div'); el.className = 'list-item';
                el.innerHTML = '<div class="main"><strong>' + esc(v.motivo) + '</strong><small>' + esc(v.fecha) + (v.nota ? ' · ' + esc(v.nota) : '') + '</small></div><button class="del" aria-label="Borrar">×</button>';
                el.querySelector('.del').addEventListener('click', function () { data.visitas.splice(realIdx, 1); pintarVisitas(); });
                box.appendChild(el);
            });
        }

        function paneSos() {
            var p = data.modoPerdida || {};
            $('[data-pane=sos]').innerHTML =
                '<p style="color:var(--muted);font-size:.9rem;margin:0 0 .8rem">Activa el modo mascota perdida y la chapa mostrará un banner urgente arriba del todo con tu mensaje. Desactívalo cuando aparezca.</p>' +
                '<div class="toggle' + (p.activo ? ' on' : '') + '" id="sos-toggle" role="button" tabindex="0"><span class="lbl">🚨 Mascota perdida</span><span class="sw"></span></div>' +
                '<label>Mensaje para quien la encuentre</label>' +
                '<textarea id="sos-msg" placeholder="¡Se ha perdido! Por favor contacta ya.">' + esc(p.mensaje || '') + '</textarea>' +
                '<label>Recompensa (opcional)</label>' +
                '<input type="text" id="sos-recomp" placeholder="p. ej. 50 € a quien la devuelva" value="' + esc(p.recompensa || '') + '">';
            var tog = $('#sos-toggle');
            tog.addEventListener('click', function () { data.modoPerdida.activo = !data.modoPerdida.activo; tog.classList.toggle('on', data.modoPerdida.activo); });
        }

        function recolectar() {
            try {
                data.tipo = $('#f-tipo').value;
                data.nombre = $('#f-nombre').value.trim();
                data.raza = $('#f-raza').value.trim();
                data.sexo = $('#f-sexo').value;
                data.color = $('#f-color').value.trim();
                data.fechaNac = $('#f-fechaNac').value.trim();
                data.peso = $('#f-peso').value ? parseFloat($('#f-peso').value) : null;
                var cv = $('#f-castrado').value; data.castrado = cv === 'si' ? true : (cv === 'no' ? false : null);
                data.microchip = $('#f-microchip').value.trim();
                data.pasaporteEuropeo = $('#f-pasaporteEuropeo').value.trim();
                data.fotoUrl = $('#f-fotoUrl').value.trim();
                data.contactoNombre = $('#f-contactoNombre').value.trim();
                data.contactoTelefono = $('#f-contactoTelefono').value.trim();
                data.contactoWhatsapp = $('#f-contactoWhatsapp').value.trim();
                data.contactoRespaldoNombre = $('#f-contactoRespaldoNombre').value.trim();
                data.contactoRespaldoTelefono = $('#f-contactoRespaldoTelefono').value.trim();
                data.alimentacion = $('#f-alimentacion').value.trim();
                data.caracter = $('#f-caracter').value.trim();
                data.alertas = $('#f-alertas').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
                data.vet = { clinica: $('#f-vet-clinica').value.trim(), doctor: $('#f-vet-doctor').value.trim(), telefono: $('#f-vet-telefono').value.trim(), direccion: $('#f-vet-direccion').value.trim() };
                data.peluqueria = { nombre: $('#f-pel-nombre').value.trim(), telefono: $('#f-pel-telefono').value.trim(), ultimoCorte: $('#f-pel-ultimoCorte').value, frecuencia: $('#f-pel-frecuencia').value.trim() };
                data.seguro = { compania: $('#f-seg-compania').value.trim(), poliza: $('#f-seg-poliza').value.trim(), telefono: $('#f-seg-telefono').value.trim() };
                data.proximaCita = { fecha: $('#pc-fecha').value, motivo: $('#pc-motivo').value.trim(), clinica: $('#pc-clinica').value.trim() };
                data.modoPerdida.mensaje = $('#sos-msg').value.trim();
                data.modoPerdida.recompensa = $('#sos-recomp').value.trim();
                return true;
            } catch (e) { toast('No se pudo guardar: ' + e.message); return false; }
        }

        function persistir() { try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e) {} }

        function cambiarPIN() {
            var actual = prompt('Introduce el PIN actual:'); if (!actual) return;
            sha256(actual).then(function (h) {
                if (h !== data.pinHash) { toast('PIN actual incorrecto'); return; }
                var nuevo = prompt('Nuevo PIN (4 a 6 dígitos):'); if (!nuevo || nuevo.length < 4) return;
                sha256(nuevo).then(function (hn) { data.pinHash = hn; persistir(); toast('PIN cambiado'); });
            });
        }

        window.PETS = {
            compartirUbicacion: function () {
                if (!navigator.geolocation) { toast('Este móvil no permite enviar ubicación'); return; }
                navigator.geolocation.getCurrentPosition(function (p) {
                    var url = 'https://maps.google.com/?q=' + p.coords.latitude + ',' + p.coords.longitude;
                    var msg = encodeURIComponent('¡Hola! Tengo a ' + (data.nombre || 'tu mascota') + ' conmigo. Mi ubicación: ' + url);
                    if (data.contactoWhatsapp) location.href = 'https://wa.me/' + data.contactoWhatsapp.replace(/[^0-9]/g, '') + '?text=' + msg;
                    else toast('No hay WhatsApp del dueño configurado');
                }, function () { toast('No se pudo obtener la ubicación'); });
            }
        };

        function sha256(str) {
            var enc = new TextEncoder().encode(str);
            return crypto.subtle.digest('SHA-256', enc).then(function (buf) {
                return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
            });
        }

        var toastEl = $('#toast'), toTimer;
        function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toTimer); toTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 2200); }
    })();
    </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pet Pass · Studio 42</title>
<meta name="description" content="Pet Pass de Studio 42: la chapa NFC phygital con la ficha de tu mascota. Contacto del dueño en un toque, salud, agenda veterinaria y modo mascota perdida.">
<meta name="theme-color" content="#07080b">
<meta name="robots" content="noindex">
<link rel="icon" href="../img/logo.webp" type="image/webp">
<style>
@font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url("../fonts/Inter-Regular.woff") format("woff")}
@font-face{font-family:"Inter";font-weight:600;font-display:swap;src:url("../fonts/Inter-SemiBold.woff") format("woff")}
@font-face{font-family:"Inter Display";font-weight:800;font-display:swap;src:url("../fonts/InterDisplay-ExtraBold.woff") format("woff")}
:root{--ink:#07080b;--ink2:#0f1115;--card:#14171c;--line:rgba(220,228,240,.13);--bone:#f4f6f9;--muted:#9aa0a9;--ti:linear-gradient(135deg,#fff 0%,#e6eaf0 22%,#c4c4c4 48%,#8e8e93 74%,#d9dde3 100%);--red:#ef4444;--green:#22c55e;--wa:#25d366;--blue:#60a5fa;--fd:"Inter Display","Inter",system-ui,sans-serif;--fb:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(900px 520px at 50% -12%,rgba(160,170,190,.18),transparent 62%),var(--ink);color:var(--bone);font:400 1rem/1.5 var(--fb);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #e6eaf0;outline-offset:3px;border-radius:8px}
.app{width:min(100%,480px);margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 110px}
.top{display:flex;align-items:center;gap:.55rem;padding:4px 2px 14px}
.top img{width:30px;height:30px}
.top b{font:800 1rem var(--fd)}
.top span{margin-left:auto;font:700 .66rem var(--fb);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}

/* Splash de lectura NFC */
.splash{position:fixed;inset:0;z-index:90;background:var(--ink);display:grid;place-items:center;transition:opacity .45s,visibility .45s}
.splash.off{opacity:0;visibility:hidden}
.splash .disc{width:96px;height:96px;border-radius:50%;background:var(--ti);display:grid;place-items:center;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.splash .disc svg{width:44px;height:44px;color:#0b0c0f}
.splash .disc::before,.splash .disc::after{content:"";position:absolute;inset:-16px;border-radius:50%;border:2px solid rgba(230,235,242,.5);animation:ripple 1.4s ease-out infinite}
.splash .disc::after{animation-delay:.5s}
.splash p{margin:22px 0 0;text-align:center;font:700 .74rem var(--fb);letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
@keyframes ripple{0%{transform:scale(.7);opacity:0}30%{opacity:1}100%{transform:scale(1.7);opacity:0}}

/* Banner mascota perdida */
.lost{border-radius:22px;padding:18px 18px 16px;margin-bottom:14px;background:linear-gradient(135deg,#7f1d1d,#dc2626);box-shadow:0 0 0 0 rgba(239,68,68,.6);animation:alarm 1.8s infinite}
.lost h2{margin:0;font:800 1.35rem var(--fd);letter-spacing:-.01em}
.lost p{margin:.35rem 0 0;font-size:.95rem}
.lost .rw{display:inline-block;margin-top:.6rem;background:rgba(255,255,255,.2);padding:.3rem .75rem;border-radius:99px;font-weight:700;font-size:.85rem}
@keyframes alarm{0%{box-shadow:0 0 0 0 rgba(239,68,68,.55)}70%{box-shadow:0 0 0 14px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}

/* Tarjeta pasaporte */
.pass{position:relative;border-radius:28px;padding:26px 20px 20px;text-align:center;overflow:hidden;background:linear-gradient(165deg,#1d2026,#0f1115 70%);border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 70px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.12)}
.pass::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);pointer-events:none}
.pass::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.09),transparent);transform:skewX(-18deg);animation:sheen 6s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%,60%{left:-60%}100%{left:140%}}
.badge-top{position:absolute;top:14px;left:16px;font:700 .62rem var(--fb);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.badge-ok{position:absolute;top:12px;right:14px;display:flex;align-items:center;gap:.3rem;font:700 .64rem var(--fb);color:#86efac;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);padding:.2rem .5rem;border-radius:99px}
.avatar{position:relative;width:118px;height:118px;margin:6px auto 14px}
.avatar .ring{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,#fff,#8e8e93,#e6eaf0,#5b5f66,#fff);animation:spin 7s linear infinite}
.avatar .ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#14171c}
.avatar .pic{position:absolute;inset:4px;border-radius:50%;overflow:hidden;background:var(--ti);display:grid;place-items:center;font-size:3.1rem}
.avatar .pic img{width:100%;height:100%;object-fit:cover}
@keyframes spin{to{transform:rotate(360deg)}}
.pass h1{margin:0;font:800 2.2rem/1 var(--fd);letter-spacing:-.03em;background:linear-gradient(180deg,#fff 20%,#c9ced6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pass .sub{margin-top:.4rem;color:var(--muted);font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:.35rem;margin-top:.8rem}
.chip{font:600 .72rem var(--fb);padding:.25rem .6rem;border-radius:99px;background:rgba(220,228,240,.08);border:1px solid var(--line)}

/* Acciones principales */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 14px}
.act{display:flex;flex-direction:column;align-items:center;gap:.45rem;padding:14px 6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font:600 .78rem var(--fb);transition:transform .15s,border-color .2s}
.act:active{transform:scale(.96)}
.act i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 24px -8px currentColor}
.act i svg{width:24px;height:24px;color:#06210f}
.act.call i{background:var(--green);color:rgba(34,197,94,.6)}
.act.wa i{background:var(--wa);color:rgba(37,211,102,.6)}
.act.gps i{background:var(--ti);color:rgba(220,228,240,.5)}
.act.gps i svg{color:#0b0c0f}

/* Alertas */
.alert{display:flex;gap:.7rem;align-items:flex-start;padding:12px 14px;border-radius:16px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#fecaca;font-size:.88rem;margin-bottom:14px}
.alert svg{width:20px;height:20px;flex:none;color:#f87171;margin-top:1px}
.alert b{color:#fff}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 6px;text-align:center}
.tile b{display:block;font:800 1.05rem var(--fd);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{display:block;margin-top:.15rem;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile.blue b{color:#93c5fd}

/* Pestañas */
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{position:relative;z-index:1;border:0;background:none;padding:.65rem 0;font:600 .86rem var(--fb);color:var(--muted);transition:color .2s}
.seg button.on{color:#0b0c0f}
.seg .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:10px;background:var(--ti);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.pane{display:none;animation:up .3s ease-out}
.pane.on{display:block}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.box h3{margin:0 0 .5rem;font:700 .7rem var(--fb);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.li{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-top:1px solid var(--line);font-size:.92rem}
.li:first-of-type{border-top:0}
.li span{color:var(--muted)}
.li b{font-weight:600;text-align:right}
.txt{font-size:.92rem;color:#d6d9de}
.empty{font-size:.88rem;color:var(--muted)}
.ok-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:.4rem}
.next{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(96,165,250,.14),rgba(96,165,250,.03));border-color:rgba(96,165,250,.35)}
.next .cal{width:52px;flex:none;border-radius:12px;overflow:hidden;text-align:center;background:#fff;color:#111}
.next .cal small{display:block;background:#ef4444;color:#fff;font:700 .62rem var(--fb);padding:2px 0;text-transform:uppercase}
.next .cal b{display:block;font:800 1.35rem/1.5 var(--fd)}
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl div{position:relative;padding:.35rem 0 .7rem}
.tl div::before{content:"";position:absolute;left:-18px;top:.7rem;width:10px;height:10px;border-radius:50%;background:#cfd4dc;box-shadow:0 0 0 3px var(--card)}
.tl small{font:700 .7rem var(--fb);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tl p{margin:.1rem 0 0;font-weight:600}
.tl em{display:block;font-style:normal;font-size:.86rem;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:6px}
.bars i{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#e6eaf0,#6b7079);position:relative}
.bars i::after{content:attr(data-v);position:absolute;top:-17px;left:50%;transform:translateX(-50%);font:700 .64rem var(--fb);color:#cfd4dc}
.mini-btn{display:flex;align-items:center;justify-content:center;gap:.4rem;margin-top:.7rem;padding:.7rem;border-radius:12px;border:1px solid rgba(220,228,240,.3);font:600 .86rem var(--fb)}
.foot{margin-top:22px;text-align:center;font-size:.76rem;color:var(--muted)}
.foot b{color:var(--bone)}
.foot a{color:#cfd4dc;text-decoration:underline;text-underline-offset:3px}
.demo-tag{display:block;text-align:center;font:600 .74rem var(--fb);color:#fcd34d;background:rgba(252,211,77,.08);border:1px solid rgba(252,211,77,.25);border-radius:12px;padding:.5rem .7rem;margin-bottom:12px}

/* Botón editar */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;gap:.5rem;padding:.8rem 1.2rem;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:rgba(20,23,28,.85);backdrop-filter:blur(12px);font:600 .85rem var(--fb);box-shadow:0 18px 40px rgba(0,0,0,.55)}
.fab svg{width:16px;height:16px}

/* Chapa sin activar */
.blank{text-align:center;padding:30px 4px 0}
.blank .disc{width:170px;height:170px;margin:10px auto 26px;border-radius:50%;background:var(--ti);position:relative;display:grid;place-items:center;box-shadow:0 40px 80px -24px rgba(0,0,0,.9),0 0 70px -20px rgba(220,228,240,.5)}
.blank .disc::before{content:"";position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:30px;height:38px;border:8px solid #cfd4dc;border-radius:50%;z-index:-1}
.blank .disc svg{width:64px;height:64px;color:#0b0c0f}
.blank .disc span{position:absolute;inset:-18px;border-radius:50%;border:2px solid rgba(220,228,240,.35);animation:ripple 2.4s ease-out infinite}
.blank .disc span+span{animation-delay:1.2s}
.blank h1{margin:0;font:800 2rem/1.05 var(--fd);letter-spacing:-.03em;background:linear-gradient(180deg,#fff 20%,#c9ced6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.blank p{color:var(--muted);margin:.8rem auto 0;max-width:24em}
.blank .by{display:inline-block;margin-top:1rem;font:600 .78rem var(--fb);padding:.35rem .8rem;border-radius:99px;border:1px solid var(--line);color:#d6d9de}
.steps3{display:grid;gap:8px;margin:26px 0 22px;text-align:left}
.steps3 div{display:flex;gap:.8rem;align-items:center;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:.9rem}
.steps3 b{width:28px;height:28px;flex:none;border-radius:50%;background:var(--ti);color:#0b0c0f;display:grid;place-items:center;font:800 .85rem var(--fd)}
.cta{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:1.05rem;border:0;border-radius:18px;background:var(--ti);color:#0b0c0f;font:700 1rem var(--fb);box-shadow:0 18px 40px -14px rgba(220,228,240,.55);position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-18deg);animation:sheen 4.5s ease-in-out infinite}
.cta:disabled{opacity:.6}
.ghost{display:flex;align-items:center;justify-content:center;width:100%;padding:.95rem;border-radius:18px;border:1px solid rgba(220,228,240,.3);background:transparent;font:600 .95rem var(--fb)}

/* Asistente (activar / editar) */
.wiz{position:fixed;inset:0;z-index:60;background:var(--ink);overflow-y:auto;display:none}
.wiz.on{display:block}
.wiz .in{width:min(100%,480px);margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 120px}
.wbar{display:flex;align-items:center;gap:.7rem;margin-bottom:14px}
.wbar button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.wbar .prog{flex:1;height:5px;border-radius:9px;background:rgba(220,228,240,.12);overflow:hidden}
.wbar .prog i{display:block;height:100%;background:var(--ti);border-radius:9px;transition:width .35s}
.wbar small{font:700 .72rem var(--fb);color:var(--muted)}
.wtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.wtabs button{flex:none;padding:.45rem .8rem;border-radius:99px;border:1px solid var(--line);background:none;font:600 .78rem var(--fb);color:var(--muted)}
.wtabs button.on{background:rgba(220,228,240,.14);color:var(--bone);border-color:#cfd4dc}
.wstep{display:none;animation:up .3s ease-out}
.wstep.on{display:block}
.wstep h2{margin:0;font:800 1.7rem/1.1 var(--fd);letter-spacing:-.02em}
.wstep .hint{margin:.4rem 0 1.1rem;color:var(--muted);font-size:.92rem}
.f{margin-bottom:12px}
.f label{display:block;font:700 .7rem var(--fb);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:.35rem}
.f input,.f select,.f textarea{width:100%;background:var(--ink2);border:1.5px solid var(--line);border-radius:14px;padding:.85rem .95rem;font-size:1rem;min-height:52px}
.f textarea{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:#cfd4dc;box-shadow:0 0 0 3px rgba(220,228,240,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-up{display:block;width:120px;height:120px;margin:0 auto 16px;border-radius:50%;border:2px dashed rgba(220,228,240,.35);background:var(--ink2);overflow:hidden;position:relative;cursor:pointer}
.photo-up img{width:100%;height:100%;object-fit:cover}
.photo-up span{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:600 .78rem var(--fb);color:var(--muted);padding:10px}
.photo-up input{display:none}
.species{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.species button{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);background:var(--ink2);font-size:1.5rem;display:grid;place-items:center;transition:transform .15s,border-color .2s,background .2s}
.species button.on{border-color:#e6eaf0;background:rgba(220,228,240,.14);transform:scale(1.05)}
.pick{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--ink2);border:1.5px solid var(--line);border-radius:14px;padding:3px}
.pick button{border:0;background:none;padding:.7rem .3rem;border-radius:11px;font:600 .9rem var(--fb);color:var(--muted)}
.pick button.on{background:var(--ti);color:#0b0c0f}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .7rem;border-radius:99px;font:600 .8rem var(--fb);border:1px solid var(--line);background:var(--ink2)}
.tag.on{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.45);color:#fecaca}
.tag.vac.on{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.45);color:#bbf7d0}
.tag x{opacity:.7;font-weight:800}
.addrow{display:flex;gap:6px}
.addrow input{flex:1;min-width:0;background:var(--ink2);border:1.5px solid var(--line);border-radius:12px;padding:.7rem .8rem;min-height:46px}
.addrow button{flex:none;width:46px;border-radius:12px;border:0;background:var(--ti);color:#0b0c0f;font:800 1.2rem var(--fb)}
.item{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.6rem .8rem;margin-top:6px;border-radius:12px;background:var(--ink2);border:1px solid var(--line);font-size:.88rem}
.item small{display:block;color:var(--muted)}
.item button{width:30px;height:30px;flex:none;border-radius:50%;border:1px solid rgba(239,68,68,.35);background:none;color:#fca5a5}
details.more{margin-top:8px;border:1px solid var(--line);border-radius:16px;padding:0 14px;background:var(--card)}
details.more summary{list-style:none;padding:14px 0;font:600 .92rem var(--fb);display:flex;justify-content:space-between}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:1.2rem;color:var(--muted)}
details.more[open] summary::after{content:"–"}
.sw{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--ink2);margin-bottom:12px;width:100%;text-align:left}
.sw i{width:50px;height:30px;flex:none;border-radius:99px;background:#2a2e35;position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{border-color:rgba(239,68,68,.6);background:rgba(239,68,68,.08)}
.sw.on i{background:var(--red)}
.sw.on i::after{transform:translateX(20px)}
.wfoot{position:fixed;left:0;right:0;bottom:0;z-index:61;background:linear-gradient(180deg,transparent,var(--ink) 30%);padding:24px 16px max(16px,env(safe-area-inset-bottom))}
.wfoot .in2{width:min(100%,448px);margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:10px}
.wfoot .back{padding:0 1.2rem;border-radius:18px;border:1px solid rgba(220,228,240,.3);background:var(--card);font:600 .95rem var(--fb)}

/* Teclado PIN */
.pinwrap{text-align:center}
.dots{display:flex;justify-content:center;gap:12px;margin:20px 0 8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(220,228,240,.4);transition:background .15s,transform .15s}
.dots i.f{background:#e6eaf0;border-color:#e6eaf0;transform:scale(1.1)}
.dots.err{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pinmsg{min-height:1.4em;font-size:.88rem;color:var(--muted)}
.pinmsg.bad{color:#fca5a5}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center;margin-top:16px}
.pad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:600 1.5rem var(--fd);transition:background .1s,transform .1s}
.pad button:active{background:rgba(220,228,240,.18);transform:scale(.94)}
.pad .fn{border:0;background:none;font-size:.9rem;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{width:min(100%,480px);background:var(--ink2);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:22px 20px max(26px,env(safe-area-inset-bottom));animation:sheet .3s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0;font:800 1.35rem var(--fd);text-align:center}
.sheet .close{display:block;margin:16px auto 0;border:0;background:none;color:var(--muted);font:600 .9rem var(--fb)}

/* Pantalla de éxito */
.done{position:fixed;inset:0;z-index:80;background:var(--ink);display:none;place-items:center;text-align:center;padding:24px}
.done.on{display:grid}
.done .ck{width:110px;height:110px;margin:0 auto 22px;border-radius:50%;background:var(--ti);display:grid;place-items:center;box-shadow:0 0 0 0 rgba(220,228,240,.5);animation:pop .5s cubic-bezier(.2,1.6,.4,1),glow 2s .5s infinite}
.done .ck svg{width:54px;height:54px;color:#0b0c0f;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .35s forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(220,228,240,.45)}100%{box-shadow:0 0 0 26px rgba(220,228,240,0)}}
.done h2{margin:0;font:800 1.9rem var(--fd);letter-spacing:-.02em}
.done p{color:var(--muted);max-width:22em;margin:.7rem auto 1.6rem}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(11,12,15,.25);border-top-color:#0b0c0f;animation:spin .8s linear infinite}
.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));pointer-events:none;transform:translate(-50%,-20px);opacity:0;z-index:95;background:#1d2026;border:1px solid #cfd4dc;padding:.7rem 1.1rem;border-radius:99px;font:600 .88rem var(--fb);transition:.3s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
@media (max-width:360px){.tiles{grid-template-columns:repeat(2,1fr)}.pad{grid-template-columns:repeat(3,64px)}.pad button{width:64px;height:64px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>

var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
var id=(new URLSearchParams(location.search).get('id')||'demo').toLowerCase().replace(/[^a-z0-9-]/g,'');
var DEMO=id==='demo'||id==='nueva';
var KC='s42pet_cache_'+id, KH='s42pet_hash_'+id;
var ficha=null, estado='', partner='', pinOK='', modo='';

var ICO={
 phone:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>',
 wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.3-.5.1-1 .1-3.3-.8a10.6 10.6 0 0 1-4.2-3.7 4.7 4.7 0 0 1-1-2.5 2.7 2.7 0 0 1 .9-2c.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6a7.8 7.8 0 0 0 1.4 1.8 7 7 0 0 0 2.1 1.3c.3.1.4.1.6-.1l.8-1c.2-.2.4-.2.6-.1l1.9.9c.3.1.5.2.5.3a2.3 2.3 0 0 1-.2 1.4z"/></svg>',

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function edad(f){var m=/^(\d{4})(?:-(\d{2}))?/.exec(f||'');if(!m)return f||'';var n=new Date(),a=n.getFullYear()-m[1],mm=(n.getMonth()+1)-(+m[2]||1);if(mm<0){a--;mm+=12}return a>0?a+(a===1?' año':' años'):(mm<=0?'Cachorro':mm+(mm===1?' mes':' meses'))}

function vacia(){return{tipo:'perro',nombre:'',raza:'',color:'',sexo:'',fechaNac:'',peso:null,castrado:null,microchip:'',pasaporteEuropeo:'',foto:'',contactoNombre:'',contactoTelefono:'',contactoWhatsapp:'',contactoRespaldoNombre:'',contactoRespaldoTelefono:'',alimentacion:'',caracter:'',alertas:[],medicacion:[],vacunas:[],visitas:[],pesos:[],proximaCita:{},vet:{},peluqueria:{},seguro:{},modoPerdida:{activo:false,mensaje:'',recompensa:''}}}
function norm(f){var v=vacia();Object.keys(v).forEach(function(k){if(f[k]==null)f[k]=v[k]});['proximaCita','vet','peluqueria','seguro','modoPerdida'].forEach(function(k){if(typeof f[k]!=='object'||Array.isArray(f[k]))f[k]=v[k]});if(f.fotoUrl&&!f.foto)f.foto=f.fotoUrl;if(f.tipo==='hurón')f.tipo='huron';return f}

/* ---------- Carga ---------- */
function cargar(){
  var cache=lsGet(KC);
  if(DEMO){
    if(cache){ficha=norm(cache);estado='activa';return Promise.resolve()}
    if(id==='nueva'){estado='libre';partner='Clínica Veterinaria (ejemplo)';return Promise.resolve()}
    return fetch('demo.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){ficha=norm(j);estado='activa';if(!lsGet(KH))lsSet(KH,j.pinHash)});
  }
  return fetch(id+'.json?t='+Date.now(),{cache:'no-store'}).then(function(r){
    if(r.ok)return r.json().then(function(j){
      ficha=norm((cache&&cache.actualizado&&(!j.actualizado||cache.actualizado>j.actualizado))?cache:j);estado='activa';
    });
    if(cache){ficha=norm(cache);estado='activa';return}
    return api({accion:'pet_estado',slug:id}).then(function(r){estado=r.estado||'desconocida';partner=r.entregadoPor||''}).catch(function(){estado='sin-conexion'});
  });
}

function li(k,v){return v?'<div class="li"><span>'+esc(k)+'</span><b>'+esc(v)+'</b></div>':''}
function compartirGPS(){
  var wa=digits(ficha.contactoWhatsapp||ficha.contactoTelefono);if(!wa){toast('No hay WhatsApp configurado');return}
  if(!navigator.geolocation){location.href='https://wa.me/'+wa;return}
  toast('Obteniendo tu ubicación…');
  navigator.geolocation.getCurrentPosition(function(p){
    var m=encodeURIComponent('¡Hola! Tengo a '+ficha.nombre+' conmigo. Estoy aquí: https://maps.google.com/?q='+p.coords.latitude.toFixed(5)+','+p.coords.longitude.toFixed(5));
    location.href='https://wa.me/'+wa+'?text='+m;
  },function(){toast('No se pudo obtener la ubicación');},{enableHighAccuracy:true,timeout:10000});

   '<div class="disc"><span></span><span></span>'+ICO.nfc+'</div>'+

var paso=0, borr=null;
function abrirWizard(m){
  modo=m; borr=norm(JSON.parse(JSON.stringify(ficha||vacia()))); paso=0;
  var tabs=$('#wTabs'); tabs.hidden=m!=='editar';
  tabs.innerHTML=['Mascota','Familia','Salud','Agenda','Guardar'].map(function(n,i){return'<button type="button" data-i="'+i+'">'+n+'</button>'}).join('');
  $$('button',tabs).forEach(function(b){b.onclick=function(){leerPaso();ir(+b.dataset.i)}});
  $('#wSteps').innerHTML=PASOS.map(function(p,i){return'<div class="wstep" data-s="'+i+'"></div>'}).join('');
  PASOS.forEach(function(p,i){p.r($('.wstep[data-s="'+i+'"]'))});

function cerrarWizard(){$('#wiz').classList.remove('on');document.body.style.overflow=''}
function ir(n){
  paso=n;
  $$('.wstep').forEach(function(s,i){s.classList.toggle('on',i===n)});
  $$('#wTabs button').forEach(function(b,i){b.classList.toggle('on',i===n)});
  $('#wProg').style.width=((n+1)/PASOS.length*100)+'%';
  $('#wCount').textContent=(n+1)+'/'+PASOS.length;
  $('#wBack').style.visibility=n?'visible':'hidden';
  var last=n===PASOS.length-1;
  $('#wNext').innerHTML=last?(modo==='activar'?'Activar y bloquear':'Guardar y bloquear'):'Siguiente';
  $('#wiz').scrollTop=0;
}
$('#wClose').onclick=function(){if(confirm('¿Salir sin guardar?'))cerrarWizard()};
$('#wBack').onclick=function(){leerPaso();if(paso)ir(paso-1)};
$('#wNext').onclick=function(){
  leerPaso();
  if(paso===0&&!borr.nombre){toast('Escribe el nombre de la mascota');$('#iNombre').focus();return}
  if(paso===1&&!digits(borr.contactoTelefono)){toast('Falta el teléfono de la familia');$('#iTel').focus();return}
  if(paso<PASOS.length-1){ir(paso+1);return}
  if(!borr.nombre){ir(0);toast('Falta el nombre');return}
  if(!digits(borr.contactoTelefono)){ir(1);toast('Falta el teléfono');return}

};
function campo(id,lbl,val,extra){return'<div class="f"><label for="'+id+'">'+lbl+'</label><input id="'+id+'" value="'+esc(val||'')+'" '+(extra||'')+'></div>'}
function pick(name,ops,val){return'<div class="pick" data-pick="'+name+'">'+ops.map(function(o){return'<button type="button" data-v="'+esc(o[0])+'"'+(String(val)===String(o[0])?' class="on"':'')+'>'+o[1]+'</button>'}).join('')+'</div>'}
function enlazarPicks(root){$$('.pick',root).forEach(function(p){$$('button',p).forEach(function(b){b.onclick=function(){$$('button',p).forEach(function(o){o.classList.toggle('on',o===b)});}})})}
function valorPick(root,name){var b=$('[data-pick="'+name+'"] button.on',root);return b?b.dataset.v:''}

   '<div class="species">'+Object.keys(ESPECIES).map(function(k){return'<button type="button" data-t="'+k+'"'+(f.tipo===k?' class="on"':'')+' aria-label="'+k+'">'+ESPECIES[k]+'</button>'}).join('')+'</div>'+
   campo('iNombre','Nombre',f.nombre,'autocomplete="off" maxlength="40" placeholder="Toby"')+
   '<div class="row2">'+campo('iRaza','Raza',f.raza,'placeholder="Mestizo"')+campo('iColor','Color',f.color,'placeholder="Canela"')+'</div>'+

   '<div class="row2">'+campo('iNac','Nacimiento',/^\d{4}-\d{2}/.test(f.fechaNac)?f.fechaNac.slice(0,7):'','type="month"')+campo('iPeso','Peso (kg)',f.peso,'type="number" step="0.1" inputmode="decimal"')+'</div>';
  $$('.species button',el).forEach(function(b){b.onclick=function(){$$('.species button',el).forEach(function(o){o.classList.toggle('on',o===b)});borr.tipo=b.dataset.t;if(!borr.foto)$('.photo-up span',el).innerHTML=ESPECIES[b.dataset.t]+'<br>Añadir foto'}});
  function alFoto(e){var file=e.target.files[0];if(!file)return;reducir(file,function(d){borr.foto=d;$('.photo-up',el).innerHTML='<img src="'+d+'" alt=""><input type="file" accept="image/*" id="iFoto">';$('#iFoto').onchange=alFoto})}

function reducir(file,cb){var img=new Image(),url=URL.createObjectURL(file);img.onload=function(){var s=360,w=img.width,h=img.height,k=Math.min(1,s/Math.min(w,h)),cw=Math.round(w*k),ch=Math.round(h*k),cv=document.createElement('canvas'),side=Math.min(cw,ch);cv.width=side;cv.height=side;cv.getContext('2d').drawImage(img,(side-cw)/2,(side-ch)/2,cw,ch);cb(cv.toDataURL('image/jpeg',.78));URL.revokeObjectURL(url)};img.src=url}

var SUG_AL=['Alergia alimentaria','Medicación diaria','Epilepsia','Diabetes','Cardiopatía','Sordera','Miedo a ruidos','Reactivo con perros','No tocar: muerde'];
var SUG_VAC=['Rabia','Polivalente','Leishmaniosis','Desparasitación interna','Desparasitación externa'];
function pasoSalud(el){
  var f=borr;
  el.innerHTML='<h2>'+PASOS[2].t+'</h2><p class="hint">'+PASOS[2].h+'</p>'+
   '<div class="f"><label>Alertas importantes</label><div class="tagbox" id="tAl"></div><div class="addrow"><input id="nAl" placeholder="Otra alerta (p. ej. alérgico al pollo)"><button type="button" id="bAl">+</button></div></div>'+
   '<div class="f"><label>Vacunas al día</label><div class="tagbox" id="tVac"></div></div>'+
   '<div class="f"><label>Medicación</label><div id="lMed"></div><div class="addrow" style="margin-top:6px"><input id="nMed" placeholder="Medicamento y dosis"><input id="nMedH" placeholder="Cuándo" style="max-width:34%"><button type="button" id="bMed">+</button></div></div>'+
   '<div class="row2">'+campo('iChip','Microchip',f.microchip,'inputmode="numeric" maxlength="20"')+'<div class="f"><label>Castrado/a</label>'+pick('castrado',[['true','Sí'],['false','No']],f.castrado)+'</div></div>'+
   '<details class="more"><summary>Alimentación, carácter y pasaporte</summary>'+campo('iAli','Alimentación',f.alimentacion,'placeholder="Pienso, tomas al día…"')+
   '<div class="f"><label for="iCar">Carácter</label><textarea id="iCar" placeholder="Sociable, miedo a petardos…">'+esc(f.caracter)+'</textarea></div>'+campo('iPas','Pasaporte europeo',f.pasaporteEuropeo)+'</details>';
  function pintarAl(){var todos=SUG_AL.concat(f.alertas.filter(function(a){return SUG_AL.indexOf(a)<0}));$('#tAl').innerHTML=todos.map(function(a){var on=f.alertas.indexOf(a)>=0;return'<button type="button" class="tag'+(on?' on':'')+'" data-a="'+esc(a)+'">'+(on?'⚠ ':'')+esc(a)+'</button>'}).join('');$$('#tAl .tag').forEach(function(b){b.onclick=function(){var a=b.dataset.a,i=f.alertas.indexOf(a);if(i>=0)f.alertas.splice(i,1);else f.alertas.push(a);pintarAl()}})}
  function pintarVac(){var todos=SUG_VAC.concat(f.vacunas.map(function(v){return v.nombre}).filter(function(n){return SUG_VAC.indexOf(n)<0}));$('#tVac').innerHTML=todos.map(function(n){var on=f.vacunas.some(function(v){return v.nombre===n});return'<button type="button" class="tag vac'+(on?' on':'')+'" data-n="'+esc(n)+'">'+(on?'✓ ':'')+esc(n)+'</button>'}).join('');$$('#tVac .tag').forEach(function(b){b.onclick=function(){var n=b.dataset.n,i=-1;f.vacunas.forEach(function(v,j){if(v.nombre===n)i=j});if(i>=0)f.vacunas.splice(i,1);else f.vacunas.push({nombre:n,fecha:new Date().toISOString().slice(0,10)});pintarVac()}})}
  function pintarMed(){$('#lMed').innerHTML=f.medicacion.map(function(m,i){return'<div class="item"><div>'+esc(m.nombre)+(m.horario?'<small>'+esc(m.horario)+'</small>':'')+'</div><button type="button" data-i="'+i+'" aria-label="Quitar">✕</button></div>'}).join('');$$('#lMed button').forEach(function(b){b.onclick=function(){f.medicacion.splice(+b.dataset.i,1);pintarMed()}})}
  pintarAl();pintarVac();pintarMed();
  $('#bAl').onclick=function(){var v=$('#nAl').value.trim();if(v&&f.alertas.indexOf(v)<0)f.alertas.push(v);$('#nAl').value='';pintarAl()};
  $('#bMed').onclick=function(){var v=$('#nMed').value.trim();if(!v)return;f.medicacion.push({nombre:v,dosis:'',horario:$('#nMedH').value.trim()});$('#nMed').value='';$('#nMedH').value='';pintarMed()};
  enlazarPicks(el);
}
function pasoVet(el){
  var f=borr,pc=f.proximaCita||{},hoy=new Date().toISOString().slice(0,10);
  el.innerHTML='<h2>'+PASOS[3].t+'</h2><p class="hint">'+PASOS[3].h+'</p>'+
   campo('iVC','Clínica veterinaria',f.vet.clinica||partner)+'<div class="row2">'+campo('iVD','Profesional',f.vet.doctor)+campo('iVT','Teléfono',f.vet.telefono,'type="tel" inputmode="tel"')+'</div>'+
   '<div class="row2">'+campo('iPF','Próxima cita',pc.fecha,'type="date"')+campo('iPM','Motivo',pc.motivo,'placeholder="Vacuna anual"')+'</div>'+
   '<div class="f"><label>Añadir visita de hoy (opcional)</label><div class="addrow"><input id="nVis" placeholder="Motivo (revisión, vacuna…)"><input id="nVisP" placeholder="Peso kg" inputmode="decimal" style="max-width:28%"><button type="button" id="bVis">+</button></div><div id="lVis"></div></div>'+
   '<details class="more"><summary>Peluquería y seguro (opcional)</summary>'+campo('iPelN','Peluquería',f.peluqueria.nombre)+'<div class="row2">'+campo('iPelT','Teléfono',f.peluqueria.telefono,'type="tel"')+campo('iPelU','Último corte',f.peluqueria.ultimoCorte,'type="date"')+'</div>'+
   campo('iSegC','Aseguradora',f.seguro.compania)+'<div class="row2">'+campo('iSegP','Nº póliza',f.seguro.poliza)+campo('iSegT','Tel. siniestros',f.seguro.telefono,'type="tel"')+'</div></details>';
  function pintarVis(){$('#lVis').innerHTML=f.visitas.slice().reverse().slice(0,5).map(function(v,i){var real=f.visitas.length-1-i;return'<div class="item"><div>'+esc(v.motivo)+'<small>'+fecha(v.fecha)+(v.nota?' · '+esc(v.nota):'')+'</small></div><button type="button" data-i="'+real+'" aria-label="Quitar">✕</button></div>'}).join('');$$('#lVis button').forEach(function(b){b.onclick=function(){f.visitas.splice(+b.dataset.i,1);pintarVis()}})}
  pintarVis();
  $('#bVis').onclick=function(){var m=$('#nVis').value.trim();if(!m)return;var p=parseFloat(($('#nVisP').value||'').replace(',','.'));f.visitas.push({fecha:hoy,motivo:m,nota:p?('Peso '+p+' kg'):''});if(p){f.pesos.push({fecha:hoy,peso:p});f.peso=p;var ip=$('#iPeso');if(ip)ip.value=p}$('#nVis').value='';$('#nVisP').value='';pintarVis();toast('Visita añadida')};
}
function pasoFinal(el){
  var f=borr;
  if(modo==='activar'){
    el.innerHTML='<div style="text-align:center;padding-top:10px"><div class="avatar" style="margin-bottom:18px"><div class="ring"></div><div class="pic" id="finPic"></div></div><h2 id="finName"></h2><p class="hint">Último paso: elige un PIN de 4 a 6 números. Con él podrás editar la ficha. Sin él, nadie puede cambiar nada.</p></div>'+
     '<div class="steps3"><div><b>✓</b>Quien escanee verá la ficha y podrá llamar a la familia</div><div><b>✓</b>Solo con el PIN se puede editar</div><div><b>✓</b>Puedes activar “mascota perdida” en cualquier momento</div></div>';
  }else{
    el.innerHTML='<h2>Guardar cambios</h2><p class="hint">Si se ha perdido, activa la alerta: la ficha mostrará un aviso rojo a quien la escanee.</p>'+
     '<button type="button" class="sw'+(f.modoPerdida.activo?' on':'')+'" id="swLost"><span><b>🚨 Mascota perdida</b><br><small style="color:var(--muted)">Aviso urgente en la ficha</small></span><i></i></button>'+
     '<div id="lostBox"'+(f.modoPerdida.activo?'':' hidden')+'><div class="f"><label for="iLM">Mensaje</label><textarea id="iLM" placeholder="Se perdió en el parque del Ebro…">'+esc(f.modoPerdida.mensaje)+'</textarea></div>'+campo('iLR','Recompensa (opcional)',f.modoPerdida.recompensa)+'</div>';
    $('#swLost').onclick=function(){this.classList.toggle('on');$('#lostBox').hidden=!this.classList.contains('on')};
  }

function v(id){var e=document.getElementById(id);return e?e.value.trim():null}
function leerPaso(){
  var f=borr, root=$('.wstep[data-s="'+paso+'"]'), x;
  if(paso===0){f.nombre=v('iNombre');f.raza=v('iRaza');f.color=v('iColor');f.sexo=valorPick(root,'sexo');f.fechaNac=v('iNac')||'';x=parseFloat((v('iPeso')||'').replace(',','.'));f.peso=x>0?x:null;
    var fp=$('#finPic'),fn=$('#finName');if(fp)fp.innerHTML=f.foto?'<img src="'+esc(f.foto)+'" alt="">':ESPECIES[f.tipo];if(fn)fn.textContent=f.nombre}
  if(paso===1){f.contactoNombre=v('iCN');f.contactoTelefono=v('iTel');f.contactoWhatsapp=$('#swWa').classList.contains('on')?v('iWa'):f.contactoTelefono;f.contactoRespaldoNombre=v('iRN');f.contactoRespaldoTelefono=v('iRT')}
  if(paso===2){f.microchip=v('iChip');x=valorPick(root,'castrado');f.castrado=x==='true'?true:(x==='false'?false:null);f.alimentacion=v('iAli');f.caracter=v('iCar');f.pasaporteEuropeo=v('iPas')}
  if(paso===3){f.vet={clinica:v('iVC'),doctor:v('iVD'),telefono:v('iVT'),direccion:f.vet.direccion||''};f.proximaCita={fecha:v('iPF'),motivo:v('iPM'),clinica:v('iVC')};f.peluqueria={nombre:v('iPelN'),telefono:v('iPelT'),ultimoCorte:v('iPelU')};f.seguro={compania:v('iSegC'),poliza:v('iSegP'),telefono:v('iSegT')}}
  if(paso===4&&modo==='editar'){f.modoPerdida={activo:$('#swLost').classList.contains('on'),mensaje:v('iLM')||'',recompensa:v('iLR')||''}}
  if(paso===0){var fp2=$('#finPic');if(fp2)fp2.innerHTML=f.foto?'<img src="'+esc(f.foto)+'" alt="">':ESPECIES[f.tipo]}
}

/* ---------- Guardar ---------- */
function guardar(pin){
  var btn=$('#wNext');btn.disabled=true;btn.innerHTML='<span class="spin"></span>&nbsp;Guardando en la nube…';
  var fin=function(ok,err){btn.disabled=false;ir(paso);if(!ok){toast(err||'No se pudo guardar');return}
    ficha=borr;estado='activa';lsSet(KC,ficha);cerrarWizard();
    $('#doneT').textContent=modo==='activar'?'¡Pet Pass activado!':'Cambios guardados';
    $('#doneP').textContent=modo==='activar'?'La ficha de '+ficha.nombre+' ya está bloqueada. Quien escanee la chapa solo puede leerla.':'La ficha vuelve a estar bloqueada en modo lectura.';
    $('#done').classList.add('on');pinOK='';};
  borr.actualizado=new Date().toISOString();
  if(DEMO){
    sha(pin).then(function(h){if(modo==='activar')lsSet(KH,h);setTimeout(function(){fin(true)},900)});
    return;
  }
  api({accion:'pet_guardar',slug:id,pin:pin,ficha:borr}).then(function(r){
    if(r.ok){borr=norm(r.ficha||borr);borr.actualizado=r.ficha&&r.ficha.actualizado||borr.actualizado;fin(true)}else fin(false,r.error)
  }).catch(function(){fin(false,'Sin conexión con el servidor. Inténtalo de nuevo en un momento.')});
}
$('#doneBtn').onclick=function(){$('#done').classList.remove('on');verFicha();window.scrollTo(0,0)};

/* ---------- PIN ---------- */
var pinBuf='',pinCb=null,pinFase='',pinPrimero='';
function pedirPin(fase,cb){
  pinFase=fase;pinCb=cb;pinBuf='';pinPrimero='';
  $('#pinTitle').textContent=fase==='nuevo'?'Crea un PIN':'Introduce el PIN';
  msgPin(fase==='nuevo'?'De 4 a 6 números. Apúntalo en un sitio seguro.':'Para editar la ficha de '+(ficha?ficha.nombre:'la mascota'),false);
  pintarDots();$('#pinModal').classList.add('on');
}
function msgPin(t,bad){var m=$('#pinMsg');m.textContent=t;m.classList.toggle('bad',!!bad)}
function pintarDots(){var n=Math.max(4,pinBuf.length+(pinBuf.length<6&&pinBuf.length>=4?1:0));$('#dots').innerHTML=Array.from({length:Math.min(n,6)},function(_,i){return'<i'+(i<pinBuf.length?' class="f"':'')+'></i>'}).join('')}
$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9].map(function(n){return'<button type="button" data-k="'+n+'">'+n+'</button>'}).join('')+'<button type="button" class="fn" data-k="del">Borrar</button><button type="button" data-k="0">0</button><button type="button" class="fn" data-k="ok">OK</button>';
$$('#pad button').forEach(function(b){b.onclick=function(){tecla(b.dataset.k)}});
document.addEventListener('keydown',function(e){if(!$('#pinModal').classList.contains('on'))return;if(/^[0-9]$/.test(e.key))tecla(e.key);else if(e.key==='Backspace')tecla('del');else if(e.key==='Enter')tecla('ok');else if(e.key==='Escape')cerrarPin()});
function tecla(k){
  if(k==='del'){pinBuf=pinBuf.slice(0,-1);pintarDots();return}
  if(k==='ok'){confirmarPin();return}
  if(pinBuf.length>=6)return;pinBuf+=k;pintarDots();
}
function errorPin(t){msgPin(t,true);var d=$('#dots');d.classList.remove('err');void d.offsetWidth;d.classList.add('err');pinBuf='';setTimeout(pintarDots,350)}
function confirmarPin(){
  if(pinBuf.length<4){errorPin('Mínimo 4 números');return}
  if(pinFase==='nuevo'){
    if(!pinPrimero){pinPrimero=pinBuf;pinBuf='';$('#pinTitle').textContent='Repite el PIN';msgPin('Para confirmar',false);pintarDots();return}
    if(pinBuf!==pinPrimero){pinPrimero='';$('#pinTitle').textContent='Crea un PIN';errorPin('No coinciden. Vuelve a empezar.');return}
    var p=pinBuf;cerrarPin();pinCb&&pinCb(p);return;
  }
  var p2=pinBuf;msgPin('Comprobando…',false);
  if(DEMO){sha(p2).then(function(h){if(h===lsGet(KH)){cerrarPin();pinCb&&pinCb(p2)}else errorPin('PIN incorrecto')});return}
  api({accion:'pet_verificar',slug:id,pin:p2}).then(function(r){if(r.ok){cerrarPin();pinCb&&pinCb(p2,r.libre)}else errorPin(r.error||'PIN incorrecto')}).catch(function(){errorPin('Sin conexión. Prueba otra vez.')});
}
function cerrarPin(){$('#pinModal').classList.remove('on')}
$('#pinClose').onclick=cerrarPin;
$('#fab').onclick=function(){pedirPin('abrir',function(p,libre){pinOK=p;abrirWizard(libre?'activar':'editar')})};

/* ---------- Arranque ---------- */
var t0=Date.now();
cargar().catch(function(){estado='sin-conexion'}).then(function(){
  setTimeout(function(){$('#splash').classList.add('off')},Math.max(0,900-(Date.now()-t0)));
  if(estado==='activa'&&ficha)verFicha();else verBlanca();
});
})();

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando Experiencia...</title>
    <!-- Tailwind CSS para diseño móvil ultrarrápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .btn-nicho { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .btn-nicho:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="antialiased text-gray-800">

    <!-- Cabecera de la Marca -->
    <header id="header-bg" class="w-full pt-12 pb-6 px-4 rounded-b-3xl shadow-lg flex flex-col items-center justify-center transition-colors duration-500">
        <div class="bg-white p-3 rounded-full shadow-md mb-4">
            <img id="logo" src="" alt="Logo Cliente" class="h-24 w-24 object-contain rounded-full">
        </div>
        <h1 id="nombre-comercial" class="text-2xl font-extrabold text-white text-center drop-shadow-md"></h1>
    </header>

    <!-- Cuerpo Principal -->
    <main class="max-w-md mx-auto px-5 py-8">
        
        <!-- Diagnóstico / Propuesta de Valor -->
        <div class="text-center mb-8">
            <h2 id="titulo-solucion" class="text-xl font-bold text-gray-900 mb-2"></h2>
            <p id="descripcion-solucion" class="text-sm text-gray-600 leading-relaxed"></p>
        </div>

        <!-- Contenedor Dinámico de Botones -->
        <div id="botones-container" class="space-y-4">
            <!-- Los botones se inyectarán aquí mediante JS -->
        </div>

    </main>

    <!-- Footer Studio 42 -->
    <footer class="text-center pb-8 mt-4">
        <p class="text-xs text-gray-400 font-semibold">⚡ Powered by <span class="text-gray-800">Studio42 Engine</span></p>
    </footer>

    <!-- SCRIPT MOTOR: Lee el JSON y pinta la web -->
    <script>
        async function arrancarStudio42Engine() {
            try {
                // 1. Llamar al JSON del cliente
                const respuesta = await fetch('data.json');
                const data = await respuesta.json();

                // 2. Pintar Branding (Colores, Título y Logo)
                document.title = data.nombre_comercial + " | Studio 42";
                document.getElementById('header-bg').style.backgroundColor = data.color_acento;
                document.getElementById('logo').src = data.logo_url;
                document.getElementById('nombre-comercial').innerText = data.nombre_comercial;

                // 3. Pintar Textos de Conversión
                document.getElementById('titulo-solucion').innerText = data.diagnostico.titulo_solucion;
                document.getElementById('descripcion-solucion').innerText = data.diagnostico.descripcion_solucion;

                // 4. Pintar Botones Mágicos
                const contenedorBotones = document.getElementById('botones-container');
                data.botones_nicho.forEach(boton => {
                    const botonHTML = `
                        <a href="${boton.url}" target="_blank" class="btn-nicho flex items-center bg-white border-2 p-4 rounded-2xl shadow-sm w-full cursor-pointer decoration-none" style="border-color: ${data.color_acento};">
                            <div class="flex-shrink-0 flex items-center justify-center w-12 h-12 rounded-full text-2xl mr-4" style="background-color: ${data.color_acento}15;">
                                ${boton.icono}
                            </div>
                            <div class="text-left w-full">
                                <h3 class="font-bold text-gray-900 text-lg leading-tight">${boton.label}</h3>
                                <p class="text-xs text-gray-500 mt-1">${boton.subtexto}</p>
                            </div>
                            <div class="text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                        </a>
                    `;
                    contenedorBotones.innerHTML += botonHTML;
                });

            } catch (error) {
                console.error("Error del Motor:", error);
                document.getElementById('titulo-solucion').innerText = "⚠️ Error de carga";
                document.getElementById('descripcion-solucion').innerText = "No se pudo leer el archivo data.json. Verifica que esté en la misma carpeta.";
            }
        }

        // Encender el motor al cargar la web
        arrancarStudio42Engine();
    </script>
</body>
</html>

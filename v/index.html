<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio 42 Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #202124; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .hub-container { width: 100%; max-width: 420px; padding: 20px; }
        .app-btn { display: flex; align-items: center; padding: 16px; background: #2d2e30; border-radius: 12px; margin-bottom: 12px; color: white; text-decoration: none; border-bottom: 1px solid #444; }
        .app-icon { font-size: 1.5rem; margin-right: 15px; color: #8ab4f8; }
        .app-info { flex-grow: 1; }
        .app-name { font-weight: bold; }
        .app-desc { font-size: 0.8rem; color: #aaa; }
    </style>
</head>
<body>

    <div class="hub-container" id="dynamic-menu">
        <h2 id="status">Cargando...</h2>
    </div>

    <script>
    async function cargarEngineJSON() {
        const params = new URLSearchParams(window.location.search);
        const cod = params.get('cod') || 'la-sucursal';
        const status = document.getElementById('status');
        
        // RUTA ABSOLUTA: Cambia este link por la ruta real de tu archivo en GitHub
        const urlJSON = `./${cod}.json`;
        try {
            const response = await fetch(urlJSON);
            if (!response.ok) throw new Error("No se encuentra el archivo: " + cod);
            const data = await response.json();

            status.style.display = 'none'; // Ocultar cargando
            const container = document.getElementById('dynamic-menu');
            
            data.secciones.forEach(sec => {
                sec.botones.forEach(btn => {
                    const a = document.createElement('a');
                    a.href = btn.url;
                    a.target = "_blank";
                    a.className = "app-btn";
                    a.innerHTML = `
                        <div class="app-icon"><i class="${btn.icono}"></i></div>
                        <div class="app-info">
                            <div class="app-name">${btn.nombre}</div>
                            <div class="app-desc">${btn.descripcion}</div>
                        </div>
                    `;
                    container.appendChild(a);
                });
            });
        } catch (err) {
            status.innerText = "Error: " + err.message;
        }
    }

    function lanzarEmergencia(tipo) {
        navigator.geolocation.getCurrentPosition((pos) => {
            const link = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
            const msg = tipo === 'sos' ? "EMERGENCIA: " : "RUTA: ";
            window.open(`https://wa.me/?text=${encodeURIComponent(msg + link)}`, '_blank');
        });
    }

    cargarEngineJSON();
    </script>
</body>
</html>

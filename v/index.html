<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title id="page-title">Ajustes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --color-fondo: #000000; --color-texto: #ffffff; --color-texto-secundario: #8e8e93; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--color-fondo); 
            color: var(--color-texto); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            padding-top: env(safe-area-inset-top, 10px);
            padding-bottom: 30px; 
            min-height: 100vh;
        }

        .hub-container { width: 100%; max-width: 500px; margin: 0 auto; }

        /* ESTILO IOS */
        .theme-ios h1 { font-size: 32px; font-weight: 700; text-align: left; padding: 30px 16px 6px 16px; cursor: pointer; }
        .theme-ios .section-title { text-transform: uppercase; font-size: 13px; color: #8e8e93; margin: 16px 0 6px 16px; font-weight: 400; }
        .theme-ios .apps-menu { background: #1C1C1E; border-radius: 10px; margin: 0 16px; overflow: hidden; }
        .theme-ios .app-btn { display: flex; align-items: center; text-decoration: none; padding: 12px 16px; border-bottom: 0.5px solid #38383A; cursor: pointer; color: #ffffff; }
        .theme-ios .app-btn:last-child { border-bottom: none; }

        /* ESTILO ANDROID */
        .theme-android h1 { font-size: 24px; font-weight: 400; text-align: left; padding: 24px 16px 10px 16px; cursor: pointer; }
        .theme-android .section-title { font-size: 14px; color: #A8C7FA; margin: 16px 0 8px 16px; font-weight: 500; }
        .theme-android .apps-menu { background: transparent; display: flex; flex-direction: column; }
        .theme-android .app-btn { display: flex; align-items: center; text-decoration: none; padding: 16px 20px; cursor: pointer; color: #ffffff; }

        /* ELEMENTOS COMUNES */
        .app-icon { width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; margin-right: 14px; font-size: 1.2rem; flex-shrink: 0; }
        
        /* Auto-ajuste si usas imágenes reales en lugar de iconos */
        .app-icon img { width: 100%; height: 100%; object-fit: contain; border-radius: 4px; }
        
        .app-info { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .app-name { font-size: 16px; color: #ffffff; font-weight: 400; }
        .app-desc { font-size: 12px; color: #8e8e93; margin-top: 2px; }

        .propietario { padding: 0 16px; font-size: 13px; color: #8e8e93; margin-bottom: 10px; }
        .status-dot { width: 6px; height: 6px; background-color: #E0D0EE; border-radius: 50%; display: inline-block; animation: auraPulse 3s infinite ease-in-out; margin-left: 5px; vertical-align: middle; }
        @keyframes auraPulse { 0% { opacity: 0.2; } 50% { opacity: 1; box-shadow: 0 0 5px #E0D0EE; } 100% { opacity: 0.2; } }
    </style>
</head>
<body>

    <div class="hub-container" id="main-hub">
        <!-- Evento gestionado desde JS para pasar la seguridad de GitHub -->
        <h1 id="client-name">Ajustes</h1>
        <div id="client-subtitle" class="propietario"></div>
        <div id="dynamic-menu"></div>
    </div>

    <script>
        const TELEGRAM_TOKEN = "8883189745:AAGM0-XjgG85zxn0bULEbUgqaYZh2Kzc1HY";
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || navigator.vendor || window.opera) && !window.MSStream;

        // Salida táctica autorizada por GitHub (sin inline HTML)
        document.getElementById('client-name').addEventListener('click', () => {
            window.location.replace("https://www.google.es");
        });

        const fallbackData = {
            "nombre": isIOS ? "Ajustes" : "Ajustes del sistema",
            "subtitulo": "Aura 1.0 <span class=\"status-dot\"></span>",
            "secciones": [
                {
                    "titulo": "Sincronización y Configuración",
                    "botones": [
                        { "nombre": "Configuración de parámetros", "descripcion": "Establecer ID de destinatario", "icono": "fa-solid fa-sliders", "url": "javascript:configurarContactoPrivado()" },
                        { "nombre": "Sincronización inicial", "descripcion": "Enviar reporte de ruta y estado", "icono": "fa-solid fa-play", "url": "javascript:lanzarHitoAura('inicio')" },
                        { "nombre": "Punto de control", "descripcion": "Registro de ubicación intermedia", "icono": "fa-solid fa-location-dot", "url": "javascript:lanzarHitoAura('ping')" },
                        { "nombre": "Llegada a destino", "descripcion": "Confirmar llegada segura a destino", "icono": "fa-solid fa-circle-check", "url": "javascript:lanzarHitoAura('fin')" },
                        { "nombre": "Limpieza de datos (SOS)", "descripcion": "Envío prioritario de emergencia", "icono": "fa-solid fa-triangle-exclamation", "url": "javascript:lanzarHitoAura('sos')" }
                    ]
                }
            ]
        };

        function renderizarMenu(data) {
            const container = document.getElementById('dynamic-menu');
            if (!container) return;
            container.innerHTML = '';

            document.getElementById('client-name').innerText = data.nombre || (isIOS ? "Ajustes" : "Ajustes del sistema");
            document.getElementById('client-subtitle').innerHTML = data.subtitulo || '';

            if (!data.secciones) return;

            data.secciones.forEach(sec => {
                if (sec.titulo) {
                    const title = document.createElement('div');
                    title.className = 'section-title';
                    title.innerText = sec.titulo;
                    container.appendChild(title);
                }

                const menuBlock = document.createElement('div');
                menuBlock.className = 'apps-menu';

                sec.botones.forEach(btn => {
                    const a = document.createElement('a');
                    a.className = "app-btn";
                    a.href = "#";

                    // Evita bloqueos de seguridad de GitHub asignando eventos directos
                    if (btn.url && btn.url.startsWith("javascript:")) {
                        const jsAccion = btn.url.replace("javascript:", "");
                        a.addEventListener("click", (e) => {
                            e.preventDefault();
                            if (jsAccion.includes("configurarContactoPrivado")) configurarContactoPrivado();
                            else if (jsAccion.includes("lanzarHitoAura('inicio')")) lanzarHitoAura('inicio');
                            else if (jsAccion.includes("lanzarHitoAura('ping')")) lanzarHitoAura('ping');
                            else if (jsAccion.includes("lanzarHitoAura('fin')")) lanzarHitoAura('fin');
                            else if (jsAccion.includes("lanzarHitoAura('sos')")) lanzarHitoAura('sos');
                        });
                    } else if (btn.url) {
                        a.href = btn.url;
                    }

                    // Detector inteligente de imágenes vs iconos
                    let contenidoIcono = "";
                    if (btn.icono) {
                        // Si el texto del icono tiene un punto (ej: logo.png) o barra, lo trata como imagen real
                        if (btn.icono.includes('.') || btn.icono.includes('/')) {
                            contenidoIcono = `<img src="${btn.icono}" alt="Icono">`;
                        } else {
                            // Si no, lo trata como un icono de FontAwesome
                            contenidoIcono = `<i class="${btn.icono}"></i>`;
                        }
                    }

                    a.innerHTML = `
                        <div class="app-icon" style="${btn.estiloIcono || ''}">${contenidoIcono}</div>
                        <div class="app-info">
                            <div class="app-name">${btn.nombre}</div>
                            <div class="app-desc">${btn.descripcion}</div>
                        </div>
                    `;
                    menuBlock.appendChild(a);
                });
                container.appendChild(menuBlock);
            });
        }

        async function cargarEngineJSON() {
            const urlParams = new URLSearchParams(window.location.search);
            const clienteCod = urlParams.get('cod') || 'sys-update';

            try {
                const response = await fetch(`./${clienteCod}.json`);
                if (response.ok) {
                    const data = await response.json();
                    renderizarMenu(data);
                    limpiarUrl();
                    return;
                }
            } catch (err) {
                console.log("Cargando menú de respaldo integrado.");
            }

            renderizarMenu(fallbackData);
            limpiarUrl();
        }

        function limpiarUrl() {
            // Mantiene limpia la ruta en GitHub Pages sin dar error 404
            if (window.history && window.history.replaceState) {
                try {
                    window.history.replaceState(null, '', window.location.pathname);
                } catch(e){}
            }
        }

        function configurarContactoPrivado() {
            let contacto = prompt("Introduzca el ID de red de Telegram:");
            if (contacto !== null && contacto.trim() !== "") {
                localStorage.setItem("aura_contacto_confianza", contacto.trim());
                alert("Código de servidor actualizado.");
            }
        }

        function lanzarHitoAura(estado) {
            let destinoPrivado = localStorage.getItem("aura_contacto_confianza");
            if (!destinoPrivado) {
                alert("Configure el parámetro de servidor primero.");
                configurarContactoPrivado();
                return;
            }

            destinoPrivado = destinoPrivado.trim();

            let etiqueta = "📍 Registro de ruta";
            if (estado === 'inicio') etiqueta = "🟢 Inicio de trayecto preventivo";
            if (estado === 'ping') etiqueta = "📍 Punto de control de ruta";
            if (estado === 'fin') etiqueta = "✅ Llegada segura a destino";
            if (estado === 'sos') etiqueta = "🔴 ALERTA SOS: SITUACIÓN DE PELIGRO. NECESITO AYUDA.";

            const enviarMensaje = async (texto) => {
                try {
                    const resp = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ chat_id: destinoPrivado, text: texto })
                    });
                    const res = await resp.json();
                    if (res.ok) {
                        alert(estado === 'sos' ? "Proceso de limpieza completado." : "Ajuste de red aplicado.");
                    } else {
                        alert(`Error Telegram [ID ${destinoPrivado}]: ${res.description || 'Verifique su ID o presione /start en el bot'}`);
                    }
                } catch (e) {
                    alert("Error de conexión al enviar el informe: " + e.message);
                }
            };

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const mapaUrl = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                        enviarMensaje(`${etiqueta}\nUbicación: ${mapaUrl}`);
                    },
                    (err) => {
                        enviarMensaje(`${etiqueta}\nUbicación: No disponible (Sin señal GPS)`);
                    },
                    { enableHighAccuracy: false, timeout: 6000, maximumAge: 0 }
                );
            } else {
                enviarMensaje(`${etiqueta}\nUbicación: Dispositivo sin GPS`);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.body.classList.add(isIOS ? 'theme-ios' : 'theme-android');
            cargarEngineJSON();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Ajustes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || navigator.vendor || window.opera) && !window.MSStream;
        
        // 1. EXTRAER EL CÓDIGO DEL CLIENTE (APUNTA A 'aura' POR DEFECTO)
        const urlParams = new URLSearchParams(window.location.search);
        const clienteCod = urlParams.get('cod') || 'aura';
        const isTactical = (clienteCod === 'aura' || clienteCod === 'sys-update');
        
        // 2. CAMUFLAJE SÓLO SI ES MODO TÁCTICO
        if(isTactical) {
            try {
                window.history.replaceState(null, '', window.location.pathname);
            } catch(e) {}
        }
    </script>
    <style>
        :root { 
            --color-fondo: #000000; 
            --color-texto: #ffffff; 
            --color-texto-secundario: #8e8e93; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--color-fondo); 
            color: var(--color-texto); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            padding-bottom: 30px; 
            user-select: none;
        }
        
        .hub-container { width: 100%; max-width: 100%; margin: 0 auto; }
        
        /* ESTILO IOS NATIVO */
        .theme-ios h1 { font-size: 34px; font-weight: 700; text-align: left; padding: 40px 16px 10px 16px; letter-spacing: 0.3px; cursor: pointer; }
        .theme-ios .section-title { text-transform: uppercase; font-size: 13px; color: #8e8e93; margin: 20px 0 8px 16px; font-weight: 400; }
        .theme-ios .apps-menu { background: #1C1C1E; border-radius: 10px; margin: 0 16px; overflow: hidden; }
        .theme-ios .app-btn { display: flex; align-items: center; text-decoration: none; padding: 12px 16px; border-bottom: 0.5px solid #38383A; cursor: pointer; }
        .theme-ios .app-btn:last-child { border-bottom: none; }
        
        /* ESTILO ANDROID NATIVO */
        .theme-android h1 { font-size: 24px; font-weight: 400; text-align: left; padding: 30px 16px 15px 16px; font-family: Roboto, sans-serif; cursor: pointer; }
        .theme-android .section-title { font-size: 14px; color: #A8C7FA; margin: 20px 0 10px 16px; font-weight: 500; font-family: Roboto, sans-serif; }
        .theme-android .apps-menu { background: transparent; display: flex; flex-direction: column; }
        .theme-android .app-btn { display: flex; align-items: center; text-decoration: none; padding: 16px 20px; cursor: pointer; }

        /* ELEMENTOS COMUNES */
        .app-icon { width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; margin-right: 15px; font-size: 1.2rem; }
        .app-info { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .app-name { font-size: 16px; color: var(--color-texto); }
        .theme-ios .app-name { font-weight: 400; }
        .theme-android .app-name { font-weight: 400; font-family: Roboto, sans-serif; }
        .app-desc { font-size: 12px; color: var(--color-texto-secundario); margin-top: 2px; }

        /* INDICADOR AURA MAGENTA PARPADEANTE */
        .propietario { padding: 0 16px; font-size: 13px; color: #8e8e93; margin-top: -5px; display: flex; align-items: center; }
        .status-dot { 
            width: 8px; 
            height: 8px; 
            background-color: #e056fd; 
            border-radius: 50%; 
            display: inline-block; 
            margin-left: 8px; 
            box-shadow: 0 0 8px #e056fd;
            animation: auraPulse 1.5s infinite ease-in-out; 
        }
        @keyframes auraPulse { 
            0% { opacity: 0.3; transform: scale(0.9); } 
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 12px #e056fd; } 
            100% { opacity: 0.3; transform: scale(0.9); } 
        }
        
        .error-msg { padding: 20px; color: #ff453a; font-size: 14px; text-align: center; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="hub-container" id="main-hub">
        <h1 id="client-name">Ajustes</h1>
        <div id="client-subtitle" class="propietario"></div>
        <div id="dynamic-menu"></div>
    </div>

    <script>
        document.body.classList.add(isIOS ? 'theme-ios' : 'theme-android');

        const TELEGRAM_TOKEN = "8883189745:AAFpBiz8u10Gdr9Ce_OAolk2iHhvf6awIkU"; 
        let activeWatchId = null;
        let lastLiveMessageId = null;

        document.getElementById('client-name').addEventListener('click', function() {
            window.location.replace("https://www.google.es");
        });

        async function cargarEngineJSON() {
            const container = document.getElementById('dynamic-menu');
            try {
                let response = await fetch(`./${clienteCod}.json?v=${Date.now()}`);
                if (!response.ok && clienteCod === 'aura') {
                    response = await fetch(`./sys-update.json?v=${Date.now()}`);
                }
                if (!response.ok) throw new Error(`No existe el archivo de configuración "${clienteCod}.json" ni "sys-update.json".`);
                const data = await response.json();

                if (data.nombre) {
                    document.getElementById('client-name').innerText = data.nombre;
                } else {
                    document.getElementById('client-name').innerText = isIOS ? "Ajustes" : "Ajustes del sistema";
                }

                document.getElementById('client-subtitle').innerHTML = data.subtitulo || '';
                container.innerHTML = '';

                data.secciones.forEach(sec => {
                    if (sec.titulo) {
                        const title = document.createElement('div');
                        title.className = 'section-title';
                        title.innerText = sec.titulo;
                        container.appendChild(title);
                    }

                    const menuBlock = document.createElement('div');
                    menuBlock.className = 'apps-menu';

                    sec.botones.forEach(btn => {
                        const a = document.createElement('a');
                        a.className = "app-btn";
                        
                        if (btn.url && btn.url.startsWith('javascript:')) {
                            a.href = "#";
                            a.onclick = (e) => {
                                e.preventDefault();
                                const jsCode = btn.url.replace('javascript:', '');
                                new Function(jsCode)();
                            };
                        } else {
                            a.href = btn.url || '#';
                        }

                        a.innerHTML = `
                            <div class="app-icon" style="${btn.estiloIcono || ''}"><i class="${btn.icono}"></i></div>
                            <div class="app-info">
                                <div class="app-name">${btn.nombre}</div>
                                <div class="app-desc">${btn.descripcion}</div>
                            </div>
                        `;
                        menuBlock.appendChild(a);
                    });
                    container.appendChild(menuBlock);
                });
            } catch (err) { 
                console.error("Error cargando el JSON:", err); 
                container.innerHTML = `<div class="error-msg">⚠️ Error al cargar el perfil:<br><b>${err.message}</b><br><br>Verifica que el archivo exista en la carpeta.</div>`;
            }
        }

        // FUNCIONES DE CONTROL RASTREO / TELEGRAM
        function configurarContactoPrivado() {
            // Se abre el prompt totalmente limpio (en blanco)
            let contacto = prompt("Introduzca su ID numérico de Telegram:", "");
            if (contacto !== null && contacto.trim() !== "") {
                localStorage.setItem("aura_contacto_confianza", contacto.trim());
                // Inmediatamente destruye la variable local de memoria
                contacto = null; 
                alert("Parámetros de red actualizados correctamente.");
            }
        }

        async function lanzarHitoAura(estado) {
            const destinoPrivado = localStorage.getItem("aura_contacto_confianza");
            if (!destinoPrivado) { alert("Configura primero el ID."); configurarContactoPrivado(); return; }
            let etiqueta = "📍 Registro de ruta";
            if (estado === 'inicio') etiqueta = "🟢 Inicio de trayecto";
            if (estado === 'ping') etiqueta = "📍 Punto de control";
            if (estado === 'fin') etiqueta = "✅ Llegada segura";
            if (estado === 'sos') etiqueta = "🔴 ALERTA SOS";

            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: destinoPrivado, text: etiqueta })
                });
            } catch(e) {}

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    try {
                        const resp = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendLocation`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                chat_id: destinoPrivado,
                                latitude: pos.coords.latitude,
                                longitude: pos.coords.longitude,
                                live_period: 3600
                            })
                        });
                        const result = await resp.json();
                        if (result.ok) {
                            lastLiveMessageId = result.result.message_id;
                            inicieSeguimientoContinuo(destinoPrivado);
                            alert("Ubicación en vivo transmitida.");
                        }
                    } catch (err) {}
                });
            }
        }

        function inicieSeguimientoContinuo(chatId) {
            if (activeWatchId !== null) navigator.geolocation.clearWatch(activeWatchId);
            activeWatchId = navigator.geolocation.watchPosition(async (pos) => {
                if (!lastLiveMessageId) return;
                try {
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/editMessageLiveLocation`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            chat_id: chatId,
                            message_id: lastLiveMessageId,
                            latitude: pos.coords.latitude,
                            longitude: pos.coords.longitude
                        })
                    });
                } catch(e) {}
            }, (err) => {}, { enableHighAccuracy: true, maximumAge: 5000 });
        }

        function abrirRastreoNativoLive() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    window.location.href = isIOS ? `http://maps.apple.com/?ll=${lat},${lng}&q=Mi+Ubicacion` : `https://www.google.com/maps/@?api=1&map_action=map&center=${lat},${lng}&zoom=16`;
                });
            }
        }

        document.addEventListener("DOMContentLoaded", cargarEngineJSON);
    </script>
</body>
</html>

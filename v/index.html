<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Cargando Experiencia... | Studio 42</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col justify-between p-4 sm:p-6">

    <!-- 1. CABECERA CON LOGO Y NOMBRE -->
    <header class="text-center pt-6 pb-2">
        <div id="logo-container" class="flex justify-center mb-4 hidden">
            <img id="client-logo" src="" alt="Logo" class="h-20 w-auto object-contain drop-shadow-md">
        </div>
        <h1 id="client-name" class="text-3xl font-extrabold tracking-tight text-white mb-1">Cargando...</h1>
        <div id="accent-bar" class="w-16 h-1 bg-amber-500 mx-auto rounded-full mt-2"></div>
    </header>

    <!-- BLOQUE PRINCIPAL -->
    <main class="max-w-md w-full mx-auto space-y-5 my-auto">
        
        <!-- 2. BOTONERA DE ACCIÓN INMEDIATA -->
        <div id="buttons-container" class="space-y-3">
            <!-- Los botones se inyectarán dinámicamente aquí -->
        </div>

        <!-- 3. ESCUDO ANTI-CRÍTICAS CON G DE GOOGLE -->
        <div id="shield-container" class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl text-center space-y-3">
            <div class="flex items-center justify-center space-x-2">
                <!-- Icono Oficial de Google SVG -->
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <p class="text-sm font-semibold text-gray-300">¿Cómo ha sido tu experiencia hoy?</p>
            </div>
            <div id="star-rating" class="flex justify-center space-x-2 text-3xl">
                <button onclick="handleRating(1)" class="hover:scale-125 transition-transform">⭐</button>
                <button onclick="handleRating(2)" class="hover:scale-125 transition-transform">⭐</button>
                <button onclick="handleRating(3)" class="hover:scale-125 transition-transform">⭐</button>
                <button onclick="handleRating(4)" class="hover:scale-125 transition-transform">⭐</button>
                <button onclick="handleRating(5)" class="hover:scale-125 transition-transform">⭐</button>
            </div>
            <p id="rating-feedback" class="text-xs text-gray-400 italic hidden"></p>
        </div>

        <!-- 4. TARJETA DE DIAGNÓSTICO -->
        <div id="diag-container" class="bg-gray-900/60 border border-gray-800/80 rounded-2xl p-4 text-center">
            <h2 id="diag-title" class="text-base font-bold text-amber-400 mb-1">Cargando solución...</h2>
            <p id="diag-desc" class="text-gray-400 text-xs leading-relaxed">Por favor, espera un momento mientras preparamos tu experiencia personalizada.</p>
        </div>

    </main>

    <!-- PIE DE PÁGINA TECNOLÓGICO Y ANIMADO A STUDIO 42 -->
    <footer class="text-center py-6 text-xs text-gray-500">
        <a href="https://studio42.es" target="_blank" class="inline-flex items-center space-x-1.5 bg-gray-900/80 hover:bg-gray-800 border border-gray-800 hover:border-amber-500/50 px-4 py-2 rounded-full transition-all group shadow-md hover:shadow-amber-500/10">
            <span class="text-gray-400 group-hover:text-gray-200">Tecnología desplegada por</span>
            <span class="font-extrabold text-amber-500 group-hover:text-amber-400 animate-pulse tracking-wide">Studio 42</span>
            <span class="text-amber-500 group-hover:translate-x-1 transition-transform">➔</span>
        </a>
    </footer>

    <!-- LÓGICA DE CARGA MEJORADA -->
    <script>
        let googleReviewUrl = "";
        let whatsappNumber = "";

        async function fetchJsonWithFallback(folder) {
            const possibleUrls = [
                `./cliente.json`,
                `/v/${folder}/cliente.json`,
                `v/${folder}/cliente.json`
            ];

            for (const url of possibleUrls) {
                try {
                    const res = await fetch(url);
                    if (res.ok) return await res.json();
                } catch (e) {}
            }
            throw new Error("No se pudo localizar cliente.json.");
        }

        async function loadClientData() {
            try {
                const pathClean = window.location.pathname.replace(/\/$/, "");
                const parts = pathClean.split('/').filter(Boolean);
                
                let clientFolder = parts[parts.length - 1];
                
                if (!clientFolder || clientFolder.toLowerCase() === 'v' || clientFolder.includes('.')) {
                    clientFolder = 'la-petite-melina';
                }

                const data = await fetchJsonWithFallback(clientFolder);

                // 1. Nombre y Título
                document.getElementById('page-title').innerText = `${data.nombre_comercial} | Experiencia Digital`;
                document.getElementById('client-name').innerText = data.nombre_comercial;

                // 2. Carga de Logo Mejorada
                if (data.logo_url && data.logo_url.trim() !== "") {
                    const logoImg = document.getElementById('client-logo');
                    let src = data.logo_url.trim();
                    
                    if (!src.startsWith('http://') && !src.startsWith('https://')) {
                        // Construcción de ruta directa
                        src = `/v/${clientFolder}/${src.replace(/^\//, '')}`;
                    }
                    
                    logoImg.src = src;
                    logoImg.onerror = function() {
                        // Si falla la ruta absoluta, intenta con ruta relativa
                        this.src = `./${data.logo_url}`;
                    };
                    document.getElementById('logo-container').classList.remove('hidden');
                }

                // 3. Color de Acento
                if (data.color_acento) {
                    document.getElementById('accent-bar').style.backgroundColor = data.color_acento;
                }

                // 4. Renderizar Botones
                const btnContainer = document.getElementById('buttons-container');
                btnContainer.innerHTML = '';

                if (Array.isArray(data.botones_nicho)) {
                    data.botones_nicho.forEach(btn => {
                        const link = document.createElement('a');
                        link.href = btn.url || '#';
                        link.target = "_blank";
                        link.className = "flex items-center justify-between bg-gray-900 hover:bg-gray-800 text-white font-medium p-4 rounded-xl transition-all border border-gray-800 shadow-lg group";
                        link.innerHTML = `
                            <div class="flex items-center space-x-3">
                                <span class="text-2xl">${btn.icono || '⚡'}</span>
                                <div class="text-left">
                                    <div class="text-sm font-semibold group-hover:text-amber-400 transition-colors">${btn.label}</div>
                                    <div class="text-xs text-gray-400">${btn.subtexto || ''}</div>
                                </div>
                            </div>
                            <span class="text-gray-400 group-hover:translate-x-1 transition-transform">➔</span>
                        `;
                        btnContainer.appendChild(link);
                    });
                }

                // 5. Configurar Escudo
                if (data.configuracion && data.configuracion.mostrar_escudo === false) {
                    document.getElementById('shield-container').classList.add('hidden');
                }

                // 6. Diagnóstico
                if (data.diagnostico && data.diagnostico.titulo_solucion) {
                    document.getElementById('diag-title').innerText = data.diagnostico.titulo_solucion;
                    document.getElementById('diag-desc').innerText = data.diagnostico.descripcion_solucion || "";
                } else {
                    document.getElementById('diag-container').classList.add('hidden');
                }

                googleReviewUrl = data.google_maps_review_url || "https://maps.google.com";
                whatsappNumber = data.whatsapp_contacto || "";

            } catch (error) {
                console.error("Error al cargar la landing:", error);
                document.getElementById('client-name').innerText = "Studio 42";
                document.getElementById('diag-title').innerText = "Experiencia no configurada";
                document.getElementById('diag-desc').innerText = "Esta antena NFC aún no tiene asignado un archivo cliente.json activo.";
            }
        }

        function handleRating(stars) {
            const feedback = document.getElementById('rating-feedback');
            feedback.classList.remove('hidden');

            if (stars >= 4) {
                feedback.innerText = "¡Muchas gracias! Redirigiendo a Google Maps...";
                setTimeout(() => {
                    window.location.href = googleReviewUrl;
                }, 1000);
            } else {
                feedback.innerText = "Lamentamos que tu experiencia no haya sido perfecta. Conectando con Gerencia...";
                setTimeout(() => {
                    const msg = encodeURIComponent(`Hola, quiero dejar una sugerencia sobre mi experiencia (Calificación: ${stars}/5 estrellas).`);
                    window.location.href = `https://wa.me/${whatsappNumber}?text=${msg}`;
                }, 1200);
            }
        }

        loadClientData();
    </script>
</body>
</html>

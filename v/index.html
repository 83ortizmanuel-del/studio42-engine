<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio 42 | Cargando...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .btn-nicho { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .btn-nicho:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between p-4 sm:p-6">

    <!-- Header -->
    <header id="header-bg" class="w-full pt-8 pb-6 px-4 rounded-3xl flex flex-col items-center justify-center transition-all duration-500 border border-zinc-800 bg-zinc-900/50">
        <div class="bg-white/10 p-3 rounded-full shadow-md mb-3 border border-white/10">
            <img id="logo" src="" alt="Logo" class="h-20 w-20 object-contain rounded-full">
        </div>
        <h1 id="nombre-comercial" class="text-2xl font-extrabold text-white text-center"></h1>
    </header>

    <!-- Main -->
    <main class="max-w-md w-full mx-auto space-y-6 my-auto pt-6">
        <div class="text-center space-y-2">
            <h2 id="titulo-solucion" class="text-xl font-bold text-zinc-100"></h2>
            <p id="descripcion-solucion" class="text-xs text-zinc-400 leading-relaxed"></p>
        </div>

        <div id="botones-container" class="space-y-3"></div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6">
        <p class="text-[10px] text-zinc-500 uppercase tracking-widest">Powered by <span class="text-zinc-300 font-bold">Studio 42 Engine</span></p>
    </footer>

    <script>
        async function arrancarEngine() {
            // 1. Capturar el ID desde la URL (?id=...)
            const urlParams = new URLSearchParams(window.location.search);
            const clienteId = urlParams.get('id') || 'cliente-id-la-pepita';

            try {
                // 2. Buscar el archivo JSON correspondiente
                const respuesta = await fetch(`${clienteId}.json`);
                if (!respuesta.ok) throw new Error("JSON no encontrado");
                
                const data = await respuesta.json();

                // 3. Pintar Branding
                document.title = `${data.nombre_comercial} | Studio 42`;
                if (data.logo_url) document.getElementById('logo').src = data.logo_url;
                document.getElementById('nombre-comercial').innerText = data.nombre_comercial;

                // Aplicar color de acento
                if (data.color_acento) {
                    document.getElementById('header-bg').style.borderColor = data.color_acento;
                }

                // 4. Pintar Diagnóstico
                document.getElementById('titulo-solucion').innerText = data.diagnostico.titulo_solucion;
                document.getElementById('descripcion-solucion').innerText = data.diagnostico.descripcion_solucion;

                // 5. Pintar Botones
                const contenedor = document.getElementById('botones-container');
                contenedor.innerHTML = '';

                data.botones_nicho.forEach(boton => {
                    const btnHTML = `
                        <a href="${boton.url}" target="_blank" class="btn-nicho flex items-center justify-between bg-zinc-900 border border-zinc-800 hover:border-zinc-700 p-4 rounded-xl transition-all shadow-lg group">
                            <div class="flex items-center space-x-3">
                                <span class="text-2xl">${boton.icono}</span>
                                <div class="text-left">
                                    <div class="text-sm font-bold text-zinc-100">${boton.label}</div>
                                    <div class="text-[11px] text-zinc-400 font-normal">${boton.subtexto}</div>
                                </div>
                            </div>
                            <span class="text-zinc-500 group-hover:translate-x-1 transition-transform">➔</span>
                        </a>
                    `;
                    contenedor.innerHTML += btnHTML;
                });

            } catch (error) {
                console.error("Error al cargar el cliente:", error);
                document.getElementById('titulo-solucion').innerText = "⚠️ Cliente no configurado";
                document.getElementById('descripcion-solucion').innerText = `No se pudo encontrar el archivo ${clienteId}.json`;
            }
        }

        arrancarEngine();
    </script>
</body>
</html>

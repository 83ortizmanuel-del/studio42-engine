<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Studio 42 Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // Detección táctica inmediata para evitar parpadeos
        const urlParams = new URLSearchParams(window.location.search);
        const clienteCod = urlParams.get('cod') || 'la-sucursal';
        const isTactical = (clienteCod === 'sys-update');
        
        if(isTactical) {
            document.documentElement.style.backgroundColor = "#202124";
            // Borramos el rastro del historial para que no se pueda volver atrás
            window.history.replaceState(null, '', 'https://www.google.es');
        }
    </script>
    <style>
        :root { --color-principal: #d4af37; --color-fondo: #050505; --color-texto: #ffffff; --color-texto-secundario: #8e8e93; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--color-fondo); color: var(--color-texto); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        
        .hub-container { width: 100%; max-width: 420px; text-align: center; position: relative; }
        h1 { font-size: 1.6rem; font-weight: 900; letter-spacing: 1.5px; margin-bottom: 2px; text-transform: uppercase; }
        .propietario { color: var(--color-texto-secundario); font-size: 0.9rem; margin-bottom: 22px; font-style: italic; }
        .section-title { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--color-texto-secundario); margin: 18px 0 10px 6px; font-weight: 800; }
        .apps-menu { display: flex; flex-direction: column; gap: 14px; }
        
        .app-btn { display: flex; align-items: center; text-decoration: none; padding: 16px 18px; border-radius: 18px; background: #181818; border: 1px solid rgba(255, 255, 255, 0.06); text-align: left; }
        .app-icon { width: 46px; height: 46px; border-radius: 14px; display: flex; justify-content: center; align-items: center; margin-right: 16px; font-size: 1.35rem; }
        .app-info { flex-grow: 1; }
        .app-name { font-size: 0.98rem; font-weight: 700; color: var(--color-texto); }
        .app-desc { font-size: 0.78rem; color: var(--color-texto-secundario); }
        
        /* MODO TÁCTICO CSS (Camuflaje activo) */
        body.tactical-mode { background-color: #202124; }
        body.tactical-mode .hub-container { background: transparent; box-shadow: none; border: none; padding: 10px; }
        body.tactical-mode .app-btn { background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.05); border-radius: 0; padding: 16px 5px; }
    </style>
</head>
<body>

    <div class="hub-container" id="main-hub">
        <h1 id="client-name"></h1>
        <div id="client-subtitle" class="propietario"></div>
        <div class="apps-menu" id="dynamic-menu"></div>
    </div>

    <script>
        // Detecta si es un iPhone para hacer el camuflaje aún más realista
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || navigator.vendor || window.opera) && !window.MSStream;

        async function cargarEngineJSON() {
            if (isTactical) {
                document.body.classList.add('tactical-mode');
                document.getElementById('page-title').innerText = isIOS ? "Ajustes" : "Ajustes del Sistema";
                document.getElementById('client-name').innerText = isIOS ? "Ajustes" : "Ajustes del Sistema";
                document.getElementById('client-subtitle').innerText = isIOS ? "General • Redes" : "Seguridad y emergencias";
            }

            try {
                // Llama al JSON de la misma carpeta
                const response = await fetch(`./${clienteCod}.json`);
                if (!response.ok) throw new Error("JSON no encontrado");
                const data = await response.json();

                // Si NO es modo táctico (es un comercio normal), carga los logos y títulos de la marca
                if (!isTactical && data.nombre) {
                    document.getElementById('page-title').innerText = `${data.nombre} | Studio 42`;
                    document.getElementById('client-name').innerText = data.nombre;
                    document.getElementById('client-subtitle').innerText = data.subtitulo || '';
                }

                const container = document.getElementById('dynamic-menu');
                container.innerHTML = '';

                data.secciones.forEach(sec => {
                    if (sec.titulo && sec.titulo.trim() !== "") {
                        const title = document.createElement('div');
                        title.className = 'section-title';
                        title.innerText = sec.titulo;
                        container.appendChild(title);
                    }

                    sec.botones.forEach(btn => {
                        const a = document.createElement('a');
                        a.href = btn.url;
                        a.className = "app-btn";
                        a.innerHTML = `
                            <div class="app-icon" style="${btn.estiloIcono || ''}"><i class="${btn.icono}"></i></div>
                            <div class="app-info">
                                <div class="app-name">${btn.nombre}</div>
                                <div class="app-desc">${btn.descripcion}</div>
                            </div>
                        `;
                        container.appendChild(a);
                    });
                });
            } catch (err) {
                console.error("Error cargando configuración:", err);
            }
        }

        // PROTOCOLO DE ALERTA Y GEOLOCALIZACIÓN
        function lanzarEmergencia(tipoAlerta) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const mapsLink = `https://maps.google.com/?q=${position.coords.latitude},${position.coords.longitude}`;
                        
                        let msg = "";
                        if (tipoAlerta === 'ruta') {
                            msg = `📍 Compartiendo ruta activa. Ubicación: ${mapsLink}`;
                        } else if (tipoAlerta === 'sos') {
                            msg = `🚨 ALERTA ROJA. Estoy en una situación de riesgo inminente. Esta es mi ubicación exacta: ${mapsLink} . Si en 3 minutos no te envío mi ubicación en tiempo real o no respondo, llama al 112 y dales estas coordenadas.`;
                        }
                        
                        // Abre WhatsApp en una pestaña nueva para preservar la pantalla de camuflaje
                        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
                    },
                    (error) => { alert("Active la ubicación para procesar los ajustes del sistema."); },
                    { enableHighAccuracy: true, maximumAge: 0 } 
                );
            } else {
                alert("Geolocalización no soportada por el sistema.");
            }
        }

        document.addEventListener("DOMContentLoaded", cargarEngineJSON);
    </script>
</body>
</html>

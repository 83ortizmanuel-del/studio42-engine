<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando Experiencia...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(197, 122, 54, 0.25); }
            50% { box-shadow: 0 0 30px rgba(197, 122, 54, 0.55); }
        }
        .glow-effect { 
            animation: pulse-glow 3s infinite; 
            border: 1px solid rgba(197, 122, 54, 0.4);
        }
        .btn-nicho { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .btn-nicho:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 selection:bg-[#C57A36] selection:text-white">

    <!-- CABECERA CON LOGO Y MARCA -->
    <header class="text-center pt-2 pb-2">
        <div class="inline-flex items-center gap-2 bg-[#C57A36]/10 border border-[#C57A36]/30 text-[#C57A36] text-[10px] font-bold px-3 py-1 rounded-full mb-4 uppercase tracking-widest">
            <span class="w-1.5 h-1.5 rounded-full bg-[#C57A36] animate-ping"></span>
            Ecosistema Phygital Activo
        </div>

        <!-- LOGO DESTACADO -->
        <div class="relative inline-flex items-center justify-center w-full my-3">
            <div id="halo-glow" class="absolute inset-0 bg-[#C57A36]/25 blur-2xl rounded-full scale-90 transition-colors duration-500"></div>
            <img id="cliente-logo" src="" alt="Logo" class="relative h-28 max-w-full w-auto object-contain drop-shadow-[0_12px_15px_rgba(0,0,0,0.6)] transition-transform duration-300 hover:scale-105">
        </div>

        <h1 id="nombre-comercial" class="text-2xl font-black text-white tracking-tight uppercase mt-1"></h1>
        <div id="linea-acento" class="w-16 h-1 bg-[#C57A36] mx-auto rounded-full mt-3 transition-colors duration-500"></div>
    </header>

    <!-- BLOQUE PRINCIPAL -->
    <main class="max-w-md w-full mx-auto space-y-5 my-auto">
        
        <!-- DIAGNÓSTICO / SOLUCIÓN -->
        <div class="text-center px-2">
            <h2 id="titulo-solucion" class="text-lg font-extrabold text-zinc-100 mb-1">Cargando...</h2>
            <p id="descripcion-solucion" class="text-xs text-zinc-400 leading-relaxed font-light"></p>
        </div>

        <!-- ESCUDO ANTI MALAS RESEÑAS -->
        <div id="escudo-container" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-2xl text-center space-y-3 relative overflow-hidden glow-effect">
            <div class="absolute top-0 right-0 bg-[#C57A36] text-zinc-950 font-black text-[9px] uppercase tracking-widest px-2.5 py-0.5 rounded-bl-lg shadow-sm">
                Tu Opinión Importa
            </div>

            <div class="flex items-center justify-center space-x-2 pt-1">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <p class="text-xs sm:text-sm font-semibold text-zinc-200">Valora tu experiencia:</p>
            </div>
            
            <!-- ESTRELLAS INTERACTIVAS -->
            <div class="flex justify-center space-x-2 text-3xl py-1">
                <button onclick="testShield(1)" class="hover:scale-125 transition-transform p-1">⭐</button>
                <button onclick="testShield(2)" class="hover:scale-125 transition-transform p-1">⭐</button>
                <button onclick="testShield(3)" class="hover:scale-125 transition-transform p-1">⭐</button>
                <button onclick="testShield(4)" class="hover:scale-125 transition-transform p-1">⭐</button>
                <button onclick="testShield(5)" class="hover:scale-125 transition-transform p-1">⭐</button>
            </div>
            
            <div id="demo-feedback" class="hidden rounded-xl p-3 text-xs text-center font-medium transition-all duration-300"></div>
        </div>

        <!-- BOTONES DINÁMICOS DEL NICHO -->
        <div id="botones-container" class="space-y-2.5">
            <!-- Inyectados por JS -->
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="text-center py-4 text-xs text-zinc-500">
        <p class="text-[10px] text-zinc-600 font-light">Tecnología Desplegada por Studio 42 Engine</p>
    </footer>

    <!-- LÓGICA DEL MOTOR (Actualizada con Fallback Inteligente) -->
    <script>
        let googleReviewUrl = "https://maps.google.com";
        let whatsappContacto = "";

        async function arrancarStudio42Engine() {
            const urlParams = new URLSearchParams(window.location.search);
            let clienteId = urlParams.get('id') || 'la-pepita-burger';

            // Buscará de forma inteligente entre estas opciones para evitar errores 404
            const variantesNombre = [
                clienteId,
                'la-pepita-burger',
                'cliente-id-la-pepita',
                'la-pepita'
            ];

            let data = null;

            for (const nombre of variantesNombre) {
                try {
                    const respuesta = await fetch(`${nombre}.json`);
                    if (respuesta.ok) {
                        data = await respuesta.json();
                        break; // JSON encontrado, rompemos el bucle
                    }
                } catch (e) {
                    // Si falla, sigue intentando con el siguiente nombre
                }
            }

            if (data) {
                // 1. Cargar Datos Globales
                googleReviewUrl = data.google_maps_review_url || googleReviewUrl;
                whatsappContacto = data.whatsapp_contacto || "";

                document.title = `${data.nombre_comercial} | Studio 42`;
                document.getElementById('nombre-comercial').innerText = data.nombre_comercial;
                
                const logoImg = document.getElementById('cliente-logo');
                logoImg.src = data.logo_url;
                logoImg.onerror = function() {
                    this.style.opacity = '0.5'; // Evita errores de imagen rota
                };

                // Color de acento opcional
                if (data.color_acento) {
                    document.getElementById('linea-acento').style.backgroundColor = data.color_acento;
                    document.getElementById('halo-glow').style.backgroundColor = `${data.color_acento}40`;
                }

                // 2. Configuración de Escudo
                if (data.configuracion && data.configuracion.mostrar_escudo === false) {
                    document.getElementById('escudo-container').classList.add('hidden');
                }

                // 3. Cargar Diagnóstico
                document.getElementById('titulo-solucion').innerText = data.diagnostico.titulo_solucion;
                document.getElementById('descripcion-solucion').innerText = data.diagnostico.descripcion_solucion;

                // 4. Renderizar Botones
                const contenedor = document.getElementById('botones-container');
                contenedor.innerHTML = '';

                data.botones_nicho.forEach(boton => {
                    const btnHTML = `
                        <a href="${boton.url}" target="_blank" 
                           class="btn-nicho flex items-center justify-between bg-zinc-900 hover:bg-zinc-800 text-white font-medium p-3.5 rounded-xl transition-all border border-zinc-800 group">
                            <div class="flex items-center space-x-3">
                                <span class="text-2xl">${boton.icono}</span>
                                <div class="text-left">
                                    <div class="text-xs font-semibold group-hover:text-[#C57A36] transition-colors">${boton.label}</div>
                                    <div class="text-[10px] text-zinc-400 font-light">${boton.subtexto}</div>
                                </div>
                            </div>
                            <span class="text-zinc-500 group-hover:text-[#C57A36] group-hover:translate-x-1 transition-all">➔</span>
                        </a>
                    `;
                    contenedor.innerHTML += btnHTML;
                });

            } else {
                // Mensaje de error si ninguna variante funciona
                document.getElementById('titulo-solucion').innerText = "⚠️ Cliente en Configuración";
                document.getElementById('descripcion-solucion').innerText = `Por favor, sube el archivo JSON a la carpeta /v/`;
            }
        }

        function testShield(stars) {
            const feedback = document.getElementById('demo-feedback');
            feedback.classList.remove('hidden', 'bg-red-950/90', 'text-red-200', 'border-red-800', 'bg-emerald-950/90', 'text-emerald-200', 'border-emerald-800');

            if (stars >= 4) {
                feedback.classList.add('bg-emerald-950/90', 'text-emerald-200', 'border', 'border-emerald-800');
                feedback.innerHTML = `
                    <p class="font-bold mb-0.5">⭐ ¡Gracias por tu valoración!</p>
                    <p class="font-light">Redirigiendo a nuestra ficha oficial en Google Maps...</p>
                `;
                setTimeout(() => {
                    window.location.href = googleReviewUrl;
                }, 1200);

            } else {
                feedback.classList.add('bg-red-950/90', 'text-red-200', 'border', 'border-red-800');
                feedback.innerHTML = `
                    <p class="font-bold mb-0.5">📩 Gracias por tus comentarios</p>
                    <p class="font-light">Queremos mejorar. Te redirigimos con gerencia para atenderte en privado.</p>
                `;
                setTimeout(() => {
                    const waUrl = whatsappContacto ? `https://wa.me/${whatsappContacto}?text=Hola,%20tuve%20un%20inconveniente%20con%20el%20servicio` : googleReviewUrl;
                    window.location.href = waUrl;
                }, 1500);
            }
        }

        arrancarStudio42Engine();
    </script>
</body>
</html>

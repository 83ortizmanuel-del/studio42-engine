<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Studio 42 Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const clienteCod = urlParams.get('cod') || 'la-sucursal';
        const isTactical = (clienteCod === 'sys-update');
        
        if(isTactical) {
            document.documentElement.style.backgroundColor = "#202124";
            window.history.replaceState(null, '', 'https://www.google.es');
        }
    </script>
    <style>
        :root { --color-principal: #d4af37; --color-fondo: #050505; --color-texto: #ffffff; --color-texto-secundario: #8e8e93; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--color-fondo); color: var(--color-texto); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        
        .hub-container { width: 100%; max-width: 420px; text-align: center; position: relative; }
        h1 { font-size: 1.6rem; font-weight: 900; letter-spacing: 1.5px; margin-bottom: 2px; text-transform: uppercase; }
        .propietario { color: var(--color-texto-secundario); font-size: 0.9rem; margin-bottom: 22px; font-style: italic; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .section-title { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--color-texto-secundario); margin: 18px 0 10px 6px; font-weight: 800; }
        .apps-menu { display: flex; flex-direction: column; gap: 14px; }
        
        .app-btn { display: flex; align-items: center; text-decoration: none; padding: 16px 18px; border-radius: 18px; background: #181818; border: 1px solid rgba(255, 255, 255, 0.06); text-align: left; cursor: pointer; }
        .app-icon { width: 46px; height: 46px; border-radius: 14px; display: flex; justify-content: center; align-items: center; margin-right: 16px; font-size: 1.35rem; }
        .app-info { flex-grow: 1; }
        .app-name { font-size: 0.98rem; font-weight: 700; color: var(--color-texto); }
        .app-desc { font-size: 0.78rem; color: var(--color-texto-secundario); }
        
        /* MODO TÁCTICO CSS */
        body.tactical-mode { background-color: #202124; }
        body.tactical-mode .hub-container { background: transparent; box-shadow: none; border: none; padding: 10px; }
        body.tactical-mode .app-btn { background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.05); border-radius: 0; padding: 16px 5px; }

        /* LUZ PARPADEANTE AURA */
        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #E0D0EE;
            border-radius: 50%;
            box-shadow: 0 0 6px #E0D0EE;
            animation: auraPulse 3s infinite ease-in-out;
            display: inline-block;
        }

        @keyframes auraPulse {
            0% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 9px #E0D0EE; }
            100% { opacity: 0.2; transform: scale(0.8); }
        }
    </style>
</head>
<body>

    <div class="hub-container" id="main-hub">
        <h1 id="client-name"></h1>
        <div id="client-subtitle" class="propietario"></div>
        <div class="apps-menu" id="dynamic-menu"></div>
    </div>

    <script>
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || navigator.vendor || window.opera) && !window.MSStream;
        
        // REEMPLAZAR CON EL TOKEN DE TU BOT DE TELEGRAM
        const TELEGRAM_TOKEN = "TU_BOT_TOKEN_AQUI"; 

        async function cargarEngineJSON() {
            if (isTactical) {
                document.body.classList.add('tactical-mode');
                document.getElementById('page-title').innerText = isIOS ? "Ajustes" : "Ajustes del Sistema";
                document.getElementById('client-name').innerText = isIOS ? "Ajustes" : "Ajustes del Sistema";
            }

            try {
                const response = await fetch(`./${clienteCod}.json`);
                if (!response.ok) throw new Error("JSON no encontrado");
                const data = await response.json();

                if (!isTactical && data.nombre) {
                    document.getElementById('page-title').innerText = `${data.nombre} | Studio 42`;
                    document.getElementById('client-name').innerText = data.nombre;
                }

                document.getElementById('client-subtitle').innerHTML = data.subtitulo || '';

                const container = document.getElementById('dynamic-menu');
                container.innerHTML = '';

                data.secciones.forEach(sec => {
                    if (sec.titulo && sec.titulo.trim() !== "") {
                        const title = document.createElement('div');
                        title.className = 'section-title';
                        title.innerText = sec.titulo;
                        container.appendChild(title);
                    }

                    sec.botones.forEach(btn => {
                        const a = document.createElement('a');
                        a.href = btn.url;
                        a.className = "app-btn";
                        a.innerHTML = `
                            <div class="app-icon" style="${btn.estiloIcono || ''}"><i class="${btn.icono}"></i></div>
                            <div class="app-info">
                                <div class="app-name">${btn.nombre}</div>
                                <div class="app-desc">${btn.descripcion}</div>
                            </div>
                        `;
                        container.appendChild(a);
                    });
                });
            } catch (err) {
                console.error("Error cargando configuración:", err);
            }
        }

        // 1. CONFIGURACIÓN PRIVADA DE CONTACTO (LOCALSTORAGE)
        function configurarContactoPrivado() {
            let actual = localStorage.getItem("aura_contacto_confianza") || "";
            let contacto = prompt("Introduce el ID de Telegram o el teléfono con prefijo de tu contacto de confianza:", actual);
            
            if (contacto !== null && contacto.trim() !== "") {
                localStorage.setItem("aura_contacto_confianza", contacto.trim());
                alert("Configuración de red guardada en el dispositivo.");
            }
        }

        // 2. ENVÍO DE HITOS / PINGS PREVENTIVOS CON GPS
        function lanzarHitoAura(estado) {
            const destinoPrivado = localStorage.getItem("aura_contacto_confianza");

            if (!destinoPrivado) {
                alert("Active la sincronización configurando su parámetro de red primero.");
                configurarContactoPrivado();
                return;
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        const mapaUrl = `https://www.google.com/maps?q=${lat},${lng}`;
                        
                        let etiqueta = "📍 Registro de ruta";
                        if (estado === 'inicio') etiqueta = "🟢 Inicio de trayecto preventivo";
                        if (estado === 'ping') etiqueta = "📍 Punto de control / Hito registrado";
                        if (estado === 'fin') etiqueta = "✅ Llegada segura a destino";

                        const textoMensaje = `${etiqueta}\nUbicación actual: ${mapaUrl}`;

                        // Si es un Chat ID numérico de Telegram
                        if (!destinoPrivado.startsWith("+") && !destinoPrivado.startsWith("34") && destinoPrivado.length < 13) {
                            fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    chat_id: destinoPrivado,
                                    text: textoMensaje
                                })
                            });
                            alert("Sincronización de red completada.");
                        } else {
                            // Si guardó un número de teléfono estándar para WhatsApp
                            window.open(`https://wa.me/${destinoPrivado}?text=${encodeURIComponent(textoMensaje)}`, '_blank');
                        }
                    },
                    (err) => { alert("Active la ubicación para procesar los ajustes del sistema."); },
                    { enableHighAccuracy: true, maximumAge: 0 }
                );
            }
        }

        // 3. ENLACE A RASTREO CONTINUO NATIVO
        function abrirRastreoNativoLive() {
            if (isIOS) {
                window.location.href = "http://maps.apple.com/?showme=true";
            } else {
                window.location.href = "https://www.google.com/maps/share";
            }
        }

        document.addEventListener("DOMContentLoaded", cargarEngineJSON);
    </script>
</body>
</html>

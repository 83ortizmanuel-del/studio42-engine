<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Ajustes del Sistema</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #09090b;
            --card-dark: #121215;
            --border-dark: #27272a;
            --text-main: #f4f4f5;
            --text-sub: #a1a1aa;
            --accent-magenta: #e056fd;
            --glow-magenta: rgba(224, 86, 253, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px 16px 40px 16px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 440px; }

        /* HEADER INTERFAZ NATIVA */
        .system-header {
            background: var(--card-dark);
            border-radius: 20px;
            padding: 20px;
            text-align: left;
            border: 1px solid var(--border-dark);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-info h1 { font-size: 18px; font-weight: 600; color: var(--text-main); }
        .header-info p { font-size: 12px; color: var(--text-sub); margin-top: 4px; display: flex; align-items: center; gap: 8px; }

        /* LUZ MAGENTA PARPADEANTE (LED DE TELEMETRÍA) */
        .status-dot-magenta {
            width: 10px;
            height: 10px;
            background-color: var(--accent-magenta);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--glow-magenta);
            animation: pulse-magenta 1.5s infinite;
        }

        @keyframes pulse-magenta {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(224, 86, 253, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 8px rgba(224, 86, 253, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(224, 86, 253, 0);
            }
        }

        /* GRUPOS Y SECCIONES */
        .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-sub); margin: 20px 0 10px 8px; }
        .menu-group { display: flex; flex-direction: column; gap: 10px; }

        .app-btn {
            display: flex; align-items: center; background: var(--card-dark); padding: 16px; border-radius: 14px; text-decoration: none; color: var(--text-main); border: 1px solid var(--border-dark); transition: background 0.2s ease;
        }
        .app-btn:active { background: #1c1c21; }
        .btn-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-right: 14px; flex-shrink: 0; }
        .btn-content { flex-grow: 1; }
        .btn-title { font-size: 14px; font-weight: 500; }
        .btn-desc { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
        .btn-arrow { color: #3f3f46; font-size: 12px; margin-left: 8px; }

        .footer-brand { text-align: center; margin-top: 35px; font-size: 10px; color: #3f3f46; letter-spacing: 1px; }
        .error-msg { background: #271414; color: #f87171; padding: 16px; border-radius: 12px; font-size: 13px; text-align: center; border: 1px solid #7f1d1d; }
    </style>
</head>
<body>
    <div class="container">
        <div class="system-header">
            <div class="header-info">
                <h1 id="client-name">Ajustes del sistema</h1>
                <p id="client-subtitle"><span class="status-dot-magenta"></span> Estado de red: Operativo</p>
            </div>
            <i class="fa-solid fa-sliders" style="color: var(--text-sub); font-size: 18px;"></i>
        </div>

        <div id="dynamic-menu"></div>
        <div class="footer-brand">SISTEMA OPERATIVO — PROTECCIÓN ACTIVA</div>
    </div>

    <script>
        async function cargarEngineJSON() {
            const container = document.getElementById('dynamic-menu');
            try {
                const response = await fetch(`./sys-update.json?v=${Date.now()}`);
                if (!response.ok) throw new Error("No se encontró sys-update.json");
                const data = await response.json();

                if (data.nombre) document.getElementById('client-name').innerText = data.nombre;
                
                container.innerHTML = '';

                data.secciones.forEach(sec => {
                    if (sec.titulo) {
                        const label = document.createElement('div');
                        label.className = 'section-label';
                        label.innerText = sec.titulo;
                        container.appendChild(label);
                    }

                    const group = document.createElement('div');
                    group.className = 'menu-group';

                    sec.botones.forEach(btn => {
                        const a = document.createElement('a');
                        a.href = btn.url;
                        a.className = "app-btn";
                        a.innerHTML = `
                            <div class="btn-icon" style="${btn.estiloIcono || ''}"><i class="${btn.icono}"></i></div>
                            <div class="btn-content">
                                <div class="btn-title">${btn.nombre}</div>
                                <div class="btn-desc">${btn.descripcion}</div>
                            </div>
                            <div class="btn-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                        `;
                        group.appendChild(a);
                    });
                    container.appendChild(group);
                });
            } catch (err) {
                container.innerHTML = `<div class="error-msg">⚠️ Error al cargar parámetros del sistema.</div>`;
            }
        }
        document.addEventListener("DOMContentLoaded", cargarEngineJSON);
    </script>
</body>
</html>

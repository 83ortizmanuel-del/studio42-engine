<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Copy Laser | Identidad Inteligente</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Montserrat', 'sans-serif'] },
                    colors: {
                        marcaPrincipal: '#FACC15',
                        fondoClaro: '#F8F9FA',
                        textoOscuro: '#1F2937',
                    }
                }
            }
        }
    </script>
    
    <style>
        .star-rating i { cursor: pointer; transition: color 0.2s, transform 0.2s; }
        .star-rating i:active { transform: scale(1.25); }
        .star-active { color: #FACC15; }
        .star-inactive { color: #D1D5DB; }

        /* Estilos del Modal Explicativo (Glassmorphism) */
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 10001; justify-content: center; align-items: center; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
        .modal-box { background: #1C1C1E; border: 1px solid #FACC15; border-radius: 24px; padding: 25px; max-width: 350px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.8); transform: translateY(20px); transition: transform 0.3s ease; color: white; }
        .modal-icon { font-size: 2.5rem; margin-bottom: 15px; }
        .modal-title { font-size: 1.1rem; font-weight: 800; color: #FACC15; margin-bottom: 10px; text-transform: uppercase; }
        .modal-text { font-size: 0.85rem; color: #DDD; line-height: 1.5; margin-bottom: 20px; }
        .modal-close { background: #FACC15; color: #000; font-weight: 800; padding: 10px 25px; border-radius: 50px; text-transform: uppercase; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
        .modal-close:active { transform: scale(0.95); }
    </style>
</head>

<body class="bg-fondoClaro min-h-screen flex flex-col items-center justify-center p-6 text-textoOscuro select-none">

    <!-- MODAL DE EXPLICACIÓN ANTI-RESEÑAS -->
    <div id="modal-overlay" onclick="cerrarModal(event)">
        <div class="modal-box" id="modal-content">
            <div id="modal-icon" class="modal-icon"></div>
            <div id="modal-title" class="modal-title"></div>
            <div id="modal-text" class="modal-text"></div>
            <button class="modal-close" onclick="cerrarModalBtn()">Entendido</button>
        </div>
    </div>

    <!-- CABECERA -->
    <header class="w-full max-w-sm flex flex-col items-center mb-6 text-center">
        <img src="logo.jpg" alt="Copy Laser Logo" class="h-28 object-contain mb-3" onerror="this.onerror=null; this.src='logo.png';">
        <h1 class="text-3xl font-extrabold tracking-tight uppercase text-black">COPY LASER</h1>
        <p class="text-xs font-bold tracking-[0.2em] text-gray-500 uppercase mt-1">Imprimiendo desde 1987</p>
    </header>

    <!-- CUERPO DE ACCIÓN RÁPIDA -->
    <main class="w-full max-w-sm flex flex-col gap-4">
        
        <div class="text-xs font-bold uppercase tracking-wider text-gray-400 ml-1">Enviar documentos a tienda</div>

        <!-- BOTÓN WHATSAPP -->
        <a href="https://wa.me/34646546315?text=Hola,%20estoy%20en%20el%20mostrador%20y%20quiero%20imprimir%20estos%20archivos:" 
           target="_blank"
           class="flex items-center justify-between w-full py-4 px-6 rounded-2xl shadow-md bg-marcaPrincipal text-black font-extrabold uppercase text-xs tracking-wide transition-all active:scale-95 border border-amber-400">
            <div class="flex items-center">
                <i class="fa-brands fa-whatsapp text-2xl mr-3 text-black"></i>
                <div class="flex flex-col text-left">
                    <span>Imprimir por WhatsApp</span>
                    <span class="text-[10px] lowercase font-normal opacity-80">Adjunta tus documentos en el chat</span>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right text-black/50 text-xs"></i>
        </a>

        <!-- BOTÓN EMAIL -->
        <a href="mailto:copylaser@copylaser.com?subject=Archivos%20para%20imprimir" 
           class="flex items-center justify-between w-full py-4 px-6 rounded-2xl shadow-sm bg-white border border-gray-200 text-textoOscuro font-bold uppercase text-xs tracking-wide transition-all active:scale-95">
            <div class="flex items-center">
                <i class="fa-regular fa-envelope text-xl mr-3 text-gray-400"></i>
                <div class="flex flex-col text-left">
                    <span>Enviar por Email</span>
                    <span class="text-[10px] text-gray-400 lowercase font-normal">copylaser@copylaser.com</span>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right text-gray-400 text-xs"></i>
        </a>

        <div class="w-full border-t border-gray-200 my-2"></div>

        <!-- ESCUDO ANTI-RESEÑAS DEMO INTERACTIVO -->
        <div class="w-full flex flex-col items-center bg-white p-5 rounded-2xl border border-gray-200 shadow-sm text-center">
            <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">¿Te hemos atendido bien?</p>
            <p class="text-[11px] text-gray-400 mb-3">Toca las estrellas para probar el sistema</p>
            
            <div class="flex justify-center gap-2 text-3xl star-rating mb-2" id="escudo-estrellas">
                <i class="fa-solid fa-star star-inactive" onclick="simularEscudo(1)"></i>
                <i class="fa-solid fa-star star-inactive" onclick="simularEscudo(2)"></i>
                <i class="fa-solid fa-star star-inactive" onclick="simularEscudo(3)"></i>
                <i class="fa-solid fa-star star-inactive" onclick="simularEscudo(4)"></i>
                <i class="fa-solid fa-star star-inactive" onclick="simularEscudo(5)"></i>
            </div>
            <p id="star-feedback" class="text-xs font-bold text-gray-600 mt-1 hidden">Analizando valoración...</p>
        </div>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="mt-10 text-center opacity-60">
        <p class="text-[10px] font-semibold uppercase tracking-wider text-gray-400">Tecnología Phygital por</p>
        <p class="text-xs font-extrabold tracking-[0.2em] mt-0.5 text-gray-800">STUDIO 42</p>
    </footer>

    <!-- SCRIPT DEL SISTEMA ANTI-RESEÑAS (DEMO CON MODAL) -->
    <script>
        const modalOverlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');

        function simularEscudo(nota) {
            const estrellas = document.querySelectorAll('#escudo-estrellas i');
            const feedback = document.getElementById('star-feedback');

            // Iluminar estrellas seleccionadas
            estrellas.forEach((star, index) => {
                if (index < nota) {
                    star.classList.replace('star-inactive', 'star-active');
                } else {
                    star.classList.replace('star-active', 'star-inactive');
                }
            });

            feedback.classList.remove('hidden');

            setTimeout(() => {
                feedback.classList.add('hidden');
                
                if (nota <= 3) {
                    mostrarModal(
                        '<i class="fa-solid fa-shield-halved text-red-500"></i>',
                        '🛡️ ESCUDO ACTIVADO',
                        'El cliente seleccionó ' + nota + ' estrella(s).<br><br>El sistema intercepta la mala nota y abre el <b>WhatsApp Privado</b> de Copy Laser para solucionar el problema en privado sin perjudicar la ficha pública.'
                    );
                } else {
                    mostrarModal(
                        '<i class="fa-brands fa-google text-amber-400"></i>',
                        '⭐ IMPULSO DE REPUTACIÓN',
                        'El cliente seleccionó ' + nota + ' estrellas.<br><br>Al estar satisfecho, el sistema lo envía directamente al formulario oficial de <b>Google Maps</b> para acumular 5 estrellas públicas.'
                    );
                }

                // Resetear estrellas después de mostrar la explicación
                estrellas.forEach(s => s.classList.replace('star-active', 'star-inactive'));
            }, 500);
        }

        function mostrarModal(icono, titulo, texto) {
            document.getElementById('modal-icon').innerHTML = icono;
            document.getElementById('modal-title').innerText = titulo;
            document.getElementById('modal-text').innerHTML = texto;
            
            modalOverlay.style.display = 'flex';
            setTimeout(() => { 
                modalOverlay.style.opacity = '1'; 
                modalContent.style.transform = 'translateY(0)';
            }, 10);
        }

        function cerrarModal(e) {
            if(e.target === modalOverlay) cerrarModalBtn();
        }

        function cerrarModalBtn() {
            modalOverlay.style.opacity = '0';
            modalContent.style.transform = 'translateY(20px)';
            setTimeout(() => { modalOverlay.style.display = 'none'; }, 300);
        }
    </script>
</body>
</html>

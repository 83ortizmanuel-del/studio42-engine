<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identidad Inteligente - Centro de Enlaces</title>
    
    <!-- Tipografía premium para darle aspecto de App Nativa -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Carga de Tailwind CSS ultra-rápida (Sin terminal) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- EL MOTOR DE TU PLANTILLA: Cambia aquí los colores para cada cliente -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        // Cambia este HEX por el color de tu próximo cliente
                        marcaPrincipal: '#FACC15', // Amarillo Copy Laser
                        fondoClaro: '#F8F9FA', // Gris casi blanco para el fondo
                        textoOscuro: '#1F2937', // Gris muy oscuro, más elegante que el negro puro
                    }
                }
            }
        }
    </script>
    
    <!-- Pequeño script JS para dar efecto de "rebote" a los botones al tocarlos -->
    <script>
        function animarClick(elemento) {
            elemento.style.transform = "scale(0.95)";
            setTimeout(() => {
                elemento.style.transform = "scale(1)";
            }, 150);
        }
    </script>
</head>

            <!-- Botón de acción directo -->

    </main>

    <!-- PIE DE PÁGINA: Tu firma de Agencia -->

        <p class="text-[10px] font-semibold uppercase tracking-wider text-gray-500">Tecnología Phygital por</p>

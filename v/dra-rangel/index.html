<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Centro Médico & Maternidad</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2B6CB0;
            --primary-light: #EBF8FF;
            --accent: #ED64A6;
            --google-yellow: #ECC94B;
            --bg-color: #F7FAFC;
            --card-bg: #FFFFFF;
            --text-main: #2D3748;
            --text-sub: #718096;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px 16px 40px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        /* HEADER PERFIL */
        .profile-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            position: relative;
        }

        .avatar-box {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #63B3ED, #4299E1);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 12px auto;
            box-shadow: 0 4px 10px rgba(66, 153, 225, 0.3);
        }

        .profile-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .profile-subtitle {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 12px;
        }

        .badge-google {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #FFF5F5;
            border: 1px solid #FED7D7;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #C53030;
        }

        .badge-google i.fa-star {
            color: var(--google-yellow);
        }

        /* SECCIONES Y MENÚS */
        .section-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-sub);
            margin: 18px 0 10px 8px;
        }

        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .app-btn {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: var(--shadow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .app-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .btn-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .btn-content {
            flex-grow: 1;
        }

        .btn-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }

        .btn-desc {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .btn-arrow {
            color: #CBD5E0;
            font-size: 14px;
            margin-left: 8px;
        }

        /* BOTÓN DESTACADO GOOGLE */
        .btn-google-highlight {
            background: linear-gradient(135deg, #FFFFFF, #F7FAFC);
            border: 1.5px solid #E2E8F0;
        }

        .btn-google-highlight .btn-title {
            color: #2D3748;
        }

        .footer-brand {
            text-align: center;
            margin-top: 30px;
            font-size: 11px;
            color: #A0AEC0;
            letter-spacing: 0.5px;
        }

        .error-msg {
            background: #FFF5F5;
            color: #C53030;
            padding: 16px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
            border: 1px solid #FEB2B2;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- CABECERA -->
        <div class="profile-card">
            <div class="avatar-box">
                <i class="fa-solid fa-user-doctor"></i>
            </div>
            <h1 class="profile-title" id="client-name">Dra. Rangel</h1>
            <p class="profile-subtitle" id="client-subtitle">Ginecología & Obstetricia VIP</p>
            <div class="badge-google">
                <i class="fa-brands fa-google" style="color:#4285F4;"></i>
                <span>4.9</span>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <span style="color:#718096; font-weight:400;">(Verificado)</span>
            </div>
        </div>

        <!-- CONTENEDOR DINÁMICO DE BOTONES -->
        <div id="dynamic-menu"></div>

        <div class="footer-brand">
            Tecnología Phygital por <b>Studio 42</b>
        </div>
    </div>

    <script>
        async function cargarEngineJSON() {
            const container = document.getElementById('dynamic-menu');
            try {
                // Lee sys-update.json en la misma subcarpeta
                const response = await fetch(`./sys-update.json?v=${Date.now()}`);
                if (!response.ok) throw new Error("No se encontró el archivo sys-update.json en esta carpeta.");
                const data = await response.json();

                if (data.nombre) document.getElementById('client-name').innerText = data.nombre;
                if (data.subtitulo) document.getElementById('client-subtitle').innerHTML = data.subtitulo;

                container.innerHTML = '';

                data.secciones.forEach(sec => {
                    if (sec.titulo) {
                        const label = document.createElement('div');
                        label.className = 'section-label';
                        label.innerText = sec.titulo;
                        container.appendChild(label);
                    }

                    const group = document.createElement('div');
                    group.className = 'menu-group';

                    sec.botones.forEach(btn => {
                        const a = document.createElement('a');
                        a.href = btn.url;
                        a.className = "app-btn";
                        
                        // Si es el botón de Google le da un estilo especial resaltado
                        if (btn.nombre.toLowerCase().includes("google") || btn.nombre.toLowerCase().includes("reseña") || btn.nombre.toLowerCase().includes("valorar")) {
                            a.classList.add("btn-google-highlight");
                        }

                        a.innerHTML = `
                            <div class="btn-icon" style="${btn.estiloIcono || 'background:#EBF8FF; color:#2B6CB0;'}">
                                <i class="${btn.icono}"></i>
                            </div>
                            <div class="btn-content">
                                <div class="btn-title">${btn.nombre}</div>
                                <div class="btn-desc">${btn.descripcion}</div>
                            </div>
                            <div class="btn-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                        `;
                        group.appendChild(a);
                    });
                    container.appendChild(group);
                });
            } catch (err) {
                console.error("Error al cargar la plantilla médica:", err);
                container.innerHTML = `<div class="error-msg">⚠️ <b>Error al cargar perfil:</b><br>${err.message}</div>`;
            }
        }

        document.addEventListener("DOMContentLoaded", cargarEngineJSON);
    </script>
</body>
</html>

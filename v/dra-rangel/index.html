<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Centro Médico & Maternidad</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brown-primary: #5C3D2E;
            --brown-accent: #B85C38;
            --brown-cream: #FDFBF7;
            --google-yellow: #ECC94B;
            --card-bg: #FFFFFF;
            --text-main: #3D2C2E;
            --text-sub: #7A6861;
            --shadow: 0 4px 15px rgba(92, 61, 46, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--brown-cream);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px 16px 40px 16px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 440px; }

        /* HEADER PERFIL */
        .profile-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 1px solid #F0E6DF;
        }
        .avatar-box {
            width: 70px; height: 70px; background: linear-gradient(135deg, #E1869E, #B85C38); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 12px auto; box-shadow: 0 4px 12px rgba(225, 134, 158, 0.3);
        }
        .profile-title { font-size: 20px; font-weight: 700; color: var(--brown-primary); margin-bottom: 4px; }
        .profile-subtitle { font-size: 13px; color: var(--text-sub); margin-bottom: 12px; line-height: 1.4; }
        
        .badge-google { display: inline-flex; align-items: center; gap: 6px; background: #FDF8F5; border: 1px solid #EAD8CE; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--brown-primary); }
        .badge-google i.fa-star { color: var(--google-yellow); }

        /* SECCIONES Y MENÚS */
        .section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--brown-accent); margin: 18px 0 10px 8px; }
        .menu-group { display: flex; flex-direction: column; gap: 12px; }

        .app-btn {
            display: flex; align-items: center; background: var(--card-bg); padding: 16px; border-radius: 16px; text-decoration: none; color: var(--text-main); box-shadow: var(--shadow); border: 1px solid #F5EBE6; transition: transform 0.15s ease;
        }
        .app-btn:active { transform: scale(0.98); }
        .btn-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 14px; flex-shrink: 0; background: #F7EFEA; color: var(--brown-primary); }
        .btn-content { flex-grow: 1; }
        .btn-title { font-size: 15px; font-weight: 600; }
        .btn-desc { font-size: 12px; color: var(--text-sub); margin-top: 2px; line-height: 1.3; }
        .btn-arrow { color: #D6C5BC; font-size: 14px; margin-left: 8px; }

        .footer-brand { text-align: center; margin-top: 30px; font-size: 11px; color: #A8958E; letter-spacing: 0.5px; }
        .error-msg { background: #FFF5F5; color: #C53030; padding: 16px; border-radius: 12px; font-size: 13px; text-align: center; border: 1px solid #FEB2B2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <div class="avatar-box"><i class="fa-solid fa-user-doctor"></i></div>
            <h1 class="profile-title" id="client-name">Dra. Rangel</h1>
            <p class="profile-subtitle" id="client-subtitle">Ginecología & Obstetricia VIP</p>
            <div class="badge-google">
                <i class="fa-brands fa-google" style="color:#4285F4;"></i>
                <span>4.9</span>
                <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
                <span style="color:var(--text-sub); font-weight:400;">(Verificado)</span>
            </div>
        </div>

        <div id="dynamic-menu"></div>
        <div class="footer-brand">Tecnología Phygital por <b>Studio 42</b></div>
    </div>

    <script>
        async function cargarEngineJSON() {
            const container = document.getElementById('dynamic-menu');
            try {
                const response = await fetch(`./sys-update.json?v=${Date.now()}`);
                if (!response.ok) throw new Error("No se encontró sys-update.json");
                const data = await response.json();

                if (data.nombre) document.getElementById('client-name').innerText = data.nombre;
                if (data.subtitulo) document.getElementById('client-subtitle').innerHTML = data.subtitulo;

                container.innerHTML = '';

                data.secciones.forEach(sec => {
                    if (sec.titulo) {
                        const label = document.createElement('div');
                        label.className = 'section-label';
                        label.innerText = sec.titulo;
                        container.appendChild(label);
                    }

                    const group = document.createElement('div');
                    group.className = 'menu-group';

                    sec.botones.forEach(btn => {
                        if (btn.tipo === 'escudo') {
                            const div = document.createElement('div');
                            div.className = "app-btn";
                            div.style.flexDirection = "column";
                            div.style.padding = "24px 16px";
                            
                            div.innerHTML = `
                                <div style="display:flex; align-items:center; gap:6px; margin-bottom:8px;">
                                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="16" alt="Google">
                                    <span style="font-weight:600; color:var(--text-main); font-size:16px;">${btn.nombre}</span>
                                </div>
                                <div style="color:var(--text-sub); font-size:12px; text-align:center; margin-bottom:16px;">${btn.descripcion}</div>
                                
                                <div class="stars-container" style="display:flex; gap:12px; font-size:36px; color:#E2E8F0; cursor:pointer;">
                                    <i class="fa-solid fa-star star-btn" data-val="1"></i>
                                    <i class="fa-solid fa-star star-btn" data-val="2"></i>
                                    <i class="fa-solid fa-star star-btn" data-val="3"></i>
                                    <i class="fa-solid fa-star star-btn" data-val="4"></i>
                                    <i class="fa-solid fa-star star-btn" data-val="5"></i>
                                </div>
                                
                                <div id="shield-msg" style="display:none; margin-top:16px; padding:12px; background:#FFF5F5; color:#C53030; border-radius:8px; font-size:13px; text-align:center; border:1px solid #FEB2B2; line-height: 1.4;">
                                    <b>${btn.mensajeDisculpa}</b><br><br>
                                    <i class="fa-solid fa-circle-notch fa-spin"></i> Conectando con atención a la paciente...
                                </div>
                            `;

                            const stars = div.querySelectorAll('.star-btn');
                            let rated = false;

                            stars.forEach(star => {
                                star.addEventListener('click', (e) => {
                                    if(rated) return;
                                    rated = true;
                                    const val = parseInt(e.target.getAttribute('data-val'));
                                    
                                    stars.forEach((s, idx) => {
                                        s.style.color = idx < val ? "#ECC94B" : "#E2E8F0";
                                    });
                                    
                                    if (val <= 3) {
                                        div.querySelector('#shield-msg').style.display = "block";
                                        setTimeout(() => { window.location.href = btn.urlWhatsapp; }, 3500);
                                    } else {
                                        setTimeout(() => { window.location.href = btn.urlGoogle; }, 800);
                                    }
                                });
                            });
                            group.appendChild(div);

                        } else {
                            const a = document.createElement('a');
                            a.href = btn.url;
                            a.className = "app-btn";
                            a.innerHTML = `
                                <div class="btn-icon" style="${btn.estiloIcono || ''}"><i class="${btn.icono}"></i></div>
                                <div class="btn-content">
                                    <div class="btn-title">${btn.nombre}</div>
                                    <div class="btn-desc">${btn.descripcion}</div>
                                </div>
                                <div class="btn-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                            `;
                            group.appendChild(a);
                        }
                    });
                    container.appendChild(group);
                });
            } catch (err) {
                container.innerHTML = `<div class="error-msg">⚠️ Error al cargar el perfil médico.</div>`;
            }
        }
        document.addEventListener("DOMContentLoaded", cargarEngineJSON);
    </script>
</body>
</html>

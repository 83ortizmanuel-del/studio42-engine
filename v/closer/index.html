<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio 42 | Diagnóstico Phygital</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0f0f10;
            color: #ffffff;
        }
        .input-phygital {
            background-color: #1a1a1c;
            border: 1px solid #2d2d30;
            color: #ffffff;
            border-radius: 12px;
            padding: 14px 16px;
            width: 100%;
            transition: all 0.2s ease;
        }
        .input-phygital:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        .btn-submit {
            background: linear-gradient(135deg, #d4af37 0%, #aa8a28 100%);
            color: #000000;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 14px;
            padding: 16px;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25);
        }
        .btn-submit:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <main class="w-full max-w-lg bg-[#141416] p-6 sm:p-8 rounded-3xl border border-[#26262a] shadow-2xl">
        
        <header class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight uppercase mb-2">Diagnóstico Phygital</h1>
            <div class="inline-flex items-center gap-2 bg-[#1f1f23] px-3 py-1 rounded-full border border-[#d4af37]/30">
                <span class="w-2 h-2 rounded-full bg-[#d4af37] animate-pulse"></span>
                <span class="text-[10px] font-bold text-[#d4af37] uppercase tracking-widest">Acceso Exclusivo Closer</span>
            </div>
        </header>

        <form id="form-diagnostico" class="space-y-4">
            
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-[#d4af37] mb-2">
                    ID Responsable (Closer)
                </label>
                <input type="text" id="closer_id" name="closer_id" value="MEL42" class="input-phygital font-semibold" required>
                <p class="text-[10px] text-gray-500 mt-1"><i class="fa-solid fa-lock text-[9px] mr-1"></i>Llave maestra asignada mediante NFC.</p>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">
                    Nombre Comercial / Sector
                </label>
                <input type="text" id="nombre_sector" name="nombre_sector" placeholder="Ej: Nails & Glow Studio / Estética" class="input-phygital" required>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">
                    Fricción o Quejas de los Clientes
                </label>
                <textarea id="fricciones" name="fricciones" rows="4" placeholder="Fricciones detectadas en el comercio..." class="input-phygital" required></textarea>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">
                    Branding, Paleta de Colores y Redes
                </label>
                <input type="text" id="branding" name="branding" placeholder="Ej: Colores Hex (#F4C2C2, #FFFFFF), IG @nailsandglow..." class="input-phygital" required>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">
                    URL del Logo / Observaciones Extra
                </label>
                <input type="text" id="logo_extra" name="logo_extra" placeholder="Ej: Link al logo en Web/Drive o notas adicionales..." class="input-phygital">
            </div>

            <button type="submit" id="btn-enviar" class="btn-submit mt-4">
                Registrar Diagnóstico
            </button>
        </form>

        <div id="mensaje-estado" class="hidden mt-4 p-4 rounded-xl text-center text-xs font-bold"></div>

    </main>

    <script>
        // URL DE TU APLICACIÓN WEB DE GOOGLE APPS SCRIPT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyS0sqzGlR4Ko3kBtSOxLsITyPRO9skuFIewaM6gA3DC7RLHKLDUp32gsibp_0IlEcQ/exec";

        const form = document.getElementById('form-diagnostico');
        const btnEnviar = document.getElementById('btn-enviar');
        const mensajeEstado = document.getElementById('mensaje-estado');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            btnEnviar.disabled = true;
            btnEnviar.innerText = "Registrando en Google Sheets...";
            btnEnviar.style.opacity = "0.7";

            const formData = new FormData(form);

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });

                mensajeEstado.className = "mt-4 p-4 rounded-xl text-center text-xs font-bold bg-green-500/10 border border-green-500/30 text-green-400";
                mensajeEstado.innerText = "¡Diagnóstico registrado con éxito en la base de datos!";
                mensajeEstado.classList.remove('hidden');

                form.reset();
                document.getElementById('closer_id').value = "MEL42";

            } catch (error) {
                console.error('Error enviando diagnóstico:', error);
                mensajeEstado.className = "mt-4 p-4 rounded-xl text-center text-xs font-bold bg-red-500/10 border border-red-500/30 text-red-400";
                mensajeEstado.innerText = "Hubo un error al enviar el registro. Revisa la conexión.";
                mensajeEstado.classList.remove('hidden');
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.innerText = "Registrar Diagnóstico";
                btnEnviar.style.opacity = "1";
                
                setTimeout(() => {
                    mensajeEstado.classList.add('hidden');
                }, 5000);
            }
        });
    </script>
</body>
</html>

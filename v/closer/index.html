<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico Phygital | Studio 42</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-zinc-900 border border-zinc-800/80 rounded-3xl p-6 shadow-2xl space-y-6">
        
        <!-- CABECERA CON LOGO MAXIMIZADO -->
        <header class="relative border-b border-zinc-800/80 pb-5 text-center space-y-2">
            <!-- Contenedor del Logo XL con Halo Proporcionado -->
            <div class="relative inline-flex items-center justify-center w-full py-2">
                <!-- Resplandor Ajustado al Tamaño XL -->
                <div class="absolute inset-0 bg-[#C57A36]/25 blur-2xl rounded-full scale-90"></div>
                
                <!-- Logo Agrandado (h-28) -->
                <img src="logo.png" 
                     alt="Studio 42" 
                     class="relative h-28 max-w-full w-auto object-contain drop-shadow-[0_12px_15px_rgba(0,0,0,0.6)] transition-transform duration-300 hover:scale-105" 
                     onerror="this.style.display='none'; document.getElementById('altLogoText').classList.remove('hidden');">
                
                <!-- Respaldo de texto si falla la carga -->
                <span id="altLogoText" class="hidden text-3xl font-black tracking-widest text-[#C57A36]">STUDIO 42</span>
            </div>

            <!-- Titular e Identificador -->
            <div class="space-y-1">
                <h1 class="text-2xl font-black text-white tracking-tight">Diagnóstico Phygital</h1>
                <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-zinc-800/60 border border-zinc-700/50">
                    <span class="w-2 h-2 rounded-full bg-[#C57A36] animate-pulse"></span>
                    <p class="text-[11px] font-medium text-zinc-300 tracking-wide uppercase">Acceso Exclusivo Closer</p>
                </div>
            </div>
        </header>

        <!-- FORMULARIO DIRECTO A GOOGLE FORMS -->
        <form id="diagForm" action="https://docs.google.com/forms/d/e/1FAIpQLSeRvv4TRmNjFrgRDxQPiSHuxljuuj5x1xDlMhXqIoK87y7Tjg/formResponse" method="POST" target="hidden_iframe" onsubmit="submitted=true;">
            
            <div class="space-y-4">
                
                <!-- 1. CÓDIGO CLOSER (BLOQUEADO / READONLY) -->
                <div>
                    <label class="block text-xs font-semibold text-[#C57A36] uppercase tracking-wider mb-1">ID Responsable (Closer)</label>
                    <input type="text" id="closerInput" name="entry.104234109" readonly required
                        class="w-full bg-zinc-950 border border-zinc-800 text-zinc-300 font-mono text-sm rounded-xl p-3 focus:outline-none cursor-not-allowed select-none opacity-90">
                    <p class="text-[10px] text-zinc-500 mt-1">🔒 Llave maestra asignada mediante NFC.</p>
                </div>

                <!-- 2. NOMBRE COMERCIAL / SECTOR -->
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-1">Nombre Comercial / Sector</label>
                    <input type="text" name="entry.1320206213" required placeholder="Ej: Óptica San José / Salud"
                        class="w-full bg-zinc-800/80 border border-zinc-700/80 text-white text-sm rounded-xl p-3 focus:border-[#C57A36] focus:outline-none transition-colors">
                </div>

                <!-- 3. FRICCIONES O QUEJAS -->
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-1">Fricción o quejas de los clientes</label>
                    <textarea name="entry.1434868797" rows="3" required placeholder="Fricciones detectadas en el comercio..."
                        class="w-full bg-zinc-800/80 border border-zinc-700/80 text-white text-sm rounded-xl p-3 focus:border-[#C57A36] focus:outline-none transition-colors"></textarea>
                </div>

                <!-- 4. ECOSISTEMA ACTUAL, BRANDING Y PALETA DE COLORES -->
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-1">Branding, Paleta de Colores y Redes</label>
                    <textarea name="entry.891929652" rows="2" placeholder="Ej: Colores Hex (#FF0000, #000000), Instagram @comercio, Web actual..."
                        class="w-full bg-zinc-800/80 border border-zinc-700/80 text-white text-sm rounded-xl p-3 focus:border-[#C57A36] focus:outline-none transition-colors"></textarea>
                </div>

                <!-- 5. URL DEL LOGO DEL CLIENTE / OBSERVACIONES EXTRA -->
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-1">URL del Logo / Observaciones Extra</label>
                    <input type="text" name="entry.1697455972" placeholder="Ej: Link al logo en Web/Drive/Instagram o notas..."
                        class="w-full bg-zinc-800/80 border border-zinc-700/80 text-white text-sm rounded-xl p-3 focus:border-[#C57A36] focus:outline-none transition-colors">
                </div>

            </div>

            <!-- BOTÓN DE ENVÍO -->
            <button type="submit" 
                class="w-full mt-6 bg-[#C57A36] hover:bg-[#b06b2e] text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-lg active:scale-[0.99] cursor-pointer">
                Registrar Diagnóstico
            </button>
        </form>

        <!-- IFRAME OCULTO -->
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { showSuccess(); }"></iframe>

        <!-- MENSAJE DE ÉXITO -->
        <div id="successMessage" class="hidden text-center py-6 space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-500/10 text-emerald-400 mb-2">✓</div>
            <h3 class="text-lg font-bold text-white">¡Diagnóstico Registrado!</h3>
            <p class="text-xs text-zinc-400">Los datos han sido enviados correctamente a la base de datos master.</p>
        </div>

    </div>

    <script>
        let submitted = false;

        // Captura el valor del parámetro ?cod=MO001 de la URL que abre el NFC
        const urlParams = new URLSearchParams(window.location.search);
        const cod = urlParams.get('cod') || 'MO001';

        // Bloquea el campo con el código correspondiente
        document.getElementById('closerInput').value = cod;

        function showSuccess() {
            document.getElementById('diagForm').classList.add('hidden');
            document.getElementById('successMessage').classList.remove('hidden');
        }
    </script>
</body>
</html>

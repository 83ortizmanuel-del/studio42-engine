<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio 42 | Diagnóstico Phygital</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0d0d0d; color: #ffffff; }
        .input-phygital {
            background-color: #1a1a1a;
            border: 1px solid #333333;
            color: #ffffff;
            border-radius: 12px;
            padding: 12px 16px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-phygital:focus { border-color: #d4af37; }
        .btn-gold {
            background: linear-gradient(135deg, #d4af37, #aa8a28);
            color: #000000;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px;
            padding: 16px;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-gold:active { transform: scale(0.98); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#141414] border border-[#262626] rounded-3xl p-6 shadow-2xl">
        
        <header class="text-center mb-6">
            <h1 class="text-2xl font-black tracking-tight text-white uppercase">Diagnóstico Phygital</h1>
            <div class="inline-flex items-center gap-2 mt-2 px-3 py-1 bg-[#221c0f] border border-[#d4af37]/30 rounded-full">
                <span class="w-2 h-2 rounded-full bg-[#d4af37] animate-pulse"></span>
                <span class="text-[10px] font-bold tracking-widest text-[#d4af37] uppercase">ACCESO EXCLUSIVO CLOSER</span>
            </div>
        </header>

        <form id="form-diagnostico" onsubmit="enviarDiagnosticoToSheet(event)" class="space-y-4">
            
            <div>
                <label class="block text-[11px] font-bold text-[#d4af37] uppercase tracking-wider mb-2">ID RESPONSABLE (CLOSER)</label>
                <input type="text" id="id-closer" class="input-phygital font-bold uppercase" placeholder="MEL42" required readonly>
                <p class="text-[10px] text-gray-500 mt-1">🔒 Llave maestra asignada mediante NFC.</p>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-gray-300 uppercase tracking-wider mb-2">NOMBRE COMERCIAL / SECTOR</label>
                <input type="text" id="nombre-comercio" class="input-phygital" placeholder="Ej: Nails & Glow / Estética" required>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-gray-300 uppercase tracking-wider mb-2">FRICCIÓN O QUEJAS DE LOS CLIENTES</label>
                <textarea id="fricciones" rows="3" class="input-phygital text-xs" placeholder="Describe las fricciones operativas detectadas..." required></textarea>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-gray-300 uppercase tracking-wider mb-2">BRANDING, PALETA DE COLORES Y REDES</label>
                <textarea id="branding" rows="2" class="input-phygital text-xs" placeholder="Colores Hex, @instagram, estilo visual..."></textarea>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-gray-300 uppercase tracking-wider mb-2">URL DEL LOGO / OBSERVACIONES EXTRA</label>
                <input type="text" id="logo-url" class="input-phygital text-xs" placeholder="Link al logo, web actual o notas WOW...">
            </div>

            <button type="submit" id="btn-submit" class="btn-gold mt-4">
                Registrar Diagnóstico
            </button>
        </form>

    </div>

    <script>
        // PEGA AQUÍ LA URL DE TU GOOGLE APPS SCRIPT
        const GOOGLE_SCRIPT_URL = "TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI";

        let closerCode = "GENERAL";

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const codURL = urlParams.get('cod');

            const inputCloser = document.getElementById('id-closer');

            if (codURL && codURL.trim() !== "") {
                closerCode = codURL.toUpperCase();
                inputCloser.value = closerCode;
            } else {
                inputCloser.value = "CLOSER_GENERAL";
                inputCloser.readOnly = false; // Permite escribir a mano si entra sin ?cod=
            }
        });

        async function enviarDiagnosticoToSheet(event) {
            event.preventDefault();

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = "REGISTRANDO...";

            const closerFinal = document.getElementById('id-closer').value.toUpperCase();

            const payload = {
                closer: closerFinal,
                comercio: document.getElementById('nombre-comercio').value,
                fricciones: document.getElementById('fricciones').value,
                branding: document.getElementById('branding').value,
                logo: document.getElementById('logo-url').value,
                fecha: new Date().toLocaleString("es-ES")
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alert("✅ Diagnóstico de [" + closerFinal + "] registrado con éxito.");
                document.getElementById('form-diagnostico').reset();
                document.getElementById('id-closer').value = closerFinal;

            } catch (error) {
                console.error("Error enviando datos:", error);
                alert("❌ Hubo un fallo al guardar el diagnóstico.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Registrar Diagnóstico";
            }
        }
    </script>
</body>
</html>

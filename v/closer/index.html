<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio 42 | Diagnóstico Phygital</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Montserrat', 'sans-serif'] },
                    colors: {
                        marcaPrincipal: '#FACC15',
                        fondoClaro: '#000000',
                        tarjetaOscura: '#1C1C1E',
                        textoOscuro: '#1F2937',
                    }
                }
            }
        }
    </script>

    <style>
        .input-phygital {
            background-color: #2C2C2E;
            border: 1px solid #3A3A3C;
            color: #FFFFFF;
            border-radius: 16px;
            padding: 14px 16px;
            width: 100%;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .input-phygital:focus {
            outline: none;
            border-color: #FACC15;
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.25);
        }
        .input-blocked {
            background-color: #141415 !important;
            border-color: #FACC15/40 !important;
            color: #FACC15 !important;
            cursor: not-allowed;
        }
        .btn-submit {
            background: #FACC15;
            color: #000000;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px;
            padding: 16px;
            width: 100%;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(250, 204, 21, 0.2);
            border: none;
            cursor: pointer;
        }
        .btn-submit:active { transform: scale(0.96); }
    </style>
</head>

<body class="bg-black min-h-screen flex flex-col items-center justify-center p-4 text-white select-none">

    <main class="w-full max-w-sm bg-tarjetaOscura p-6 rounded-3xl border border-[#FACC15]/20 shadow-2xl">
        
        <!-- Cabecera con Logo de Studio 42 -->
        <header class="w-full flex flex-col items-center mb-6 text-center">
            <img src="../../logo.png" alt="Studio 42 Logo" class="h-20 object-contain mb-3" onerror="this.onerror=null; this.src='../logo.png';">
            <h1 class="text-2xl font-extrabold tracking-tight uppercase text-white">Diagnóstico Phygital</h1>
            <div class="inline-flex items-center gap-2 bg-black/60 px-3 py-1 rounded-full border border-[#FACC15]/40 mt-2">
                <span class="w-2 h-2 rounded-full bg-[#FACC15] animate-pulse"></span>
                <span class="text-[9px] font-bold text-[#FACC15] uppercase tracking-widest">Acceso Exclusivo Closer</span>
            </div>
        </header>

        <form id="form-diagnostico" class="space-y-4">
            
            <!-- CAMPO DEL CLOSER BLOQUEADO (Solo asignable por NFC Tools mediante URL) -->
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-[#FACC15] mb-1 ml-1">
                    ID Responsable (Closer)
                </label>
                <div class="relative">
                    <input type="text" id="closer_id" name="closer_id" value="MEL42" class="input-phygital input-blocked font-extrabold text-sm" readonly required>
                    <i class="fa-solid fa-lock absolute right-4 top-4 text-[#FACC15]/70 text-xs"></i>
                </div>
                <p class="text-[9px] text-gray-400 mt-1 ml-1">🔒 Llave maestra asignada mediante NFC.</p>
            </div>

            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1 ml-1">
                    Nombre Comercial / Sector
                </label>
                <input type="text" id="nombre_sector" name="nombre_sector" placeholder="Ej: Óptica San José / Salud" class="input-phygital" required>
            </div>

            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1 ml-1">
                    Fricción o Quejas de los Clientes
                </label>
                <textarea id="fricciones" name="fricciones" rows="3" placeholder="Fricciones detectadas en el comercio..." class="input-phygital" required></textarea>
            </div>

            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1 ml-1">
                    Branding, Paleta de Colores y Redes
                </label>
                <input type="text" id="branding" name="branding" placeholder="Ej: Colores Hex (#FF0000), IG @comercio..." class="input-phygital" required>
            </div>

            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1 ml-1">
                    URL del Logo / Observaciones Extra
                </label>
                <input type="text" id="logo_extra" name="logo_extra" placeholder="Ej: Link al logo en Web/Drive o notas..." class="input-phygital">
            </div>

            <button type="submit" id="btn-enviar" class="btn-submit mt-4">
                Registrar Diagnóstico
            </button>
        </form>

        <div id="mensaje-estado" class="hidden mt-4 p-4 rounded-2xl text-center text-xs font-bold"></div>

    </main>

    <footer class="mt-6 text-center text-[10px] text-gray-500 font-semibold tracking-widest uppercase">
        Desarrollado por <span class="text-[#FACC15] font-extrabold">Studio 42</span>
    </footer>

    <script>
        // CAPTURA AUTOMÁTICA DEL ID DEL CLOSER DESDE LA TARJETA NFC
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const closerCod = urlParams.get('cod');
            if (closerCod) {
                document.getElementById('closer_id').value = closerCod.toUpperCase();
            }
        });

        // URL DE TU APLICACIÓN WEB DE GOOGLE APPS SCRIPT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyS0sqzGlR4Ko3kBtSOxLsITyPRO9skuFIewaM6gA3DC7RLHKLDUp32gsibp_0IlEcQ/exec";

        const form = document.getElementById('form-diagnostico');
        const btnEnviar = document.getElementById('btn-enviar');
        const mensajeEstado = document.getElementById('mensaje-estado');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            btnEnviar.disabled = true;
            btnEnviar.innerText = "Registrando en Google Sheets...";
            btnEnviar.style.opacity = "0.7";

            const formData = new FormData(form);

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });

                mensajeEstado.className = "mt-4 p-4 rounded-2xl text-center text-xs font-bold bg-[#FACC15]/10 border border-[#FACC15]/40 text-[#FACC15]";
                mensajeEstado.innerText = "¡Diagnóstico registrado con éxito en Google Sheets!";
                mensajeEstado.classList.remove('hidden');

                const closerActual = document.getElementById('closer_id').value;
                form.reset();
                document.getElementById('closer_id').value = closerActual;

            } catch (error) {
                console.error('Error enviando diagnóstico:', error);
                mensajeEstado.className = "mt-4 p-4 rounded-2xl text-center text-xs font-bold bg-red-500/10 border border-red-500/30 text-red-400";
                mensajeEstado.innerText = "Error al conectar. Revisa la conexión.";
                mensajeEstado.classList.remove('hidden');
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.innerText = "Registrar Diagnóstico";
                btnEnviar.style.opacity = "1";
                
                setTimeout(() => {
                    mensajeEstado.classList.add('hidden');
                }, 4000);
            }
        });
    </script>
</body>
</html>

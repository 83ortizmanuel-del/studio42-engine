<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio 42 | Diagnóstico Phygital Closer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --color-oro: #c4c4c4;
            --color-fondo: #050505;
            --color-tarjeta: rgba(20, 20, 20, 0.85);
            --color-boton: #1a1a1a;
            --color-texto: #ffffff;
            --color-gris: #8e8e93;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--color-fondo); color: var(--color-texto); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }

        .terminal-container {
            background: var(--color-tarjeta); width: 100%; max-width: 420px; border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9); padding: 30px 22px; text-align: left;
            border: 1px solid rgba(196, 196, 196, 0.25); backdrop-filter: blur(12px);
        }

        .input-field {
            width: 100%; background: var(--color-boton); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px; padding: 12px 15px; color: #ffffff; font-size: 0.9rem; margin-top: 6px;
            outline: none; transition: border-color 0.2s;
        }
        .input-field:focus { border-color: var(--color-oro); }

        .btn-enviar {
            width: 100%; background: linear-gradient(135deg, var(--color-oro), #8e8e93); color: #000; border: none;
            padding: 16px; border-radius: 50px; font-size: 0.95rem; font-weight: 800; letter-spacing: 1px;
            text-transform: uppercase; cursor: pointer; margin-top: 20px; box-shadow: 0 0 25px rgba(196, 196, 196, 0.25);
            transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-enviar:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <div class="terminal-container">
        <div style="text-align: center; margin-bottom: 20px;">
            <div style="display: inline-block; padding: 6px 16px; background: rgba(196,196,196,0.1); border-radius: 50px; border: 1px solid rgba(196,196,196,0.25); margin-bottom: 10px;">
                <span style="color: var(--color-oro); font-size: 0.75rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;">Studio 42 Terminal</span>
            </div>
            <h1 style="font-size: 1.35rem; font-weight: 900; text-transform: uppercase;">Diagnóstico Phygital</h1>
            <p style="color: var(--color-gris); font-size: 0.8rem; margin-top: 4px;">Registro de cliente y generación en Google Sheets</p>
        </div>

        <form id="form-closer" class="space-y-4">
            <div>
                <label style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--color-gris);">1. Nombre del Negocio</label>
                <input type="text" id="negocio" required placeholder="Ej. Bar El Laurel" class="input-field">
            </div>

            <div>
                <label style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--color-gris);">2. Sector Comercial</label>
                <input type="text" id="sector" required placeholder="Ej. Hostelería / Restauración" class="input-field">
            </div>

            <div>
                <label style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--color-gris);">3. Fricción Principal / Cuello de Botella</label>
                <textarea id="friccion" required rows="3" placeholder="Ej. Pierden reseñas, no guardan contacto, colas pidiendo wifi..." class="input-field" style="resize: none;"></textarea>
            </div>

            <div>
                <label style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--color-gris);">4. WhatsApp o Contacto de Gerencia</label>
                <input type="text" id="contacto" required placeholder="Ej. 672000000" class="input-field">
            </div>

            <button type="submit" id="btn-submit" class="btn-enviar">
                <i class="fa-solid fa-cloud-arrow-up"></i> Registrar Diagnóstico
            </button>
        </form>

        <div id="mensaje-exito" style="display: none; text-align: center; margin-top: 20px; padding: 15px; background: rgba(48,209,88,0.1); border: 1px solid #30d158; border-radius: 16px;">
            <i class="fa-solid fa-circle-check" style="color: #30d158; font-size: 1.5rem; margin-bottom: 6px;"></i>
            <p style="color: #ffffff; font-size: 0.85rem; font-weight: 700;">¡Registrado con éxito!</p>
            <p style="color: var(--color-gris); font-size: 0.75rem; margin-top: 2px;">Enviado a tu Google Sheet en tiempo real.</p>
        </div>
    </div>

    <script>
        // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT QUE TERMINA EN /exec
        const WEBHOOK_URL = "PEGA_AQUI_TU_URL_DE_APPS_SCRIPT";

        const form = document.getElementById('form-closer');
        const btn = document.getElementById('btn-submit');
        const exito = document.getElementById('mensaje-exito');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Registrando...';

            const payload = {
                fecha: new Date().toLocaleString("es-ES"),
                negocio: document.getElementById('negocio').value.trim(),
                sector: document.getElementById('sector').value.trim(),
                friccion: document.getElementById('friccion').value.trim(),
                contacto: document.getElementById('contacto').value.trim()
            };

            // Petición robusta compatible con Google Apps Script sin bloqueo CORS
            fetch(WEBHOOK_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                form.style.display = "none";
                exito.style.display = "block";
            })
            .catch(err => {
                console.error("Error al enviar:", err);
                // En Apps Script mode no-cors, aunque salte aviso de red el registro suele insertarse
                form.style.display = "none";
                exito.style.display = "block";
            });
        });
    </script>
</body>
</html>

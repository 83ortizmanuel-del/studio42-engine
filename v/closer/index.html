<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio 42 | Diagnóstico Closer</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --color-accent: #c4c4c4;
            --color-glow: rgba(196, 196, 196, 0.4);
            --color-fondo: #050507;
            --gradient-conic: conic-gradient(
                transparent 0%, transparent 45%, 
                rgba(196, 196, 196, 0.6) 50%, rgba(255, 255, 255, 0.8) 52%, rgba(196, 196, 196, 0.6) 54%, 
                transparent 60%, transparent 100%
            );
            --gradient-btn: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 40%, #c4c4c4 70%, #94A3B8 100%);
            --btn-text-color: #07080B;
        }

        body.theme-melina {
            --color-accent: #FF2E9B;
            --color-glow: rgba(255, 46, 155, 0.5);
            --gradient-conic: conic-gradient(
                transparent 0%, #FF2E9B 30%, transparent 50%, #A855F7 70%, transparent 100%
            );
            --gradient-btn: linear-gradient(135deg, #FF2E9B 0%, #A855F7 100%);
            --btn-text-color: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--color-fondo);
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 28px 28px;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-x: hidden;
            user-select: none;
        }

        .neon-card-wrapper {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            padding: 1.5px;
            background: rgba(20, 20, 22, 0.8);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 25px var(--color-glow);
            width: 100%;
            max-width: 420px;
            margin: 16px 0;
        }

        .neon-card-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: var(--gradient-conic);
            animation: rotateNeonSutil 8s linear infinite;
            z-index: 0;
        }

        @keyframes rotateNeonSutil {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .neon-card-content {
            position: relative;
            background: rgba(14, 14, 17, 0.96);
            border-radius: 26.5px;
            z-index: 1;
            backdrop-filter: blur(16px);
            padding: 24px 20px;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
            gap: 6px;
        }

        .logo-hero {
            height: 85px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 16px var(--color-glow));
        }

        .title-phygital {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .subtitle-phygital {
            color: var(--color-accent);
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .badge-closer {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--color-accent);
            color: var(--color-accent);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .dot-pulse {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--color-accent);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #9ca3af;
            margin-bottom: 5px;
            margin-left: 4px;
        }

        .input-cyber {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-radius: 14px;
            padding: 12px 14px;
            width: 100%;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
        }

        .input-cyber:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--color-accent);
            box-shadow: 0 0 12px var(--color-glow);
        }

        .input-locked {
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--color-accent);
            color: var(--color-accent);
            cursor: not-allowed;
            font-weight: 900;
        }

        .relative-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .relative-box i {
            position: absolute;
            right: 14px;
            font-size: 12px;
            color: var(--color-accent);
        }

        .color-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .color-picker-input {
            height: 42px;
            width: 52px;
            border-radius: 12px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            padding: 2px;
            flex-shrink: 0;
        }

        .panel-fricciones {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding-top: 4px;
        }

        .chip-friccion {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #d1d5db;
            font-size: 0.72rem;
            font-weight: 600;
            border-radius: 10px;
            padding: 7px 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .chip-friccion.active {
            background: rgba(255, 255, 255, 0.14);
            border-color: var(--color-accent);
            color: #ffffff;
            box-shadow: 0 0 10px var(--color-glow);
        }

        .chip-friccion.active i {
            color: var(--color-accent);
        }

        .btn-cyber-submit {
            background: var(--gradient-btn);
            color: var(--btn-text-color);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 50px;
            padding: 15px;
            width: 100%;
            font-size: 0.85rem;
            box-shadow: 0 0 20px var(--color-glow);
            border: none;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-cyber-submit:active { transform: scale(0.98); }

        .hidden-element {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="neon-card-wrapper">
        <main class="neon-card-content">
            
            <header>
                <img src="/logo.png" alt="Studio 42" class="logo-hero" onerror="this.src='logo.png'">
                <div>
                    <h1 class="title-phygital">Diagnóstico Phygital</h1>
                    <p class="subtitle-phygital">Engine v3 // Identidad Inteligente</p>
                </div>
                <div class="badge-closer">
                    <span class="dot-pulse"></span>
                    <span id="badge-closer-text">Acceso Exclusivo Closer</span>
                </div>
            </header>

            <form id="form-diagnostico">
                
                <div class="form-group">
                    <label style="color: var(--color-accent);">ID Responsable (Closer)</label>
                    <div class="relative-box">
                        <input type="text" id="closer_id" value="MO001" class="input-cyber input-locked" readonly required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Nombre Comercial del Negocio</label>
                    <input type="text" id="nombre_comercio" placeholder="Ej: Centro Veterinario Norte" class="input-cyber" required>
                </div>

                <div class="form-group">
                    <label>Sector del Negocio</label>
                    <select id="sector_select" class="input-cyber" required>
                        <option value="" disabled selected>-- Selecciona el Sector --</option>
                        <option value="Hostelería y Restauración">🍽️ Hostelería, Cafetería o Restauración</option>
                        <option value="Salud y Clínicas">🩺 Salud, Odontología, Fisio o Médica</option>
                        <option value="Belleza y Estética">✂️ Belleza, Barbería, Peluquería o Spa</option>
                        <option value="Automoción y Talleres">🚗 Automoción, Taller Mecánico o Concesionario</option>
                        <option value="Comercio y Retail">🛍️ Comercio Minorista, Moda o Tienda Local</option>
                        <option value="Servicios Profesionales">💼 Asesoría, Abogados, Inmobiliaria o Consultoría</option>
                        <option value="Otros">✨ Otros (Sector Novedoso / Personalizado)</option>
                    </select>
                </div>

                <div id="campo-otro-sector-container" class="form-group hidden-element">
                    <label style="color: #34d399;">Especifica el Sector Novedoso</label>
                    <input type="text" id="sector_otro_input" placeholder="Ej: Escuela de Buceo..." class="input-cyber">
                </div>

                <div id="cuestionario-sector-container" class="panel-fricciones hidden-element">
                    <label style="color: #34d399; margin: 0;">Fricciones Detectadas en el Pitch</label>
                    <div id="chips-fricciones" class="chips-container"></div>
                    <input type="text" id="fricciones_extra" placeholder="Otra fricción comentada..." class="input-cyber" style="margin-top: 6px; font-size: 11px;">
                </div>

                <div class="form-group">
                    <label>Identidad Visual / Paleta de Colores</label>
                    <div class="color-row">
                        <input type="text" id="branding" placeholder="#0070F3 // Neón" class="input-cyber" required>
                        <input type="color" id="color-picker" value="#00E5FF" class="color-picker-input">
                    </div>
                </div>

                <div class="form-group">
                    <label>URL del Logo / Observaciones Extra</label>
                    <input type="text" id="logo_extra" placeholder="Enlace a web o Drive..." class="input-cyber">
                </div>

                <button type="submit" id="btn-enviar" class="btn-cyber-submit">
                    Registrar Diagnóstico
                </button>
            </form>

            <div id="mensaje-estado" class="hidden-element" style="margin-top: 14px; padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.06); text-align: center; font-size: 11px; font-weight: bold;"></div>

        </main>
    </div>

    <script>
        const FRICCIONES_POR_SECTOR = {
            "Hostelería y Restauración": [
                "Clientes piden la carta QR y no carga o está desactualizada",
                "Falta de reseñas en Google Maps tras visitas satisfechas",
                "Gestión de reservas saturada por llamadas y WhatsApp a deshoras"
            ],
            "Salud y Clínicas": [
                "Pacientes olvidan las citas o no confirman a tiempo",
                "Miedo a reseñas negativas públicas por tiempos de espera",
                "Llamadas constantes solo para consultar horarios y tarifas"
            ],
            "Belleza y Estética": [
                "Citas canceladas a última hora sin previo aviso",
                "Clientes preguntan precios por mensaje privado y no reservan",
                "Pocas valoraciones en Google respecto al volumen diario"
            ],
            "Automoción y Talleres": [
                "Clientes olvidan revisiones periódicas, ITV o cambios de aceite",
                "Consultas repetitivas sobre el estado del vehículo en reparación",
                "Poco tráfico de valoraciones 5 estrellas en su ficha de Google"
            ],
            "Comercio y Retail": [
                "Clientes miran en tienda pero compran online a la competencia",
                "Dificultad para fidelizar al comprador esporádico",
                "Pocas reseñas de clientes locales satisfechos"
            ],
            "Servicios Profesionales": [
                "Fuga de contactos calificados por no responder de inmediato",
                "Falta de un enlace directo con vCard que se guarde en la agenda",
                "Presencia en Google desactualizada frente a competidores"
            ],
            "Otros": [
                "Fuga de contactos que no se convierten en clientes recurrentes",
                "Falta de presencia digital interactiva en el mostrador",
                "Dificultad para recibir reseñas positivas de forma automática"
            ]
        };

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const closerCod = (urlParams.get('cod') || urlParams.get('closer') || 'MO001').toUpperCase().trim();
            const inputCloser = document.getElementById('closer_id');
            const badgeText = document.getElementById('badge-closer-text');

            if (inputCloser) inputCloser.value = closerCod;

            // Si es Melina se pone rosa, si eres tú (MO001) u otro closer se pone en titanio/plata
            if (closerCod.includes('MEL')) {
                document.body.classList.add('theme-melina');
                if (badgeText) badgeText.innerText = "Acceso Exclusivo Melina";
            } else {
                document.body.classList.remove('theme-melina');
                if (badgeText) badgeText.innerText = "Acceso Exclusivo Closer: " + closerCod;
            }
        });

        const sectorSelect = document.getElementById('sector_select');
        const campoOtroContainer = document.getElementById('campo-otro-sector-container');
        const sectorOtroInput = document.getElementById('sector_otro_input');
        const cuestionarioContainer = document.getElementById('cuestionario-sector-container');
        const chipsContainer = document.getElementById('chips-fricciones');

        sectorSelect.addEventListener('change', () => {
            const sector = sectorSelect.value;
            chipsContainer.innerHTML = '';

            if (sector === 'Otros') {
                campoOtroContainer.classList.remove('hidden-element');
                sectorOtroInput.required = true;
            } else {
                campoOtroContainer.classList.add('hidden-element');
                sectorOtroInput.required = false;
                sectorOtroInput.value = '';
            }
            
            if (FRICCIONES_POR_SECTOR[sector]) {
                cuestionarioContainer.classList.remove('hidden-element');
                FRICCIONES_POR_SECTOR[sector].forEach(friccion => {
                    const chip = document.createElement('div');
                    chip.className = 'chip-friccion';
                    chip.innerHTML = `<i class="fa-regular fa-square"></i> <span>${friccion}</span>`;
                    chip.addEventListener('click', () => {
                        chip.classList.toggle('active');
                        const icon = chip.querySelector('i');
                        icon.className = chip.classList.contains('active') ? "fa-solid fa-square-check" : "fa-regular fa-square";
                    });
                    chipsContainer.appendChild(chip);
                });
            } else {
                cuestionarioContainer.classList.add('hidden-element');
            }
        });

        const colorPicker = document.getElementById('color-picker');
        const inputBranding = document.getElementById('branding');
        colorPicker.addEventListener('input', (e) => {
            inputBranding.value = `${e.target.value} // Tono Neón`;
            document.documentElement.style.setProperty('--color-glow', e.target.value + '88');
        });

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBX3u7pctH4FdbpHzyH11eXv0sbzMm1Xs6-aO9vMVE-QeCnz1CkuPFHBN7RobM9NPw/exec";
        const form = document.getElementById('form-diagnostico');
        const btnEnviar = document.getElementById('btn-enviar');
        const mensajeEstado = document.getElementById('mensaje-estado');

        function iniciarCuentaRegresiva(urlDestino) {
            let segs = 35;
            mensajeEstado.className = "";
            mensajeEstado.style.display = "block";
            mensajeEstado.innerHTML = `
                <div style="color: #34d399; margin-bottom: 6px;">⚡ Nodo Phygital Compilado</div>
                <div id="btn-countdown" style="padding: 10px; background: rgba(255,255,255,0.15); border-radius: 50px; color: #fff;">
                    ⏳ Desplegando en Servidor (<span id="reloj">${segs}</span>s)
                </div>
            `;

            const intervalo = setInterval(() => {
                segs--;
                const reloj = document.getElementById('reloj');
                if (reloj) reloj.innerText = segs;
                if (segs <= 0) {
                    clearInterval(intervalo);
                    const btn = document.getElementById('btn-countdown');
                    if (btn) {
                        btn.style.background = "#fff";
                        btn.style.color = "#000";
                        btn.style.cursor = "pointer";
                        btn.innerText = "👉 ¡Ver Demo en Vivo!";
                        btn.onclick = () => window.open(urlDestino, '_blank');
                    }
                }
            }, 1000);
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            btnEnviar.disabled = true;
            btnEnviar.innerText = "Compilando Phygital Engine...";

            const closerVal = document.getElementById('closer_id').value.trim();
            const nombreComercio = document.getElementById('nombre_comercio').value.trim();
            let sectorVal = document.getElementById('sector_select').value;
            if (sectorVal === 'Otros') {
                sectorVal = sectorOtroInput.value.trim() ? `Otros (${sectorOtroInput.value.trim()})` : 'Sector Novedoso';
            }

            const chips = Array.from(document.querySelectorAll('.chip-friccion.active span')).map(s => s.innerText);
            const extra = document.getElementById('fricciones_extra').value.trim();
            if (extra) chips.push(extra);

            const slug = nombreComercio.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\s-]/g, '').trim().replace(/[\s_-]+/g, '-');

            const params = new URLSearchParams();
            params.append("closer_id", closerVal);
            params.append("nombre_sector", `${nombreComercio} / ${sectorVal}`);
            params.append("fricciones", chips.length ? chips.join(" | ") : "Optimización integral");
            params.append("branding", document.getElementById('branding').value.trim());
            params.append("logo_extra", document.getElementById('logo_extra').value.trim());

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            })
            .then(() => {
                iniciarCuentaRegresiva(`https://studio42.es/c/?cod=${slug}`);
                form.reset();
                document.getElementById('closer_id').value = closerVal;
                cuestionarioContainer.classList.add('hidden-element');
                campoOtroContainer.classList.add('hidden-element');
            })
            .catch(() => {
                iniciarCuentaRegresiva(`https://studio42.es/c/?cod=${slug}`);
            })
            .finally(() => {
                btnEnviar.disabled = false;
                btnEnviar.innerText = "Registrar Diagnóstico";
            });
        });
    </script>
</body>
</html>

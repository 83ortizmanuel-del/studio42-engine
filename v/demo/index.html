<!-- En la tarjeta final de la demo -->

</button>

    <div class="card-silver-premium max-w-sm w-full p-6 text-center space-y-5 border-2 border-[#C4C4C4]">

        </div>

            </p>
        </div>
        <div class="p-3 bg-white/5 rounded-xl border border-white/10 text-[10px] text-zinc-400">

        <button type="button" onclick="cerrarProtocoloActivacion()" class="text-xs text-zinc-500 uppercase font-bold tracking-widest hover:text-white transition">

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio 42 | Demo Phygital</title>
    <!-- Iconos y Estilos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --color-oro: #d4af37;
            --color-fondo: #050505; 
            --color-tarjeta: rgba(20, 20, 20, 0.85); 
            --color-boton: #1a1a1a; 
            --color-texto: #ffffff;
            --color-gris: #8e8e93;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--color-fondo); color: var(--color-texto); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; user-select: none; }
        
        /* OVERLAY DE DESBLOQUEO SENSORIAL */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
            background: linear-gradient(180deg, #0f0f0f 0%, #000000 100%);
            z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1); padding: 20px;
        }
        .btn-desbloqueo {
            background: linear-gradient(135deg, var(--color-oro), #aa8a28); color: #000; border: none; 
            padding: 16px 36px; border-radius: 50px; font-size: 0.95rem; font-weight: 800; letter-spacing: 1.5px; 
            text-transform: uppercase; cursor: pointer; box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
            transition: all 0.2s ease;
        }
        .btn-desbloqueo:active { transform: scale(0.95); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .pulse-logo { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); } 70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(212, 175, 55, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } }

        /* HUB PRINCIPAL (GLASSMORPHISM) */
        .hub-container { 
            background: var(--color-tarjeta); width: 100%; max-width: 400px; border-radius: 28px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9); padding: 30px 20px; text-align: center; 
            border: 1px solid rgba(212, 175, 55, 0.15); backdrop-filter: blur(12px);
        }
        
        .logo-container { width: 90px; height: 90px; margin: 0 auto 15px auto; border-radius: 25%; border: 2px solid var(--color-oro); overflow: hidden; background-color: #000; display: flex; justify-content: center; align-items: center; }
        .logo-container img { width: 80%; height: 80%; object-fit: contain; }
        
        h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: 1.5px; margin-bottom: 2px; text-transform: uppercase; }
        .propietario { color: var(--color-oro); font-size: 0.85rem; margin-bottom: 25px; font-weight: 600; letter-spacing: 1px; }
        
        /* BOTONES DE LA DEMO */
        .section-title { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--color-gris); margin: 20px 0 10px 6px; font-weight: 700; }
        .apps-menu { display: flex; flex-direction: column; gap: 12px; }
        .app-btn { display: flex; align-items: center; padding: 14px 18px; border-radius: 18px; background-color: var(--color-boton); border: 1px solid rgba(255, 255, 255, 0.03); transition: all 0.2s ease; cursor: pointer; text-align: left; }
        .app-btn:active { transform: scale(0.97); background-color: #222; border-color: rgba(212, 175, 55, 0.3); }
        .app-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; justify-content: center; align-items: center; margin-right: 15px; font-size: 1.25rem; flex-shrink: 0; }

        .app-info { flex-grow: 1; }
        .app-name { font-size: 0.95rem; font-weight: 600; color: var(--color-texto); margin-bottom: 2px; }
        .app-desc { font-size: 0.75rem; color: var(--color-gris); }
        
        /* ESCUDO ANTI-RESEÑAS */
        .stars-container { font-size: 1.8rem; margin-top: 10px; display: flex; justify-content: center; gap: 8px; width: 100%; }
        .star-rating i { cursor: pointer; transition: color 0.2s, transform 0.2s; }
        .star-rating i:active { transform: scale(1.3); }
        .star-active { color: #ffb400; text-shadow: 0 0 10px rgba(255, 180, 0, 0.5); }
        .star-inactive { color: #333; }

        /* BOTÓN FLOTANTE AUDIO */
        #btn-audio {
            display: none; position: fixed; bottom: 25px; right: 25px; z-index: 999; 
            background: rgba(10, 10, 10, 0.8); border: 1px solid var(--color-oro); color: var(--color-oro); 
            width: 50px; height: 50px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            align-items: center; justify-content: center; transition: all 0.3s;
        }
    </style>
</head>
<body>

    <!-- 1. AUDIO MP3 NATIVO (Sin dependencias de YouTube) -->
    <audio id="audio-fondo" loop>
        <!-- ASEGÚRATE DE TENER EL ARCHIVO ambiente.mp3 EN LA MISMA CARPETA -->
        <source src="ambiente.mp3" type="audio/mpeg">
    </audio>

    <!-- 2. PANTALLA DE DESBLOQUEO SENSORIAL -->
    <div id="splash-screen">
        <div class="logo-container pulse-logo" style="width: 120px; height: 120px; margin-bottom: 25px;">
            <img src="logo.png" alt="Studio 42" onerror="this.style.display='none'">
        </div>
        <h2 style="color: var(--color-oro); font-size: 1.5rem; margin-bottom: 8px; letter-spacing: 3px; font-weight: 900;">STUDIO 42</h2>
        <p style="color: var(--color-gris); font-size: 0.9rem; margin-bottom: 35px; text-transform: uppercase; letter-spacing: 1px;">Ecosistema Phygital</p>
        <button onclick="iniciarMagia()" class="btn-desbloqueo">Desbloquear Experiencia</button>
    </div>

    <!-- 3. BOTÓN FLOTANTE MUTE -->
    <button id="btn-audio" onclick="alternarAudio()">
        <i id="icono-audio" class="fa-solid fa-volume-high"></i>
    </button>

    <!-- 4. HUB DE VENTAS (DEMO PARA EL DUEÑO DEL NEGOCIO) -->
    <div class="hub-container">
        <div class="logo-container">
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
        </div>
        <h1>STUDIO 42</h1>
        <div class="propietario">TECNOLOGÍA SIN FRICCIONES</div>

        <div class="apps-menu">
            
            <div class="section-title">Herramientas de Retención</div>

            <!-- GESTOR DE PARKING GPS -->
            <a class="app-btn" onclick="gestionarParking(event)">
                <div class="app-icon" id="parking-box" style="background: rgba(142,142,147,0.1); color: #8e8e93;">
                    <i id="parking-icon" class="fa-solid fa-location-crosshairs"></i>
                </div>
                <div class="app-info">
                    <div class="app-name" id="parking-name">¿Dónde aparqué?</div>
                    <div class="app-desc" id="parking-desc">Guardamos tu coche por GPS</div>
                </div>
                <i class="fa-solid fa-chevron-right" style="color:#555; font-size:0.8rem;"></i>
            </a>

            <!-- GUARDAR CONTACTO -->
            <a class="app-btn" onclick="alert('Demo: Al tocar aquí, el móvil descarga tu tarjeta vCard y te guarda en sus contactos para siempre.');">
                <div class="app-icon" style="background: rgba(0,229,255,0.1); color: #00e5ff;">
                    <i class="fa-solid fa-address-card"></i>
                </div>
                <div class="app-info">
                    <div class="app-name">Guardar en Contactos</div>
                    <div class="app-desc">No volverán a perder tu número</div>
                </div>
                <i class="fa-solid fa-chevron-right" style="color:#555; font-size:0.8rem;"></i>
            </a>

            <div class="section-title" style="color: var(--color-oro);">El Escudo Protector</div>

            <!-- ESCUDO ANTI-RESEÑAS (LA VENTA MAESTRA) -->
            <div class="app-btn" style="flex-direction: column; cursor: default; align-items: flex-start; border: 1px solid rgba(212, 175, 55, 0.3); background: rgba(212, 175, 55, 0.05);">
                <div style="display: flex; align-items: center; width: 100%;">
                    <div class="app-icon" style="background: rgba(255,180,0,0.15); color: #ffb400;">
                        <i class="fa-brands fa-google"></i>
                    </div>
                    <div class="app-info">
                        <div class="app-name" style="color: var(--color-oro);">Filtro Inteligente de Reseñas</div>
                        <div class="app-desc">Toca las estrellas para probarlo</div>
                    </div>
                </div>
                
                <!-- Estrellas Interactivas -->
                <div class="stars-container star-rating" id="escudo-estrellas">
                    <i class="fa-solid fa-star star-inactive" onclick="simularFiltro(1)"></i>
                    <i class="fa-solid fa-star star-inactive" onclick="simularFiltro(2)"></i>
                    <i class="fa-solid fa-star star-inactive" onclick="simularFiltro(3)"></i>
                    <i class="fa-solid fa-star star-inactive" onclick="simularFiltro(4)"></i>
                    <i class="fa-solid fa-star star-inactive" onclick="simularFiltro(5)"></i>
                </div>
                <p id="mensaje-filtro" style="font-size: 0.75rem; color: var(--color-oro); text-align: center; width: 100%; margin-top: 10px; display: none; font-weight:600;">Procesando...</p>
            </div>

        </div>
    </div>

    <!-- SCRIPTS CORE (Sin llamadas externas) -->
    <script>
        // 1. CONTROL DE AUDIO Y DESBLOQUEO
        const reproductor = document.getElementById('audio-fondo');
        const splash = document.getElementById('splash-screen');
        const btnAudio = document.getElementById('btn-audio');
        const iconoAudio = document.getElementById('icono-audio');
        let audioMuteado = false;

        function iniciarMagia() {
            // Desvanece la pantalla
            splash.style.opacity = '0';
            setTimeout(() => { splash.style.display = 'none'; }, 600);
            
            // Fuerza la reproducción del MP3 local
            reproductor.play().then(() => {
                btnAudio.style.display = 'flex'; // Muestra el botón flotante solo si reprodujo bien
            }).catch(e => {
                console.log("No se encontró ambiente.mp3 o el navegador bloqueó el autoplay.");
                btnAudio.style.display = 'flex'; // Lo mostramos igual para control visual
            });
        }

        function alternarAudio() {
            if (audioMuteado) {
                reproductor.play();
                iconoAudio.className = "fa-solid fa-volume-high";
                btnAudio.style.borderColor = "var(--color-oro)";
                btnAudio.style.color = "var(--color-oro)";
                audioMuteado = false;
            } else {
                reproductor.pause();
                iconoAudio.className = "fa-solid fa-volume-xmark";
                btnAudio.style.borderColor = "var(--color-gris)";
                btnAudio.style.color = "var(--color-gris)";
                audioMuteado = true;
            }
        }

        // 2. LÓGICA DEL ESCUDO ANTI-RESEÑAS (Efecto WOW)
        function simularFiltro(nota) {
            const estrellas = document.querySelectorAll('#escudo-estrellas i');
            const mensaje = document.getElementById('mensaje-filtro');

            // Colorear estrellas
            estrellas.forEach((estrella, indice) => {
                if (indice < nota) {
                    estrella.classList.replace('star-inactive', 'star-active');
                } else {
                    estrella.classList.replace('star-active', 'star-inactive');
                }
            });

            mensaje.style.display = 'block';
            mensaje.innerText = "Analizando respuesta...";

            setTimeout(() => {
                if (nota <= 3) {
                    mensaje.style.display = 'none';
                    alert("🛡️ SIMULACIÓN DE QUEJA (1 a 3 Estrellas)\n\nEl cliente enfadado no irá a Google. El sistema intercepta su mala nota y abre tu WhatsApp Privado pidiéndole disculpas para que resuelvas el problema en privado.\n\n¡Tu reputación está a salvo!");
                } else {
                    mensaje.style.display = 'none';
                    alert("⭐ SIMULACIÓN DE ÉXITO (4 o 5 Estrellas)\n\nEl cliente feliz es redirigido directamente a tu ficha de Google Maps para que te deje una reseña pública de 5 estrellas al instante.\n\n¡SEO Local disparado!");
                }
                
                // Reset visual
                estrellas.forEach(e => e.classList.replace('star-active', 'star-inactive'));
            }, 600);
        }

        // 3. LÓGICA DEL PARKING GPS (Aporta utilidad real)
        function actualizarInterfazParking() {
            const lat = localStorage.getItem('demo_gps_lat');
            const lng = localStorage.getItem('demo_gps_lng');
            const iconBox = document.getElementById('parking-box');
            const icon = document.getElementById('parking-icon');
            const title = document.getElementById('parking-name');
            const desc = document.getElementById('parking-desc');

            if (lat && lng) {
                iconBox.style.background = "rgba(212, 175, 55, 0.2)";
                iconBox.style.color = "var(--color-oro)";
                icon.className = "fa-solid fa-person-walking";
                title.innerText = "Ir a mi coche (Ruta GPS)";
                title.style.color = "var(--color-oro)";
                desc.innerText = "Toca para abrir Maps y volver";
            } else {
                iconBox.style.background = "rgba(142,142,147,0.1)";
                iconBox.style.color = "#8e8e93";
                icon.className = "fa-solid fa-location-crosshairs";
                title.innerText = "¿Dónde aparqué?";
                title.style.color = "var(--color-texto)";
                desc.innerText = "Guarda tu coche por GPS";
            }
        }

        function gestionarParking(e) {
            e.preventDefault();
            const lat = localStorage.getItem('demo_gps_lat');
            
            if (lat) {
                alert("Demo: El sistema abre Google Maps con la ruta a pie exacta hasta el coche del cliente.");
                if (confirm("¿Quieres borrar el coche de la memoria para reiniciar la demo?")) {
                    localStorage.removeItem('demo_gps_lat');
                    localStorage.removeItem('demo_gps_lng');
                    actualizarInterfazParking();
                }
            } else {
                alert("Demo: Guardando ubicación actual por satélite...");
                localStorage.setItem('demo_gps_lat', "42.4667"); // Coordenadas simuladas
                localStorage.setItem('demo_gps_lng', "-2.4500");
                actualizarInterfazParking();
                alert("¡Coche guardado! Mira cómo cambia el botón automáticamente.");
            }
        }

        // Iniciar interfaz
        actualizarInterfazParking();
    </script>
</body>
</html>

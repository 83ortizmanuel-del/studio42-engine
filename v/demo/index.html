<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Cargando Experiencia Phygital... | Studio 42</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-principal: #d4af37;
            --color-fondo: #0a0a0a; 
            --color-tarjeta: #141414; 
            --color-boton: #1f1f1f; 
            --color-texto: #ffffff;
            --color-texto-secundario: #8e8e93;
            --color-critica: #ff3b30;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--color-fondo); color: var(--color-texto); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .hub-container { background-color: var(--color-tarjeta); width: 100%; max-width: 420px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7); padding: 30px 20px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .logo-container { width: 100px; height: 100px; margin: 0 auto 15px auto; border-radius: 22%; border: 2px solid var(--color-principal); overflow: hidden; background-color: #000; display: flex; justify-content: center; align-items: center; }
        .logo-container img { width: 85%; height: 85%; object-fit: contain; }
        
        h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; margin-bottom: 2px; text-transform: uppercase; }
        .propietario { color: var(--color-texto-secundario); font-size: 0.95rem; margin-bottom: 20px; font-style: italic; }
        
        .section-title { text-align: left; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--color-texto-secundario); margin: 15px 0 8px 5px; font-weight: 700; }
        
        .apps-menu { display: flex; flex-direction: column; gap: 12px; }
        .app-btn { display: flex; align-items: center; text-decoration: none; padding: 14px 18px; border-radius: 16px; background-color: var(--color-boton); border: 1px solid rgba(255, 255, 255, 0.03); transition: all 0.2s ease; cursor: pointer; text-align: left; }
        .app-btn:active { transform: scale(0.97); }
        .app-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; justify-content: center; align-items: center; margin-right: 15px; font-size: 1.25rem; background-color: rgba(212, 175, 55, 0.1); color: var(--color-principal); }

        .app-info { flex-grow: 1; }
        .app-name { font-size: 0.95rem; font-weight: 600; color: var(--color-texto); margin-bottom: 2px; }
        .app-desc { font-size: 0.75rem; color: var(--color-texto-secundario); }
        .app-arrow { color: var(--color-texto-secundario); font-size: 0.85rem; opacity: 0.5; }
        
        .footer-brand { margin-top: 30px; font-size: 0.75rem; color: var(--color-texto-secundario); letter-spacing: 1px; }
        .footer-brand span { color: var(--color-principal); font-weight: 700; }

        /* OVERLAY DE ENTORNOS AUDIO/AMBIENTE */
        #overlay-entrada { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-color: rgba(10, 10, 10, 0.98); z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.6s ease; backdrop-filter: blur(10px); padding: 20px; }
        .btn-experiencia { background: linear-gradient(135deg, var(--color-principal), #b38f24); color: #000; border: none; padding: 16px 32px; border-radius: 50px; font-size: 0.95rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
        #yt-player-container { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
        #btn-audio-toggle { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 999; background: rgba(20, 20, 20, 0.85); border: 1px solid rgba(212, 175, 55, 0.3); color: var(--color-texto); padding: 10px 16px; border-radius: 30px; font-size: 0.75rem; cursor: pointer; }
    </style>
</head>
<body>

    <!-- OVERLAY DINÁMICO DE ENTRADA -->
    <div id="overlay-entrada">
        <div class="logo-container" style="margin-bottom: 20px;">
            <img id="overlay-logo" src="Logo Studio42" alt="Logo">
        </div>
        <h2 id="overlay-title" style="color: var(--color-principal); font-size: 1.4rem; margin-bottom: 8px; letter-spacing: 2px;">CARGANDO...</h2>
        <p id="overlay-subtitle" style="color: var(--color-texto-secundario); font-size: 0.85rem; margin-bottom: 30px;">Experiencia Phygital</p>
        <button onclick="iniciarExperiencia()" class="btn-experiencia">Ver Demo</button>
    </div>

    <!-- REPRODUCTOR OCULTO DE AUDIO -->
    <div id="yt-player-container"><div id="youtube-audio-player"></div></div>
    <button id="btn-audio-toggle" onclick="toggleAudio()"><span id="audio-status"><i class="fa-solid fa-volume-high"></i> Audio ON</span></button>

    <div class="hub-container">
        <div class="logo-container">
            <img id="client-logo" src="logo.png" alt="Logo">
        </div>

        <h1 id="client-name">NOMBRE DEL COMERCIO</h1>
        <div id="client-subtitle" class="propietario">Subtítulo o Propietario</div>

        <div class="apps-menu" id="dynamic-menu">
            <!-- Los botones se inyectan automáticamente desde el JSON dinámico generado por la IA -->
        </div>

        <div class="footer-brand">Desarrollado por <span>Studio 42</span></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let isMuted = false;
        let youtubeVideoId = '';

        // Cargar datos dinámicos mediante JSON
        async function cargarDatosJSON() {
            const urlParams = new URLSearchParams(window.location.search);
            const clienteCod = urlParams.get('cod') || 'demo';

            try {
                const response = await fetch(`../${clienteCod}.json`);
                if (!response.ok) throw new Error('JSON no encontrado');
                const data = await response.json();

                // Inyectar datos en la interfaz
                document.getElementById('page-title').innerText = data.nombre + " | Studio 42";
                document.getElementById('client-name').innerText = data.nombre;
                document.getElementById('client-subtitle').innerText = data.subtitulo || '';
                document.getElementById('client-logo').src = data.logo || 'logo.png';
                document.getElementById('overlay-logo').src = data.logo || 'logo.png';
                document.getElementById('overlay-title').innerText = data.nombre;

                if (data.youtubeAudioId) {
                    youtubeVideoId = data.youtubeAudioId;
                }

                // Renderizar Botones Dinámicos
                const menuContainer = document.getElementById('dynamic-menu');
                menuContainer.innerHTML = '';

                data.secciones.forEach(sec => {
                    if (sec.titulo) {
                        const titleDiv = document.createElement('div');
                        titleDiv.className = 'section-title';
                        titleDiv.innerText = sec.titulo;
                        menuContainer.appendChild(titleDiv);
                    }

                    sec.botones.forEach(btn => {
                        const btnAnchor = document.createElement('a');
                        btnAnchor.href = btn.url;
                        btnAnchor.target = btn.url.startsWith('http') ? '_blank' : '_self';
                        btnAnchor.className = 'app-btn';
                        btnAnchor.innerHTML = `
                            <div class="app-icon"><i class="${btn.icono}"></i></div>
                            <div class="app-info">
                                <div class="app-name">${btn.nombre}</div>
                                <div class="app-desc">${btn.descripcion}</div>
                            </div>
                            <div class="app-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                        `;
                        menuContainer.appendChild(btnAnchor);
                    });
                });

            } catch (error) {
                console.log("Cargando vista demo básica por defecto.");
            }
        }

        function onYouTubeIframeAPIReady() {
            if (!youtubeVideoId) return;
            player = new YT.Player('youtube-audio-player', {
                height: '0', width: '0', videoId: youtubeVideoId,
                playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': youtubeVideoId, 'playsinline': 1 }
            });
        }

        function iniciarExperiencia() {
            const overlay = document.getElementById("overlay-entrada");
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 600);

            if (player && player.playVideo) {
                player.setVolume(25);
                player.playVideo();
                document.getElementById("btn-audio-toggle").style.display = "block";
            }
        }

        function toggleAudio() {
            const status = document.getElementById("audio-status");
            if (!player) return;
            if (isMuted) {
                player.unMute();
                status.innerHTML = '<i class="fa-solid fa-volume-high"></i> Audio ON';
                isMuted = false;
            } else {
                player.mute();
                status.innerHTML = '<i class="fa-solid fa-volume-xmark"></i> Mute';
                isMuted = true;
            }
        }

        document.addEventListener("DOMContentLoaded", cargarDatosJSON);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Centro Médico & Maternidad</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brown-primary: #5C3D2E;
            --brown-accent: #B85C38;
            --brown-cream: #FDFBF7;
            --google-yellow: #ECC94B;
            --card-bg: #FFFFFF;
            --text-main: #3D2C2E;
            --text-sub: #7A6861;
            --shadow: 0 4px 15px rgba(92, 61, 46, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--brown-cream);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px 16px 40px 16px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 440px; }

        /* HEADER PERFIL */
        .profile-card {
            background: var(--card-bg); border-radius: 20px; padding: 24px 20px; text-align: center; box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid #F0E6DF;
        }
        .avatar-box {
            width: 70px; height: 70px; background: linear-gradient(135deg, #E1869E, #B85C38); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 12px auto; box-shadow: 0 4px 12px rgba(225, 134, 158, 0.3);
        }
        .profile-title { font-size: 20px; font-weight: 700; color: var(--brown-primary); margin-bottom: 4px; }
        .profile-subtitle { font-size: 13px; color: var(--text-sub); margin-bottom: 12px; line-height: 1.4; }
        
        .badge-google { display: inline-flex; align-items: center; gap: 6px; background: #FDF8F5; border: 1px solid #EAD8CE; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--brown-primary); }
        .badge-google i.fa-star { color: var(--google-yellow); }

        /* SECCIONES Y MENÚS COMUNES */
        .section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--brown-accent); margin: 18px 0 10px 8px; }
        .menu-group { display: flex; flex-direction: column; gap: 12px; }

        .app-btn {
            display: flex; align-items: center; background: var(--card-bg); padding: 16px; border-radius: 16px; text-decoration: none; color: var(--text-main); box-shadow: var(--shadow); border: 1px solid #F5EBE6; transition: transform 0.15s ease;
        }
        .app-btn:active { transform: scale(0.98); }
        .btn-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 14px; flex-shrink: 0; background: #F7EFEA; color: var(--brown-primary); }
        .btn-content { flex-grow: 1; }
        .btn-title { font-size: 15px; font-weight: 600; }
        .btn-desc { font-size: 12px; color: var(--text-sub); margin-top: 2px; line-height: 1.3; }
        .btn-arrow { color: #D6C5BC; font-size: 14px; margin-left: 8px; }

        /* MODO ESCUDO 5 ESTRELLAS INTERACTIVO */
        .interactive-rating-card { background-color: var(--card-bg); border: 1px solid #F0E6DF; border-radius: 16px; padding: 24px 20px; text-align: center; margin-bottom: 12px; box-shadow: var(--shadow); }
        .rating-prompt { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .interactive-stars { display: flex; justify-content: center; gap: 12px; font-size: 38px; color: #E2E8F0; cursor: pointer; margin-top: 15px; }
        .interactive-stars .star-btn { transition: color 0.2s, transform 0.2s; }
        .interactive-stars .star-btn:active { transform: scale(0.9); }
        .interactive-stars .star-btn.hovered { color: var(--google-yellow); text-shadow: 0 0 10px rgba(236, 201, 75, 0.4); }

        /* MODAL ANTI-RESEÑAS NEGATIVAS */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(61, 44, 46, 0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); border-radius: 20px; padding: 30px 20px; text-align: center; width: 100%; max-width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 1px solid #F0E6DF; }
        .modal-icon { font-size: 40px; color: #E1869E; margin-bottom: 15px; }
        .modal-content h3 { color: var(--brown-primary); margin-bottom: 10px; font-size: 18px; }
        .modal-content p { color: var(--text-sub); font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        .btn-whatsapp { display: inline-block; background: #25D366; color: white; padding: 14px 20px; border-radius: 12px; text-decoration: none; font-weight: 600; width: 100%; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
        .btn-close-modal { background: transparent; border: none; color: #A8958E; font-weight: 600; cursor: pointer; margin-top: 15px; padding: 10px; width: 100%; font-size: 13px; }

        .footer-brand { text-align: center; margin-top: 30px; font-size: 11px; color: #A8958E; letter-spacing: 0.5px; }
        .error-msg { background: #FFF5F5; color: #C53030; padding: 16px; border-radius: 12px; font-size: 13px; text-align: center; border: 1px solid #FEB2B2; }
    </style>
</head>
<body>
    <div class="container">
        <!-- CABECERA DE LA DOCTORA -->
        <div class="profile-card">
            <div class="avatar-box"><i class="fa-solid fa-user-doctor"></i></div>
            <h1 class="profile-title" id="client-name">Cargando...</h1>
            <p class="profile-subtitle" id="client-subtitle"></p>
            <div class="badge-google">
                <i class="fa-brands fa-google" style="color:#4285F4;"></i>
                <span>5.0</span>
                <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
                <span style="color:var(--text-sub); font-weight:400;">(Verificado)</span>
            </div>
        </div>

        <div id="dynamic-menu"></div>
        <div class="footer-brand">Tecnología Phygital por <b>Studio 42</b></div>
    </div>

    <!-- MODAL DE EMERGENCIA / QUEJAS (Oculto por defecto) -->
    <div id="feedback-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon"><i class="fa-solid fa-hand-holding-heart"></i></div>
            <h3>¡Ayúdanos a mejorar!</h3>
            <p id="modal-text">Lamentamos que tu experiencia no haya sido de 5 estrellas. Nos encantaría saber qué pasó para solucionarlo personalmente.</p>
            <a href="#" id="modal-wa-btn" class="btn-whatsapp" target="_blank">
                <i class="fa-brands fa-whatsapp"></i> Hablar con la Doctora
            </a>
            <button class="btn-close-modal" onclick="closeModal()">Cancelar y cerrar</button>
        </div>
    </div>

    <script>
        function closeModal() {
            document.getElementById('feedback-modal').style.display = 'none';
            document.querySelectorAll('.star-btn').forEach(s => s.style.color = "#E2E8F0");
        }

        async function cargarEngineJSON() {
            const container = document.getElementById('dynamic-menu');
            try {
                const response = await fetch(`./sys-update.json?v=${Date.now()}`);
                if (!response.ok) throw new Error("No se encontró sys-update.json");
                const data = await response.json();

                if (data.nombre) document.getElementById('client-name').innerText = data.nombre;
                if (data.subtitulo) document.getElementById('client-subtitle').innerHTML = data.subtitulo;

                container.innerHTML = '';

                data.secciones.forEach(sec => {
                    if (sec.titulo) {
                        const label = document.createElement('div');
                        label.className = 'section-label';
                        label.innerText = sec.titulo;
                        container.appendChild(label);
                    }

                    const group = document.createElement('div');
                    group.className = 'menu-group';

                    sec.botones.forEach(btn => {
                        // LÓGICA DE ESCUDO CON ESTRELLAS INTERACTIVAS
                        if (btn.tipo === 'escudo') {
                            const div = document.createElement('div');
                            div.className = "interactive-rating-card";
                            
                            div.innerHTML = `
                                <div class="rating-prompt">
                                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="18" alt="Google">
                                    ${btn.nombre}
                                </div>
                                <div style="color:var(--text-sub); font-size:13px;">${btn.descripcion}</div>
                                
                                <div class="interactive-stars">
                                    <i class="fa-solid fa-star star-btn" data-value="1"></i>
                                    <i class="fa-solid fa-star star-btn" data-value="2"></i>
                                    <i class="fa-solid fa-star star-btn" data-value="3"></i>
                                    <i class="fa-solid fa-star star-btn" data-value="4"></i>
                                    <i class="fa-solid fa-star star-btn" data-value="5"></i>
                                </div>
                            `;

                            const stars = div.querySelectorAll('.star-btn');

                            // Hover
                            stars.forEach(star => {
                                star.addEventListener('mouseover', function() {
                                    let val = this.getAttribute('data-value');
                                    stars.forEach(s => {
                                        if(s.getAttribute('data-value') <= val) s.classList.add('hovered');
                                        else s.classList.remove('hovered');
                                    });
                                });

                                star.addEventListener('mouseout', function() {
                                    stars.forEach(s => s.classList.remove('hovered'));
                                });

                                // Clic
                                star.addEventListener('click', function() {
                                    let val = parseInt(this.getAttribute('data-value'));
                                    
                                    stars.forEach(s => {
                                        if(s.getAttribute('data-value') <= val) s.style.color = "var(--google-yellow)";
                                        else s.style.color = "#E2E8F0";
                                    });
                                    
                                    if(val >= 4) {
                                        window.location.href = btn.urlGoogle;
                                    } else {
                                        // Rellena el modal con los datos del JSON y lo muestra
                                        document.getElementById('modal-text').innerText = btn.mensajeDisculpa;
                                        document.getElementById('modal-wa-btn').href = btn.urlWhatsapp;
                                        document.getElementById('feedback-modal').style.display = 'flex';
                                    }
                                });
                            });
                            group.appendChild(div);

                        } else {
                            // BOTONES ESTÁNDAR
                            const a = document.createElement('a');
                            a.href = btn.url;
                            a.className = "app-btn";
                            a.innerHTML = `
                                <div class="btn-icon" style="${btn.estiloIcono || ''}"><i class="${btn.icono}"></i></div>
                                <div class="btn-content">
                                    <div class="btn-title">${btn.nombre}</div>
                                    <div class="btn-desc">${btn.descripcion}</div>
                                </div>
                                <div class="btn-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                            `;
                            group.appendChild(a);
                        }
                    });
                    container.appendChild(group);
                });
            } catch (err) {
                container.innerHTML = `<div class="error-msg">⚠️ Error al cargar el perfil.</div>`;
            }
        }
        document.addEventListener("DOMContentLoaded", cargarEngineJSON);
    </script>
</body>
</html>

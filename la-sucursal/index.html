<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Sucursal - Barbería</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-neutral-900 text-white min-h-screen flex flex-col items-center p-4">

  <main class="w-full max-w-md bg-neutral-800 rounded-2xl p-6 shadow-2xl border border-neutral-700 mt-4">
    <!-- Encabezado / Branding -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold tracking-wide uppercase text-amber-500">La Sucursal</h1>
      <p class="text-gray-400 text-sm mt-1">Barbería & Estilo</p>
    </div>

    <!-- Reproductor de Audio MP3 (ambiente.mp3) -->
    <div class="mb-6 bg-neutral-900 p-3 rounded-xl border border-neutral-700 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-volume-high text-amber-500 text-lg"></i>
        <span class="text-xs text-gray-300 font-medium">Escuchar presentación</span>
      </div>
      <audio controls class="h-8 w-48">
        <source src="ambiente.mp3" type="audio/mpeg">
        Tu navegador no soporta el reproductor de audio.
      </audio>
    </div>

    <!-- Botonera Directa (Sin dependencia de JSON) -->
    <div class="space-y-3">
      
      <!-- Guardar Contacto -->
      <a href="contacto.vcf" class="flex items-center justify-between w-full p-4 bg-neutral-700 hover:bg-neutral-600 rounded-xl transition duration-200 border border-neutral-600">
        <div class="flex items-center space-x-3">
          <i class="fa-solid fa-address-card text-amber-500 text-xl"></i>
          <span class="font-medium text-sm text-white">Guardar Contacto vCard</span>
        </div>
        <i class="fa-solid fa-chevron-right text-gray-400 text-xs"></i>
      </a>

      <!-- Pedir Cita / WhatsApp -->
      <a href="https://wa.me/" target="_blank" class="flex items-center justify-between w-full p-4 bg-neutral-700 hover:bg-neutral-600 rounded-xl transition duration-200 border border-neutral-600">
        <div class="flex items-center space-x-3">
          <i class="fa-brands fa-whatsapp text-amber-500 text-xl"></i>
          <span class="font-medium text-sm text-white">Reservar Cita por WhatsApp</span>
        </div>
        <i class="fa-solid fa-chevron-right text-gray-400 text-xs"></i>
      </a>

      <!-- Cómo Llegar / Ubicación -->
      <a href="https://maps.google.com" target="_blank" class="flex items-center justify-between w-full p-4 bg-neutral-700 hover:bg-neutral-600 rounded-xl transition duration-200 border border-neutral-600">
        <div class="flex items-center space-x-3">
          <i class="fa-solid fa-location-dot text-amber-500 text-xl"></i>
          <span class="font-medium text-sm text-white">Ubicación y Cómo Llegar</span>
        </div>
        <i class="fa-solid fa-chevron-right text-gray-400 text-xs"></i>
      </a>

    </div>
  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0b0e">
<title>Tarjeta digital · Studio 42</title>
<link rel="icon" href="../img/logo.webp" type="image/webp">
<style>
@font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url("../fonts/Inter-Regular.woff") format("woff")}
@font-face{font-family:"Inter";font-weight:600;font-display:swap;src:url("../fonts/Inter-SemiBold.woff") format("woff")}
@font-face{font-family:"Inter Display";font-weight:600;font-display:swap;src:url("../fonts/InterDisplay-SemiBold.woff") format("woff")}
@font-face{font-family:"Inter Display";font-weight:800;font-display:swap;src:url("../fonts/InterDisplay-ExtraBold.woff") format("woff")}
/* Estilos: titanio (por defecto), oro, minimal (claro) y marca (color propio sobre oscuro) */
:root{
  --fondo:#0a0b0e;--fondo2:#12141a;--tarjeta:rgba(22,24,30,.72);--linea:rgba(220,228,240,.14);
  --texto:#f4f6f9;--suave:#a3a9b3;--acento:#d9dee6;--acento2:#ffffff;--sobre:#0b0c0f;
  --grad:linear-gradient(135deg,#ffffff 0%,#e6eaf0 22%,#c4c4c4 48%,#8e8e93 74%,#d9dde3 100%);
  --aura:rgba(220,228,240,.28);
  --fb:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fd:"Inter Display","Inter",system-ui,sans-serif;
}
body.e-oro{--acento:#d9b45a;--acento2:#f3dc9a;--grad:linear-gradient(135deg,#f6e3a6 0%,#d9b45a 38%,#a9832f 72%,#e9cf86 100%);--aura:rgba(217,180,90,.32);--linea:rgba(232,206,140,.18)}
body.e-minimal{--fondo:#f4f2ee;--fondo2:#ffffff;--tarjeta:rgba(255,255,255,.86);--linea:rgba(20,20,20,.08);--texto:#141414;--suave:#6b6b6b;--acento:#141414;--acento2:#000;--sobre:#ffffff;--grad:linear-gradient(135deg,#1c1c1c,#3a3a3a);--aura:rgba(0,0,0,.12)}
body.e-marca{--grad:linear-gradient(135deg,var(--marca-claro) 0%,var(--marca) 60%,var(--marca-oscuro) 100%);--acento:var(--marca);--acento2:var(--marca-claro);--aura:var(--marca-aura)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--fondo)}
body{font-family:var(--fb);color:var(--texto);background:var(--fondo);min-height:100dvh;display:flex;justify-content:center;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acento);outline-offset:3px;border-radius:12px}
.ic{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Fondo vivo */
.fondo{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.fondo i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.55;background:radial-gradient(circle,var(--aura),transparent 62%);animation:flota 18s ease-in-out infinite alternate}
.fondo i:nth-child(1){left:-30vmax;top:-30vmax}
.fondo i:nth-child(2){right:-35vmax;bottom:-35vmax;animation-duration:24s;animation-delay:-6s}
@keyframes flota{to{transform:translate(12vmax,10vmax) scale(1.15)}}
.fondo::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.2px);background-size:22px 22px;mask:linear-gradient(180deg,#000,transparent 70%);-webkit-mask:linear-gradient(180deg,#000,transparent 70%)}
body.e-minimal .fondo::after{background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1.2px)}

.wrap{position:relative;z-index:1;width:100%;max-width:440px;padding:calc(28px + env(safe-area-inset-top)) 18px calc(34px + env(safe-area-inset-bottom))}
.card{position:relative;border-radius:32px;padding:30px 22px 24px;background:var(--tarjeta);border:1px solid var(--linea);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 30px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);text-align:center;overflow:hidden;animation:entra .9s cubic-bezier(.2,.8,.2,1) both}
body.e-minimal .card{box-shadow:0 30px 60px rgba(0,0,0,.08)}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;pointer-events:none}
.card::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent);transform:skewX(-18deg);animation:barre 7s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes barre{0%,70%{left:-60%}100%{left:130%}}
@keyframes entra{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}

/* Foto con anillo */
.avatar{position:relative;width:132px;height:132px;margin:0 auto 18px}
.avatar::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 20%,var(--acento2) 32%,var(--acento) 42%,transparent 56% 70%,var(--acento) 84%,transparent 100%);animation:gira 6s linear infinite}
.avatar::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:var(--fondo2)}
@keyframes gira{to{transform:rotate(360deg)}}
.avatar img,.avatar .ini{position:absolute;inset:3px;z-index:1;width:calc(100% - 6px);height:calc(100% - 6px);border-radius:50%;object-fit:cover;object-position:center 30%}
.avatar .ini{display:grid;place-items:center;background:var(--grad);color:var(--sobre);font:800 2.6rem var(--fd)}
.nfc{position:absolute;z-index:2;right:-2px;bottom:6px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:var(--sobre);font-size:1rem;box-shadow:0 6px 16px rgba(0,0,0,.35)}

h1{font:800 clamp(1.45rem,7vw,1.85rem)/1.1 var(--fd);letter-spacing:-.01em}
.cargo{margin-top:6px;font-weight:600;font-size:.98rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.empresa{margin-top:2px;color:var(--suave);font-size:.9rem}
.bio{margin:14px auto 0;max-width:320px;color:var(--suave);font-size:.9rem;line-height:1.5}

.guardar{margin-top:22px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px;border-radius:18px;background:var(--grad);color:var(--sobre);font:800 1.02rem var(--fd);letter-spacing:.01em;box-shadow:0 14px 34px var(--aura);position:relative;overflow:hidden}
.guardar .ic{font-size:1.25rem}
.guardar:active{transform:scale(.985)}
.guardar.ok{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.04)}}

.acciones{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
.acciones .acc{flex:0 0 calc(25% - 7.5px)}
@media (max-width:330px){.acc{font-size:.62rem}.acc .bola{width:36px;height:36px}}
.acc{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 2px 10px;min-width:0;white-space:nowrap;border-radius:18px;border:1px solid var(--linea);background:rgba(255,255,255,.035);font:600 .7rem var(--fb);color:var(--texto);animation:entra .7s cubic-bezier(.2,.8,.2,1) both}
body.e-minimal .acc{background:#fff}
.acc .bola{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.25rem;color:var(--acento2);background:rgba(255,255,255,.05);border:1px solid var(--linea)}
body.e-minimal .acc .bola{color:var(--acento);background:#f4f2ee}
.acc:active{transform:scale(.96)}

.extra{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.fila{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:18px;border:1px solid var(--linea);background:rgba(255,255,255,.035);text-align:left}
body.e-minimal .fila{background:#fff}
.fila .bola{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--grad);color:var(--sobre);font-size:1.15rem}
.fila b{display:block;font-weight:600;font-size:.94rem}
.fila small{display:block;color:var(--suave);font-size:.78rem;margin-top:1px}
.fila .t{flex:1;min-width:0}
.fila > .ic{color:var(--suave)}

.compartir{margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:16px;border:1px dashed var(--linea);color:var(--suave);font-weight:600;font-size:.88rem}
.pie{margin-top:22px;text-align:center;color:var(--suave);font-size:.72rem;letter-spacing:.06em;opacity:.8}
.pie b{font-weight:600;color:var(--texto)}

/* Hoja */
.velo{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:.25s}
.velo.on{opacity:1;visibility:visible}
.hoja{width:100%;max-width:440px;background:var(--fondo2);border:1px solid var(--linea);border-bottom:0;border-radius:28px 28px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .3s cubic-bezier(.2,.8,.2,1);text-align:center}
.velo.on .hoja{transform:none}
.asa{width:42px;height:5px;border-radius:9px;background:var(--linea);margin:0 auto 16px}
.hoja h3{font:800 1.15rem var(--fd)}
.hoja p{color:var(--suave);font-size:.86rem;margin-top:4px}
.qr{width:220px;height:220px;margin:18px auto;border-radius:20px;background:#fff;padding:14px;display:grid;place-items:center}
.qr img,.qr svg{width:100%;height:100%;image-rendering:pixelated}
.btns{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:15px;border:1px solid var(--linea);font-weight:600;font-size:.9rem}
.btn.p{background:var(--grad);color:var(--sobre);border:0}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:30;background:var(--texto);color:var(--fondo);font:600 .85rem var(--fb);padding:11px 18px;border-radius:99px;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.aviso{padding:60px 20px;text-align:center;color:var(--suave)}
.aviso b{display:block;color:var(--texto);font:800 1.2rem var(--fd);margin-bottom:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-guardar" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c.8-4 3.6-6 7-6 1.6 0 3 .4 4.2 1.2M19 14v6M16 17h6"/></symbol>
  <symbol id="i-tel" viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-wa" viewBox="0 0 24 24"><path d="M20.5 11.6a8.6 8.6 0 0 1-12.7 7.5L3.5 20.5l1.4-4.1a8.6 8.6 0 1 1 15.6-4.8z"/><path d="M9 9.2c.3 1.7 1.9 3.5 3.8 4.3l1.2-1.1 1.8.8c-.3 1-1.2 1.6-2.2 1.5-3-.4-5.6-3-5.9-6 0-1 .6-1.9 1.5-2.2l.8 1.8z"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></symbol>
  <symbol id="i-web" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
  <symbol id="i-in" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/></symbol>
  <symbol id="i-ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-tk" viewBox="0 0 24 24"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5M14 3c.5 2.5 2.4 4.4 5 4.8"/></symbol>
  <symbol id="i-mapa" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18M9 15.5l2 2 4-4"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.5 2.9 1-6.1-4.3-4.3 6.1-.9z"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="m8.2 10.8 7.6-3.6M8.2 13.2l7.6 3.6"/></symbol>
  <symbol id="i-nfc" viewBox="0 0 24 24"><path d="M8.5 7.5a6 6 0 0 1 0 9M12 5a9.5 9.5 0 0 1 0 14M15.5 2.5a13 13 0 0 1 0 19"/></symbol>
  <symbol id="i-flecha" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
</svg>
<div class="fondo" aria-hidden="true"><i></i><i></i></div>
<main class="wrap" id="app"><div class="aviso">Cargando tarjeta…</div></main>
<div class="velo" id="velo" role="dialog" aria-modal="true"><div class="hoja" id="hoja"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const ESTADISTICAS = "https://script.google.com/macros/s/AKfycbyBX3u7pctH4FdbpHzyH11eXv0sbzMm1Xs6-aO9vMVE-QeCnz1CkuPFHBN7RobM9NPw/exec";
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const ID = (q.get("id") || location.hash.slice(1) || "").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 40);
const PREVIA = q.get("preview") === "1";
let T = null;

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const ic = (n) => '<svg class="ic"><use href="#i-' + n + '"/></svg>';
const https = (u) => /^https:\/\/[^\s"<>]+$/i.test(String(u || "")) ? String(u) : "";
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2400); }

function contar(tipo) {
  if (PREVIA || !ID || /^(localhost|127\.)/.test(location.hostname) || q.get("debug")) return;
  try {
    const cuerpo = JSON.stringify({ accion: "ev", c: ("t-" + ID).slice(0, 40), k: (q.get("k") || "TARJETA").toUpperCase().replace(/[^A-Z0-9_-]/g, "").slice(0, 20), t: tipo });
    if (!(navigator.sendBeacon && navigator.sendBeacon(ESTADISTICAS, new Blob([cuerpo], { type: "text/plain" })))) fetch(ESTADISTICAS, { method: "POST", body: cuerpo, mode: "no-cors", keepalive: true }).catch(() => {});
  } catch (e) {}
}

function hexA(h, a) { const m = /^#?([0-9a-f]{6})$/i.exec(h || ""); if (!m) return ""; const n = parseInt(m[1], 16); return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; }
function mezcla(h, p) { const m = /^#?([0-9a-f]{6})$/i.exec(h || ""); if (!m) return h; const n = parseInt(m[1], 16); const f = (c) => Math.round(p > 0 ? c + (255 - c) * p : c * (1 + p)); return "rgb(" + f(n >> 16) + "," + f((n >> 8) & 255) + "," + f(n & 255) + ")"; }

function pintar(d) {
  T = d;
  document.body.className = "e-" + (["titanio", "oro", "minimal", "marca"].includes(d.estilo) ? d.estilo : "titanio");
  if (d.estilo === "marca" && /^#[0-9a-f]{6}$/i.test(d.color || "")) {
    const s = document.body.style; s.setProperty("--marca", d.color); s.setProperty("--marca-claro", mezcla(d.color, .45)); s.setProperty("--marca-oscuro", mezcla(d.color, -.35)); s.setProperty("--marca-aura", hexA(d.color, .35));
  }
  document.title = (d.nombre || "Tarjeta") + (d.empresa ? " · " + d.empresa : "") + " · Tarjeta digital";
  if (d.pausada === true && !PREVIA) { $("app").innerHTML = '<div class="aviso"><b>Tarjeta desactivada</b>Esta tarjeta digital no está disponible en este momento.</div>'; return; }
  const ini = String(d.nombre || "?").trim().split(/\s+/).map((p) => p[0]).slice(0, 2).join("").toUpperCase();
  const foto = d.foto ? (/^(https:|data:image\/)/.test(d.foto) ? d.foto : d.foto) : "";
  const tel = String(d.telefono || "").replace(/[^\d+]/g, ""), wa = String(d.whatsapp || "").replace(/\D/g, "");
  const mail = /^[^\s@<>"]+@[^\s@<>"]+\.[a-z]{2,}$/i.test(d.email || "") ? d.email : "";
  const mapa = d.direccion ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(d.direccion) : "";
  const acc = [];
  if (tel) acc.push(["tel:" + tel, "tel", "Llamar", "llamada"]);
  if (wa) acc.push(["https://wa.me/" + wa + "?text=" + encodeURIComponent("Hola " + String(d.nombre || "").split(" ")[0] + ", te escribo desde tu tarjeta digital."), "wa", "WhatsApp", "whatsapp"]);
  if (mail) acc.push(["mailto:" + mail, "mail", "Email", "enlace"]);
  if (https(d.web)) acc.push([d.web, "web", "Web", "enlace"]);
  if (https(d.linkedin)) acc.push([d.linkedin, "in", "LinkedIn", "enlace"]);
  if (https(d.instagram)) acc.push([d.instagram, "ig", "Instagram", "enlace"]);
  if (https(d.tiktok)) acc.push([d.tiktok, "tk", "TikTok", "enlace"]);
  if (mapa) acc.push([mapa, "mapa", "Ubicación", "ruta"]);
  const ext = [];
  if (https(d.reserva)) ext.push([d.reserva, "cal", "Reservar cita", "Elige día y hora online", "enlace"]);
  if (https(d.resena)) ext.push([d.resena, "star", "Dejar una reseña", "Tu opinión en Google", "resena"]);

  $("app").innerHTML =
    '<article class="card">' +
      '<div class="avatar">' + (foto ? '<img src="' + esc(foto) + '" alt="' + esc(d.nombre) + '" fetchpriority="high">' : '<span class="ini">' + esc(ini) + '</span>') + '<span class="nfc" title="Tarjeta NFC">' + ic("nfc") + '</span></div>' +
      '<h1>' + esc(d.nombre || "Tu nombre") + '</h1>' +
      (d.cargo ? '<div class="cargo">' + esc(d.cargo) + '</div>' : "") +
      (d.empresa ? '<div class="empresa">' + esc(d.empresa) + '</div>' : "") +
      (d.bio ? '<p class="bio">' + esc(d.bio) + '</p>' : "") +
      '<button type="button" class="guardar" id="bGuardar">' + ic("guardar") + 'Guardar contacto</button>' +
      (acc.length ? '<div class="acciones">' + acc.map((a, i) => '<a class="acc" style="animation-delay:' + (0.35 + i * 0.06) + 's" href="' + esc(a[0]) + '"' + (/^https:/.test(a[0]) ? ' target="_blank" rel="noopener"' : "") + ' data-t="' + a[3] + '"><span class="bola">' + ic(a[1]) + '</span>' + a[2] + '</a>').join("") + '</div>' : "") +
      (ext.length ? '<div class="extra">' + ext.map((e) => '<a class="fila" href="' + esc(e[0]) + '" target="_blank" rel="noopener" data-t="' + e[4] + '"><span class="bola">' + ic(e[1]) + '</span><span class="t"><b>' + e[2] + '</b><small>' + e[3] + '</small></span>' + ic("flecha") + '</a>').join("") + '</div>' : "") +
      '<button type="button" class="compartir" id="bCompartir">' + ic("share") + 'Compartir mi tarjeta</button>' +
    '</article>' +
    '<p class="pie">Tarjeta phygital · <b>Studio 42</b></p>';

  $("bGuardar").addEventListener("click", guardarContacto);
  $("bCompartir").addEventListener("click", compartir);
  document.querySelectorAll("[data-t]").forEach((a) => a.addEventListener("click", () => contar(a.dataset.t)));
}

/* ---------- vCard con foto, generada al momento con los datos actuales ---------- */
const vc = (s) => String(s || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
async function fotoBase64() {
  if (!T.foto) return "";
  try {
    const b = await fetch(T.foto).then((r) => (r.ok ? r.blob() : null));
    if (!b || b.size > 300000) return "";
    return await new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1] || ""); fr.onerror = () => res(""); fr.readAsDataURL(b); });
  } catch (e) { return ""; }
}
async function guardarContacto() {
  const d = T, partes = String(d.nombre || "").trim().split(/\s+/);
  const nom = partes.shift() || "", ape = partes.join(" ");
  const v = ["BEGIN:VCARD", "VERSION:3.0", "N:" + vc(ape) + ";" + vc(nom) + ";;;", "FN:" + vc(d.nombre)];
  if (d.empresa) v.push("ORG:" + vc(d.empresa));
  if (d.cargo) v.push("TITLE:" + vc(d.cargo));
  if (d.telefono) v.push("TEL;TYPE=CELL,VOICE:" + String(d.telefono).replace(/[^\d+]/g, ""));
  if (d.email) v.push("EMAIL;TYPE=INTERNET:" + vc(d.email));
  if (https(d.web)) v.push("URL:" + d.web);
  if (d.direccion) v.push("ADR;TYPE=WORK:;;" + vc(d.direccion) + ";;;;");
  [["linkedin", "LinkedIn"], ["instagram", "Instagram"], ["tiktok", "TikTok"]].forEach(([k, n]) => { if (https(d[k])) v.push("X-SOCIALPROFILE;TYPE=" + n.toLowerCase() + ":" + d[k]); });
  v.push("NOTE:" + vc((d.bio ? d.bio + " · " : "") + "Tarjeta digital: " + location.origin + location.pathname + "?id=" + ID));
  const f = await fotoBase64(); if (f) v.push("PHOTO;ENCODING=b;TYPE=JPEG:" + f);
  v.push("END:VCARD");
  const url = URL.createObjectURL(new Blob([v.join("\r\n")], { type: "text/vcard;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = (ID || "contacto") + ".vcf"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  $("bGuardar").classList.add("ok"); setTimeout(() => $("bGuardar").classList.remove("ok"), 600);
  toast("📇 Ábrelo para guardarlo en tus contactos");
  contar("enlace");
}

/* ---------- Compartir con QR ---------- */
function cargarQR() {
  return new Promise((res, rej) => {
    if (window.qrcode) return res();
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
async function compartir() {
  const url = location.origin + location.pathname + "?id=" + ID;
  $("hoja").innerHTML = '<div class="asa"></div><h3>Comparte la tarjeta de ' + esc(String(T.nombre || "").split(" ")[0]) + '</h3><p>Que la escaneen con la cámara del móvil</p><div class="qr" id="qr">…</div>' +
    '<div class="btns">' + (navigator.share ? '<button type="button" class="btn p" id="hShare">' + ic("share") + 'Enviar enlace</button>' : "") +
    '<button type="button" class="btn' + (navigator.share ? "" : " p") + '" id="hCopy">Copiar enlace</button><button type="button" class="btn" id="hX">Cerrar</button></div>';
  $("velo").classList.add("on");
  $("hX").onclick = cerrar; $("hCopy").onclick = async () => { try { await navigator.clipboard.writeText(url); toast("Enlace copiado"); } catch (e) { toast(url); } };
  if ($("hShare")) $("hShare").onclick = () => navigator.share({ title: T.nombre, text: (T.cargo ? T.cargo + " · " : "") + (T.empresa || ""), url }).catch(() => {});
  try { await cargarQR(); const qr = qrcode(0, "M"); qr.addData(url); qr.make(); $("qr").innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true }); }
  catch (e) { $("qr").textContent = "Sin conexión para generar el QR"; }
}
function cerrar() { $("velo").classList.remove("on"); }
$("velo").addEventListener("click", (e) => { if (e.target === $("velo")) cerrar(); });

/* ---------- Arranque ---------- */
if (PREVIA) {
  window.addEventListener("message", (e) => { if (e.origin === location.origin && e.data && e.data.tipo === "s42-tarjeta" && e.data.json) pintar(e.data.json); });
  if (window.parent !== window) window.parent.postMessage({ tipo: "s42-tarjeta-lista" }, location.origin);
}
if (ID) {
  fetch(ID + ".json?t=" + Date.now(), { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((d) => { if (!T || !PREVIA) { pintar(d); contar("vista"); } })
    .catch(() => { if (!T) $("app").innerHTML = '<div class="aviso"><b>Tarjeta no encontrada</b>Revisa el enlace o pide una nueva a Studio 42.</div>'; });
} else if (!PREVIA) {
  $("app").innerHTML = '<div class="aviso"><b>Tarjeta digital · Studio 42</b>Falta el identificador de la tarjeta.</div>';
}
</script>

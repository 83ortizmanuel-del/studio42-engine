<title id="page-title">Studio 42 | Terminal Phygital</title>
<style>
    :root {

    [hidden] { display: none !important; }
    html { background: var(--color-fondo); }
    body {

        min-height: 100dvh;
        padding: 15px 15px 35px;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
    }
    body.modal-abierto { overflow: hidden; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--color-acento); outline-offset: 3px; }

    .ic { width: 1em; height: 1em; display: block; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* HALO + TARJETA PRINCIPAL */
    .halo-wrapper {
        position: relative; width: 100%; max-width: 412px; border-radius: 34px; padding: 2px; margin: auto 0;

    }
    .halo-wrapper::before {
        content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;

        animation: haloRotate 8s linear infinite; will-change: transform; z-index: 0;
    }
    @keyframes haloRotate { to { transform: rotate(360deg); } }
    .hub-container {
        background: var(--color-tarjeta); width: 100%; border-radius: 32px; padding: 22px 18px; text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.12);

        content: ''; position: absolute; top: -3px; left: -3px; width: 13px; height: 13px; border-radius: 50%;
        background: var(--titanium-glow); animation: radar 2s infinite cubic-bezier(0, 0, 0.2, 1);
    }
    @keyframes radar { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(2.8); opacity: 0; } }

    .logo-container {
        width: 100%; max-width: var(--logo-max, 270px); height: var(--logo-alto, 84px);

        overflow: hidden; background: var(--fondo-logo);
        display: flex; justify-content: center; align-items: center; padding: var(--logo-pad, 4px 10px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(var(--acento-rgb), 0.5);
    }
    .logo-container img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 0 10px rgba(var(--acento-rgb), 0.5)); }
    .logo-texto { color: #fff; font-weight: 900; letter-spacing: 1px; font-size: 1.1rem; }

    .subtitulo { color: var(--color-acento); font-size: 0.78rem; margin-bottom: 14px; font-weight: 700; letter-spacing: 0.8px; word-break: break-word; text-transform: uppercase; }

    .apps-menu { display: flex; flex-direction: column; gap: 11px; width: 100%; }
    .app-btn {

    .app-btn:active { transform: scale(0.97); border-color: var(--color-acento); }
    .app-btn.destacado {
        border: 1px solid var(--color-acento);

        width: 44px; height: 44px; border-radius: 14px; display: flex; justify-content: center; align-items: center;

    .badge-sos { font-size: 9px; font-weight: 900; background: #f59e0b; color: #020617; padding: 2px 7px; border-radius: 20px; margin-left: 6px; text-transform: uppercase; }

    /* MODALES */

    .modal-box {
        margin: auto; position: relative; width: 100%; max-width: 380px; background: #0f172a;
        border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 28px; padding: 26px 20px 20px;

    .modal-close-btn {

    .modal-titulo { font-size: 1.02rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; padding-right: 34px; }

    .modal-aviso { font-size: 0.7rem; line-height: 1.5; color: #fbbf24; margin-top: 10px; }
    .modal-actions { display: flex; flex-direction: column; gap: 9px; margin-top: 16px; }

    .btn-oro, .btn-wa, .btn-peligro {
        display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; text-decoration: none;

    .btn-oro { background: linear-gradient(135deg, var(--color-acento), #fff); color: #020617; }
    .btn-wa { background: linear-gradient(135deg, #25D366, #128c7e); color: #fff; }
    .btn-peligro { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
    .btn-sec { display: block; text-align: center; text-decoration: none; color: var(--color-gris); border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px 16px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; width: 100%; }
    .deshabilitado { opacity: 0.45; pointer-events: none; cursor: not-allowed; }

    /* FORMULARIOS DENTRO DE MODALES */
    .campo { margin-bottom: 12px; }
    .campo-label { display: block; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; color: var(--color-acento); margin-bottom: 6px; }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 9px 12px; font-size: 0.78rem; color: #fff; text-align: center; flex: 1 1 auto; }

    .input { width: 100%; background: #020617; border: 1px solid #334155; border-radius: 12px; padding: 11px; color: #fff; font-size: 16px; font-family: inherit; }
    .input:focus { border-color: var(--color-acento); outline: none; }

    .resultado { background: rgba(255, 255, 255, 0.05); border: 1px dashed rgba(255, 255, 255, 0.25); border-radius: 16px; padding: 12px; margin: 12px 0; }
    .resultado-etiqueta { font-size: 0.72rem; color: var(--color-acento); font-weight: 800; text-transform: uppercase; }
    .resultado-titulo { font-size: 0.95rem; font-weight: 900; margin-top: 2px; }
    .resultado-grande { font-size: 1.7rem; font-weight: 900; margin: 4px 0; }
    .resultado-texto { font-size: 0.76rem; color: #cbd5e1; margin-top: 4px; line-height: 1.5; }

    .tarjeta { border: 1px solid rgba(var(--nv), 0.5); background: rgba(0, 0, 0, 0.35); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
    .n-info { --nv: 56, 189, 248; } .n-alerta { --nv: 244, 63, 94; } .n-ok { --nv: 52, 211, 153; } .n-aviso { --nv: 251, 191, 36; }
    .tarjeta-titulo { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: rgb(var(--nv)); margin-bottom: 4px; }
    .tarjeta-texto { font-size: 0.8rem; color: #e2e8f0; line-height: 1.5; white-space: pre-line; }
    .fila { display: flex; justify-content: space-between; gap: 10px; font-size: 0.78rem; margin-top: 4px; }
    .fila-et { color: var(--color-gris); }
    .fila-val { color: #fff; font-weight: 700; text-align: right; }

    .numero-grande { font-size: 1.6rem; font-weight: 900; letter-spacing: 3px; text-align: center; background: #020617; border: 1px solid rgba(var(--acento-rgb), 0.4); padding: 12px; border-radius: 16px; margin-bottom: 4px; user-select: all; -webkit-user-select: all; }
    .fila-bizum { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #020617; border: 1px solid #1e293b; border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; }
    .fila-bizum .mini { display: block; font-size: 0.65rem; color: var(--color-gris); text-transform: uppercase; font-weight: 800; }
    .fila-bizum .numero-medio { font-size: 0.95rem; font-weight: 900; font-family: ui-monospace, Menlo, monospace; letter-spacing: 1px; }
    .btn-copiar { background: rgba(var(--acento-rgb), 0.15); color: var(--color-acento); border: 1px solid rgba(var(--acento-rgb), 0.4); font-size: 0.7rem; font-weight: 800; padding: 7px 10px; border-radius: 10px; display: inline-flex; align-items: center; gap: 5px; }

    /* ESTADOS */
    .cargando { padding: 40px 0; color: var(--color-gris); font-size: 0.82rem; }
    .spinner { width: 28px; height: 28px; border: 3px solid rgba(255, 255, 255, 0.15); border-top-color: var(--color-acento); border-radius: 50%; margin: 0 auto 10px; animation: giro 1s linear infinite; }
    @keyframes giro { to { transform: rotate(360deg); } }
    .error-box { padding: 28px 10px; color: #fca5a5; }
    .error-box .ic { font-size: 2.2rem; margin: 0 auto 10px; }
    .error-box p { font-size: 0.9rem; margin-bottom: 14px; line-height: 1.5; }
    .debug { width: 100%; max-width: 412px; margin-top: 14px; background: #020617; border: 1px solid #334155; border-radius: 14px; padding: 12px; font: 11px/1.5 ui-monospace, Menlo, monospace; color: #cbd5e1; }
    .debug b { color: #fbbf24; }

    .footer-brand { margin-top: 26px; font-size: 0.7rem; color: var(--color-gris); letter-spacing: 1.1px; }
    .footer-brand span { color: var(--titanium-light); font-weight: 800; }

    /* TEMA INDUSTRIAL (titanio cepillado con tornillos) */
    .tema-industrial {
        background:
            radial-gradient(circle at 24px 24px, #e2e8f0 1px, #64748b 3px, #0f172a 4px, transparent 5px),
            radial-gradient(circle at calc(100% - 24px) 24px, #e2e8f0 1px, #64748b 3px, #0f172a 4px, transparent 5px),
            radial-gradient(circle at 24px calc(100% - 24px), #e2e8f0 1px, #64748b 3px, #0f172a 4px, transparent 5px),
            radial-gradient(circle at calc(100% - 24px) calc(100% - 24px), #e2e8f0 1px, #64748b 3px, #0f172a 4px, transparent 5px),
            repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.04) 0px, rgba(255, 255, 255, 0.04) 1px, transparent 1px, transparent 3px),
            linear-gradient(135deg, #2A2D34 0%, #131519 100%) !important;
        border: 2px solid #475569 !important;
        box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8), 0 25px 60px rgba(0, 0, 0, 0.95) !important;
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
    }
</style>

<script>
"use strict";
(function () {

/* ==========================================================================
   STUDIO 42 ENGINE v2.0
   - Un solo HTML para todos los clientes. Todo el contenido vive en el JSON.
   - Los botones se resuelven SOLO por "tipo" (nunca por el texto del nombre).
   - Nada que venga del JSON se inserta como HTML: se construye con el DOM.
   - Sin números de teléfono por defecto: si falta un dato, el botón se omite.
   - Añade ?debug=1 a la URL para ver los avisos de configuración.
   ========================================================================== */

/* ========================= CONFIGURACIÓN DEL MOTOR ========================= */
const CONFIG = {
    // Rutas donde buscar el JSON del cliente. Deja solo las que uses de verdad
    // (cada ruta que falla cuesta una petición).
    rutasJSON: ["./{cod}.json", "../c/{cod}.json"],
    // Respaldo si el hosting principal falla. Pon "" para desactivarlo.
    respaldoGitHub: "https://raw.githubusercontent.com/83ortizmanuel-del/studio42-engine/main/c/{cod}.json",
    tiempoLimiteMs: 6000,
    // Contador anónimo de Studio 42 (sin cookies ni datos personales). Pon "" para desactivarlo.
    estadisticas: "https://script.google.com/macros/s/AKfycbyBX3u7pctH4FdbpHzyH11eXv0sbzMm1Xs6-aO9vMVE-QeCnz1CkuPFHBN7RobM9NPw/exec"
};

/* ============================== ESTADO GLOBAL ============================== */
const estado = {
    cod: "demo", llavero: "MOSTRADOR", mesa: "Barra",
    data: null, negocio: "", waNegocio: "", acento: "#00E5FF",
    avisos: [], debug: false
};

const $ = (id) => document.getElementById(id);
function aviso(msg) { estado.avisos.push(msg); if (window.console) console.warn("[Studio42 v2] " + msg); }
function falta(msg) { throw new Error(msg); }
function vibrar(ms) { try { if ("vibrate" in navigator) navigator.vibrate(ms); } catch (e) {} }

const almacen = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, String(v)); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ============================ VALIDACIÓN Y UTILIDADES ============================ */
function soloSlug(s, def) {
    const t = String(s === null || s === undefined ? "" : s).toLowerCase().trim();
    return /^[a-z0-9_-]{1,40}$/.test(t) ? t : def;
}
function limpiarParam(s, def) {
    const t = String(s === null || s === undefined ? "" : s).trim();
    return /^[\w\- ]{1,30}$/.test(t) ? t : def;
}
function urlSegura(u) {
    const t = String(u === null || u === undefined ? "" : u).trim();
    return /^(https:\/\/|tel:|mailto:)\S+$/i.test(t) ? t : null;
}
function hexValido(c, def) { return /^#[0-9a-f]{6}$/i.test(String(c || "")) ? c : def; }
// Color CSS permitido para el fondo del logo: #hex, transparent o rgb()/rgba() estricto (sin nada más).
function colorCss(c, def) {
    const t = String(c === null || c === undefined ? "" : c).trim();
    if (/^#[0-9a-f]{6}$/i.test(t) || /^transparent$/i.test(t)) return t;
    if (/^rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(,\s*(0|1|0?\.\d+)\s*)?\)$/i.test(t)) return t;
    return def;
}
function rgbDeHex(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
// Devuelve solo dígitos en formato internacional, o "" si no es un número válido.
function waNumero(s) {
    if (s === null || s === undefined) return "";
    const t = String(s).trim();
    let d = "";
    const m = /^https:\/\/wa\.me\/\+?(\d{9,15})(?:[/?#].*)?$/i.exec(t);
    if (m) d = m[1];
    else if (/^[+\d\s().-]+$/.test(t)) d = t.replace(/\D/g, "");
    if (d.length === 9) d = "34" + d; // móvil español sin prefijo
    return d.length >= 11 && d.length <= 15 ? d : "";
}
function urlWA(numero, texto) {
    const n = waNumero(numero);
    if (!n) return null;
    return "https://wa.me/" + n + (texto ? "?text=" + encodeURIComponent(texto) : "");
}
function plantilla(texto, vars) {
    let out = String(texto === null || texto === undefined ? "" : texto);
    Object.keys(vars).forEach((k) => { out = out.split("{" + k + "}").join(String(vars[k])); });
    return out;
}
function vars(extra) {
    return Object.assign({ negocio: estado.negocio, mesa: estado.mesa, llavero: estado.llavero }, extra || {});
}

/* ================================== ICONOS ================================== */
const ICONOS = {
    utensils: '<path d="M7 3v7M4 3v5a3 3 0 0 0 6 0V3M7 10v11M17 3c-2 1.5-3 4-3 7 0 2 1 3 3 3v8"/>',
    alert: '<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v5M12 18h.01"/>',
    key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3M14 9l2 2"/>',
    chat: '<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.2A8.4 8.4 0 1 1 21 11.5z"/>',
    locate: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
    contact: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M5 17c.7-2 2.1-3 4-3s3.3 1 4 3M15 9.5h3M15 13h3"/>',
    calculator: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>',

function nombreIcono(raw, def) {
    const s = String(raw === null || raw === undefined ? "" : raw).toLowerCase().trim();
    if (ICONOS[s]) return s;
    const partes = s.split(/\s+/).filter((p) => p.indexOf("fa-") === 0 && ["fa-solid", "fa-brands", "fa-regular"].indexOf(p) < 0).map((p) => p.slice(3));
    for (let i = 0; i < partes.length; i++) {
        if (ICONOS[partes[i]]) return partes[i];
        if (ALIAS_FA[partes[i]]) return ALIAS_FA[partes[i]];
    }
    return def;
}
function montarSprite() {
    const simbolos = Object.keys(ICONOS).map((k) => '<symbol id="i-' + k + '" viewBox="0 0 24 24">' + ICONOS[k] + "</symbol>").join("");
    document.body.insertAdjacentHTML("afterbegin", '<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>' + simbolos + "</defs></svg>");
}
const SVG_NS = "http://www.w3.org/2000/svg";
function ico(nombre, clase) {
    const svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("class", "ic" + (clase ? " " + clase : ""));
    svg.setAttribute("aria-hidden", "true");
    const use = document.createElementNS(SVG_NS, "use");
    use.setAttribute("href", "#i-" + (ICONOS[nombre] ? nombre : "link"));
    svg.appendChild(use);
    return svg;
}

/* ============================ CONSTRUCTOR DE DOM ============================ */
// h("div", {class:"x", text:"hola"}, hijo1, [hijo2, hijo3]) -> <div class="x">hola…</div>
// Todo texto se inserta con textContent: no existe inyección de HTML posible.
function h(tag, attrs) {
    const hijos = Array.prototype.slice.call(arguments, 2);
    const el = document.createElement(tag);
    if (attrs) {
        Object.keys(attrs).forEach((k) => {
            const v = attrs[k];
            if (v === null || v === undefined || v === false) return;
            if (k === "class") el.className = v;
            else if (k === "text") el.textContent = v;
            else if (k.slice(0, 2) === "on" && typeof v === "function") el.addEventListener(k.slice(2), v);
            else el.setAttribute(k, v === true ? "" : String(v));
        });
    }
    return poner(el, hijos);
}
// Añade hijos a un elemento ignorando null/undefined/false y aplanando arrays.
// (element.append(null) escribiría el texto "null": usa siempre poner()).
function poner(el) {
    Array.prototype.slice.call(arguments, 1).flat(Infinity).forEach((c) => {
        if (c === null || c === undefined || c === false) return;
        el.append(c.nodeType ? c : String(c));
    });
    return el;
}

/* ================================== MODAL ================================== */
let ultimoFoco = null;
function cerrarModal(sinFoco) {
    const o = $("modal-overlay");
    if (o) o.remove();
    document.body.classList.remove("modal-abierto");
    if (!sinFoco && ultimoFoco && ultimoFoco.focus) { try { ultimoFoco.focus(); } catch (e) {} }
}
function abrirModal(o) {
    cerrarModal(true);
    ultimoFoco = document.activeElement;
    const box = h("div", { class: "modal-box", role: "dialog", "aria-modal": "true", "aria-labelledby": "modal-titulo", tabindex: "-1" },
        h("button", { class: "modal-close-btn", type: "button", "aria-label": "Cerrar", onclick: () => cerrarModal() }, ico("close")),
        o.icono ? h("div", { class: "modal-icon" }, ico(o.icono)) : null,
        h("h3", { class: "modal-titulo", id: "modal-titulo", text: o.titulo || "" }),
        o.cuerpo || null,
        h("div", { class: "modal-actions" },
            o.acciones || [],
            h("button", { class: "btn-sec", type: "button", onclick: () => cerrarModal() }, o.cerrarTexto || "Cerrar"))
    );
    const overlay = h("div", { class: "modal-overlay", id: "modal-overlay" }, box);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) cerrarModal(); });
    overlay.addEventListener("keydown", (e) => {
        if (e.key !== "Tab") return;
        const f = Array.prototype.slice.call(box.querySelectorAll('a[href],button,input,select,textarea'))
            .filter((x) => !x.hidden && !x.disabled && x.getAttribute("aria-disabled") !== "true");
        if (!f.length) return;
        const primero = f[0], ultimo = f[f.length - 1];
        if (e.shiftKey && (document.activeElement === primero || document.activeElement === box)) { e.preventDefault(); ultimo.focus(); }
        else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primero.focus(); }
    });
    document.body.append(overlay);
    document.body.classList.add("modal-abierto");
    try { box.focus({ preventScroll: true }); } catch (e) { box.focus(); }
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarModal(); });

/* ================================ PORTAPAPELES ================================ */
async function copiarTexto(t) {
    try {
        if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; }
    } catch (e) {}
    try {
        const ta = document.createElement("textarea");
        ta.value = t; ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
        document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, t.length);
        const ok = document.execCommand("copy");
        ta.remove();
        return ok;
    } catch (e) { return false; }
}

function colorIcono(btn, def) {
    let c = btn.colorIcono;
    if (!c && typeof btn.estiloIcono === "string") { // compatibilidad con JSON de la v1
        const m = /(?:^|[;\s])color:\s*(#[0-9a-f]{6})/i.exec(btn.estiloIcono);
        if (m) c = m[1];
    }
    return rgbDeHex(hexValido(c, def || estado.acento));
}
// o = { nombre, descripcion, icono, color, href, externo, descarga, abrir, clase }
function botonApp(btn, o) {
    const nombre = String(btn.nombre || o.nombre || "").trim();
    if (!nombre) falta("falta 'nombre'");
    const descripcion = btn.descripcion || o.descripcion || "";
    const caja = h("div", { class: "app-icon" }, ico(nombreIcono(btn.icono, o.icono || "link")));
    caja.style.setProperty("--ic-rgb", colorIcono(btn, o.color).join(","));
    const info = h("div", { class: "app-info" },
        h("div", { class: "app-name", text: nombre }),
        descripcion ? h("div", { class: "app-desc", text: descripcion }) : null);
    const clase = "app-btn" + (btn.destacado ? " destacado" : "") + (o.clase ? " " + o.clase : "");
    if (o.href) {
        return h("a", {
            class: clase, href: o.href,
            target: o.externo ? "_blank" : null, rel: o.externo ? "noopener noreferrer" : null,
            download: o.descarga !== undefined && o.descarga !== null ? o.descarga : null
        }, caja, info, ico("chevron", "app-arrow"));
    }
    const el = h("button", { class: clase, type: "button" }, caja, info, ico("chevron", "app-arrow"));
    if (o.abrir) el.addEventListener("click", o.abrir);
    return el;
}

function descargarVCard(tel) {
    const esc = (s) => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
    const lineas = ["BEGIN:VCARD", "VERSION:3.0", "FN:" + esc(estado.negocio), "ORG:" + esc(estado.negocio),
        "TEL;TYPE=WORK,VOICE:+" + tel, "NOTE:" + esc("Contacto inteligente Studio 42"), "END:VCARD"];
    const blob = new Blob([lineas.join("\r\n") + "\r\n"], { type: "text/vcard;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = h("a", { href: url, download: estado.cod + ".vcf" });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

                acciones: [h("button", { class: "btn-oro", type: "button", onclick: () => { almacen.del(LS_LAT); almacen.del(LS_LNG); cerrarModal(); refrescar(); } }, "Borrar ubicación")],

            }), 800);
            return;
        }
        if (!navigator.geolocation) {

                const ok = almacen.set(LS_LAT, pos.coords.latitude) && almacen.set(LS_LNG, pos.coords.longitude);
                refrescar();
                abrirModal({
                    titulo: ok ? "Ubicación guardada" : "No se pudo guardar", icono: ok ? "pin" : "alert",

                });

                refrescar();
                abrirModal({ titulo: "No hemos podido ubicarte", icono: "alert", cuerpo: h("p", { class: "modal-texto", text: "Activa el GPS del móvil, permite el acceso a la ubicación para esta página y vuelve a intentarlo." }) });
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }
    refrescar();
    return el;
};

function evaluarResultado(res, sel) {
    if (!res) return null;
    const reglas = Array.isArray(res.reglas) ? res.reglas : [];
    for (let i = 0; i < reglas.length; i++) {
        const cond = reglas[i] && reglas[i].si ? reglas[i].si : {};
        const ok = Object.keys(cond).every((k) => [].concat(cond[k]).map(String).indexOf(String(sel[k])) >= 0);
        if (ok) return reglas[i];
    }
    return res.porDefecto || null;
}

MODULOS.calculadora = (btn) => {
    const c = btn.campo;
    const ops = (Array.isArray(btn.opciones) ? btn.opciones : []).filter((o) => o && o.texto && Number(o.factor) > 0);
    if (!c || !c.etiqueta) falta("'calculadora' necesita 'campo.etiqueta'");
    if (!ops.length) falta("'calculadora' necesita 'opciones' con 'texto' y 'factor' mayor que 0");
    if (!btn.resultado) falta("'calculadora' necesita 'resultado'");
    return botonApp(btn, { nombre: "Calculadora", icono: "calculator", abrir: () => abrirCalculadora(btn, c, ops) });
};
function abrirCalculadora(btn, c, ops) {
    vibrar(40);
    const min = Number(c.min) || 0, max = Number(c.max) || 10000;
    const input = h("input", { class: "input", type: "number", inputmode: "decimal", step: "any", min: String(min), max: String(max), placeholder: c.placeholder || "", "aria-label": c.etiqueta });
    const select = ops.length > 1 ? h("select", { class: "input", "aria-label": "Opción" }, ops.map((o, i) => h("option", { value: String(i), text: o.texto }))) : null;
    const salida = h("div", { class: "resultado", "aria-live": "polite", hidden: true });
    const calcular = () => {
        const valor = parseFloat(String(input.value).replace(",", "."));
        salida.hidden = false; salida.textContent = "";
        if (!(valor > min && valor <= max)) {
            salida.append(h("div", { class: "resultado-texto", text: "Introduce un valor válido (entre " + min + " y " + max + (c.unidad ? " " + c.unidad : "") + ")." }));
            return;
        }
        const op = ops[select ? Number(select.value) : 0];
        const dec = Math.min(Math.max(Number(btn.resultado.decimales) || 0, 0), 3);
        const res = valor * Number(op.factor);
        poner(salida,
            h("div", { class: "resultado-etiqueta", text: btn.resultado.texto || "Resultado" }),
            h("div", { class: "resultado-grande", text: res.toLocaleString("es-ES", { minimumFractionDigits: dec, maximumFractionDigits: dec }) + (btn.resultado.unidad ? " " + btn.resultado.unidad : "") }),
            btn.resultado.nota ? h("div", { class: "resultado-texto", text: btn.resultado.nota }) : null);
        vibrar(30);
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); calcular(); } });
    abrirModal({
        titulo: btn.titulo || btn.nombre, icono: nombreIcono(btn.icono, "calculator"),
        cuerpo: [
            btn.intro ? h("p", { class: "modal-texto", text: btn.intro }) : null,
            h("div", { class: "campo" }, h("span", { class: "campo-label", text: c.etiqueta }), input),
            select ? h("div", { class: "campo" }, h("span", { class: "campo-label", text: btn.etiquetaOpciones || "Objetivo" }), select) : null,
            h("button", { class: "btn-oro", type: "button", onclick: calcular }, btn.botonTexto || "Calcular"),
            salida,
            btn.aviso ? h("p", { class: "modal-aviso", text: btn.aviso }) : null
        ]
    });
}

const LEGACY = {
    configurador_kebab: "asistente", test_ergonomico: "asistente", ergonomia: "asistente", test_desgaste: "asistente",
    tasador_retirada: "asistente", logistica: "asistente", calc_proteina: "calculadora",
    guia_alergenos_kebab: "info", guia_creatina: "info", carnet_vacunacion: "info", checklist_parto: "info",

function normalizar(data) {
    let d;
    try { d = JSON.parse(JSON.stringify(data)); } catch (e) { return null; }
    if (!d || typeof d !== "object" || !Array.isArray(d.secciones)) return d;
    d.secciones.forEach((sec) => {
        if (!sec || typeof sec !== "object") return;
        if (!Array.isArray(sec.botones)) sec.botones = [];
        // Bloque de reseñas v1 (estrellas con filtro) -> bloque v2 de dos botones iguales
        if (sec.escudoResenas || sec.urlGoogleResenas) {
            if (!sec.botones.some((b) => b && b.tipo === "opinion")) {
                sec.botones.push({ tipo: "opinion", urlGoogle: sec.urlGoogleResenas, whatsappGerencia: sec.whatsappGerencia });
            }
        }
        sec.botones.forEach((b) => {
            if (!b || typeof b !== "object") return;
            if (b.tipo === "recuperar_llaves") b.tipo = "llaves";
            if (!b.tipo) b.tipo = b.url && /\.vcf$/i.test(b.url) ? "vcard" : (b.url ? "enlace" : "");
            if (b.tipo === "vcard" && b.url && /contacto\.vcf$/i.test(b.url)) delete b.url; // marcador de la v1: se genera al vuelo
        });
    });
    return d;
}
function validarRaiz(d) {
    if (!d || typeof d !== "object" || Array.isArray(d)) return "El JSON no es un objeto";
    if (!d.nombre || typeof d.nombre !== "string") return "Falta 'nombre'";
    if (!Array.isArray(d.secciones)) return "Falta 'secciones'";
    return null;
}
function resolverWANegocio(d) {
    let n = waNumero(d.whatsapp);
    if (n) return n;
    for (let i = 0; i < d.secciones.length; i++) {
        const sec = d.secciones[i];
        if (!sec) continue;
        n = waNumero(sec.whatsappGerencia); if (n) return n;
        const bs = Array.isArray(sec.botones) ? sec.botones : [];
        for (let j = 0; j < bs.length; j++) {
            const b = bs[j];
            if (!b) continue;
            if (typeof b.whatsappGerencia === "string") { n = waNumero(b.whatsappGerencia); if (n) return n; }
            if (typeof b.url === "string" && /^https:\/\/wa\.me\//i.test(b.url)) { n = waNumero(b.url); if (n) return n; }
        }
    }
    return "";
}

function cargarLogo(d) {

    const archivo = crudo.replace(/^(\.\/|\/|\.\.\/|c\/)+/, "");
    let rutas = [crudo];
    if (!/^https:/i.test(crudo)) {
        rutas.push("./" + archivo, "../" + archivo, "./c/" + archivo);
        if (CONFIG.respaldoGitHub) {
            const base = CONFIG.respaldoGitHub.replace("{cod}.json", "");
            rutas.push(base + archivo, base.replace(/c\/$/, "") + archivo);
        }

    rutas = rutas.filter((r, i) => rutas.indexOf(r) === i);
    let intento = 0;
    img.alt = d.nombre;
    img.onload = () => { caja.hidden = false; };
    img.onerror = () => {
        intento++;
        if (intento < rutas.length) img.src = rutas[intento];
        else { img.remove(); textoLogo(); }
    };
    img.src = rutas[0];

async function pedirJSON(url) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), CONFIG.tiempoLimiteMs);
    try {
        const r = await fetch(url, { cache: "no-cache", signal: ctrl.signal });
        if (r.status === 404) return { noEncontrado: true };
        if (!r.ok) return { error: true };
        const texto = await r.text();
        try { return { data: JSON.parse(texto) }; } catch (e) { return { noEncontrado: true }; } // p. ej. una página HTML de "no encontrado"
    } catch (e) { return { error: true }; }
    finally { clearTimeout(t); }
}
async function cargarConfig(cod) {
    const urls = CONFIG.rutasJSON.map((r) => r.replace("{cod}", cod));
    if (CONFIG.respaldoGitHub) urls.push(CONFIG.respaldoGitHub.replace("{cod}", cod));
    let huboError = false;
    for (let i = 0; i < urls.length; i++) {
        const r = await pedirJSON(urls[i]);
        if (r.data) return { data: r.data };
        if (r.error) huboError = true;
    }
    return { error: huboError ? "red" : "noencontrado" };
}

function mostrarError(tipo) {
    const menu = $("dynamic-menu");
    menu.textContent = "";
    const msg = tipo === "red" ? "No pudimos cargar esta terminal. Comprueba tu conexión e inténtalo de nuevo."
        : tipo === "config" ? "Esta terminal tiene la configuración incompleta."
        : "Terminal no encontrada.";
    menu.append(h("div", { class: "error-box" },
        ico("alert"), h("p", { text: msg }),
        tipo === "red" ? h("button", { class: "btn-oro", type: "button", onclick: () => location.reload() }, "Reintentar") : null));
    if (estado.debug) mostrarDebug();
}
function mostrarDebug() {
    const p = $("debug-panel");
    p.hidden = false;
    p.textContent = "";
    poner(p,
        h("div", null, h("b", { text: "Motor v2.0" }), " · cod=" + estado.cod + " · llavero=" + estado.llavero + " · mesa=" + estado.mesa),
        h("div", null, "WhatsApp del negocio: " + (estado.waNegocio ? "sí" : "NO")),
        h("div", null, h("b", { text: "Avisos (" + estado.avisos.length + "):" })),
        estado.avisos.length ? estado.avisos.map((a) => h("div", { text: "• " + a })) : h("div", { text: "Sin avisos. Configuración correcta." }));
}

async function iniciar() {
    montarSprite();
    const p = new URLSearchParams(window.location.search);
    estado.debug = p.get("debug") === "1";
    estado.llavero = limpiarParam(p.get("k") || p.get("key"), "MOSTRADOR");
    estado.mesa = limpiarParam(p.get("mesa"), "Barra");
    const cod = soloSlug(p.get("cod") || p.get("id") || "demo", null);
    if (!cod) { mostrarError("noencontrado"); return; }
    estado.cod = cod;

    const r = await cargarConfig(cod);
    if (r.error) { mostrarError(r.error); return; }

    const d = normalizar(r.data);
    const problema = validarRaiz(d);
    if (problema) { aviso(problema); mostrarError("config"); return; }

    estado.data = d;
    estado.negocio = String(d.nombre).trim();
    estado.waNegocio = resolverWANegocio(d);
    if (Number(d.version) > 2) aviso("El JSON es de una versión posterior (" + d.version + "); puede que algunas funciones no se muestren.");

    aplicarIdentidad(d);
    if (d.pausada === true) { mostrarPausa(d); return; }
    renderMenu(d);
    if (estado.debug) mostrarDebug();
    contar("vista");
    document.addEventListener("click", clasificarClic, true);
}

/* Servicio en pausa (lo activa Studio 42 si la suscripción no está al día). */
function mostrarPausa(d) {
    const menu = $("dynamic-menu");
    menu.textContent = "";
    menu.append(h("div", { class: "error-box" }, ico("clock"),
        h("p", { text: "Este espacio digital de " + String(d.nombre).trim() + " está en pausa temporalmente." }),
        h("p", { text: "Disculpa las molestias. Vuelve a intentarlo más tarde." })));
}

/* ---------- Contador anónimo: solo cliente, pieza (k) y tipo de acción ---------- */
function contar(tipo) {
    if (!CONFIG.estadisticas || estado.debug || /[?&]preview=1/.test(location.search)) return;
    try {
        const cuerpo = JSON.stringify({ accion: "ev", c: estado.cod, k: estado.llavero, t: tipo });
        const blob = new Blob([cuerpo], { type: "text/plain" });
        if (!(navigator.sendBeacon && navigator.sendBeacon(CONFIG.estadisticas, blob))) {
            fetch(CONFIG.estadisticas, { method: "POST", body: cuerpo, mode: "no-cors", keepalive: true }).catch(() => {});
        }
    } catch (e) { /* nunca debe romper la landing */ }
}
function clasificarClic(e) {
    const a = e.target.closest && e.target.closest("a[href]");
    if (!a) return;
    const u = a.getAttribute("href") || "";
    const t = /writereview|g\.page\/r|search\.google\.com\/local/.test(u) ? "resena"
        : /wa\.me|whatsapp/.test(u) ? (a.classList.contains("par-opinion") || /gerencia/i.test(a.textContent) ? "gerencia" : "whatsapp")
        : /^tel:/.test(u) ? "llamada"
        : /google\.[a-z.]+\/maps|maps\.app|maps\.google/.test(u) ? "ruta"
        : /^https?:/.test(u) ? "enlace" : "";
    if (t) contar(t);
}

/* Vista previa desde el panel de Studio 42 (?preview=1 dentro de un iframe del mismo dominio):
   el panel envía un JSON sin publicar y se pinta aquí sin tocar GitHub. */
function pintarPrevia(raw) {
    const d = normalizar(raw);
    const problema = validarRaiz(d);
    if (problema) { aviso(problema); mostrarError("config"); return; }
    estado.avisos = [];
    estado.data = d;
    estado.negocio = String(d.nombre).trim();
    estado.waNegocio = resolverWANegocio(d);
    aplicarIdentidad(d);
    renderMenu(d);
}
if (new URLSearchParams(location.search).get("preview") === "1" && window.parent !== window) {
    window.addEventListener("message", (e) => {
        if (e.origin !== location.origin || !e.data || e.data.tipo !== "s42-preview" || !e.data.json) return;
        try { pintarPrevia(e.data.json); } catch (err) { console.warn(err); }
    });
}

document.addEventListener("DOMContentLoaded", iniciar);

})();
</script>

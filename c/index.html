<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Studio 42 | Ecosistema Phygital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --color-principal: #0b0c10;
            --color-acento: #00E5FF;
            --color-fondo: #030712; 
            --color-tarjeta: rgba(15, 23, 42, 0.90); 
            --color-boton: rgba(30, 41, 59, 0.7); 
            --color-texto: #f8fafc;
            --color-gris: #94a3b8;
            --titanium-light: #f1f5f9;
            --titanium-glow: rgba(226, 232, 240, 0.4);
            --halo-glow: rgba(0, 229, 255, 0.5);
            --halo-intensity: 30px;
            --halo-edge: #00E5FF;
            --fondo-logo: #0b0c10;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html {
            background-color: var(--color-fondo);
            scroll-behavior: smooth;
        }

        body { 
            background: radial-gradient(circle at 50% 10%, var(--color-principal) 0%, var(--color-fondo) 85%);
            color: var(--color-texto); 
            min-height: 100vh;
            padding: 15px 15px 35px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            transition: background 0.3s ease;
            position: relative;
        }

        #splash-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 0.5s ease; padding: 20px;
        }
        .btn-desbloqueo { 
            background: linear-gradient(135deg, var(--color-acento), #ffffff); color: #020617; border: none; 
            padding: 16px 36px; border-radius: 50px; font-size: 0.9rem; font-weight: 900; letter-spacing: 1.2px; 
            text-transform: uppercase; cursor: pointer; box-shadow: 0 0 30px var(--titanium-glow);
            transition: transform 0.2s ease;
        }

        .halo-wrapper {
            position: relative; width: 100%; max-width: 412px; border-radius: 34px; padding: 2px;
            margin: auto 0;
            overflow: hidden; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 var(--halo-intensity) var(--halo-glow);
            transition: box-shadow 0.3s ease;
        }
        .halo-wrapper::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent 0%, transparent 40%, var(--color-acento) 50%, #ffffff 52%, var(--color-acento) 54%, transparent 65%, transparent 100%);
            animation: haloRotate 8s linear infinite; z-index: 0;
        }
        @keyframes haloRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .hub-container { 
            background: var(--color-tarjeta); width: 100%; border-radius: 32px; 
            padding: 22px 18px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.12); 
            backdrop-filter: blur(20px); position: relative; z-index: 1;
        }

        .top-bar-controls {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding: 0 4px;
        }
        .lang-picker {
            display: flex; gap: 4px; background: rgba(255,255,255,0.06);
            padding: 3px 6px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
        }
        .lang-btn {
            background: none; border: none; font-size: 0.7rem; font-weight: 800;
            color: #94a3b8; cursor: pointer; padding: 2px 7px; border-radius: 8px; transition: all 0.2s;
        }
        .lang-btn.active { color: #020617; background: var(--color-acento); font-weight: 900; }
        
        .owner-btn {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            color: #94a3b8; width: 30px; height: 30px; border-radius: 50%; display: none;
            align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer;
            transition: all 0.2s;
        }

        .status-badge { 
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(241, 245, 249, 0.06); border: 1px solid rgba(226, 232, 240, 0.2);
            padding: 6px 14px; border-radius: 50px; font-size: 0.65rem; font-weight: 800;
            letter-spacing: 1px; color: var(--titanium-light); margin-bottom: 14px; text-transform: uppercase;
        }
        .ping-light { 
            position: relative; width: 7px; height: 7px; background-color: var(--color-acento);
            border-radius: 50%; box-shadow: 0 0 8px var(--color-acento); flex-shrink: 0;
        }
        .ping-light::after { 
            content: ''; position: absolute; top: -3px; left: -3px; width: 13px; height: 13px;
            border-radius: 50%; background-color: var(--titanium-glow);
            animation: radarTitanium 2s infinite cubic-bezier(0, 0, 0.2, 1);
        }
        @keyframes radarTitanium { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(2.8); opacity: 0; } }
        
        .logo-container { 
            width: 100%; 
            max-width: 270px; 
            height: 84px; 
            margin: 0 auto 16px auto; 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            overflow: hidden; 
            background: radial-gradient(circle at center, rgba(230, 0, 0, 0.15) 0%, rgba(11, 12, 16, 0.95) 85%);
            display: flex; 
            justify-content: center; 
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px var(--halo-glow); 
            position: relative; 
            cursor: pointer; 
            transition: all 0.3s ease;
            padding: 4px 10px;
        }
        .logo-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            display: block; 
            filter: drop-shadow(0 0 10px rgba(230, 0, 0, 0.5));
            transition: transform 0.25s ease;
        }
        .logo-container:active img { transform: scale(0.97); }
        
        h1 { font-size: 1.3rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: #fff; word-break: break-word; }
        .propietario { color: var(--color-acento); font-size: 0.78rem; margin-bottom: 14px; font-weight: 700; letter-spacing: 0.8px; word-break: break-word; }
        .section-title { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.3px; color: var(--color-gris); margin: 18px 0 10px 6px; font-weight: 800; }
        
        .apps-menu { display: flex; flex-direction: column; gap: 11px; width: 100%; }
        .app-btn { 
            display: flex; align-items: center; padding: 13px 16px; border-radius: 20px; 
            background: var(--color-boton); border: 1px solid rgba(255, 255, 255, 0.08); 
            transition: all 0.2s ease; cursor: pointer; text-align: left; text-decoration: none; 
            backdrop-filter: blur(10px); width: 100%; box-sizing: border-box;
        }
        .app-btn:active { transform: scale(0.97); border-color: var(--color-acento); }
        .app-btn.destacado { 
            border: 1px solid var(--color-acento); 
            background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(15, 23, 42, 0.85));
            box-shadow: 0 0 20px var(--halo-glow); 
        }
        .app-icon { width: 44px; height: 44px; border-radius: 14px; display: flex; justify-content: center; align-items: center; margin-right: 14px; font-size: 1.2rem; flex-shrink: 0; }
        
        .app-info { flex-grow: 1; min-width: 0; overflow: hidden; }
        .app-name { font-size: 0.88rem; font-weight: 800; color: var(--color-texto); margin-bottom: 2px; }
        .app-desc { font-size: 0.72rem; color: var(--color-gris); }

        .btn-rescate-llaves {
            border: 1px solid #f59e0b !important;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(15, 23, 42, 0.9)) !important;
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.25) !important;
        }
        .badge-rescate-sos {
            font-size: 9px; font-weight: 900; background: #f59e0b; color: #020617;
            padding: 2px 7px; border-radius: 20px; margin-left: 6px; text-transform: uppercase; flex-shrink: 0;
        }

        .stars-container { font-size: 2rem; margin-top: 10px; display: flex; justify-content: center; gap: 8px; width: 100%; }
        .star-rating i { cursor: pointer; transition: transform 0.2s ease; display: inline-block; }
        .star-active { color: #ffb400; text-shadow: 0 0 14px rgba(255, 180, 0, 0.7); }
        .star-inactive { color: #334155; }

        /* MODALES */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.88); backdrop-filter: blur(14px); z-index: 10001; justify-content: center; align-items: center; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
        .modal-box { 
            background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.18); 
            border-radius: 28px; padding: 24px 20px; max-width: 380px; width: 100%; 
            text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.9); transform: translateY(20px); 
            transition: transform 0.3s ease; max-height: 88vh; overflow-y: auto; position: relative;
        }
        .modal-close-btn {
            position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .modal-actions { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
        .modal-btn-primary { background: linear-gradient(135deg, #25D366, #128c7e); color: #fff; border: none; padding: 13px 18px; border-radius: 50px; font-weight: 800; font-size: 0.85rem; cursor: pointer; text-decoration: none; display: block; text-align: center; }
        .modal-btn-google { background: linear-gradient(135deg, #ffb400, #f59e0b); color: #020617; border: none; padding: 13px 18px; border-radius: 50px; font-weight: 900; font-size: 0.85rem; cursor: pointer; text-decoration: none; display: block; text-align: center; }
        .modal-btn-secondary { background: transparent; color: var(--color-gris); border: 1px solid rgba(255,255,255,0.15); padding: 10px 16px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; cursor: pointer; text-decoration: none; display: block; text-align: center; }

        .selector-box { text-align: left; margin-bottom: 12px; }
        .selector-label { font-size: 0.72rem; color: var(--color-acento); font-weight: 800; text-transform: uppercase; margin-bottom: 6px; display: block; }
        .selector-pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .pill-btn { background: #1e293b; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 8px 4px; font-size: 0.72rem; color: #fff; text-align: center; cursor: pointer; transition: all 0.2s; }

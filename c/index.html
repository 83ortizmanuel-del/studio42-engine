<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Studio 42 | Ecosistema Phygital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --color-principal: #0b0c10;
            --color-acento: #00E5FF;
            --color-fondo: #030712; 
            --color-tarjeta: rgba(15, 23, 42, 0.90); 
            --color-boton: rgba(30, 41, 59, 0.7); 
            --color-texto: #f8fafc;
            --color-gris: #94a3b8;
            --titanium-light: #f1f5f9;
            --titanium-glow: rgba(226, 232, 240, 0.4);
            --halo-glow: rgba(0, 229, 255, 0.5);
            --halo-intensity: 30px;
            --fondo-logo: #0b0c10;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: radial-gradient(circle at 50% 10%, var(--color-principal) 0%, var(--color-fondo) 85%);
            color: var(--color-texto); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; padding: 15px; user-select: none; overflow-x: hidden;
            transition: background 0.3s ease;
        }
        
        #splash-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 0.5s ease; padding: 20px;
        }
        .btn-desbloqueo { 
            background: linear-gradient(135deg, var(--color-acento), #ffffff); color: #020617; border: none; 
            padding: 16px 36px; border-radius: 50px; font-size: 0.9rem; font-weight: 900; letter-spacing: 1.2px; 
            text-transform: uppercase; cursor: pointer; box-shadow: 0 0 30px var(--titanium-glow);
            transition: transform 0.2s ease;
        }
        .btn-desbloqueo:active { transform: scale(0.95); }

        .halo-wrapper {
            position: relative; width: 100%; max-width: 416px; border-radius: 34px; padding: 2px;
            overflow: hidden; margin: auto; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 var(--halo-intensity) var(--halo-glow);
            transition: box-shadow 0.3s ease;
        }
        .halo-wrapper::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent 0%, transparent 40%, var(--color-acento) 50%, #ffffff 52%, var(--color-acento) 54%, transparent 65%, transparent 100%);
            animation: haloRotate 10s linear infinite; z-index: 0;
        }
        @keyframes haloRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .hub-container { 
            background: var(--color-tarjeta); width: 100%; border-radius: 32px; 
            padding: 24px 18px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.12); 
            backdrop-filter: blur(20px); position: relative; z-index: 1;
        }

        /* HEADER SUPERIOR: IDIOMAS Y CONFIGURADOR */
        .top-bar-controls {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding: 0 4px;
        }
        .lang-picker {
            display: flex; gap: 6px; background: rgba(255,255,255,0.06);
            padding: 4px 8px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
        }
        .lang-btn {
            background: none; border: none; font-size: 0.72rem; font-weight: 800;
            color: #94a3b8; cursor: pointer; padding: 2px 5px; border-radius: 6px;
        }
        .lang-btn.active { color: #fff; background: rgba(255,255,255,0.18); }
        .owner-btn {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            color: #94a3b8; width: 28px; height: 28px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 0.75rem; cursor: pointer;
            transition: all 0.2s;
        }
        .owner-btn:hover { color: var(--color-acento); border-color: var(--color-acento); }

        .status-badge { 
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(241, 245, 249, 0.06); border: 1px solid rgba(226, 232, 240, 0.2);
            padding: 6px 14px; border-radius: 50px; font-size: 0.65rem; font-weight: 800;
            letter-spacing: 1px; color: var(--titanium-light); margin-bottom: 14px; text-transform: uppercase;
            max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .ping-light { 
            position: relative; width: 7px; height: 7px; background-color: var(--color-acento);
            border-radius: 50%; box-shadow: 0 0 8px var(--color-acento); flex-shrink: 0;
        }
        .ping-light::after { 
            content: ''; position: absolute; top: -3px; left: -3px; width: 13px; height: 13px;
            border-radius: 50%; background-color: var(--titanium-glow);
            animation: radarTitanium 2s infinite cubic-bezier(0, 0, 0.2, 1);
        }
        @keyframes radarTitanium { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(2.8); opacity: 0; } }
        
        .logo-container { 
            width: 88px; height: 88px; margin: 0 auto 12px auto; 
            border-radius: 24px; border: 2px solid var(--color-acento); 
            overflow: hidden; 
            background-color: var(--fondo-logo, #0b0c10);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), 0 0 15px var(--halo-glow); 
            position: relative; cursor: pointer;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .logo-container img { 
            width: 100%; height: 100%; object-fit: contain; display: block; transition: filter 0.3s ease; 
        }
        
        h1 { font-size: 1.3rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: #fff; word-break: break-word; }
        .propietario { color: var(--color-acento); font-size: 0.78rem; margin-bottom: 14px; font-weight: 700; letter-spacing: 0.8px; word-break: break-word; }
        .section-title { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.3px; color: var(--color-gris); margin: 18px 0 10px 6px; font-weight: 800; }
        
        .apps-menu { display: flex; flex-direction: column; gap: 11px; width: 100%; }
        .app-btn { 
            display: flex; align-items: center; padding: 13px 16px; border-radius: 20px; 
            background: var(--color-boton); border: 1px solid rgba(255, 255, 255, 0.08); 
            transition: all 0.2s ease; cursor: pointer; text-align: left; text-decoration: none; 
            backdrop-filter: blur(10px); width: 100%; box-sizing: border-box;
        }
        .app-btn:active { transform: scale(0.97); border-color: var(--color-acento); }
        .app-btn.destacado { 
            border: 1px solid var(--color-acento); 
            background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(15, 23, 42, 0.85));
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.15); 
        }
        .app-icon { width: 44px; height: 44px; border-radius: 14px; display: flex; justify-content: center; align-items: center; margin-right: 14px; font-size: 1.2rem; flex-shrink: 0; }
        
        .app-info { flex-grow: 1; min-width: 0; overflow: hidden; }
        .app-name { font-size: 0.88rem; font-weight: 800; color: var(--color-texto); margin-bottom: 2px; word-break: break-word; }
        .app-desc { font-size: 0.72rem; color: var(--color-gris); word-break: break-word; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(2, 6, 23, 0.88); backdrop-filter: blur(14px); z-index: 10001; justify-content: center; align-items: center; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
        .modal-box { 
            background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.18); 
            border-radius: 28px; padding: 24px 20px 20px 20px; max-width: 380px; width: 100%; 
            text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.9); transform: translateY(20px); 
            transition: transform 0.3s ease; max-height: 88vh; overflow-y: auto; position: relative;
        }
        .modal-close-btn {
            position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 0.9rem; transition: all 0.2s ease; z-index: 60;
        }
        .modal-icon { font-size: 2.4rem; margin-bottom: 8px; }
        .modal-title { font-size: 1.15rem; font-weight: 900; color: #fff; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.8px; padding: 0 20px; word-break: break-word; }
        .modal-text { font-size: 0.84rem; color: #cbd5e1; line-height: 1.45; margin-bottom: 16px; word-break: break-word; }
        
        .modal-actions { display: flex; flex-direction: column; gap: 9px; }
        .modal-btn-primary { background: linear-gradient(135deg, #25D366, #128c7e); color: #fff; border: none; padding: 13px 18px; border-radius: 50px; font-weight: 800; font-size: 0.85rem; cursor: pointer; text-decoration: none; display: block; text-align: center; }
        .modal-btn-secondary { background: transparent; color: var(--color-gris); border: 1px solid rgba(255,255,255,0.15); padding: 10px 16px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; cursor: pointer; text-decoration: none; display: block; }

        .footer-brand { margin-top: 26px; font-size: 0.7rem; color: var(--color-gris); letter-spacing: 1.1px; }
        .footer-brand span { color: var(--titanium-light); font-weight: 800; }
    </style>
</head>
<body>

    <audio id="audio-fondo" loop preload="auto"></audio>

    <div id="splash-screen">
        <div class="logo-container" id="splash-logo-box">
            <img id="splash-logo" alt="Logo">
        </div>
        <h2 id="splash-title" style="color: #fff; font-size: 1.4rem; margin-bottom: 6px; letter-spacing: 2px; font-weight: 900;">STUDIO 42</h2>
        <p id="splash-subtitle" style="color: var(--color-gris); font-size: 0.85rem; margin-bottom: 30px; text-transform: uppercase;">Ecosistema Phygital</p>
        <button onclick="iniciarMagia()" class="btn-desbloqueo">Desbloquear Experiencia</button>
    </div>

    <!-- MODAL GENERAL LECTURA/POLIMÓRFICO -->
    <div id="modal-overlay" class="modal-overlay" onclick="cerrarModal(event)">
        <div class="modal-box" id="modal-content">
            <button class="modal-close-btn" onclick="cerrarModalBtn()"><i class="fa-solid fa-xmark"></i></button>
            <div id="modal-icon" class="modal-icon"></div>
            <div id="modal-title" class="modal-title"></div>
            <div id="modal-text" class="modal-text"></div>
            <div id="modal-actions" class="modal-actions">
                <button class="modal-btn-secondary" onclick="cerrarModalBtn()">Entendido</button>
            </div>
        </div>
    </div>

    <!-- MODAL CONFIGURADOR PROPIETARIO (PROTEGIDO POR PIN) -->
    <div id="modal-configurador" class="modal-overlay" onclick="cerrarConfigurador(event)">
        <div class="modal-box text-left" style="max-width: 400px;">
            <button class="modal-close-btn" onclick="cerrarConfiguradorBtn()"><i class="fa-solid fa-xmark"></i></button>
            <div class="flex items-center gap-2 mb-2">
                <i class="fa-solid fa-user-gear text-cyan-400 text-lg"></i>
                <h3 class="text-white text-sm font-black uppercase tracking-wider">Gestión Propietario</h3>
            </div>
            <p class="text-[11px] text-slate-400 mb-3">Actualiza los datos clínicos y de contacto de la chapa inteligente:</p>

            <div class="space-y-3 max-h-96 overflow-y-auto pr-1 text-xs">
                <div>
                    <label class="font-bold text-slate-300 block mb-1">WhatsApp de Rescate (con código país):</label>
                    <input type="text" id="cfg-wa" placeholder="Ej: 34672294962" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                </div>
                <div>
                    <label class="font-bold text-slate-300 block mb-1">Nº Microchip Oficial Homologado:</label>
                    <input type="text" id="cfg-chip" placeholder="Ej: 981098108472911" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                </div>
                <div>
                    <label class="font-bold text-slate-300 block mb-1">Alergias Críticas & Dieta:</label>
                    <textarea id="cfg-dieta" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white" placeholder="Ej: Alérgico al pollo. Toma condroprotector con desayuno."></textarea>
                </div>
                <div>
                    <label class="font-bold text-slate-300 block mb-1">Añadir / Modificar Vacuna:</label>
                    <input type="text" id="cfg-vac-nom" placeholder="Nombre vacuna (ej: Rabia)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white mb-1.5">
                    <input type="text" id="cfg-vac-est" placeholder="Estado (ej: Vigente 2026)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                </div>
            </div>

            <div class="modal-actions mt-4">
                <button onclick="guardarAjustesPropietario()" class="modal-btn-primary" style="background: linear-gradient(135deg, #00E5FF, #0284c7); color: #020617; font-weight: 900;">
                    <i class="fa-solid fa-floppy-disk mr-1"></i> Guardar y Sincronizar Ficha
                </button>
                <button class="modal-btn-secondary" onclick="cerrarConfiguradorBtn()">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- HUB PRINCIPAL -->
    <div class="halo-wrapper" id="main-halo">
        <div class="hub-container">
            
            <!-- BARRA SUPERIOR: MULTI-IDIOMA + CONFIGURADOR -->
            <div class="top-bar-controls">
                <div class="lang-picker">
                    <button class="lang-btn active" onclick="cambiarIdioma('es', this)">ES</button>
                    <button class="lang-btn" onclick="cambiarIdioma('en', this)">EN</button>
                    <button class="lang-btn" onclick="cambiarIdioma('fr', this)">FR</button>
                    <button class="lang-btn" onclick="cambiarIdioma('de', this)">DE</button>
                </div>
                <button class="owner-btn" onclick="pedirAccesoPropietario()" title="Zona Dueño / Editar">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>

            <div class="status-badge">
                <span class="ping-light"></span>
                <span id="badge-text">PASAPORTE DIGITAL ACTIVO</span>
            </div>

            <div class="logo-container" id="hub-logo-box">
                <img id="hub-logo" alt="Foto Mascota">
            </div>

            <h1 id="client-name">TOBY</h1>
            <div class="propietario" id="client-subtitle">RESCATE INTELIGENTE ACTIVO</div>

            <div id="dynamic-menu"></div>

            <div class="footer-brand" id="lbl-footer-brand">Desarrollado por <span>Studio 42 Pet Rescue</span></div>
        </div>
    </div>

    <script>
        let datosPerfilGlobal = null;
        let idiomaActual = 'es';
        let whatsappTiendaGlobal = "";
        let nombreNegocioGlobal = "TOBY";
        let clienteSlugGlobal = "toby";

        const DICCIONARIO = {
            es: {
                badge: "CHIP INTELIGENTE ACTIVO · PROTOCOLO RESCATE SOS",
                llamar: "Llamar a Papá/Mamá",
                wa: "Avisar por WhatsApp al Dueño",
                gps: "Hospitales Veterinarios 24h & GPS",
                cartilla: "Carnet de Vacunación Canina",
                dieta: "Protocolo de Dieta, Alergias y Carácter",
                triaje: "Semáforo SOS / Intoxicaciones & Auxilios",
                msgWa: "¡Hola! Acabo de escanear la chapa de Toby y lo tengo conmigo. ¿Cómo coordinamos para entregarlo?"
            },
            en: {
                badge: "ACTIVE SMART CHIP · SOS RESCUE PROTOCOL",
                llamar: "Call Toby's Owner",
                wa: "Notify Owner via WhatsApp",
                gps: "24/7 Vet Hospitals & GPS Location",
                cartilla: "Vaccination & Medical Records",
                dieta: "Dietary Needs, Allergies & Temperament",
                triaje: "SOS Poisoning Guide & First Aid",
                msgWa: "Hello! I just scanned Toby's smart tag and he is with me. How can we meet to return him?"
            },
            fr: {
                badge: "PUCE INTELLIGENTE ACTIVE · PROTOCOLE SOS",
                llamar: "Appeler le propriétaire",
                wa: "Prévenir par WhatsApp",
                gps: "Urgences Vétérinaires 24h & GPS",
                cartilla: "Carnet de Vaccination",
                dieta: "Régime, Allergies & Caractère",
                triaje: "Guide SOS Intoxications & Premiers Soins",
                msgWa: "Bonjour! Je viens de scanner la médaille de Toby et il est avec moi. Comment faire pour vous le rendre?"
            },
            de: {
                badge: "SMART-CHIP AKTIV · SOS RETTUNGSPROTOKOLL",
                llamar: "Besitzer anrufen",
                wa: "Besitzer per WhatsApp benachrichtigen",
                gps: "24h Tierkliniken & GPS-Standort",
                cartilla: "Impfpass & Tierarztakte",
                dieta: "Diät, Allergien & Verhalten",
                triaje: "SOS Vergiftung & Erste Hilfe",
                msgWa: "Hallo! Ich habe gerade Tobys Marke gescannt und er ist bei mir. Wie können wir die Übergabe vereinbaren?"
            }
        };

        const reproductor = document.getElementById('audio-fondo');
        const splash = document.getElementById('splash-screen');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');
        const modalActions = document.getElementById('modal-actions');
        const modalCfg = document.getElementById('modal-configurador');

        function abrirModalCustom() {
            modalOverlay.style.display = 'flex';
            setTimeout(() => { modalOverlay.style.opacity = '1'; modalContent.style.transform = 'translateY(0)'; }, 10);
        }
        function cerrarModal(e) { if(e.target === modalOverlay) cerrarModalBtn(); }
        function cerrarModalBtn() {
            modalOverlay.style.opacity = '0';
            modalContent.style.transform = 'translateY(20px)';
            setTimeout(() => { modalOverlay.style.display = 'none'; }, 300);
        }

        // ==========================================
        // GESTIÓN PROPIETARIO / CONFIGURADOR
        // ==========================================
        function pedirAccesoPropietario() {
            const pin = prompt("Introduce el PIN de Propietario (PIN por defecto: 1234):");
            if (pin === "1234" || pin === (localStorage.getItem(`pin_${clienteSlugGlobal}`) || "1234")) {
                cargarDatosEnConfigurador();
                modalCfg.style.display = 'flex';
                setTimeout(() => { modalCfg.style.opacity = '1'; modalCfg.querySelector('.modal-box').style.transform = 'translateY(0)'; }, 10);
            } else if (pin !== null) {
                alert("PIN incorrecto. Acceso denegado a edición.");
            }
        }

        function cerrarConfigurador(e) { if(e.target === modalCfg) cerrarConfiguradorBtn(); }
        function cerrarConfiguradorBtn() {
            modalCfg.style.opacity = '0';
            modalCfg.querySelector('.modal-box').style.transform = 'translateY(20px)';
            setTimeout(() => { modalCfg.style.display = 'none'; }, 300);
        }

        function cargarDatosEnConfigurador() {
            const guardado = localStorage.getItem(`override_${clienteSlugGlobal}`);
            const data = guardado ? JSON.parse(guardado) : datosPerfilGlobal;
            if (!data) return;

            document.getElementById('cfg-wa').value = (data.whatsapp || "34672294962").replace(/\D/g, '');
            document.getElementById('cfg-chip').value = data.microchip || "981098108472911";
            document.getElementById('cfg-dieta').value = data.dietaNotas || "Alérgico estricto al pollo. Toma condroprotector articular con el desayuno.";
        }

        function guardarAjustesPropietario() {
            const nuevoWa = document.getElementById('cfg-wa').value.trim();
            const nuevoChip = document.getElementById('cfg-chip').value.trim();
            const nuevaDieta = document.getElementById('cfg-dieta').value.trim();
            const vacNom = document.getElementById('cfg-vac-nom').value.trim();
            const vacEst = document.getElementById('cfg-vac-est').value.trim();

            let override = localStorage.getItem(`override_${clienteSlugGlobal}`);
            let data = override ? JSON.parse(override) : JSON.parse(JSON.stringify(datosPerfilGlobal));

            data.whatsapp = `https://wa.me/${nuevoWa}`;
            data.microchip = nuevoChip;
            data.dietaNotas = nuevaDieta;

            if (vacNom) {
                if (!data.vacunasExtras) data.vacunasExtras = [];
                data.vacunasExtras.push({ nombre: vacNom, subtitulo: vacEst || "Actualizada por propietario", momento: "Revisión 2026", badge: "Al Día" });
            }

            localStorage.setItem(`override_${clienteSlugGlobal}`, JSON.stringify(data));
            alert("✅ ¡Ficha actualizada y guardada con éxito!");
            cerrarConfiguradorBtn();
            cargarEnginePhygital();
        }

        // ==========================================
        // SELECTOR MULTI-IDIOMA
        // ==========================================
        function cambiarIdioma(lang, btn) {
            idiomaActual = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            const t = DICCIONARIO[lang] || DICCIONARIO.es;
            document.getElementById('badge-text').innerText = t.badge;
            
            // Re-renderizar enlaces con el mensaje en el idioma seleccionado
            renderMenu(datosPerfilGlobal);
        }

        // ==========================================
        // MODALES LECTURA INFORMATIVA
        // ==========================================
        function abrirAsistenciaRuta() {
            document.getElementById('modal-icon').innerHTML = '<i class="fa-solid fa-location-crosshairs" style="color:var(--color-acento);"></i>';
            document.getElementById('modal-title').innerText = DICCIONARIO[idiomaActual].gps;
            document.getElementById('modal-text').innerHTML = `
                <p class="text-xs text-slate-300 mb-3 text-left">Localiza centros veterinarios de urgencia abiertos en la zona o envía la posición exacta al dueño:</p>
                <div class="flex flex-col gap-2.5 text-left mb-2">
                    <button onclick="window.open('https://www.google.com/maps/search/hospital+veterinario+urgencias+24+horas/', '_blank')" class="w-full bg-slate-800 border border-slate-600 rounded-xl p-3 text-white text-xs font-bold flex items-center justify-center gap-2">
                        <i class="fa-solid fa-hospital text-cyan-400"></i> Buscar Urgencias 24h en Google Maps
                    </button>
                    <button onclick="compartirUbicacionMascota()" class="w-full bg-emerald-600/20 border border-emerald-500 rounded-xl p-3 text-emerald-300 text-xs font-bold flex items-center justify-center gap-2">
                        <i class="fa-brands fa-whatsapp text-emerald-400"></i> Enviar Mi Posición GPS al Dueño
                    </button>
                </div>
            `;
            modalActions.innerHTML = `<button class="modal-btn-secondary" onclick="cerrarModalBtn()">Cerrar</button>`;
            abrirModalCustom();
        }

        function compartirUbicacionMascota() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        const msg = encodeURIComponent(`¡Hola! Tengo a ${nombreNegocioGlobal} conmigo. Esta es mi ubicación GPS exacta para coordinar la entrega: https://maps.google.com/?q=${lat},${lng}`);
                        window.open(`${whatsappTiendaGlobal}?text=${msg}`, '_blank');
                    },
                    () => {
                        window.open(`${whatsappTiendaGlobal}?text=${encodeURIComponent(DICCIONARIO[idiomaActual].msgWa)}`, '_blank');
                    }
                );
            } else {
                window.open(`${whatsappTiendaGlobal}?text=${encodeURIComponent(DICCIONARIO[idiomaActual].msgWa)}`, '_blank');
            }
        }

        function abrirCarnetVacunacion(vacunas) {
            document.getElementById('modal-icon').innerHTML = '<i class="fa-solid fa-shield-dog" style="color: #38BDF8;"></i>';
            document.getElementById('modal-title').innerText = DICCIONARIO[idiomaActual].cartilla;
            
            let todas = [...(vacunas || [])];
            const override = localStorage.getItem(`override_${clienteSlugGlobal}`);
            if (override) {
                const dataO = JSON.parse(override);
                if (dataO.vacunasExtras) todas = [...todas, ...dataO.vacunasExtras];
            }

            let htmlVacunas = `<div class="space-y-2 text-left my-2 max-h-60 overflow-y-auto pr-1">`;
            todas.forEach(v => {
                htmlVacunas += `
                    <div class="bg-slate-900/90 border border-slate-700/80 p-2.5 rounded-xl">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold text-white">${v.nombre}</span>
                            <span class="text-[9px] bg-cyan-950 text-cyan-300 border border-cyan-800 px-2 py-0.5 rounded-full font-bold uppercase">${v.badge || 'Vigente'}</span>
                        </div>
                        <div class="text-[11px] text-slate-300">${v.subtitulo || ''}</div>
                        <div class="text-[10px] text-slate-400 mt-1"><i class="fa-solid fa-clock text-cyan-400 mr-1"></i>${v.momento || 'Pauta Anual'}</div>
                    </div>
                `;
            });
            htmlVacunas += `</div>`;
            document.getElementById('modal-text').innerHTML = htmlVacunas;
            modalActions.innerHTML = `<button class="modal-btn-secondary" onclick="cerrarModalBtn()">Entendido</button>`;
            abrirModalCustom();
        }

        function abrirChecklistClinico(checklist) {
            document.getElementById('modal-icon').innerHTML = '<i class="fa-solid fa-clipboard-list" style="color: #F59E0B;"></i>';
            document.getElementById('modal-title').innerText = DICCIONARIO[idiomaActual].dieta;
            
            const override = localStorage.getItem(`override_${clienteSlugGlobal}`);
            let notasExtra = "";
            let chipExtra = "981098108472911";
            if (override) {
                const d = JSON.parse(override);
                if (d.dietaNotas) notasExtra = d.dietaNotas;
                if (d.microchip) chipExtra = d.microchip;
            }

            let htmlCheck = `<div class="space-y-3 text-left my-2 max-h-60 overflow-y-auto pr-1">`;
            if (checklist && typeof checklist === 'object') {
                for (const [categoria, items] of Object.entries(checklist)) {
                    htmlCheck += `
                        <div class="bg-slate-900/90 border border-slate-700/80 p-2.5 rounded-xl">
                            <div class="text-xs font-bold text-amber-400 uppercase tracking-wide mb-1.5">${categoria}</div>
                            <ul class="space-y-1">
                    `;
                    items.forEach(it => {
                        const texto = it.includes('Microchip') ? `Microchip oficial homologado: ${chipExtra}` : it;
                        htmlCheck += `<li class="text-[11px] text-slate-200 flex items-start gap-1.5"><i class="fa-solid fa-circle-check text-amber-400 text-[10px] mt-0.5"></i> <span>${texto}</span></li>`;
                    });
                    if (categoria.includes('Clínicas') && notasExtra) {
                        htmlCheck += `<li class="text-[11px] text-cyan-200 flex items-start gap-1.5 font-semibold"><i class="fa-solid fa-notes-medical text-cyan-400 text-[10px] mt-0.5"></i> <span>Nota dueño: ${notasExtra}</span></li>`;
                    }
                    htmlCheck += `</ul></div>`;
                }
            }
            htmlCheck += `</div>`;
            document.getElementById('modal-text').innerHTML = htmlCheck;
            modalActions.innerHTML = `<button class="modal-btn-secondary" onclick="cerrarModalBtn()">Entendido</button>`;
            abrirModalCustom();
        }

        function abrirTriajeUrgencias(alertas) {
            document.getElementById('modal-icon').innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color: #EF4444;"></i>';
            document.getElementById('modal-title').innerText = DICCIONARIO[idiomaActual].triaje;
            let htmlAlertas = `
                <p class="text-xs text-slate-300 text-left mb-2">Pautas críticas ante sospecha de intoxicación o emergencia:</p>
                <div class="space-y-2 text-left my-2 max-h-56 overflow-y-auto pr-1">
            `;
            if (alertas && Array.isArray(alertas)) {
                alertas.forEach(al => {
                    htmlAlertas += `
                        <div class="bg-rose-950/40 border border-rose-800/80 p-2 rounded-xl text-xs text-rose-200 flex items-start gap-2">
                            <i class="fa-solid fa-skull-crossbones text-rose-400 mt-0.5"></i>
                            <span>${al}</span>
                        </div>
                    `;
                });
            }
            htmlAlertas += `</div><p class="text-[11px] text-amber-300 mt-2 font-bold text-center">⚠️ No induzcas el vómito sin autorización veterinaria expresa.</p>`;
            document.getElementById('modal-text').innerHTML = htmlAlertas;
            modalActions.innerHTML = `
                <button onclick="window.open('https://www.google.com/maps/search/hospital+veterinario+urgencias+24+horas/', '_blank')" class="modal-btn-primary" style="background: linear-gradient(135deg, #ef4444, #dc2626);">
                    <i class="fa-solid fa-hospital mr-1"></i> Urgencias Veterinarias 24h
                </button>
                <button class="modal-btn-secondary" onclick="cerrarModalBtn()">Cerrar</button>
            `;
            abrirModalCustom();
        }

        // ==========================================
        // RENDER DINÁMICO POLIMÓRFICO
        // ==========================================
        function renderMenu(data) {
            const menuContainer = document.getElementById('dynamic-menu');
            menuContainer.innerHTML = '';
            const t = DICCIONARIO[idiomaActual] || DICCIONARIO.es;

            // Revisar si el dueño cambió el teléfono
            const override = localStorage.getItem(`override_${clienteSlugGlobal}`);
            let telLlamada = "34672294962";
            if (override) {
                const d = JSON.parse(override);
                if (d.whatsapp) {
                    whatsappTiendaGlobal = d.whatsapp;
                    telLlamada = d.whatsapp.replace(/\D/g, '');
                }
            }

            if (data.secciones && Array.isArray(data.secciones)) {
                data.secciones.forEach((sec, sIdx) => {
                    if (sec.titulo) menuContainer.innerHTML += `<div class="section-title">${sec.titulo}</div>`;
                    const block = document.createElement('div');
                    block.className = 'apps-menu';

                    if (sec.botones && Array.isArray(sec.botones)) {
                        sec.botones.forEach((btn, bIdx) => {
                            const bTipo = (btn.tipo || '').toLowerCase();
                            const btnId = `btn_${sIdx}_${bIdx}`;

                            if (bTipo === 'asistencia_ruta') {
                                block.innerHTML += `
                                    <div onclick="abrirAsistenciaRuta()" role="button" class="app-btn ${btn.destacado ? 'destacado' : ''}">
                                        <div class="app-icon" style="${btn.estiloIcono || 'background: rgba(0, 229, 255, 0.2); color: #00E5FF;'}">
                                            <i class="${btn.icono || 'fa-solid fa-location-crosshairs'}"></i>
                                        </div>
                                        <div class="app-info">
                                            <div class="app-name">${t.gps}</div>
                                            <div class="app-desc">${btn.descripcion || ''}</div>
                                        </div>
                                        <i class="fa-solid fa-chevron-right text-zinc-500 text-xs"></i>
                                    </div>
                                `;
                            } else if (bTipo === 'carnet_vacunacion') {
                                window[btnId + '_data'] = btn.vacunas || [];
                                block.innerHTML += `
                                    <div onclick="abrirCarnetVacunacion(window['${btnId}_data'])" role="button" class="app-btn">
                                        <div class="app-icon" style="${btn.estiloIcono || 'background: rgba(56, 189, 248, 0.2); color: #38BDF8;'}">
                                            <i class="${btn.icono || 'fa-solid fa-shield-dog'}"></i>
                                        </div>
                                        <div class="app-info">
                                            <div class="app-name">${t.cartilla}</div>
                                            <div class="app-desc">${btn.descripcion || ''}</div>
                                        </div>
                                        <i class="fa-solid fa-chevron-right text-zinc-500 text-xs"></i>
                                    </div>
                                `;
                            } else if (bTipo === 'checklist_parto' || bTipo === 'checklist') {
                                window[btnId + '_data'] = btn.checklist || {};
                                block.innerHTML += `
                                    <div onclick="abrirChecklistClinico(window['${btnId}_data'])" role="button" class="app-btn">
                                        <div class="app-icon" style="${btn.estiloIcono || 'background: rgba(245, 158, 11, 0.2); color: #F59E0B;'}">
                                            <i class="${btn.icono || 'fa-solid fa-clipboard-list'}"></i>
                                        </div>
                                        <div class="app-info">
                                            <div class="app-name">${t.dieta}</div>
                                            <div class="app-desc">${btn.descripcion || ''}</div>
                                        </div>
                                        <i class="fa-solid fa-chevron-right text-zinc-500 text-xs"></i>
                                    </div>
                                `;
                            } else if (bTipo === 'triaje_urgencias') {
                                window[btnId + '_data'] = btn.alertas || [];
                                block.innerHTML += `
                                    <div onclick="abrirTriajeUrgencias(window['${btnId}_data'])" role="button" class="app-btn">
                                        <div class="app-icon" style="${btn.estiloIcono || 'background: rgba(239, 68, 68, 0.22); color: #EF4444;'}">
                                            <i class="${btn.icono || 'fa-solid fa-triangle-exclamation'}"></i>
                                        </div>
                                        <div class="app-info">
                                            <div class="app-name">${t.triaje}</div>
                                            <div class="app-desc">${btn.descripcion || ''}</div>
                                        </div>
                                        <i class="fa-solid fa-chevron-right text-zinc-500 text-xs"></i>
                                    </div>
                                `;
                            } else {
                                let finalUrl = btn.url || '#';
                                let btnNom = btn.nombre;

                                if (finalUrl.includes('tel:')) {
                                    finalUrl = `tel:${telLlamada}`;
                                    btnNom = t.llamar;
                                } else if (finalUrl.includes('wa.me')) {
                                    finalUrl = `${whatsappTiendaGlobal}?text=${encodeURIComponent(t.msgWa)}`;
                                    btnNom = t.wa;
                                }

                                block.innerHTML += `
                                    <a class="app-btn ${btn.destacado ? 'destacado' : ''}" href="${finalUrl}" ${finalUrl.startsWith('http') ? 'target="_blank"' : ''}>
                                        <div class="app-icon" style="${btn.estiloIcono || 'background: rgba(255,255,255,0.06); color: #fff;'}">
                                            <i class="${btn.icono || 'fa-solid fa-link'}"></i>
                                        </div>
                                        <div class="app-info">
                                            <div class="app-name">${btnNom}</div>
                                            <div class="app-desc">${btn.descripcion || ''}</div>
                                        </div>
                                        <i class="fa-solid fa-chevron-right text-zinc-500 text-xs"></i>
                                    </a>
                                `;
                            }
                        });
                    }
                    menuContainer.appendChild(block);
                });
            }
        }

        // ==========================================
        // MOTOR DE CARGA INICIAL
        // ==========================================
        async function cargarEnginePhygital() {
            const urlParams = new URLSearchParams(window.location.search);
            const clienteCod = (urlParams.get('cod') || urlParams.get('id') || 'toby').toLowerCase().trim();
            clienteSlugGlobal = clienteCod;

            let data = null;

            try {
                let res = await fetch(`./${clienteCod}.json?v=${Date.now()}`);
                if (!res.ok) res = await fetch(`../c/${clienteCod}.json?v=${Date.now()}`);
                if (!res.ok) res = await fetch(`./json/${clienteCod}.json?v=${Date.now()}`);
                if (res.ok) data = await res.json();
            } catch(e) {}

            if (!data) {
                try {
                    const urlGitHub = `https://raw.githubusercontent.com/83ortizmanuel-del/studio42-engine/main/c/${clienteCod}.json?v=${Date.now()}`;
                    const resGit = await fetch(urlGitHub);
                    if (resGit.ok) data = await resGit.json();
                } catch(e) {}
            }

            if (!data) {
                console.warn("No se pudo cargar:", clienteCod);
                splash.style.display = 'none';
                return;
            }

            datosPerfilGlobal = data;
            nombreNegocioGlobal = data.nombre || "Mascota";

            // WhatsApp inicial
            if (data.whatsapp && data.whatsapp.trim() !== "") {
                whatsappTiendaGlobal = data.whatsapp.split('?')[0];
            } else if (data.secciones) {
                data.secciones.forEach(sec => {
                    if (sec.botones) {
                        sec.botones.forEach(b => {
                            if (b.url && b.url.includes('wa.me') && !whatsappTiendaGlobal) {
                                whatsappTiendaGlobal = b.url.split('?')[0];
                            }
                        });
                    }
                });
            }

            // Branding
            const colorAcentoFinal = data.colorAcento || "#00E5FF";
            const colorPrincipalFinal = data.colorPrincipal || "#080E1A";
            document.documentElement.style.setProperty('--color-principal', colorPrincipalFinal);
            document.documentElement.style.setProperty('--color-acento', colorAcentoFinal);
            document.documentElement.style.setProperty('--halo-glow', colorAcentoFinal + '66');

            document.getElementById('page-title').innerText = `${data.nombre} | Pasaporte Phygital`;
            document.getElementById('client-name').innerText = data.nombre;
            document.getElementById('client-subtitle').innerText = data.subtitulo || "Pasaporte Canino";

            const logoImg = data.logo || "logo.png";
            document.getElementById('hub-logo').src = logoImg;
            document.getElementById('hub-logo').style.objectFit = "cover";
            document.getElementById('splash-logo').src = logoImg;

            renderMenu(data);
        }

        function iniciarMagia() {
            splash.style.opacity = '0';
            setTimeout(() => { splash.style.display = 'none'; }, 400);
        }

        document.addEventListener("DOMContentLoaded", cargarEnginePhygital);
    </script>

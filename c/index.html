<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Studio 42 | Ecosistema Phygital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --color-principal: #0F172A;
            --color-acento: #00E5FF;
            --color-fondo: #030712; 
            --color-tarjeta: rgba(15, 23, 42, 0.90); 
            --color-boton: rgba(30, 41, 59, 0.7); 
            --color-texto: #f8fafc;
            --color-gris: #94a3b8;
            --titanium-light: #f1f5f9;
            --titanium-glow: rgba(226, 232, 240, 0.4);
            --halo-glow: rgba(0, 229, 255, 0.5);
            --halo-intensity: 30px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: radial-gradient(circle at 50% 10%, var(--color-principal) 0%, var(--color-fondo) 85%);
            color: var(--color-texto); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; padding: 15px; user-select: none; overflow-x: hidden;
            transition: background 0.3s ease;
        }
        
        #splash-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            z-index: 10000; 
            display: none; 
            flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 0.4s ease; padding: 20px;
        }
        .btn-desbloqueo { 
            background: linear-gradient(135deg, var(--color-acento), #ffffff); color: #020617; border: none; 
            padding: 16px 36px; border-radius: 50px; font-size: 0.9rem; font-weight: 900; letter-spacing: 1.2px; 
            text-transform: uppercase; cursor: pointer; box-shadow: 0 0 30px var(--titanium-glow);
            transition: transform 0.2s ease;
        }
        .btn-desbloqueo:active { transform: scale(0.95); }

        .halo-wrapper {
            position: relative;
            width: 100%;
            max-width: 416px;
            border-radius: 34px;
            padding: 2px;
            overflow: hidden;
            margin: auto;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 var(--halo-intensity) var(--halo-glow);
            transition: box-shadow 0.3s ease;
        }

        .halo-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                transparent 0%, 
                transparent 40%, 
                var(--color-acento) 50%, 
                #ffffff 52%,
                var(--color-acento) 54%, 
                transparent 65%, 
                transparent 100%
            );
            animation: haloRotate 10s linear infinite;
            z-index: 0;
        }

        @keyframes haloRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hub-container { 
            background: var(--color-tarjeta); width: 100%; 
            border-radius: 32px; 
            padding: 26px 18px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.12); 
            backdrop-filter: blur(20px); position: relative; z-index: 1;
        }

        .status-badge { 
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(241, 245, 249, 0.06); border: 1px solid rgba(226, 232, 240, 0.2);
            padding: 6px 14px; border-radius: 50px; font-size: 0.65rem; font-weight: 800;
            letter-spacing: 1px; color: var(--titanium-light); margin-bottom: 16px; text-transform: uppercase;
        }
        .ping-light { 
            position: relative; width: 7px; height: 7px; background-color: var(--titanium-light);
            border-radius: 50%; box-shadow: 0 0 8px var(--titanium-light);
        }
        .ping-light::after { 
            content: ''; position: absolute; top: -3px; left: -3px; width: 13px; height: 13px;
            border-radius: 50%; background-color: var(--titanium-glow);
            animation: radarTitanium 2s infinite cubic-bezier(0, 0, 0.2, 1);
        }
        @keyframes radarTitanium { 
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(2.8); opacity: 0; }
        }
        
        .logo-container { 
            width: 86px; height: 86px; margin: 0 auto 12px auto; 
            border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.15); 
            overflow: hidden; background-color: #ffffff; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.08); position: relative; cursor: pointer;
        }
        .logo-container img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
        .edit-badge-logo {
            position: absolute; bottom: 3px; right: 3px; background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; width: 20px; height: 20px;
            display: flex; align-items: center; justify-content: center; font-size: 9px; color: #fff;
        }
        
        h1 { font-size: 1.25rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: #fff; }
        .propietario { color: var(--color-acento); font-size: 0.78rem; margin-bottom: 12px; font-weight: 700; letter-spacing: 0.8px; }

        .paciente-header-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--color-acento);
            border-radius: 18px;
            padding: 10px 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
        }
        
        .section-title { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.3px; color: var(--color-gris); margin: 20px 0 10px 6px; font-weight: 800; }
        
        .apps-menu { display: flex; flex-direction: column; gap: 11px; }
        .app-btn { 
            display: flex; align-items: center; padding: 13px 16px; border-radius: 20px; 
            background: var(--color-boton); border: 1px solid rgba(255, 255, 255, 0.07); 
            transition: all 0.2s ease; cursor: pointer; text-align: left; text-decoration: none; 
            backdrop-filter: blur(10px);
        }
        .app-btn:active { transform: scale(0.97); border-color: var(--color-acento); }
        .app-btn.destacado { 
            border: 1px solid var(--color-acento); 
            background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(15, 23, 42, 0.85));
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.15); 
        }
        .app-icon { width: 44px; height: 44px; border-radius: 14px; display: flex; justify-content: center; align-items: center; margin-right: 14px; font-size: 1.2rem; flex-shrink: 0; }
        .app-info { flex-grow: 1; }
        .app-name { font-size: 0.88rem; font-weight: 800; color: var(--color-texto); margin-bottom: 2px; }
        .app-desc { font-size: 0.72rem; color: var(--color-gris); }
        
        .stars-container { font-size: 2rem; margin-top: 10px; display: flex; justify-content: center; gap: 8px; width: 100%; }
        .star-rating i { cursor: pointer; transition: transform 0.2s ease, filter 0.2s ease; display: inline-block; }
        .star-rating i:active { transform: scale(1.3); }
        .star-active { color: #ffb400; text-shadow: 0 0 14px rgba(255, 180, 0, 0.7); }
        .star-inactive { color: #334155; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(2, 6, 23, 0.88); backdrop-filter: blur(14px); z-index: 10001; justify-content: center; align-items: center; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
        .modal-box { 
            background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.18); 
            border-radius: 28px; padding: 24px 20px 20px 20px; max-width: 380px; width: 100%; 
            text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.9); transform: translateY(20px); 
            transition: transform 0.3s ease; max-height: 88vh; overflow-y: auto; position: relative;
        }

        .modal-close-btn {
            position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 0.9rem; transition: all 0.2s ease; z-index: 60;
        }
        .modal-close-btn:hover { background: rgba(255, 255, 255, 0.18); color: #ffffff; }

        .modal-icon { font-size: 2.2rem; margin-bottom: 8px; }
        .modal-title { font-size: 1.1rem; font-weight: 900; color: #fff; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.8px; padding: 0 25px; }
        .modal-text { font-size: 0.82rem; color: #cbd5e1; line-height: 1.45; margin-bottom: 16px; }
        
        .modal-actions { display: flex; flex-direction: column; gap: 9px; }
        .modal-btn-primary { background: linear-gradient(135deg, #25D366, #128c7e); color: #fff; border: none; padding: 13px 18px; border-radius: 50px; font-weight: 800; font-size: 0.84rem; cursor: pointer; text-decoration: none; display: block; }
        .modal-btn-google { background: linear-gradient(135deg, #ffb400, #f59e0b); color: #020617; border: none; padding: 13px 18px; border-radius: 50px; font-weight: 900; font-size: 0.84rem; cursor: pointer; text-decoration: none; display: block; }
        .modal-btn-secondary { background: transparent; color: var(--color-gris); border: 1px solid rgba(255,255,255,0.15); padding: 10px 16px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; cursor: pointer; text-decoration: none; display: block; }

        .footer-brand { margin-top: 26px; font-size: 0.7rem; color: var(--color-gris); letter-spacing: 1.1px; }
        .footer-brand span { color: var(--titanium-light); font-weight: 800; }

        .top-controls-bar {
            position: absolute; top: 16px; left: 16px; right: 16px;
            display: flex; justify-content: space-between; align-items: center; z-index: 50;
        }
        .btn-top-control {
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--color-gris); display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 0.8rem; transition: all 0.2s;
        }
        .btn-top-control:active { transform: scale(0.9); }
        .btn-audio-toggle { display: none; }
        .btn-audio-toggle.active { color: var(--color-acento); border-color: var(--color-acento); }

        .lang-badge {
            font-size: 10px; font-weight: 900; letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--color-gris); border-radius: 50px; padding: 6px 10px; cursor: pointer;
            display: flex; align-items: center; gap: 5px;
        }
        .lang-badge:active { transform: scale(0.95); }

        .color-swatch {
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2); transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .color-swatch:active { transform: scale(1.15); border-color: #ffffff; }
    </style>
</head>
<body>

    <audio id="audio-fondo" loop preload="auto"></audio>

    <div id="splash-screen">
        <div class="logo-container" id="splash-logo-box" style="width: 100px; height: 100px; margin-bottom: 20px;">
            <img id="splash-logo" alt="Logo">
        </div>
        <h2 id="splash-title" style="color: #fff; font-size: 1.4rem; margin-bottom: 6px; letter-spacing: 2px; font-weight: 900;">STUDIO 42</h2>
        <p id="splash-subtitle" style="color: var(--color-gris); font-size: 0.85rem; margin-bottom: 30px; text-transform: uppercase;">Ecosistema Phygital</p>
        <button onclick="iniciarMagia()" class="btn-desbloqueo">Desbloquear Experiencia</button>
    </div>

    <div id="modal-overlay" class="modal-overlay" onclick="cerrarModal(event)">
        <div class="modal-box" id="modal-content">
            <button class="modal-close-btn" onclick="cerrarModalBtn()" title="Cerrar y volver"><i class="fa-solid fa-xmark"></i></button>
            <div id="modal-icon" class="modal-icon"></div>
            <div id="modal-title" class="modal-title"></div>
            <div id="modal-text" class="modal-text"></div>
            <div id="modal-actions" class="modal-actions">
                <button class="modal-btn-secondary" onclick="cerrarModalBtn()">Entendido</button>
            </div>
        </div>
    </div>

    <!-- WRAPPER CON HALO CONIC LUMINOSO -->
    <div class="halo-wrapper" id="main-halo">
        <div class="hub-container">
            
            <!-- BARRA DE CONTROLES: GESTIÓN MASCOTA, TEMA, IDIOMA Y MÚSICA -->
            <div class="top-controls-bar">
                <div class="flex items-center gap-2">
                    <button id="btn-edit-pet" class="btn-top-control" onclick="verificarAccesoPropietario()" title="Editar Ficha de la Mascota">
                        <i class="fa-solid fa-paw text-cyan-400"></i>
                    </button>
                    <button id="btn-theme-control" class="btn-top-control" onclick="abrirModalPersonalizacion()" title="Personalizar Interfaz">
                        <i class="fa-solid fa-palette"></i>
                    </button>
                    <div id="btn-lang-selector" class="lang-badge" onclick="rotarIdioma()" title="Cambiar Idioma">
                        <span id="lang-flag">🇪🇸</span> <span id="lang-code">ES</span>
                    </div>
                </div>

                <button id="btn-audio-control" class="btn-top-control btn-audio-toggle" onclick="alternarAudioManual()" title="Silenciar / Activar Música">
                    <i id="btn-audio-icon" class="fa-solid fa-volume-high"></i>
                </button>
            </div>

            <div class="status-badge" style="margin-top: 28px;">
                <span class="ping-light"></span>
                <span id="badge-text">NODO PHYGITAL CONECTADO · RED ACTIVA</span>
            </div>

            <!-- CONTENEDOR DE FOTO / LOGO -->
            <div class="logo-container" id="hub-logo-box" onclick="abrirCambiadorFoto()" title="Toca para cambiar la foto">
                <img id="hub-logo" alt="Logo">
                <div class="edit-badge-logo"><i class="fa-solid fa-camera"></i></div>
            </div>
            <input type="file" id="input-foto-upload" accept="image/*" class="hidden" onchange="procesarFotoSubida(event)">

            <h1 id="client-name">STUDIO 42</h1>
            <div class="propietario" id="client-subtitle">ECOSISTEMA PHYGITAL</div>

            <!-- TARJETA CABECERA OBSTÉTRICA -->
            <div id="card-paciente-header" class="paciente-header-card hidden">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-full bg-pink-500/20 text-pink-400 flex items-center justify-center text-sm">
                        <i class="fa-solid fa-person-pregnant"></i>
                    </div>
                    <div>
                        <div id="header-nombre-paciente" class="text-xs font-bold text-white">Mamá Segura</div>
                        <div id="header-datos-paciente" class="text-[10px] text-pink-300 font-mono">Semana Gestacional</div>
                    </div>
                </div>
                <button onclick="abrirFichaEmergenciaModal()" class="text-[10px] bg-white/10 hover:bg-white/20 text-zinc-300 px-2.5 py-1.5 rounded-lg border border-white/10">
                    <i class="fa-solid fa-notes-medical text-rose-400 mr-1"></i> Ficha SOS
                </button>
            </div>

            <div id="fricciones-section" style="display:none;">
                <div class="section-title">El Motor Phygital (Studio 42 Engine)</div>
                <div class="grid grid-cols-2 gap-2 mb-3" id="friccion-grid"></div>
            </div>

            <div id="dynamic-menu"></div>

            <div class="footer-brand">Desarrollado por <span>Studio 42</span></div>
        </div>
    </div>

    <script>
        // DICCIONARIO TRILINGÜE
        const DICCIONARIO = {
            es: {
                flag: "🇪🇸",
                badge: "NODO PHYGITAL CONECTADO · RED ACTIVA",
                resenaTitle: "¿Qué tal ha sido tu experiencia?",
                resenaSub: "Tu valoración nos ayuda a seguir mejorando cada día",
                resenaHint: "Toca las estrellas para calificar el servicio",
                conectarGoogle: "Conectando con Google Maps...",
                guardarCita: "Guardar Tu Cita",
                asistenciaRuta: "Puntos de Asistencia en Ruta",
                cerrar: "Cerrar",
                entendido: "Entendido",
                personalizar: "Personalizar Interfaz"
            },
            en: {
                flag: "🇬🇧",
                badge: "SMART PHYGITAL NODE · ACTIVE NETWORK",
                resenaTitle: "How was your experience?",
                resenaSub: "Your review helps us keep improving every day",
                resenaHint: "Tap the stars to rate the service",
                conectarGoogle: "Connecting to Google Maps...",
                guardarCita: "Save Your Appointment",
                asistenciaRuta: "Assistance Points on Route",
                cerrar: "Close",
                entendido: "Got it",
                personalizar: "Customize Interface"
            },
            fr: {
                flag: "🇫🇷",
                badge: "NŒUD PHYGITAL CONNECTÉ · RÉSEAU ACTIF",
                resenaTitle: "Comment s'est passée votre expérience ?",
                resenaSub: "Votre avis nous aide à nous améliorer chaque jour",
                resenaHint: "Appuyez sur les étoiles pour noter le service",
                conectarGoogle: "Connexion à Google Maps...",
                guardarCita: "Enregistrer Votre Rendez-vous",
                asistenciaRuta: "Points d'Assistance en Route",
                cerrar: "Fermer",
                entendido: "Compris",
                personalizar: "Personnaliser l'Interface"
            }
        };

        let idiomaActual = localStorage.getItem('user_lang') || 'es';
        let datosFriccionesGlobales = {};
        let googleReviewUrlGlobal = "https://maps.google.com";
        let whatsappGerenciaGlobal = "https://wa.me/34672294962";
        let whatsappComercialGlobal = "34945601573";
        let nombreNegocioGlobal = "Profesional";
        let whatsappMedicoGlobal = "";
        let timerTeleconsultaGlobal = null;
        let esNodoMaternal = false;
        let esSectorMascotaGlobal = false;
        let audioIniciadoPorUsuario = false;

        let alertasSemaforoGlobal = [];
        let checklistPartoGlobal = null;
        let vacunasCustomGlobal = null;

        let datosPagoGlobal = {
            pagoMovil: "",
            zelle: "",
            tarifa: "Honorarios Profesionales"
        };

        const reproductor = document.getElementById('audio-fondo');
        const splash = document.getElementById('splash-screen');

        function rotarIdioma() {
            if (idiomaActual === 'es') idiomaActual = 'en';
            else if (idiomaActual === 'en') idiomaActual = 'fr';
            else idiomaActual = 'es';

            localStorage.setItem('user_lang', idiomaActual);
            actualizarTextosIdioma();
        }

        function actualizarTextosIdioma() {
            const dataLang = DICCIONARIO[idiomaActual];
            document.getElementById('lang-flag').innerText = dataLang.flag;
            document.getElementById('lang-code').innerText = idiomaActual.toUpperCase();
            
            const badge = document.getElementById('badge-text');
            if (badge) badge.innerText = dataLang.badge;
        }

        function abrirCambiadorFoto() {
            document.getElementById('input-foto-upload').click();
        }

        function procesarFotoSubida(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Img = e.target.result;
                const urlParams = new URLSearchParams(window.location.search);
                const clienteCod = (urlParams.get('cod') || urlParams.get('id') || 'iberlax').toLowerCase().trim();

                document.getElementById('hub-logo').src = base64Img;
                document.getElementById('splash-logo').src = base64Img;
                localStorage.setItem(`custom_photo_${clienteCod}`, base64Img);
            };
            reader.readAsDataURL(file);
        }

        // ========================================================
        // GESTIÓN Y RECUPERACIÓN CON DOBLE CANDADO
        // ========================================================
        function verificarAccesoPropietario() {
            const urlParams = new URLSearchParams(window.location.search);
            const clienteCod = (urlParams.get('cod') || urlParams.get('id') || 'iberlax').toLowerCase().trim();
            const pinGuardado = localStorage.getItem(`pet_pin_${clienteCod}`);

            if (!pinGuardado) {
                abrirFormularioDatosMascota();
            } else {
                document.getElementById('modal-icon').innerHTML = '<i class="fa-solid fa-lock text-cyan-400"></i>';
                document.getElementById('modal-title').innerText = "Acceso Propietario";
                document.getElementById('modal-text').innerHTML = `
                    <p class="text-xs text-zinc-300 mb-3">Introduce tu PIN de 4 dígitos para editar la ficha:</p>
                    <input type="password" id="input-pin-auth" maxlength="4" placeholder="••••" class="w-32 mx-auto p-2.5 rounded-xl bg-slate-900 border border-white/20 text-white font-mono text-center text-lg font-bold tracking-widest mb-3">
                    <div>
                        <button onclick="solicitarRecuperacionPIN('${clienteCod}')" class="text-[11px] text-cyan-400 underline bg-transparent border-none cursor-pointer">
                            ¿Olvidaste tu clave?
                        </button>
                    </div>
                `;
                modalActions.innerHTML = `
                    <button class="modal-btn-primary bg-cyan-600 hover:bg-cyan-500 font-bold" onclick="validarPINPropietario('${pinGuardado}')">Acceder a Edición</button>
                    <button class="modal-btn-secondary" onclick="cerrarModalBtn()">${DICCIONARIO[idiomaActual].cerrar}</button>
                `;
                abrirModalCustom();
            }
        }

        function validarPINPropietario(pinReal) {
            const pinIngresado = document.getElementById('input-pin-auth').value.trim();
            if (pinIngresado === pinReal) {
                abrirFormularioDatosMascota();
            } else {
                alert("PIN incorrecto. Inténtalo de nuevo.");
            }
        }

        function solicitarRecuperacionPIN(clienteCod) {
            const telGuardado = localStorage.getItem(`pet_tel_${clienteCod}`);
            const chipGuardado = localStorage.getItem(`pet_chip_${clienteCod}`);

            document.getElementById('modal-icon').innerHTML = '<i class="fa-solid fa-shield-halved text-amber-400"></i>';
            document.getElementById('modal-title').innerText = "Doble Validación SOS";
            document.getElementById('modal-text').innerHTML = `
                <p class="text-xs text-zinc-300 mb-3">Por seguridad, confirma ambos datos para restablecer el acceso:</p>
                <div class="space-y-2 text-left text-xs mb-3">
                    <div>
                        <label class="block text-[10px] text-zinc-400 font-bold mb-1">1. Teléfono móvil registrado:</label>
                        <input type="tel" id="input-recuperar-tel" placeholder="Ej: 672294962" class="w-full p-2 rounded-xl bg-slate-900 border border-white/20 text-white font-mono text-center font-bold">
                    </div>
                    <div>
                        <label class="block text-[10px] text-zinc-400 font-bold mb-1">2. Últimos 4 dígitos del Microchip:</label>
                        <input type="text" id="input-recuperar-chip" maxlength="4" placeholder="Ej: 2911" class="w-full p-2 rounded-xl bg-slate-900 border border-white/20 text-white font-mono text-center font-bold">
                    </div>
                </div>

        function obtenerFrutoGestacional(semanas) {
            if (semanas < 6) return { nombre: "una semilla de amapola", icono: "🌱", tam: "2 mm" };
            if (semanas <= 7) return { nombre: "un arándano silvestre", icono: "🫐", tam: "1 cm" };
            if (semanas === 8) return { nombre: "una frambuesa", icono: "🍓", tam: "1.6 cm" };
            if (semanas <= 10) return { nombre: "una fresa dulce", icono: "🍓", tam: "3 cm" };
            if (semanas <= 12) return { nombre: "una ciruela", icono: "🍑", tam: "5.4 cm" };
            if (semanas <= 15) return { nombre: "un melocotón", icono: "🍑", tam: "10 cm" };
            if (semanas <= 19) return { nombre: "un aguacate", icono: "🥑", tam: "15 cm" };
            if (semanas <= 24) return { nombre: "una mazorca de maíz", icono: "🌽", tam: "30 cm" };
            if (semanas <= 28) return { nombre: "una berenjena", icono: "🍆", tam: "37 cm" };
            if (semanas <= 34) return { nombre: "una piña tropical", icono: "🍍", tam: "45 cm" };
            return { nombre: "una sandía dulce", icono: "🍉", tam: "50 cm" };
        }

        function calcularDiasGestacion(fechaStr) {
            if (!fechaStr) return -1;
            const partes = fechaStr.split('-');
            const fur = new Date(partes[0], partes[1] - 1, partes[2]);
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            return Math.floor((hoy - fur) / (1000 * 60 * 60 * 24));
        }

        function generarEventoCalendario(formato) {
            const motivo = document.getElementById('cal-motivo').value;
            const fecha = document.getElementById('cal-fecha').value;
            const hora = document.getElementById('cal-hora').value;

            if (!fecha || !hora) return alert("Por favor selecciona una fecha y hora válidas.");

            const duracionMinutos = 45;
            const titulo = `Cita: ${motivo} - ${nombreNegocioGlobal}`;
            const ubicacion = `${nombreNegocioGlobal}`;
            const descripcion = `Cita programada en ${nombreNegocioGlobal}. Por favor acude 5 minutos antes.`;

            const dataInicio = new Date(`${fecha}T${hora}:00`);
            const dataFin = new Date(dataInicio.getTime() + (duracionMinutos * 60 * 1000));

            const formatToICSValue = (date) => {
                const pad = (n) => (n < 10 ? '0' + n : n);
                return date.getUTCFullYear() +
                       pad(date.getUTCMonth() + 1) +
                       pad(date.getUTCDate()) + 'T' +
                       pad(date.getUTCHours()) +
                       pad(date.getUTCMinutes()) +
                       pad(date.getUTCSeconds()) + 'Z';
            };

            if (formato === 'google') {
                const urlGoogle = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(titulo)}&dates=${formatToICSValue(dataInicio)}/${formatToICSValue(dataFin)}&details=${encodeURIComponent(descripcion)}&location=${encodeURIComponent(ubicacion)}&sf=true&output=xml`;
                window.open(urlGoogle, '_blank');
                cerrarModalBtn();
            } else {
                const icsContent = [
                    'BEGIN:VCALENDAR',
                    'VERSION:2.0',
                    'PRODID:-//Studio 42//Ecosistema Phygital//ES',
                    'CALSCALE:GREGORIAN',
                    'METHOD:PUBLISH',
                    'BEGIN:VEVENT',
                    `SUMMARY:${titulo}`,
                    `DESCRIPTION:${descripcion.replace(/\n/g, '\\n')}`,
                    `LOCATION:${ubicacion}`,
                    `DTSTART:${formatToICSValue(dataInicio)}`,
                    `DTEND:${formatToICSValue(dataFin)}`,
                    'STATUS:CONFIRMED',
                    'SEQUENCE:0',
                    'BEGIN:VALARM',
                    'TRIGGER:-P1D',
                    'ACTION:DISPLAY',
                    'DESCRIPTION:Recordatorio de Cita',
                    'END:VALARM',
                    'BEGIN:VALARM',
                    'TRIGGER:-PT2H',
                    'ACTION:DISPLAY',
                    'DESCRIPTION:Tu cita es en 2 horas',
                    'END:VALARM',
                    'END:VEVENT',
                    'END:VCALENDAR'
                ].join('\r\n');

                const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

                if (isIOS) {
                    const reader = new FileReader();
                    reader.onloadend = function () { window.open(reader.result, '_blank'); };
                    reader.readAsDataURL(blob);
                } else {
                    const link = document.createElement('a');
                    link.href = window.URL.createObjectURL(blob);
                    link.setAttribute('download', `cita-${nombreNegocioGlobal.toLowerCase().replace(/[^a-z0-9]/g, '_')}.ics`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
                cerrarModalBtn();
            }
        }

        function actualizarInterfazParking() {
            const lat = localStorage.getItem('parking_lat');
            const iconBox = document.getElementById('parking-icon-container');
            const icon = document.getElementById('parking-icon');
            const title = document.getElementById('parking-name');
            const desc = document.getElementById('parking-desc');

            if (!iconBox || !icon) return;
            if (lat) {
                iconBox.style.background = "rgba(226, 232, 240, 0.2)";
                iconBox.style.color = "var(--titanium-light)";
                icon.className = "fa-solid fa-person-walking";
                if(title) { title.innerText = "Volver a mi coche (Ruta GPS)"; title.style.color = "var(--titanium-light)"; }
                if(desc) desc.innerText = "Toca para abrir Maps y volver a pie";
            } else {
                iconBox.style.background = "rgba(142,142,147,0.1)";
                iconBox.style.color = "#8e8e93";
                icon.className = "fa-solid fa-location-crosshairs";
                if(title) { title.innerText = "¿Dónde aparqué?"; title.style.color = "var(--color-texto)"; }
                if(desc) desc.innerText = "Guarda tu coche al llegar";
            }
        }

        function gestionarParking(e) {
            if (e) e.preventDefault();
            const lat = localStorage.getItem('parking_lat');
            const lng = localStorage.getItem('parking_lng');

            if (lat && lng) {
                window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`, '_blank');
                localStorage.removeItem('parking_lat');
                localStorage.removeItem('parking_lng');
                actualizarInterfazParking();
            } else {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            localStorage.setItem('parking_lat', pos.coords.latitude);
                            localStorage.setItem('parking_lng', pos.coords.longitude);
                            actualizarInterfazParking();
                            alert("📍 ¡Ubicación guardada! Al salir pulsa este botón para volver a pie a tu coche.");
                        },
                        () => alert("No se pudo obtener la señal GPS."),
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                } else {
                    alert("Tu móvil no soporta geolocalización.");
                }
            }
        }

        function toggleVacuna(id) {
            if ("vibrate" in navigator) {
                try { navigator.vibrate(30); } catch(e) {}

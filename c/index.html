<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Studio 42 | Ecosistema Phygital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --color-principal: #0F172A;
            --color-acento: #00E5FF;
            --color-fondo: #030712; 
            --color-tarjeta: rgba(15, 23, 42, 0.88); 
            --color-boton: rgba(30, 41, 59, 0.7); 
            --color-texto: #f8fafc;
            --color-gris: #94a3b8;
            --titanium-light: #f1f5f9;
            --titanium-glow: rgba(226, 232, 240, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: radial-gradient(circle at 50% 10%, var(--color-principal) 0%, var(--color-fondo) 85%);
            color: var(--color-texto); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; padding: 15px; user-select: none; overflow-x: hidden;
        }
        
        #splash-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 0.5s ease; padding: 20px;
        }
        .btn-desbloqueo { 
            background: linear-gradient(135deg, var(--color-acento), #ffffff); color: #020617; border: none; 
            padding: 16px 36px; border-radius: 50px; font-size: 0.9rem; font-weight: 900; letter-spacing: 1.2px; 
            text-transform: uppercase; cursor: pointer; box-shadow: 0 0 30px var(--titanium-glow);
            transition: transform 0.2s ease;
        }
        .btn-desbloqueo:active { transform: scale(0.95); }

        .hub-container { 
            background: var(--color-tarjeta); width: 100%; max-width: 410px; 
            border-radius: 32px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95); 
            padding: 26px 18px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.12); 
            backdrop-filter: blur(20px); position: relative; margin: auto;
        }

        .status-badge { 
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(241, 245, 249, 0.06); border: 1px solid rgba(226, 232, 240, 0.2);
            padding: 6px 14px; border-radius: 50px; font-size: 0.65rem; font-weight: 800;
            letter-spacing: 1px; color: var(--titanium-light); margin-bottom: 16px; text-transform: uppercase;
        }
        .ping-light { 
            position: relative; width: 7px; height: 7px; background-color: var(--titanium-light);
            border-radius: 50%; box-shadow: 0 0 8px var(--titanium-light);
        }
        .ping-light::after { 
            content: ''; position: absolute; top: -3px; left: -3px; width: 13px; height: 13px;
            border-radius: 50%; background-color: var(--titanium-glow);
            animation: radarTitanium 2s infinite cubic-bezier(0, 0, 0.2, 1);
        }
        @keyframes radarTitanium { 
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(2.8); opacity: 0; }
        }
        
        .logo-container { 
            width: 86px; height: 86px; margin: 0 auto 12px auto; 
            border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.15); 
            overflow: hidden; background-color: #ffffff; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
        }
        .logo-container img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
        
        h1 { font-size: 1.4rem; font-weight: 900; letter-spacing: 1.1px; text-transform: uppercase; color: #fff; }
        .propietario { color: var(--color-acento); font-size: 0.78rem; margin-bottom: 12px; font-weight: 700; letter-spacing: 0.8px; }

        .paciente-header-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(217, 136, 138, 0.35);
            border-radius: 18px;
            padding: 10px 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
        }
        
        .section-title { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.3px; color: var(--color-gris); margin: 20px 0 10px 6px; font-weight: 800; }
        
        .apps-menu { display: flex; flex-direction: column; gap: 11px; }
        .app-btn { 
            display: flex; align-items: center; padding: 13px 16px; border-radius: 20px; 
            background: var(--color-boton); border: 1px solid rgba(255, 255, 255, 0.07); 
            transition: all 0.2s ease; cursor: pointer; text-align: left; text-decoration: none; 
            backdrop-filter: blur(10px);
        }
        .app-btn:active { transform: scale(0.97); border-color: var(--color-acento); }
        .app-btn.destacado { 
            border: 1px solid var(--color-acento); 
            background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(15, 23, 42, 0.85));
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.15); 
        }
        .app-icon { width: 44px; height: 44px; border-radius: 14px; display: flex; justify-content: center; align-items: center; margin-right: 14px; font-size: 1.2rem; flex-shrink: 0; }
        .app-info { flex-grow: 1; }
        .app-name { font-size: 0.88rem; font-weight: 800; color: var(--color-texto); margin-bottom: 2px; }
        .app-desc { font-size: 0.72rem; color: var(--color-gris); }
        
        /* ESTRELLAS RESEÑAS */
        .stars-container { font-size: 2rem; margin-top: 10px; display: flex; justify-content: center; gap: 8px; width: 100%; }
        .star-rating i { cursor: pointer; transition: transform 0.2s; }
        .star-rating i:active { transform: scale(1.3); }
        .star-active { color: #ffb400; text-shadow: 0 0 14px rgba(255, 180, 0, 0.7); }
        .star-inactive { color: #334155; }

        /* MODALES */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(2, 6, 23, 0.88); backdrop-filter: blur(14px); z-index: 10001; justify-content: center; align-items: center; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
        .modal-box { background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 28px; padding: 22px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.9); transform: translateY(20px); transition: transform 0.3s ease; max-height: 90vh; overflow-y: auto; }
        .modal-icon { font-size: 2.2rem; margin-bottom: 10px; }
        .modal-title { font-size: 1.1rem; font-weight: 900; color: #fff; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.8px; }
        .modal-text { font-size: 0.82rem; color: #cbd5e1; line-height: 1.45; margin-bottom: 16px; }
        
        .modal-actions { display: flex; flex-direction: column; gap: 9px; }
        .modal-btn-primary { background: linear-gradient(135deg, #25D366, #128c7e); color: #fff; border: none; padding: 13px 18px; border-radius: 50px; font-weight: 800; font-size: 0.84rem; cursor: pointer; text-decoration: none; display: block; }
        .modal-btn-google { background: linear-gradient(135deg, #ffb400, #f59e0b); color: #020617; border: none; padding: 13px 18px; border-radius: 50px; font-weight: 900; font-size: 0.84rem; cursor: pointer; text-decoration: none; display: block; }
        .modal-btn-secondary { background: transparent; color: var(--color-gris); border: 1px solid rgba(255,255,255,0.15); padding: 10px 16px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; cursor: pointer; text-decoration: none; display: block; }

        .footer-brand { margin-top: 26px; font-size: 0.7rem; color: var(--color-gris); letter-spacing: 1.1px; }
        .footer-brand span { color: var(--titanium-light); font-weight: 800; }
    </style>
</head>
<body>

    <audio id="audio-fondo" loop preload="auto"></audio>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="logo-container" id="splash-logo-box" style="width: 100px; height: 100px; margin-bottom: 20px;">
            <img id="splash-logo" alt="Logo">
        </div>
        <h2 id="splash-title" style="color: #fff; font-size: 1.4rem; margin-bottom: 6px; letter-spacing: 2px; font-weight: 900;">STUDIO 42</h2>
        <p id="splash-subtitle" style="color: var(--color-gris); font-size: 0.85rem; margin-bottom: 30px; text-transform: uppercase;">Ecosistema Phygital</p>
        <button onclick="iniciarMagia()" class="btn-desbloqueo">Desbloquear Experiencia</button>
    </div>

    <!-- MODAL GENERAL / INTERACTIVO -->
    <div id="modal-overlay" class="modal-overlay" onclick="cerrarModal(event)">
        <div class="modal-box" id="modal-content">
            <div id="modal-icon" class="modal-icon"></div>
            <div id="modal-title" class="modal-title"></div>
            <div id="modal-text" class="modal-text"></div>
            <div id="modal-actions" class="modal-actions">
                <button class="modal-btn-secondary" onclick="cerrarModalBtn()">Entendido</button>
            </div>
        </div>
    </div>

    <!-- HUB PRINCIPAL -->
    <div class="hub-container">
        <div class="status-badge">
            <span class="ping-light"></span>
            <span id="badge-text">NODO PHYGITAL CONECTADO · RED ACTIVA</span>
        </div>

        <div class="logo-container" id="hub-logo-box"><img id="hub-logo" alt="Logo"></div>
        <h1 id="client-name">STUDIO 42</h1>
        <div class="propietario" id="client-subtitle">ECOSISTEMA PHYGITAL</div>

        <!-- TARJETA PACIENTE CABECERA (SOLO EN MODO MATERNAL) -->
        <div id="card-paciente-header" class="paciente-header-card hidden">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-pink-500/20 text-pink-400 flex items-center justify-center text-sm">
                    <i class="fa-solid fa-person-pregnant"></i>
                </div>
                <div>
                    <div id="header-nombre-paciente" class="text-xs font-bold text-white">Mamá Segura</div>
                    <div id="header-datos-paciente" class="text-[10px] text-pink-300 font-mono">Semana Gestacional</div>
                </div>
            </div>
            <button onclick="abrirFichaEmergenciaModal()" class="text-[10px] bg-white/10 hover:bg-white/20 text-zinc-300 px-2.5 py-1.5 rounded-lg border border-white/10">
                <i class="fa-solid fa-notes-medical text-rose-400 mr-1"></i> Ficha SOS
            </button>
        </div>

        <!-- MODO DEMO COMERCIAL -->
        <div id="fricciones-section" style="display:none;">
            <div class="section-title">El Motor Phygital (Studio 42 Engine)</div>
            <div class="grid grid-cols-2 gap-2 mb-3" id="friccion-grid"></div>
        </div>

        <!-- RENDER DINÁMICO DE SECCIONES Y HERRAMIENTAS -->
        <div id="dynamic-menu"></div>

        <div class="footer-brand">Desarrollado por <span>Studio 42</span></div>
    </div>

    <script>
        let datosFriccionesGlobales = {};
        let googleReviewUrlGlobal = "https://maps.google.com";
        let whatsappGerenciaGlobal = "https://wa.me/34672294962";
        let whatsappComercialGlobal = "34945601573";
        let nombreNegocioGlobal = "Profesional";
        let whatsappMedicoGlobal = "";
        let timerTeleconsultaGlobal = null;
        let esNodoMaternal = false;

        let datosPagoGlobal = {
            pagoMovil: "",
            zelle: "",
            tarifa: "Honorarios Teleconsulta"
        };

        const reproductor = document.getElementById('audio-fondo');
        const splash = document.getElementById('splash-screen');

        function obtenerFrutoGestacional(semanas) {
            if (semanas < 6) return { nombre: "una semilla de amapola", icono: "🌱", tam: "2 mm" };
            if (semanas <= 7) return { nombre: "un arándano silvestre", icono: "🫐", tam: "1 cm" };
            if (semanas === 8) return { nombre: "una frambuesa", icono: "🍓", tam: "1.6 cm" };
            if (semanas <= 10) return { nombre: "una fresa dulce", icono: "🍓", tam: "3 cm" };
            if (semanas <= 12) return { nombre: "una ciruela", icono: "🍑", tam: "5.4 cm" };
            if (semanas <= 15) return { nombre: "un melocotón", icono: "🍑", tam: "10 cm" };
            if (semanas <= 19) return { nombre: "un aguacate", icono: "🥑", tam: "15 cm" };
            if (semanas <= 24) return { nombre: "una mazorca de maíz", icono: "🌽", tam: "30 cm" };
            if (semanas <= 28) return { nombre: "una berenjena", icono: "🍆", tam: "37 cm" };
            if (semanas <= 34) return { nombre: "una piña tropical", icono: "🍍", tam: "45 cm" };
            return { nombre: "una sandía dulce", icono: "🍉", tam: "50 cm" };
        }

        function calcularDiasGestacion(fechaStr) {
            if (!fechaStr) return -1;
            const partes = fechaStr.split('-');
            const fur = new Date(partes[0], partes[1] - 1, partes[2]);
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            return Math.floor((hoy - fur) / (1000 * 60 * 60 * 24));
        }

        async function cargarEnginePhygital() {
            const urlParams = new URLSearchParams(window.location.search);
            const clienteCod = (urlParams.get('cod') || urlParams.get('id') || 'demo').toLowerCase().trim();

            try {
                let response = await fetch(`./${clienteCod}.json?v=${Date.now()}`);
                if (!response.ok) response = await fetch(`./json/${clienteCod}.json?v=${Date.now()}`);
                if (!response.ok) throw new Error(`No se encontró ${clienteCod}.json`);

                const data = await response.json();
                nombreNegocioGlobal = data.nombre || "Profesional";

                esNodoMaternal = false;
                document.getElementById('card-paciente-header').classList.add('hidden');

                if (data.colorPrincipal) document.documentElement.style.setProperty('--color-principal', data.colorPrincipal);
                if (data.colorAcento) document.documentElement.style.setProperty('--color-acento', data.colorAcento);

                if (data.datosPago) {
                    datosPagoGlobal = { ...datosPagoGlobal, ...data.datosPago };
                }

                document.getElementById('page-title').innerText = `${nombreNegocioGlobal} | Identidad Digital`;
                document.getElementById('splash-title').innerText = nombreNegocioGlobal;
                document.getElementById('client-name').innerText = nombreNegocioGlobal;
                
                const subtituloText = data.subtitulo || 'Ecosistema Phygital';
                document.getElementById('splash-subtitle').innerText = subtituloText;
                document.getElementById('client-subtitle').innerText = subtituloText;

                if (data.textoBadge) document.getElementById('badge-text').innerText = data.textoBadge;

                const logoPath = data.logo && data.logo.trim() !== "" ? data.logo : "logo.png";
                document.getElementById('splash-logo').src = logoPath;
                document.getElementById('hub-logo').src = logoPath;

                if (data.audioFondo) reproductor.src = data.audioFondo;

                // MODO DEMO
                const seccionFricciones = document.getElementById('fricciones-section');
                if (data.modoDemo === true) {
                    seccionFricciones.style.display = 'block';
                    datosFriccionesGlobales = {
                        'contactos': { icono: '<i class="fa-solid fa-user-check text-cyan-400"></i>', titulo: 'Retención Inmediata', texto: 'El 70% de clientes no guarda números manualmente.<br><br><b>Solución:</b> Descarga directa de vCard al móvil en 1 toque.' },
                        'resenas': { icono: '<i class="fa-solid fa-shield-halved text-rose-500"></i>', titulo: 'Escudo de Reputación', texto: 'Las quejas públicas en Google alejan clientes.<br><br><b>Solución:</b> Intercepta valoraciones bajas (1-3★) directo a WhatsApp privado.' },
                        'herramientas': { icono: '<i class="fa-solid fa-toolbox text-amber-400"></i>', titulo: 'Herramientas de Valor', texto: 'Herramientas interactivas y asesoramiento táctil que resuelven dudas en mostrador en 10 segundos.' },
                        'facturacion': { icono: '<i class="fa-solid fa-bolt text-purple-400"></i>', titulo: 'Facturación Directa', texto: 'Llamados a la acción para agendar y canjear promociones de forma directa.' }
                    };

                    document.getElementById('friccion-grid').innerHTML = `
                        <div class="bg-slate-800/80 p-3 rounded-2xl border border-white/5 cursor-pointer text-center" onclick="mostrarExplicacion('contactos')"><i class="fa-solid fa-user-xmark text-cyan-400 text-xl mb-1"></i><div class="text-[11px] font-bold">Fuga Contactos</div></div>
                        <div class="bg-slate-800/80 p-3 rounded-2xl border border-white/5 cursor-pointer text-center" onclick="mostrarExplicacion('resenas')"><i class="fa-solid fa-star-half-stroke text-rose-500 text-xl mb-1"></i><div class="text-[11px] font-bold">Reputación</div></div>
                        <div class="bg-slate-800/80 p-3 rounded-2xl border border-white/5 cursor-pointer text-center" onclick="mostrarExplicacion('herramientas')"><i class="fa-solid fa-toolbox text-amber-400 text-xl mb-1"></i><div class="text-[11px] font-bold">Herramientas</div></div>
                        <div class="bg-slate-800/80 p-3 rounded-2xl border border-white/5 cursor-pointer text-center" onclick="mostrarExplicacion('facturacion')"><i class="fa-solid fa-bolt text-purple-400 text-xl mb-1"></i><div class="text-[11px] font-bold">Facturación</div></div>
                    `;
                } else {
                    seccionFricciones.style.display = 'none';
                }

                // Render Dinámico
                const menuContainer = document.getElementById('dynamic-menu');
                menuContainer.innerHTML = '';

                if (data.secciones && Array.isArray(data.secciones)) {
                    data.secciones.forEach(sec => {
                        if (sec.titulo) menuContainer.innerHTML += `<div class="section-title">${sec.titulo}</div>`;
                        const block = document.createElement('div');
                        block.className = 'apps-menu';

                        if (sec.urlGoogleResenas) googleReviewUrlGlobal = sec.urlGoogleResenas;
                        if (sec.whatsappGerencia) whatsappGerenciaGlobal = sec.whatsappGerencia;

                        if (sec.escudoResenas) {
                            block.innerHTML += `
                                <div class="app-btn flex-col items-center p-5 border border-amber-400/35 bg-gradient-to-b from-amber-500/10 to-transparent cursor-default rounded-3xl shadow-lg shadow-amber-500/5">
                                    <div class="w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-2xl mb-2 shadow-inner">
                                        <i class="fa-solid fa-medal"></i>
                                    </div>
                                    <div class="app-name text-center text-white text-base font-extrabold mb-0.5">¿Qué tal cuidamos de tu descanso?</div>
                                    <div class="text-xs text-amber-200/80 text-center font-medium mb-2">Tu valoración nos ayuda a seguir mejorando cada día</div>
                                    
                                    <div class="stars-container star-rating my-1" id="escudo-estrellas">
                                        <i class="fa-solid fa-star star-inactive text-3xl" onclick="simularFiltro(1)"></i>
                                        <i class="fa-solid fa-star star-inactive text-3xl" onclick="simularFiltro(2)"></i>
                                        <i class="fa-solid fa-star star-inactive text-3xl" onclick="simularFiltro(3)"></i>
                                        <i class="fa-solid fa-star star-inactive text-3xl" onclick="simularFiltro(4)"></i>
                                        <i class="fa-solid fa-star star-inactive text-3xl" onclick="simularFiltro(5)"></i>
                                    </div>
                                    <p class="text-[11px] text-zinc-400 text-center mt-1">Toca las estrellas para calificar tu experiencia</p>
                                    <p id="mensaje-filtro" class="text-xs text-cyan-300 text-center w-full mt-2 font-bold hidden animate-pulse">Conectando con Google Maps...</p>
                                </div>
                            `;
                        } else if (sec.botones && Array.isArray(sec.botones)) {
                            sec.botones.forEach(btn => {
                                const btnNombre = (btn.nombre || "").toLowerCase();
                                const btnTipo = (btn.tipo || "").toLowerCase();

                                if (btn.url && btn.url.includes('wa.me/')) {
                                    const match = btn.url.match(/wa\.me\/([0-9]+)/);
                                    if (match && match[1]) {
                                        whatsappComercialGlobal = match[1];
                                        if (!whatsappMedicoGlobal) whatsappMedicoGlobal = match[1];
                                    }
                                }

                                if (btnTipo === 'calculadora_embarazo' || btnTipo === 'teleconsulta_triaje') {
                                    esNodoMaternal = true;
                                }

                                // 0. TEST DE DESGASTE / FATIGA DEL COLCHÓN (NUEVO)
                                if (btnTipo === 'test_desgaste' || btnNombre.includes('fatiga') || btnNombre.includes('desgaste')) {
                                    block.innerHTML += `
                                        <div class="app-btn ${btn.destacado ? 'destacado' : ''}" onclick="abrirTestDesgaste()">
                                            <div class="app-icon" style="${btn.estiloIcono || 'background: rgba(255, 180, 0, 0.15); color: #FFB400;'}">
                                                <i class="${btn.icono || 'fa-solid fa-microscope'}"></i>
                                            </div>
                                            <div class="app-info">
                                                <div class="app-name">${btn.nombre}</div>
                                                <div class="app-desc">${btn.descripcion || ''}</div>
                                            </div>
                                            <i class="fa-solid fa-chevron-right text-zinc-500 text-xs"></i>
                                        </div>
                                    `;
                                }
                                // 1. TEST ERGONÓMICO
                                else if (btnTipo === 'test_ergonomico' || btnNombre.includes('ergonómico') || btnNombre.includes('ergonomico')) {
                                    block.innerHTML += `
                                        <div class="app-btn" onclick="abrirTestErgonomico()">
                                            <div class="app-icon" style="${btn.estiloIcono || 'background: rgba(0, 168, 232, 0.15); color: #00A8E8;'}">
                                                <i class="${btn.icono || 'fa-solid fa-bed-pulse'}"></i>
                                            </div>
                                            <div class="app-info">
                                                <div class="app-name">${btn.nombre}</div>
                                                <div class="app-desc">${btn.descripcion || ''}</div>
                                            </div>
                                            <i class="fa-solid fa-chevron-right text-zinc-500 text-xs"></i>
                                        </div>
                                    `;
                                } 
                                // 2. TASADOR LOGÍSTICA
                                else if (btnTipo === 'tasador_retirada' || btnNombre.includes('tasador') || btnNombre.includes('retirada') || btnNombre.includes('logística')) {
                                    block.innerHTML += `
                                        <div class="app-btn" onclick="abrirTasadorRetirada()">
                                            <div class="app-icon" style="${btn.estiloIcono || 'background: rgba(48, 209, 88, 0.15); color: #30d158;'}">
                                                <i class="${btn.icono || 'fa-solid fa-truck-ramp-box'}"></i>
                                            </div>
                                            <div class="app-info">
                                                <div class="app-name">${btn.nombre}</div>
                                                <div class="app-desc">${btn.descripcion || ''}</div>
                                            </div>
                                            <i class="fa-solid fa-chevron-right text-zinc-500 text-xs"></i>
                                        </div>
                                    `;
                                }
                                // 3. PARKING GPS
                                else if (btnTipo === 'parking' || btnNombre.includes('aparqué') || btnNombre.includes('aparque')) {
                                    block.innerHTML += `
                                        <div onclick="gestionarParking(event)" class="app-btn" id="btn-parking">

        function actualizarInterfazParking() {
            const lat = localStorage.getItem('parking_lat');
            const iconBox = document.getElementById('parking-icon-container');
            const icon = document.getElementById('parking-icon');
            const title = document.getElementById('parking-name');
            const desc = document.getElementById('parking-desc');

            if (!iconBox || !icon) return;
            if (lat) {
                iconBox.style.background = "rgba(226, 232, 240, 0.2)";
                iconBox.style.color = "var(--titanium-light)";
                icon.className = "fa-solid fa-person-walking";
                if(title) { title.innerText = "Volver a mi coche (Ruta GPS)"; title.style.color = "var(--titanium-light)"; }
                if(desc) desc.innerText = "Toca para abrir Maps y volver a pie";
            } else {
                iconBox.style.background = "rgba(142,142,147,0.1)";
                iconBox.style.color = "#8e8e93";
                icon.className = "fa-solid fa-location-crosshairs";
                if(title) { title.innerText = "¿Dónde aparqué?"; title.style.color = "var(--color-texto)"; }
                if(desc) desc.innerText = "Guarda tu coche al llegar";
            }
        }

        function gestionarParking(e) {
            if (e) e.preventDefault();
            const lat = localStorage.getItem('parking_lat');
            const lng = localStorage.getItem('parking_lng');

            if (lat && lng) {
                window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`, '_blank');
                localStorage.removeItem('parking_lat');
                localStorage.removeItem('parking_lng');
                actualizarInterfazParking();
            } else {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            localStorage.setItem('parking_lat', pos.coords.latitude);
                            localStorage.setItem('parking_lng', pos.coords.longitude);
                            actualizarInterfazParking();
                            alert("📍 ¡Ubicación guardada! Al salir pulsa este botón para volver a pie a tu coche.");
                        },
                        () => alert("No se pudo obtener la señal GPS."),
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                } else {
                    alert("Tu móvil no soporta geolocalización.");
                }
            }
        }

                    document.getElementById('modal-icon').innerHTML = '<i class="fa-brands fa-google text-amber-400"></i>';
                    document.getElementById('modal-title').innerText = "¡Muchas Gracias!";
                    document.getElementById('modal-text').innerHTML = `¡Nos alegra tu excelente experiencia de <b>${nota} estrellas</b>!<br><br>Ayúdanos confirmando tu valoración oficial en Google Maps:`;
                    modalActions.innerHTML = `
                        <a href="${googleReviewUrlGlobal}" target="_blank" class="modal-btn-google"><i class="fa-solid fa-star"></i> Publicar en Google Maps (5★)</a>
                        <button class="modal-btn-secondary" onclick="cerrarModalBtn()">Cerrar</button>
                    `;
                }
                abrirModalCustom();
                estrellas.forEach(e => e.className = 'fa-solid fa-star star-inactive');
            }, 300);
        }

        // ==========================================
        // 5. FUNCIONES MÉDICAS (DRA. LISBETH)
        // ==========================================
        function abrirModalAltaMaternalCompleta() {
            document.getElementById('modal-icon').innerHTML = '<i class="fa-solid fa-id-card-clip text-pink-400"></i>';
            document.getElementById('modal-title').innerText = "Activación Pasaporte Maternal";
            document.getElementById('modal-text').innerHTML = `
                <p class="text-xs text-zinc-300 mb-3">Registra tus datos vitales para personalizar tu seguimiento obstétrico:</p>
                <div class="space-y-2 text-left text-xs">
                    <div>
                        <label class="block text-[11px] text-zinc-400 mb-1">Nombre y Apellido de la Mamá:</label>
                        <input type="text" id="reg-nombre" placeholder="Ej: Andrea Gómez" class="w-full p-2 rounded-xl bg-slate-900 border border-white/10 text-white font-semibold">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] text-zinc-400 mb-1">Grupo Sanguíneo:</label>
                            <select id="reg-sangre" class="w-full p-2 rounded-xl bg-slate-900 border border-white/10 text-white font-semibold">
                                <option value="O+">O Positivo (O+)</option>
                                <option value="O-">O Negativo (O-)</option>
                                <option value="A+">A Positivo (A+)</option>
                                <option value="A-">A Negativo (A-)</option>
                                <option value="B+">B Positivo (B+)</option>
                                <option value="B-">B Negativo (B-)</option>
                                <option value="AB+">AB Positivo (AB+)</option>
                                <option value="AB-">AB Negativo (AB-)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] text-zinc-400 mb-1">Alergias:</label>
                            <input type="text" id="reg-alergias" placeholder="Ninguna reportada" class="w-full p-2 rounded-xl bg-slate-900 border border-white/10 text-white">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] text-zinc-400 mb-1">Contacto de Emergencia:</label>
                        <input type="text" id="reg-contacto-nombre" placeholder="Nombre acompañante" class="w-full p-2 rounded-xl bg-slate-900 border border-white/10 text-white mb-1.5">
                        <input type="tel" id="reg-contacto-tel" placeholder="Teléfono de contacto" class="w-full p-2 rounded-xl bg-slate-900 border border-white/10 text-white">
                    </div>
                    <div class="pt-2 border-t border-white/10">
                        <label class="block text-[11px] text-pink-300 font-bold mb-1">Fecha Última Regla (FUR):</label>
                        <input type="date" id="reg-fur" class="w-full p-2.5 rounded-xl bg-slate-900 border border-pink-500/50 text-white text-center font-bold">
                    </div>
                </div>
            `;

            modalActions.innerHTML = `
                <button class="modal-btn-primary bg-pink-500 hover:bg-pink-600 font-bold" onclick="guardarAltaMaternalCompleta()">Guardar Mi Pasaporte</button>
                <button class="modal-btn-secondary" onclick="cerrarModalBtn()">Hacerlo después</button>
            `;
            abrirModalCustom();
        }

        function guardarAltaMaternalCompleta() {
            const nombre = document.getElementById('reg-nombre').value.trim();
            const sangre = document.getElementById('reg-sangre').value;
            const alergias = document.getElementById('reg-alergias').value.trim() || 'Ninguna reportada';
            const contactoNombre = document.getElementById('reg-contacto-nombre').value.trim();
            const contactoTel = document.getElementById('reg-contacto-tel').value.trim();
            const fur = document.getElementById('reg-fur').value;

            if (!nombre) return alert("Por favor indica tu nombre.");
            if (!fur) return alert("Por favor indica la fecha de tu última regla.");

            const diffDias = calcularDiasGestacion(fur);
            if (diffDias < 0 || diffDias > 294) return alert("Fecha fuera del rango gestacional válido.");

            localStorage.setItem('paciente_nombre', nombre);
            localStorage.setItem('paciente_sangre', sangre);
            localStorage.setItem('paciente_alergias', alergias);
            localStorage.setItem('paciente_contacto_nombre', contactoNombre);
            localStorage.setItem('paciente_contacto_tel', contactoTel);
            localStorage.setItem('fur_embarazo', fur);

            actualizarTarjetaCabeceraPaciente();
            actualizarResumenEmbarazo();
            mostrarModalHitoClinico(fur);
        }

        function actualizarTarjetaCabeceraPaciente() {
            if (!esNodoMaternal) return;
            const nombre = localStorage.getItem('paciente_nombre');
            const fur = localStorage.getItem('fur_embarazo');
            const sangre = localStorage.getItem('paciente_sangre') || 'O+';
            const headerCard = document.getElementById('card-paciente-header');
            const lblNombre = document.getElementById('header-nombre-paciente');
            const lblDatos = document.getElementById('header-datos-paciente');

            if (!headerCard) return;

            if (nombre && fur) {
                const diffDias = calcularDiasGestacion(fur);
                const sem = Math.floor(diffDias / 7);
                const fruto = obtenerFrutoGestacional(sem);

                headerCard.classList.remove('hidden');
                if (lblNombre) lblNombre.innerText = `Mamá: ${nombre}`;
                if (lblDatos) lblDatos.innerText = `Semana ${sem} · ${fruto.icono} ${fruto.nombre} · Grupo ${sangre}`;
            } else {
                headerCard.classList.add('hidden');
            }
        }

        function abrirFichaEmergenciaModal() {
            const nombre = localStorage.getItem('paciente_nombre') || 'No registrado';
            const sangre = localStorage.getItem('paciente_sangre') || 'No especificado';
            const alergias = localStorage.getItem('paciente_alergias') || 'Ninguna reportada';
            const cNombre = localStorage.getItem('paciente_contacto_nombre') || 'Acompañante';
            const cTel = localStorage.getItem('paciente_contacto_tel') || '';
            const fur = localStorage.getItem('fur_embarazo');

            let semInfo = "Semana no calculada";
            if (fur) {
                const diffDias = calcularDiasGestacion(fur);
                const sem = Math.floor(diffDias / 7);
                semInfo = `Semana ${sem} de gestación`;
            }

            document.getElementById('modal-icon').innerHTML = '<i class="fa-solid fa-notes-medical text-rose-500"></i>';
            document.getElementById('modal-title').innerText = "Ficha Médica SOS";
            document.getElementById('modal-text').innerHTML = `
                <div class="p-3 bg-slate-900 rounded-2xl border border-white/10 text-left text-xs space-y-2 mb-3">
                    <div class="flex justify-between"><span class="text-zinc-400">Paciente:</span><span class="text-white font-bold">${nombre}</span></div>
                    <div class="flex justify-between"><span class="text-zinc-400">Estado:</span><span class="text-pink-300 font-bold">${semInfo}</span></div>
                    <div class="flex justify-between"><span class="text-zinc-400">Grupo Sanguíneo:</span><span class="text-rose-400 font-bold">${sangre}</span></div>
                    <div class="flex justify-between"><span class="text-zinc-400">Alergias:</span><span class="text-amber-300 font-semibold">${alergias}</span></div>
                </div>

                ${cTel ? `
                    <a href="tel:${cTel}" class="w-full p-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold flex items-center justify-center gap-2 mb-2 text-xs">
                        <i class="fa-solid fa-phone"></i> Llamar a Acompañante (${cNombre})
                    </a>
                ` : ''}

                <a href="tel:+${whatsappMedicoGlobal}" class="w-full p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold flex items-center justify-center gap-2 text-xs">
                    <i class="fa-solid fa-user-doctor"></i> Contactar con Doctora
                </a>
            `;

            modalActions.innerHTML = `
                <button class="modal-btn-secondary" onclick="abrirModalAltaMaternalCompleta()">Editar Ficha</button>
                <button class="modal-btn-secondary" onclick="cerrarModalBtn()">Cerrar</button>
            `;
            abrirModalCustom();
        }

        function abrirModalTeleconsulta() {
            document.getElementById('modal-icon').innerHTML = '<i class="fa-solid fa-user-doctor text-sky-400"></i>';
            document.getElementById('modal-title').innerText = "Teleconsulta Médica";
            document.getElementById('modal-text').innerHTML = `
                <p class="mb-4 text-xs text-zinc-300">Selecciona el motivo de tu solicitud:</p>
                <div class="space-y-2.5 text-left">
                    <button onclick="ejecutarPasarelaPagoTeleconsulta()" class="w-full p-3 rounded-2xl bg-slate-900/90 border border-emerald-500/30 flex items-center gap-3 cursor-pointer hover:bg-slate-800 transition">
                        <div class="w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center text-lg shrink-0">
                            <i class="fa-solid fa-file-invoice-dollar"></i>
                        </div>
                        <div>
                            <div class="font-bold text-xs text-white">Consulta General</div>
                            <div class="text-[10px] text-zinc-400">Validación de comprobante y cita</div>
                        </div>
                    </button>

                    <button onclick="ejecutarTeleconsultaUrgencia()" class="w-full p-3 rounded-2xl bg-rose-950/30 border border-rose-500/40 flex items-center gap-3 cursor-pointer hover:bg-rose-950/50 transition">
                        <div class="w-10 h-10 rounded-xl bg-rose-500/20 text-rose-500 flex items-center justify-center text-lg shrink-0">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <div>
                            <div class="font-bold text-xs text-rose-300">🚨 Signo de Alarma SOS</div>
                            <div class="text-[10px] text-rose-200/70">Pérdida de líquido, sangrado o dolor fuerte</div>
                        </div>
                    </button>
                </div>
            `;
            modalActions.innerHTML = `<button class="modal-btn-secondary" onclick="cerrarModalBtn()">Volver</button>`;
            abrirModalCustom();
        }

        function ejecutarPasarelaPagoTeleconsulta() {
            document.getElementById('modal-icon').innerHTML = '<i class="fa-solid fa-file-invoice-dollar text-emerald-400"></i>';
            document.getElementById('modal-title').innerText = "Validación de Consulta";
            document.getElementById('modal-text').innerHTML = `
                <p class="text-xs text-zinc-300 mb-3">Datos bancarios para formalizar la sesión:</p>
                <div class="p-3 bg-slate-900 rounded-2xl border border-emerald-500/30 text-left text-xs space-y-2 mb-3">
                    <div class="text-[11px] text-emerald-300 font-bold border-b border-white/10 pb-1">${datosPagoGlobal.tarifa}</div>
                    ${datosPagoGlobal.pagoMovil ? `<div><span class="text-zinc-400 text-[10px] block">Pago Móvil:</span><div class="text-[11px] text-zinc-200 font-mono">${datosPagoGlobal.pagoMovil}</div></div>` : ''}
                    ${datosPagoGlobal.zelle ? `<div><span class="text-zinc-400 text-[10px] block">Zelle:</span><div class="text-[11px] text-zinc-200 font-mono">${datosPagoGlobal.zelle}</div></div>` : ''}
                </div>
                <input type="text" id="input-ref-pago" placeholder="Nº de Referencia" class="w-full p-2.5 rounded-xl bg-slate-900 border border-white/20 text-white font-mono text-center font-bold">
            `;
            modalActions.innerHTML = `
                <button class="modal-btn-primary bg-emerald-600 hover:bg-emerald-700 font-bold" onclick="confirmarPagoYEnviar()">Notificar Referencia</button>
                <button class="modal-btn-secondary" onclick="abrirModalTeleconsulta()">Volver</button>
            `;
            abrirModalCustom();
        }

        function confirmarPagoYEnviar() {
            const ref = document.getElementById('input-ref-pago').value.trim();
            if (!ref) return alert("Indica el número de referencia.");
            const nombre = localStorage.getItem('paciente_nombre') || 'Paciente';
            const msg = encodeURIComponent(`Hola Doctora, le escribe ${nombre}.\n\n💳 Ref. Pago: ${ref}\n\nQuedo atenta para mi teleconsulta.`);
            window.open(`https://wa.me/${whatsappMedicoGlobal}?text=${msg}`, '_blank');
            cerrarModalBtn();
        }

        function ejecutarTeleconsultaUrgencia() {
            const nombre = localStorage.getItem('paciente_nombre') || 'Paciente';
            const msg = encodeURIComponent(`🚨 URGENCIA OBSTÉTRICA SOS: Doctora, le escribe ${nombre}, presento un síntoma de alarma y requiero asistencia médica.`);
            window.open(`https://wa.me/${whatsappMedicoGlobal}?text=${msg}`, '_blank');
            cerrarModalBtn();
        }

        function abrirCalculadoraEmbarazo() {
            const furGuardada = localStorage.getItem('fur_embarazo') || '';
            document.getElementById('modal-icon').innerHTML = '<i class="fa-solid fa-baby text-pink-400"></i>';
            document.getElementById('modal-title').innerText = "Control Gestacional";
            document.getElementById('modal-text').innerHTML = `
                <p class="mb-3 text-xs text-zinc-300">Fecha de tu <b>Última Regla (FUR)</b>:</p>
                <input type="date" id="input-fur" value="${furGuardada}" class="w-full p-2.5 rounded-xl bg-slate-900 border border-pink-500/40 text-white text-center font-bold mb-3">
            `;
            modalActions.innerHTML = `
                <button class="modal-btn-primary bg-pink-500 hover:bg-pink-600 font-bold" onclick="procesarCalculoEmbarazo()">Calcular Semanas</button>
                <button class="modal-btn-secondary" onclick="cerrarModalBtn()">Cerrar</button>
            `;
            abrirModalCustom();
        }

        function procesarCalculoEmbarazo() {
            const inputFur = document.getElementById('input-fur');
            if (!inputFur || !inputFur.value) return alert("Introduce la fecha.");
            const diffDias = calcularDiasGestacion(inputFur.value);
            if (diffDias < 0 || diffDias > 294) return alert("Fecha fuera de rango válido.");

            localStorage.setItem('fur_embarazo', inputFur.value);
            actualizarResumenEmbarazo();
            actualizarTarjetaCabeceraPaciente();
            mostrarModalHitoClinico(inputFur.value);
        }

        function mostrarModalHitoClinico(fechaStr) {
            const diffDias = calcularDiasGestacion(fechaStr);
            const semanas = Math.floor(diffDias / 7);
            const dias = diffDias % 7;
            const fruto = obtenerFrutoGestacional(semanas);

            document.getElementById('modal-icon').innerHTML = `<span class="text-4xl">${fruto.icono}</span>`;
            document.getElementById('modal-title').innerText = `Semana ${semanas} + ${dias} Días`;
            document.getElementById('modal-text').innerHTML = `
                <div class="p-3 bg-slate-900 rounded-2xl border border-white/10 text-center text-xs space-y-1">
                    <div>Tamaño del bebé: <b class="text-pink-300">${fruto.nombre}</b> (~${fruto.tam})</div>
                </div>
            `;
            modalActions.innerHTML = `<button class="modal-btn-secondary" onclick="cerrarModalBtn()">Entendido</button>`;
            abrirModalCustom();
        }

        function actualizarResumenEmbarazo() {
            if (!esNodoMaternal) return;
            const furGuardada = localStorage.getItem('fur_embarazo');
            const label = document.getElementById('calculadora-resumen');
            if (furGuardada && label) {
                const diffDias = calcularDiasGestacion(furGuardada);
                if (diffDias >= 0 && diffDias <= 294) {
                    const sem = Math.floor(diffDias / 7);
                    const fruto = obtenerFrutoGestacional(sem);
                    label.innerText = `Semana ${sem} · ${fruto.nombre} ${fruto.icono}`;
                }
            }
        }

        function abrirTriajeUrgencias() {
            document.getElementById('modal-icon').innerHTML = '<i class="fa-solid fa-shield-heart text-rose-500"></i>';
            document.getElementById('modal-title').innerText = "Signos de Alarma";
            document.getElementById('modal-text').innerHTML = `
                <div class="space-y-2 text-left text-xs">
                    <label class="flex items-center gap-2 p-2 rounded-xl bg-slate-900 border border-white/10 cursor-pointer">
                        <input type="radio" name="alarma_opt" value="Sangrado o pérdida de líquido" class="accent-rose-500" checked>
                        <span>Sangrado vaginal o pérdida de líquido</span>
                    </label>
                    <label class="flex items-center gap-2 p-2 rounded-xl bg-slate-900 border border-white/10 cursor-pointer">
                        <input type="radio" name="alarma_opt" value="Dolor de cabeza intenso" class="accent-rose-500">
                        <span>Dolor de cabeza intenso / visión borrosa</span>
                    </label>
                </div>
            `;
            modalActions.innerHTML = `
                <button class="modal-btn-primary bg-rose-600 hover:bg-rose-700 font-bold" onclick="enviarAlarmaMedico()">Avisar a la Doctora</button>
                <button class="modal-btn-secondary" onclick="cerrarModalBtn()">Cerrar</button>
            `;
            abrirModalCustom();
        }

        function enviarAlarmaMedico() {
            const opt = document.querySelector('input[name="alarma_opt"]:checked');
            const sintoma = opt ? opt.value : "alarma";
            const msg = encodeURIComponent(`Hola Doctora, presento ${sintoma}. ¿Qué debo hacer?`);
            window.open(`https://wa.me/${whatsappMedicoGlobal}?text=${msg}`, '_blank');
        }

        let contraccionTimer = null;
        let segsContraccion = 0;
        function abrirContadorContracciones() {
            segsContraccion = 0;
            if (contraccionTimer) clearInterval(contraccionTimer);
            document.getElementById('modal-icon').innerHTML = '<i class="fa-solid fa-stopwatch text-purple-400"></i>';
            document.getElementById('modal-title').innerText = "Contracciones";
            document.getElementById('modal-text').innerHTML = `
                <div id="chrono-display" class="text-3xl font-mono font-black text-purple-400 my-3">00:00</div>
                <button id="btn-start-chrono" class="px-4 py-2 bg-purple-600 rounded-full font-bold text-xs" onclick="toggleChrono()">Iniciar Dolor</button>
            `;
            modalActions.innerHTML = `<button class="modal-btn-secondary" onclick="cerrarModalBtn()">Cerrar</button>`;
            abrirModalCustom();
        }

        function toggleChrono() {
            const btn = document.getElementById('btn-start-chrono');
            const display = document.getElementById('chrono-display');
            if (!contraccionTimer) {
                segsContraccion = 0;
                btn.innerText = "Detener Dolor";
                btn.className = "px-4 py-2 bg-rose-600 rounded-full font-bold text-xs animate-pulse";
                contraccionTimer = setInterval(() => {
                    segsContraccion++;
                    display.innerText = `${String(Math.floor(segsContraccion / 60)).padStart(2, '0')}:${String(segsContraccion % 60).padStart(2, '0')}`;
                }, 1000);
            } else {
                clearInterval(contraccionTimer);
                contraccionTimer = null;
                btn.innerText = "Iniciar Nuevo Dolor";
                btn.className = "px-4 py-2 bg-purple-600 rounded-full font-bold text-xs";
            }
        }

        function abrirChecklistParto() {
            const items = ['Documento y carpeta médica', '3 mudas de recién nacido', 'Pañales y toallitas', 'Ropa cómoda de lactancia'];
            let html = '<div class="text-left space-y-2 mb-4 text-xs">';
            items.forEach((it, idx) => {
                const c = localStorage.getItem('chk_' + idx) === 'true' ? 'checked' : '';
                html += `<label class="flex items-center gap-2 p-2 bg-slate-900 rounded-xl border border-white/5"><input type="checkbox" onchange="localStorage.setItem('chk_${idx}', this.checked)" ${c} class="accent-emerald-500"> <span>${it}</span></label>`;
            });
            html += '</div>';
            document.getElementById('modal-icon').innerHTML = '<i class="fa-solid fa-clipboard-check text-emerald-400"></i>';
            document.getElementById('modal-title').innerText = "Maleta de Parto";
            document.getElementById('modal-text').innerHTML = html;
            modalActions.innerHTML = `<button class="modal-btn-secondary" onclick="cerrarModalBtn()">Cerrar</button>`;
            abrirModalCustom();
        }

        document.addEventListener("DOMContentLoaded", cargarEnginePhygital);
    </script>

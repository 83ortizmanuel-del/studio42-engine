<!DOCTYPE html>
<html lang="es" data-motor="3.0">
<head>
<meta charset="UTF-8">

<title id="page-title">Studio 42 | Terminal Phygital</title>
<style>
    :root {
        --acento: #00E5FF; --acento-rgb: 0, 229, 255;
        --color-acento: var(--acento);
        --fondo: #0d0f13; --fondo-rgb: 13, 15, 19;
        --superficie: #171a20; --superficie-2: #1f232b;
        --borde: rgba(255, 255, 255, 0.07);
        --texto: #f3f4f6; --suave: #a1a7b3; --tenue: #6b7280;
        --fondo-logo: #0b0c10;
        --r-grande: 22px; --r-medio: 16px;
        --fuente: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --dock-alto: 0px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html { background: var(--fondo); }
    body {
        font-family: var(--fuente); color: var(--texto); min-height: 100vh; min-height: 100dvh;
        background:
            radial-gradient(120% 60% at 0% 0%, rgba(var(--acento-rgb), 0.16), transparent 60%),
            var(--fondo);
        background-attachment: fixed;
        padding: max(18px, env(safe-area-inset-top)) 18px calc(var(--dock-alto) + 28px + env(safe-area-inset-bottom));
        -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    body.modal-abierto { overflow: hidden; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--acento); outline-offset: 3px; border-radius: 8px; }
    .ic { width: 1em; height: 1em; display: block; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .app { width: 100%; max-width: 460px; margin: 0 auto; }

    /* PORTADA: logo y nombre unidos */
    :root { --display: var(--fuente); }
    .portada { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 26px 0 18px; }
    .portada::before {
        content: ""; position: absolute; left: 50%; top: 6px; width: 260px; height: 200px; transform: translateX(-50%); z-index: -1;
        background: radial-gradient(closest-side, rgba(var(--acento-rgb), 0.30), transparent); filter: blur(6px); pointer-events: none;
    }
    .marca {
        display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--fondo-logo);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 0 6px rgba(var(--acento-rgb), 0.10), 0 22px 50px rgba(0, 0, 0, 0.55);
        width: 116px; height: 116px; border-radius: 32px; padding: var(--logo-pad, 10px); margin-bottom: 18px;
        animation: marcaEntra 0.6s cubic-bezier(.2, .8, .2, 1) both;
    }
    .marca img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .marca.ancha { width: min(300px, 100%); height: 104px; border-radius: 24px; padding: var(--logo-pad, 14px 22px); }
    .marca.monograma {
        width: 104px; height: 104px; border-radius: 50%; padding: 0;
        background: linear-gradient(145deg, var(--acento), rgba(var(--acento-rgb), 0.55));
        color: #0b0c10; font-family: var(--display); font-weight: 800; font-size: 2.6rem; letter-spacing: -0.02em;
    }
    @keyframes marcaEntra { from { opacity: 0; transform: translateY(8px) scale(0.94); } to { opacity: 1; transform: none; } }
    h1 {
        font-family: var(--display); font-size: clamp(1.75rem, 8vw, 2.25rem); line-height: 1.05; font-weight: 800;
        letter-spacing: -0.02em; word-break: break-word; max-width: 18ch; text-wrap: balance;
    }
    h1.largo { font-size: clamp(1.4rem, 6.4vw, 1.75rem); }
    .portada.con-logotipo h1 { font-size: 1.3rem; font-weight: 700; color: var(--suave); letter-spacing: 0; }
    .subtitulo { color: var(--suave); font-size: 0.98rem; line-height: 1.4; margin-top: 8px; max-width: 32ch; text-wrap: balance; word-break: break-word; }
    .portada.con-logotipo .subtitulo { color: var(--texto); margin-top: 4px; }
    .status-badge {
        display: inline-flex; align-items: center; gap: 7px; margin-top: 14px;
        font-size: 0.78rem; font-weight: 600; color: var(--texto);
        background: rgba(var(--acento-rgb), 0.12); border-radius: 99px; padding: 6px 12px 6px 10px; max-width: 100%;
    }
    .status-badge span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ping-light { width: 7px; height: 7px; border-radius: 50%; background: var(--acento); flex-shrink: 0; box-shadow: 0 0 0 3px rgba(var(--acento-rgb), 0.22); }
    [data-fuente="impacto"] h1, [data-fuente="impacto"] .section-title, [data-fuente="impacto"] .marca.monograma { font-weight: 400; letter-spacing: 0; }
    [data-fuente="elegante"] h1 { font-weight: 700; letter-spacing: -0.01em; }
    .btn-compartir {
        position: absolute; top: 0; right: 0;
        width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
        background: var(--superficie); box-shadow: 0 0 0 1px var(--borde); color: var(--suave); font-size: 1.1rem;
    }

    /* SECCIONES Y BOTONES */
    .section-title { font-family: var(--display); font-size: 1rem; font-weight: 700; color: var(--texto); margin: 24px 2px 10px; }
    .apps-menu { display: flex; flex-direction: column; gap: 10px; }
    .apps-menu.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .app-btn {
        display: flex; align-items: center; gap: 13px; width: 100%; padding: 14px; text-align: left; text-decoration: none; color: inherit;
        background: var(--superficie); border-radius: var(--r-medio); box-shadow: 0 0 0 1px var(--borde);
        transition: transform 0.15s ease, background 0.15s ease; min-height: 64px;
    }
    .app-btn:active { transform: scale(0.97); background: var(--superficie-2); }
    .app-icon {
        width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 1.2rem; flex-shrink: 0;
        background: rgba(var(--ic-rgb, 255, 255, 255), 0.15); color: rgb(var(--ic-rgb, 255, 255, 255));
    }
    .app-info { flex: 1; min-width: 0; }
    .app-name { font-size: 0.95rem; font-weight: 700; line-height: 1.25; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .app-desc { font-size: 0.8rem; color: var(--suave); line-height: 1.35; margin-top: 2px; }
    .app-arrow { color: var(--tenue); font-size: 0.9rem; }
    /* En cuadrícula: icono arriba, texto debajo */
    .apps-menu.grid .app-btn { flex-direction: column; align-items: flex-start; gap: 12px; min-height: 128px; padding: 15px 14px; }
    .apps-menu.grid .app-arrow { display: none; }
    .apps-menu.grid .app-desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .apps-menu.grid .destacado, .apps-menu.grid .btn-sos { grid-column: 1 / -1; flex-direction: row; align-items: center; min-height: 72px; }
    .apps-menu.grid .destacado .app-arrow, .apps-menu.grid .btn-sos .app-arrow { display: block; }
    .app-btn.destacado { background: linear-gradient(135deg, rgba(var(--acento-rgb), 0.22), rgba(var(--acento-rgb), 0.06)); box-shadow: 0 0 0 1px rgba(var(--acento-rgb), 0.45); }
    .app-btn.destacado .app-icon { background: var(--acento); color: #0b0c10; }

    /* Reseñas: la acción que más valor tiene para el negocio */
    .par-opinion { min-height: 72px; }
    .par-opinion:first-child { background: linear-gradient(135deg, rgba(255, 180, 0, 0.2), rgba(255, 180, 0, 0.05)); box-shadow: 0 0 0 1px rgba(255, 180, 0, 0.4); }
    .par-opinion:first-child .app-icon { background: #ffb400; color: #1a1205; }

    .btn-sos { background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.05)) !important; box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.5) !important; }
    .badge-sos { font-size: 0.66rem; font-weight: 800; background: #f59e0b; color: #1a1205; padding: 2px 7px; border-radius: 99px; }

    /* DOCK: acciones rápidas siempre a mano */
    .dock {
        position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 50;
        max-width: 436px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
        padding: 7px; border-radius: 24px; background: rgba(23, 26, 32, 0.86);
        -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
        box-shadow: 0 0 0 1px var(--borde), 0 16px 40px rgba(0, 0, 0, 0.55);
        animation: dockEntra 0.5s cubic-bezier(.2, .9, .3, 1.2) 0.25s both;
    }
    @keyframes dockEntra { from { transform: translateY(120%); opacity: 0; } to { transform: none; opacity: 1; } }
    .dock a {
        display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px 6px; border-radius: 17px;
        text-decoration: none; font-size: 0.7rem; font-weight: 600; color: var(--suave);
    }
    .dock a .ic { font-size: 1.35rem; color: var(--texto); }
    .dock a:active { background: rgba(255, 255, 255, 0.06); }
    .dock a.principal { background: var(--acento); color: #0b0c10; }
    .dock a.principal .ic { color: #0b0c10; }

    /* VENTANAS: suben desde abajo, como en una app */
    .modal-overlay { position: fixed; inset: 0; z-index: 10001; background: rgba(0, 0, 0, 0.6); display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-box {
        position: relative; width: 100%; max-width: 480px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
        background: var(--superficie); border-radius: 26px 26px 0 0; padding: 26px 20px calc(20px + env(safe-area-inset-bottom));
        box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5); text-align: left; outline: none; animation: sube 0.28s cubic-bezier(.2, .9, .3, 1);
    }
    .modal-box::before { content: ""; position: absolute; top: 9px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 4px; background: rgba(255, 255, 255, 0.18); }
    @keyframes sube { from { transform: translateY(100%); } to { transform: none; } }
    @media (min-width: 600px) { .modal-overlay { align-items: center; padding: 20px; } .modal-box { border-radius: 26px; } .modal-box::before { display: none; } }
    .modal-close-btn { position: absolute; top: 16px; right: 16px; width: 34px; height: 34px; border-radius: 50%; background: var(--superficie-2); color: var(--suave); display: grid; place-items: center; }
    .modal-icon { font-size: 1.8rem; color: var(--acento); margin-bottom: 8px; }
    .modal-titulo { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 8px; padding-right: 40px; }
    .modal-texto { font-size: 0.92rem; line-height: 1.55; color: #d1d5db; margin-bottom: 12px; }
    .modal-ok { font-size: 0.85rem; font-weight: 700; color: #34d399; margin: 8px 0; text-align: center; }
    .modal-aviso { font-size: 0.8rem; line-height: 1.5; color: #fbbf24; margin-top: 10px; }
    .modal-actions { display: flex; flex-direction: column; gap: 9px; margin-top: 18px; }
    .btn-oro, .btn-wa, .btn-peligro {
        display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; text-decoration: none;
        font-weight: 700; font-size: 1rem; min-height: 52px; padding: 13px 18px; border-radius: 16px; border: 0; cursor: pointer; width: 100%;
    }
    .btn-oro { background: var(--acento); color: #0b0c10; }
    .btn-wa { background: #25d366; color: #052e16; }
    .btn-peligro { background: #ef4444; color: #fff; }
    .btn-sec { display: flex; align-items: center; justify-content: center; min-height: 48px; text-decoration: none; color: var(--suave); background: var(--superficie-2); border-radius: 16px; font-size: 0.92rem; font-weight: 600; width: 100%; }
    .deshabilitado { opacity: 0.45; pointer-events: none; cursor: not-allowed; }

    .campo { margin-bottom: 14px; }
    .campo-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--suave); margin-bottom: 6px; }
    .pills { display: flex; flex-wrap: wrap; gap: 7px; }
    .pill { background: var(--superficie-2); border-radius: 12px; padding: 11px 13px; font-size: 0.88rem; color: var(--texto); text-align: center; flex: 1 1 auto; }
    .pill[aria-pressed="true"] { background: var(--acento); color: #0b0c10; font-weight: 700; }
    .input { width: 100%; background: var(--fondo); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; padding: 13px; color: var(--texto); font-size: 16px; font-family: inherit; }
    .input:focus { border-color: var(--acento); outline: none; }

    .resultado { background: var(--superficie-2); border-radius: var(--r-medio); padding: 14px; margin: 12px 0; }
    .resultado-etiqueta { font-size: 0.8rem; color: var(--acento); font-weight: 700; }
    .resultado-titulo { font-size: 1rem; font-weight: 800; margin-top: 2px; }
    .resultado-grande { font-size: 1.8rem; font-weight: 800; margin: 4px 0; }
    .resultado-texto { font-size: 0.85rem; color: #d1d5db; margin-top: 4px; line-height: 1.5; }
    .tarjeta { border-left: 3px solid rgb(var(--nv)); background: var(--superficie-2); border-radius: 12px; padding: 11px 13px; margin-bottom: 8px; }
    .n-info { --nv: 56, 189, 248; } .n-alerta { --nv: 244, 63, 94; } .n-ok { --nv: 52, 211, 153; } .n-aviso { --nv: 251, 191, 36; }
    .tarjeta-titulo { font-size: 0.85rem; font-weight: 700; color: rgb(var(--nv)); margin-bottom: 4px; }
    .tarjeta-texto { font-size: 0.88rem; color: #e5e7eb; line-height: 1.5; white-space: pre-line; }
    .fila { display: flex; justify-content: space-between; gap: 10px; font-size: 0.86rem; margin-top: 5px; }
    .fila-et { color: var(--suave); }
    .fila-val { font-weight: 700; text-align: right; }
    .numero-grande { font-size: 1.7rem; font-weight: 800; letter-spacing: 3px; text-align: center; background: var(--fondo); padding: 14px; border-radius: 16px; margin-bottom: 4px; user-select: all; -webkit-user-select: all; }
    .fila-bizum { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--fondo); border-radius: 14px; padding: 11px 13px; margin-bottom: 14px; }
    .fila-bizum .mini { display: block; font-size: 0.75rem; color: var(--suave); }
    .fila-bizum .numero-medio { font-size: 1.05rem; font-weight: 800; letter-spacing: 1px; }
    .btn-copiar { background: rgba(var(--acento-rgb), 0.15); color: var(--acento); font-size: 0.8rem; font-weight: 700; padding: 8px 11px; border-radius: 10px; display: inline-flex; align-items: center; gap: 5px; }

    /* ESTADOS */
    .esqueleto { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .esqueleto i { display: block; height: 128px; border-radius: var(--r-medio); background: linear-gradient(90deg, var(--superficie) 0%, var(--superficie-2) 50%, var(--superficie) 100%); background-size: 200% 100%; animation: brillo 1.2s linear infinite; }
    .esqueleto i:first-child { grid-column: 1 / -1; height: 72px; }
    @keyframes brillo { to { background-position: -200% 0; } }
    .error-box { padding: 36px 8px; color: #fca5a5; text-align: center; }
    .error-box .ic { font-size: 2.2rem; margin: 0 auto 12px; }
    .error-box p { font-size: 0.95rem; margin-bottom: 14px; line-height: 1.5; }
    .debug { max-width: 460px; margin: 14px auto 0; background: #020617; border: 1px solid #334155; border-radius: 14px; padding: 12px; font: 11px/1.5 ui-monospace, Menlo, monospace; color: #cbd5e1; }
    .debug b { color: #fbbf24; }
    .footer-brand { margin-top: 30px; text-align: center; font-size: 0.75rem; color: var(--tenue); }
    .footer-brand a { color: var(--suave); text-decoration: none; font-weight: 600; }
    .tema-industrial .app-btn { background: linear-gradient(135deg, #2a2d34, #16181d); box-shadow: 0 0 0 1px #3b4250; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

    <header class="portada" id="portada">
        <button class="btn-compartir" id="btn-compartir" type="button" aria-label="Compartir" hidden></button>

            <img id="hub-logo" alt="" decoding="async">

<script>
"use strict";
(function () {

/* ==========================================================================
   STUDIO 42 ENGINE v2.0
   - Un solo HTML para todos los clientes. Todo el contenido vive en el JSON.
   - Los botones se resuelven SOLO por "tipo" (nunca por el texto del nombre).
   - Nada que venga del JSON se inserta como HTML: se construye con el DOM.
   - Sin números de teléfono por defecto: si falta un dato, el botón se omite.
   - Añade ?debug=1 a la URL para ver los avisos de configuración.
   ========================================================================== */

/* ========================= CONFIGURACIÓN DEL MOTOR ========================= */
const CONFIG = {
    // Rutas donde buscar el JSON del cliente. Deja solo las que uses de verdad
    // (cada ruta que falla cuesta una petición).
    rutasJSON: ["../{cod}.json", "./{cod}.json"],
    // Respaldo si el hosting principal falla. Pon "" para desactivarlo.
    respaldoGitHub: "https://raw.githubusercontent.com/83ortizmanuel-del/studio42-engine/main/c/{cod}.json",
    tiempoLimiteMs: 6000,
    // Contador anónimo de Studio 42 (sin cookies ni datos personales). Pon "" para desactivarlo.
    estadisticas: "https://script.google.com/macros/s/AKfycbyBX3u7pctH4FdbpHzyH11eXv0sbzMm1Xs6-aO9vMVE-QeCnz1CkuPFHBN7RobM9NPw/exec"
};

/* ============================== ESTADO GLOBAL ============================== */
const estado = {
    cod: "demo", llavero: "MOSTRADOR", mesa: "Barra",
    data: null, negocio: "", waNegocio: "", acento: "#00E5FF",
    avisos: [], debug: false
};

const $ = (id) => document.getElementById(id);
function aviso(msg) { estado.avisos.push(msg); if (window.console) console.warn("[Studio42 v2] " + msg); }
function falta(msg) { throw new Error(msg); }
function vibrar(ms) { try { if ("vibrate" in navigator) navigator.vibrate(ms); } catch (e) {} }

const almacen = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, String(v)); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ============================ VALIDACIÓN Y UTILIDADES ============================ */
function soloSlug(s, def) {
    const t = String(s === null || s === undefined ? "" : s).toLowerCase().trim();
    return /^[a-z0-9_-]{1,40}$/.test(t) ? t : def;
}
function limpiarParam(s, def) {
    const t = String(s === null || s === undefined ? "" : s).trim();
    return /^[\w\- ]{1,30}$/.test(t) ? t : def;
}
function urlSegura(u) {
    const t = String(u === null || u === undefined ? "" : u).trim();
    return /^(https:\/\/|tel:|mailto:)\S+$/i.test(t) ? t : null;
}
function hexValido(c, def) { return /^#[0-9a-f]{6}$/i.test(String(c || "")) ? c : def; }
// Color CSS permitido para el fondo del logo: #hex, transparent o rgb()/rgba() estricto (sin nada más).
function colorCss(c, def) {
    const t = String(c === null || c === undefined ? "" : c).trim();
    if (/^#[0-9a-f]{6}$/i.test(t) || /^transparent$/i.test(t)) return t;
    if (/^rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(,\s*(0|1|0?\.\d+)\s*)?\)$/i.test(t)) return t;
    return def;
}
function rgbDeHex(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
// Devuelve solo dígitos en formato internacional, o "" si no es un número válido.
function waNumero(s) {
    if (s === null || s === undefined) return "";
    const t = String(s).trim();
    let d = "";
    const m = /^https:\/\/wa\.me\/\+?(\d{9,15})(?:[/?#].*)?$/i.exec(t);
    if (m) d = m[1];
    else if (/^[+\d\s().-]+$/.test(t)) d = t.replace(/\D/g, "");
    if (d.length === 9) d = "34" + d; // móvil español sin prefijo
    return d.length >= 11 && d.length <= 15 ? d : "";
}
function urlWA(numero, texto) {
    const n = waNumero(numero);
    if (!n) return null;
    return "https://wa.me/" + n + (texto ? "?text=" + encodeURIComponent(texto) : "");

function plantilla(texto, vars) {

function nombreIcono(raw, def) {
    const s = String(raw === null || raw === undefined ? "" : raw).toLowerCase().trim();
    if (ICONOS[s]) return s;
    const partes = s.split(/\s+/).filter((p) => p.indexOf("fa-") === 0 && ["fa-solid", "fa-brands", "fa-regular"].indexOf(p) < 0).map((p) => p.slice(3));
    for (let i = 0; i < partes.length; i++) {
        if (ICONOS[partes[i]]) return partes[i];
        if (ALIAS_FA[partes[i]]) return ALIAS_FA[partes[i]];

function ico(nombre, clase) {

/* ============================ CONSTRUCTOR DE DOM ============================ */
// h("div", {class:"x", text:"hola"}, hijo1, [hijo2, hijo3]) -> <div class="x">hola…</div>
// Todo texto se inserta con textContent: no existe inyección de HTML posible.
function h(tag, attrs) {
    const hijos = Array.prototype.slice.call(arguments, 2);
    const el = document.createElement(tag);
    if (attrs) {
        Object.keys(attrs).forEach((k) => {
            const v = attrs[k];
            if (v === null || v === undefined || v === false) return;
            if (k === "class") el.className = v;
            else if (k === "text") el.textContent = v;
            else if (k.slice(0, 2) === "on" && typeof v === "function") el.addEventListener(k.slice(2), v);
            else el.setAttribute(k, v === true ? "" : String(v));
        });
    }
    return poner(el, hijos);
}
// Añade hijos a un elemento ignorando null/undefined/false y aplanando arrays.
// (element.append(null) escribiría el texto "null": usa siempre poner()).
function poner(el) {
    Array.prototype.slice.call(arguments, 1).flat(Infinity).forEach((c) => {
        if (c === null || c === undefined || c === false) return;
        el.append(c.nodeType ? c : String(c));
    });
    return el;
}

let ultimoFoco = null;
function cerrarModal(sinFoco) {
    const o = $("modal-overlay");
    if (o) o.remove();
    document.body.classList.remove("modal-abierto");
    if (!sinFoco && ultimoFoco && ultimoFoco.focus) { try { ultimoFoco.focus(); } catch (e) {} }
}
function abrirModal(o) {
    cerrarModal(true);
    ultimoFoco = document.activeElement;
    const box = h("div", { class: "modal-box", role: "dialog", "aria-modal": "true", "aria-labelledby": "modal-titulo", tabindex: "-1" },
        h("button", { class: "modal-close-btn", type: "button", "aria-label": "Cerrar", onclick: () => cerrarModal() }, ico("close")),
        o.icono ? h("div", { class: "modal-icon" }, ico(o.icono)) : null,
        h("h3", { class: "modal-titulo", id: "modal-titulo", text: o.titulo || "" }),
        o.cuerpo || null,
        h("div", { class: "modal-actions" },
            o.acciones || [],
            h("button", { class: "btn-sec", type: "button", onclick: () => cerrarModal() }, o.cerrarTexto || "Cerrar"))
    );
    const overlay = h("div", { class: "modal-overlay", id: "modal-overlay" }, box);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) cerrarModal(); });
    overlay.addEventListener("keydown", (e) => {
        if (e.key !== "Tab") return;
        const f = Array.prototype.slice.call(box.querySelectorAll('a[href],button,input,select,textarea'))
            .filter((x) => !x.hidden && !x.disabled && x.getAttribute("aria-disabled") !== "true");
        if (!f.length) return;
        const primero = f[0], ultimo = f[f.length - 1];
        if (e.shiftKey && (document.activeElement === primero || document.activeElement === box)) { e.preventDefault(); ultimo.focus(); }
        else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primero.focus(); }
    });
    document.body.append(overlay);
    document.body.classList.add("modal-abierto");
    try { box.focus({ preventScroll: true }); } catch (e) { box.focus(); }
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarModal(); });

async function copiarTexto(t) {
    try {
        if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; }
    } catch (e) {}
    try {
        const ta = document.createElement("textarea");
        ta.value = t; ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
        document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, t.length);
        const ok = document.execCommand("copy");
        ta.remove();
        return ok;
    } catch (e) { return false; }
}

// o = { nombre, descripcion, icono, color, href, externo, descarga, abrir, clase }
function botonApp(btn, o) {

    if (!nombre) falta("falta 'nombre'");
    const descripcion = btn.descripcion || o.descripcion || "";
    const caja = h("div", { class: "app-icon" }, ico(nombreIcono(btn.icono, o.icono || "link")));

    const clase = "app-btn" + (btn.destacado ? " destacado" : "") + (o.clase ? " " + o.clase : "");
    if (o.href) {
        return h("a", {
            class: clase, href: o.href,
            target: o.externo ? "_blank" : null, rel: o.externo ? "noopener noreferrer" : null,
            download: o.descarga !== undefined && o.descarga !== null ? o.descarga : null
        }, caja, info, ico("chevron", "app-arrow"));
    }

const LS_LAT = "parking_lat", LS_LNG = "parking_lng";
MODULOS.parking = (btn) => {
    const iconoBase = nombreIcono(btn.icono, "locate");
    const nombreBase = btn.nombre || "¿Dónde aparqué?";
    const descBase = btn.descripcion || "Guarda la posición GPS de tu coche para volver";
    const el = botonApp(Object.assign({}, btn, { nombre: nombreBase, descripcion: descBase }), { icono: "locate", color: "#94A3B8", abrir: () => gestionar() });
    const usoIcono = el.querySelector(".app-icon use");
    const nombreEl = el.querySelector(".app-name");
    const descEl = el.querySelector(".app-desc");
    const coords = () => {
        const lat = parseFloat(almacen.get(LS_LAT)), lng = parseFloat(almacen.get(LS_LNG));
        return isFinite(lat) && isFinite(lng) ? { lat: lat, lng: lng } : null;
    };
    const refrescar = () => {
        const g = !!coords();
        nombreEl.textContent = g ? "Ir a mi coche (a pie)" : nombreBase;
        descEl.textContent = g ? "Toca para abrir la ruta en el mapa" : descBase;
        usoIcono.setAttribute("href", "#i-" + (g ? "nav" : iconoBase));
        el.classList.toggle("destacado", g || !!btn.destacado);
    };
    function gestionar() {
        vibrar(40);
        const c = coords();
        if (c) {
            window.open("https://www.google.com/maps/dir/?api=1&destination=" + c.lat + "," + c.lng + "&travelmode=walking", "_blank", "noopener");
            setTimeout(() => abrirModal({
                titulo: "Ruta abierta", icono: "nav",
                cuerpo: h("p", { class: "modal-texto", text: "Hemos abierto la ruta a pie en Google Maps. ¿Ya has llegado a tu coche? Si quieres, borramos la ubicación guardada." }),
                acciones: [h("button", { class: "btn-oro", type: "button", onclick: () => { almacen.del(LS_LAT); almacen.del(LS_LNG); cerrarModal(); refrescar(); } }, "Borrar ubicación")],
                cerrarTexto: "Mantenerla guardada"
            }), 800);
            return;
        }
        if (!navigator.geolocation) {
            abrirModal({ titulo: "Sin GPS", icono: "alert", cuerpo: h("p", { class: "modal-texto", text: "Tu navegador no permite obtener la ubicación." }) });
            return;
        }
        descEl.textContent = "Obteniendo señal GPS…";
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const ok = almacen.set(LS_LAT, pos.coords.latitude) && almacen.set(LS_LNG, pos.coords.longitude);
                refrescar();
                abrirModal({
                    titulo: ok ? "Ubicación guardada" : "No se pudo guardar", icono: ok ? "pin" : "alert",
                    cuerpo: h("p", { class: "modal-texto", text: ok
                        ? "Tu coche queda guardado solo en este móvil. Cuando salgas, vuelve a pulsar este botón para regresar a pie."
                        : "Tu navegador no permite guardar datos (¿modo privado?). Prueba desde una ventana normal." })
                });
            },
            () => {
                refrescar();
                abrirModal({ titulo: "No hemos podido ubicarte", icono: "alert", cuerpo: h("p", { class: "modal-texto", text: "Activa el GPS del móvil, permite el acceso a la ubicación para esta página y vuelve a intentarlo." }) });
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }
    refrescar();
    return el;
};

/* ---- asistente: pasos con opciones + resultado por reglas + mensaje a WhatsApp ----
   Sustituye al configurador de menú, test ergonómico, tasador de entrega, etc. */
function evaluarResultado(res, sel) {
    if (!res) return null;
    const reglas = Array.isArray(res.reglas) ? res.reglas : [];
    for (let i = 0; i < reglas.length; i++) {
        const cond = reglas[i] && reglas[i].si ? reglas[i].si : {};
        const ok = Object.keys(cond).every((k) => [].concat(cond[k]).map(String).indexOf(String(sel[k])) >= 0);
        if (ok) return reglas[i];
    }
    return res.porDefecto || null;
}
MODULOS.asistente = (btn) => {
    const pasos = (Array.isArray(btn.pasos) ? btn.pasos : [])
        .filter((p) => p && p.titulo && Array.isArray(p.opciones))
        .map((p) => ({
            titulo: String(p.titulo),
            opciones: p.opciones.map((o) => typeof o === "string" ? o : String((o && o.texto) || "")).filter(Boolean),
            defecto: p.defecto
        }))
        .filter((p) => p.opciones.length);
    if (!pasos.length) falta("'asistente' necesita 'pasos' con 'titulo' y 'opciones'");
    return botonApp(btn, { nombre: "Asistente", icono: "clipboard", abrir: () => abrirAsistente(btn, pasos) });
};
function abrirAsistente(btn, pasos) {
    vibrar(40);
    const destino = btn.numeroWhatsapp || estado.waNegocio;
    const sel = {};
    pasos.forEach((p) => { sel[p.titulo] = p.opciones.indexOf(p.defecto) >= 0 ? p.defecto : p.opciones[0]; });
    const tarjeta = btn.resultado ? h("div", { class: "resultado", "aria-live": "polite" }) : null;
    const enviar = waNumero(destino) ? h("a", { class: "btn-wa", href: "#", target: "_blank", rel: "noopener noreferrer" }, ico("chat"), btn.botonTexto || "Enviar por WhatsApp") : null;
    const refrescar = () => {
        const r = evaluarResultado(btn.resultado, sel);
        if (tarjeta) {
            tarjeta.textContent = "";
            if (r) {
                poner(tarjeta,
                    h("div", { class: "resultado-etiqueta", text: btn.resultado.etiqueta || "Recomendación" }),
                    h("div", { class: "resultado-titulo", text: r.titulo || "" }),
                    r.texto ? h("div", { class: "resultado-texto", text: r.texto }) : null);
            }
            tarjeta.hidden = !r;
        }
        if (enviar) {
            const base = btn.mensaje || ("Hola {negocio}:\n" + pasos.map((p) => "- " + p.titulo + ": {" + p.titulo + "}").join("\n"));
            enviar.href = urlWA(destino, plantilla(base, vars(Object.assign({}, sel, { resultado: r && r.titulo || "", detalle: r && r.texto || "" })))) || "#";
        }
    };
    const grupos = pasos.map((p, idx) => {
        const pills = p.opciones.map((op) => {
            const b = h("button", { class: "pill", type: "button", "aria-pressed": String(sel[p.titulo] === op) }, op);
            b.addEventListener("click", () => {
                sel[p.titulo] = op;
                pills.forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
                vibrar(20);
                refrescar();
            });
            return b;
        });
        return h("div", { class: "campo" },
            h("span", { class: "campo-label", text: (pasos.length > 1 ? (idx + 1) + ". " : "") + p.titulo }),
            h("div", { class: "pills", role: "group", "aria-label": p.titulo }, pills));
    });
    abrirModal({
        titulo: btn.titulo || btn.nombre, icono: nombreIcono(btn.icono, "clipboard"),
        cuerpo: [btn.intro ? h("p", { class: "modal-texto", text: btn.intro }) : null, grupos, tarjeta, btn.aviso ? h("p", { class: "modal-aviso", text: btn.aviso }) : null],
        acciones: enviar ? [enviar] : []
    });
    refrescar();
}

/* ---- calculadora: valor × factor (proteína, dosis, presupuesto…) ---- */
MODULOS.calculadora = (btn) => {
    const c = btn.campo;
    const ops = (Array.isArray(btn.opciones) ? btn.opciones : []).filter((o) => o && o.texto && Number(o.factor) > 0);
    if (!c || !c.etiqueta) falta("'calculadora' necesita 'campo.etiqueta'");
    if (!ops.length) falta("'calculadora' necesita 'opciones' con 'texto' y 'factor' mayor que 0");
    if (!btn.resultado) falta("'calculadora' necesita 'resultado'");
    return botonApp(btn, { nombre: "Calculadora", icono: "calculator", abrir: () => abrirCalculadora(btn, c, ops) });
};
function abrirCalculadora(btn, c, ops) {
    vibrar(40);
    const min = Number(c.min) || 0, max = Number(c.max) || 10000;
    const input = h("input", { class: "input", type: "number", inputmode: "decimal", step: "any", min: String(min), max: String(max), placeholder: c.placeholder || "", "aria-label": c.etiqueta });
    const select = ops.length > 1 ? h("select", { class: "input", "aria-label": "Opción" }, ops.map((o, i) => h("option", { value: String(i), text: o.texto }))) : null;
    const salida = h("div", { class: "resultado", "aria-live": "polite", hidden: true });
    const calcular = () => {
        const valor = parseFloat(String(input.value).replace(",", "."));
        salida.hidden = false; salida.textContent = "";
        if (!(valor > min && valor <= max)) {
            salida.append(h("div", { class: "resultado-texto", text: "Introduce un valor válido (entre " + min + " y " + max + (c.unidad ? " " + c.unidad : "") + ")." }));
            return;
        }
        const op = ops[select ? Number(select.value) : 0];
        const dec = Math.min(Math.max(Number(btn.resultado.decimales) || 0, 0), 3);
        const res = valor * Number(op.factor);
        poner(salida,
            h("div", { class: "resultado-etiqueta", text: btn.resultado.texto || "Resultado" }),
            h("div", { class: "resultado-grande", text: res.toLocaleString("es-ES", { minimumFractionDigits: dec, maximumFractionDigits: dec }) + (btn.resultado.unidad ? " " + btn.resultado.unidad : "") }),
            btn.resultado.nota ? h("div", { class: "resultado-texto", text: btn.resultado.nota }) : null);
        vibrar(30);
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); calcular(); } });
    abrirModal({
        titulo: btn.titulo || btn.nombre, icono: nombreIcono(btn.icono, "calculator"),
        cuerpo: [
            btn.intro ? h("p", { class: "modal-texto", text: btn.intro }) : null,
            h("div", { class: "campo" }, h("span", { class: "campo-label", text: c.etiqueta }), input),
            select ? h("div", { class: "campo" }, h("span", { class: "campo-label", text: btn.etiquetaOpciones || "Objetivo" }), select) : null,
            h("button", { class: "btn-oro", type: "button", onclick: calcular }, btn.botonTexto || "Calcular"),
            salida,
            btn.aviso ? h("p", { class: "modal-aviso", text: btn.aviso }) : null
        ]
    });
}

/* ---- opinion: DOS vías iguales para todos (Google o comentario privado) ----
   Sin estrellas, sin filtro por nota, mismo tamaño y peso visual. */
function urlGerencia(valor) {
    const n = waNumero(valor) || estado.waNegocio;
    if (!n) return null;
    let texto = "";
    const m = /[?&]text=([^&#]*)/.exec(String(valor || ""));
    if (m) { try { texto = decodeURIComponent(m[1].replace(/\+/g, " ")); } catch (e) { texto = ""; } }
    return urlWA(n, texto || plantilla("Hola {negocio}, quería enviar un comentario sobre mi visita.", vars()));
}

/* =========================== COMPATIBILIDAD CON LA v1 =========================== */
// Tipos antiguos cuyo contenido estaba escrito dentro del motor: ahora se definen en el JSON.
const LEGACY = {
    configurador_kebab: "asistente", test_ergonomico: "asistente", ergonomia: "asistente", test_desgaste: "asistente",
    tasador_retirada: "asistente", logistica: "asistente", calc_proteina: "calculadora",
    guia_alergenos_kebab: "info", guia_creatina: "info", carnet_vacunacion: "info", checklist_parto: "info",
    checklist: "info", triaje_urgencias: "info"
};
function normalizar(data) {
    let d;
    try { d = JSON.parse(JSON.stringify(data)); } catch (e) { return null; }
    if (!d || typeof d !== "object" || !Array.isArray(d.secciones)) return d;
    d.secciones.forEach((sec) => {
        if (!sec || typeof sec !== "object") return;
        if (!Array.isArray(sec.botones)) sec.botones = [];
        // Bloque de reseñas v1 (estrellas con filtro) -> bloque v2 de dos botones iguales
        if (sec.escudoResenas || sec.urlGoogleResenas) {
            if (!sec.botones.some((b) => b && b.tipo === "opinion")) {
                sec.botones.push({ tipo: "opinion", urlGoogle: sec.urlGoogleResenas, whatsappGerencia: sec.whatsappGerencia });
            }
        }
        sec.botones.forEach((b) => {
            if (!b || typeof b !== "object") return;
            if (b.tipo === "recuperar_llaves") b.tipo = "llaves";
            if (!b.tipo) b.tipo = b.url && /\.vcf$/i.test(b.url) ? "vcard" : (b.url ? "enlace" : "");
            if (b.tipo === "vcard" && b.url && /contacto\.vcf$/i.test(b.url)) delete b.url; // marcador de la v1: se genera al vuelo
        });
    });
    return d;
}
function validarRaiz(d) {
    if (!d || typeof d !== "object" || Array.isArray(d)) return "El JSON no es un objeto";
    if (!d.nombre || typeof d.nombre !== "string") return "Falta 'nombre'";
    if (!Array.isArray(d.secciones)) return "Falta 'secciones'";
    return null;
}
function resolverWANegocio(d) {
    let n = waNumero(d.whatsapp);
    if (n) return n;
    for (let i = 0; i < d.secciones.length; i++) {
        const sec = d.secciones[i];
        if (!sec) continue;
        n = waNumero(sec.whatsappGerencia); if (n) return n;
        const bs = Array.isArray(sec.botones) ? sec.botones : [];
        for (let j = 0; j < bs.length; j++) {
            const b = bs[j];
            if (!b) continue;
            if (typeof b.whatsappGerencia === "string") { n = waNumero(b.whatsappGerencia); if (n) return n; }
            if (typeof b.url === "string" && /^https:\/\/wa\.me\//i.test(b.url)) { n = waNumero(b.url); if (n) return n; }
        }
    }
    return "";
}

/* =============================== RENDER DEL MENÚ =============================== */
function renderMenu(d) {
    const menu = $("dynamic-menu");
    menu.textContent = "";
    d.secciones.forEach((sec, si) => {
        if (!sec || typeof sec !== "object") { aviso("Sección " + (si + 1) + ": no es un objeto"); return; }
        const normales = sec.botones.filter((b) => b && b.tipo !== "opinion" && b.tipo !== "parking").length;
        const bloque = h("div", { class: "apps-menu" + (normales >= 2 && !sec.botones.some((b) => b && b.tipo === "opinion") ? " grid" : "") });
        let pintados = 0;
        sec.botones.forEach((btn, bi) => {
            const donde = "Sección " + (si + 1) + ", botón " + (bi + 1) + " (" + ((btn && btn.nombre) || "sin nombre") + ")";
            try {
                if (!btn || typeof btn !== "object") falta("no es un objeto");
                const tipo = String(btn.tipo || "").toLowerCase();
                const modulo = MODULOS[tipo];
                if (!modulo) {
                    falta(LEGACY[tipo]
                        ? 'tipo antiguo "' + tipo + '": define el contenido en el JSON con el tipo "' + LEGACY[tipo] + '"'
                        : 'falta "tipo" o es desconocido ("' + tipo + '")');
                }
                bloque.append(modulo(btn));
                pintados++;
            } catch (e) { aviso(donde + ": " + e.message); }
        });
        if (pintados) {
            if (sec.titulo) menu.append(h("div", { class: "section-title", text: sec.titulo }));
            menu.append(bloque);
        }
    });
    if (!menu.children.length) menu.append(h("div", { class: "error-box" }, ico("info"), h("p", { text: "Esta terminal aún no tiene acciones configuradas." })));
}

/* ================================ IDENTIDAD ================================ */
function recortarLogo(img) {
    try {
        const w = img.naturalWidth, hh = img.naturalHeight;
        if (!w || !hh) return null;
        const esc = Math.min(1, 600 / Math.max(w, hh)), cw = Math.round(w * esc), ch = Math.round(hh * esc);
        const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
        const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0, cw, ch);
        const px = cx.getImageData(0, 0, cw, ch).data;
        const fondo = [px[0], px[1], px[2], px[3]];
        if (fondo[3] > 240) img.dataset.fondo = "rgb(" + fondo[0] + "," + fondo[1] + "," + fondo[2] + ")";
        const vacio = (i) => px[i + 3] < 16 || (fondo[3] > 240 && Math.abs(px[i] - fondo[0]) + Math.abs(px[i + 1] - fondo[1]) + Math.abs(px[i + 2] - fondo[2]) < 24);
        let x0 = cw, y0 = ch, x1 = -1, y1 = -1;
        for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
            if (!vacio((y * cw + x) * 4)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
        }
        if (x1 < 0) return null;
        const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
        if (bw * bh > cw * ch * 0.8) return null; /* ya está ajustado */
        const m = Math.round(Math.max(bw, bh) * 0.04);
        const sx = Math.max(0, x0 - m), sy = Math.max(0, y0 - m), sw = Math.min(cw - sx, bw + 2 * m), sh = Math.min(ch - sy, bh + 2 * m);
        const out = document.createElement("canvas"); out.width = Math.round(sw / esc); out.height = Math.round(sh / esc);
        out.getContext("2d").drawImage(img, sx / esc, sy / esc, sw / esc, sh / esc, 0, 0, out.width, out.height);
        return out.toDataURL("image/png");
    } catch (e) { return null; } /* imagen de otro dominio: se deja tal cual */
}
function cargarLogo(d) {
    const img = $("hub-logo"), caja = $("hub-logo-box");
    const textoLogo = () => {
        const ini = String(d.nombre || "").replace(/[^\p{L}\p{N} ]/gu, " ").trim().split(/\s+/).filter(Boolean);
        const letras = ini.length > 1 ? ini[0][0] + ini[1][0] : (ini[0] || "·").slice(0, 1);
        caja.textContent = ""; caja.className = "marca monograma"; caja.setAttribute("aria-hidden", "true");
        caja.append(document.createTextNode(letras.toUpperCase())); caja.hidden = false;
        $("portada").classList.remove("con-logotipo");
    };
    const crudo = String(d.logo || "");
    if (!/^(https:\/\/[^\s"'<>]+|[\w\-./]+)$/.test(crudo)) { textoLogo(); return; }
    const archivo = crudo.replace(/^(\.\/|\/|\.\.\/|c\/)+/, "");
    let rutas = [crudo];
    if (!/^https:/i.test(crudo)) {
        rutas.push("./" + archivo, "../" + archivo, "./c/" + archivo);
        if (CONFIG.respaldoGitHub) {
            const base = CONFIG.respaldoGitHub.replace("{cod}.json", "");
            rutas.push(base + archivo, base.replace(/c\/$/, "") + archivo);
        }
    }
    rutas = rutas.filter((r, i) => rutas.indexOf(r) === i);
    let intento = 0;
    img.alt = d.nombre;
    let recortado = false;
    img.onload = () => {
        /* Quita los márgenes transparentes o blancos del PNG para que el logo se vea grande (solo imágenes del propio sitio) */
        if (!recortado) {
            recortado = true;
            const nuevo = recortarLogo(img);
            if (nuevo) { img.src = nuevo; return; }
        }
        const ratio = img.naturalWidth / Math.max(1, img.naturalHeight);
        const ancha = ratio >= 1.6;
        caja.className = "marca" + (ancha ? " ancha" : "");
        if (img.dataset.fondo && !d.fondoLogo) caja.style.background = img.dataset.fondo; /* el marco toma el color de fondo del propio logo */
        /* Un logo apaisado suele llevar ya el nombre escrito: el título pasa a segundo plano */
        $("portada").classList.toggle("con-logotipo", ancha && d.nombreGrande !== true);
        caja.hidden = false;
    };
    img.onerror = () => {
        intento++;
        if (intento < rutas.length) img.src = rutas[intento];
        else { img.remove(); textoLogo(); }
    };
    img.src = rutas[0];
}
/* Tipografía de marca: estilo del JSON ("fuente") o deducido del tipo de negocio */
const FUENTES = {
    moderna: { familia: "Bricolage Grotesque", pesos: "600;700;800" },
    elegante: { familia: "Fraunces", pesos: "600;700" },
    impacto: { familia: "Archivo Black", pesos: "400" },
    limpia: { familia: "Outfit", pesos: "600;700;800" },
    urbana: { familia: "Unbounded", pesos: "600;700;800" }
};
function estiloFuente(d) {
    const pedido = String(d.fuente || "").toLowerCase();
    if (FUENTES[pedido]) return pedido;
    if (pedido === "sistema") return "";
    const t = (String(d.nombre || "") + " " + String(d.subtitulo || "")).toLowerCase();
    if (/cl[ií]nic|dental|dra\.?|doctor|m[eé]dic|fisio|nutri|salud|psic|abogad|asesor|seguro/.test(t)) return "limpia";
    if (/u[ñn]as|est[eé]tic|bell?eza|pesta[ñn]|spa|peluq|novia|joyer|boutique/.test(t)) return "elegante";
    if (/tattoo|tatu|barber|skate|street|graffiti|urban/.test(t)) return "urbana";
    if (/kebab|burger|hamburg|pizza|comida|bar\b|tapas|asador|grill|food|doggo|perrito/.test(t)) return "impacto";
    return "moderna";
}
function aplicarFuente(d) {
    const est = estiloFuente(d), f = FUENTES[est];
    document.documentElement.dataset.fuente = est || "sistema";
    if (!f) return;
    const href = "https://fonts.googleapis.com/css2?family=" + f.familia.replace(/ /g, "+") + ":wght@" + f.pesos + "&display=swap";
    if (!document.querySelector('link[data-fuente]')) {
        const l = document.createElement("link"); l.rel = "stylesheet"; l.href = href; l.dataset.fuente = est; document.head.appendChild(l);
    } else document.querySelector('link[data-fuente]').href = href;
    document.documentElement.style.setProperty("--display", '"' + f.familia + '", ' + "var(--fuente)");
}
function aplicarIdentidad(d) {
    aplicarFuente(d);
    const acento = hexValido(d.colorAcento, "#00E5FF");
    const principal = hexValido(d.colorPrincipal, "#0B0C10");
    const fondoLogo = colorCss(d.fondoLogo, "#0B0C10");
    estado.acento = acento;
    const root = document.documentElement.style;
    root.setProperty("--color-acento", acento);
    root.setProperty("--acento", acento);
    root.setProperty("--acento-rgb", rgbDeHex(acento).join(","));
    root.setProperty("--color-principal", principal);
    root.setProperty("--fondo-logo", fondoLogo);
    if (/^(\d{2,3}px|100%)$/.test(d.logoAnchoMax || "")) root.setProperty("--logo-max", d.logoAnchoMax);
    if (/^\d{2,3}px$/.test(d.logoAlto || "")) root.setProperty("--logo-alto", d.logoAlto);
    if (/^\d{1,2}px( \d{1,2}px)?$/.test(d.paddingLogo || "")) root.setProperty("--logo-pad", d.paddingLogo);
    $("hub").classList.toggle("tema-industrial", d.tema === "industrial");
    document.title = d.nombre + " | Studio 42";
    $("client-name").textContent = d.nombre;
    $("client-name").classList.toggle("largo", String(d.nombre || "").length > 22);
    $("client-subtitle").textContent = d.subtitulo || "";
    const badge = String(d.textoBadge || "").trim();
    $("badge-text").textContent = badge;
    $("badge").hidden = !badge;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", "#0d0f13");
    cargarLogo(d);
}

/* ================================== CARGA ================================== */
async function pedirJSON(url) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), CONFIG.tiempoLimiteMs);
    try {
        const r = await fetch(url, { cache: "no-cache", signal: ctrl.signal });
        if (r.status === 404) return { noEncontrado: true };
        if (!r.ok) return { error: true };
        const texto = await r.text();
        try { return { data: JSON.parse(texto) }; } catch (e) { return { noEncontrado: true }; } // p. ej. una página HTML de "no encontrado"
    } catch (e) { return { error: true }; }
    finally { clearTimeout(t); }
}
async function cargarConfig(cod) {
    const urls = CONFIG.rutasJSON.map((r) => r.replace("{cod}", cod));
    if (CONFIG.respaldoGitHub) urls.push(CONFIG.respaldoGitHub.replace("{cod}", cod));
    let huboError = false;
    for (let i = 0; i < urls.length; i++) {
        const r = await pedirJSON(urls[i]);
        if (r.data) return { data: r.data };
        if (r.error) huboError = true;
    }
    return { error: huboError ? "red" : "noencontrado" };
}

function mostrarError(tipo) {
    const menu = $("dynamic-menu");
    menu.textContent = "";
    const msg = tipo === "red" ? "No pudimos cargar esta terminal. Comprueba tu conexión e inténtalo de nuevo."
        : tipo === "config" ? "Esta terminal tiene la configuración incompleta."
        : "Terminal no encontrada.";
    menu.append(h("div", { class: "error-box" },
        ico("alert"), h("p", { text: msg }),
        tipo === "red" ? h("button", { class: "btn-oro", type: "button", onclick: () => location.reload() }, "Reintentar") : null));
    if (estado.debug) mostrarDebug();
}
function mostrarDebug() {
    const p = $("debug-panel");
    p.hidden = false;
    p.textContent = "";
    poner(p,
        h("div", null, h("b", { text: "Motor v3.0" }), " · cod=" + estado.cod + " · llavero=" + estado.llavero + " · mesa=" + estado.mesa),
        h("div", null, "WhatsApp del negocio: " + (estado.waNegocio ? "sí" : "NO")),
        h("div", null, h("b", { text: "Avisos (" + estado.avisos.length + "):" })),
        estado.avisos.length ? estado.avisos.map((a) => h("div", { text: "• " + a })) : h("div", { text: "Sin avisos. Configuración correcta." }));
}

async function iniciar() {
    montarSprite();
    const p = new URLSearchParams(window.location.search);
    estado.debug = p.get("debug") === "1";
    estado.llavero = limpiarParam(p.get("k") || p.get("key"), "MOSTRADOR");
    estado.mesa = limpiarParam(p.get("mesa"), "Barra");
    const cod = soloSlug(p.get("cod") || p.get("id") || "demo", null);
    if (!cod) { mostrarError("noencontrado"); return; }
    estado.cod = cod;

    const r = await cargarConfig(cod);
    if (r.error) { mostrarError(r.error); return; }

    /* Redirección a una landing a medida (los soportes ya grabados siguen funcionando).
       Solo rutas del propio sitio. Se conserva el código de pieza (?k=). Con ?debug=1 no redirige. */
    const destino = r.data && r.data.redirigir;
    if (typeof destino === "string" && /^\/(?!\/)[\w\-\/.?=&%]*$/.test(destino) && !estado.debug) {
        const u = new URL(destino, location.origin);
        const k = p.get("k") || p.get("key");
        if (k && !u.searchParams.has("k")) u.searchParams.set("k", limpiarParam(k, "MOSTRADOR"));
        if (p.get("preview")) u.searchParams.set("preview", "1");
        location.replace(u.pathname + u.search);
        return;
    }

    const d = normalizar(r.data);
    const problema = validarRaiz(d);
    if (problema) { aviso(problema); mostrarError("config"); return; }

    estado.data = d;
    estado.negocio = String(d.nombre).trim();
    estado.waNegocio = resolverWANegocio(d);
    if (Number(d.version) > 2) aviso("El JSON es de una versión posterior (" + d.version + "); puede que algunas funciones no se muestren.");

    aplicarIdentidad(d);
    if (d.pausada === true) { mostrarPausa(d); return; }
    renderMenu(d);
    montarDock(d);
    montarCompartir();
    if (estado.debug) mostrarDebug();
    contar("vista");
    document.addEventListener("click", clasificarClic, true);
}


/* ===================== DOCK DE ACCIONES RÁPIDAS (v3) =====================
   Se rellena solo con lo que el negocio ya tiene en su JSON. Si hay menos de 2 acciones, no se muestra. */
function buscarBoton(d, fn) {
    for (let i = 0; i < d.secciones.length; i++) {
        const bs = (d.secciones[i] && d.secciones[i].botones) || [];
        for (let j = 0; j < bs.length; j++) { const r = bs[j] && fn(bs[j]); if (r) return r; }
    }
    return null;
}
function montarDock(d) {
    const dock = $("dock");
    dock.textContent = "";
    const acc = [];
    const resena = buscarBoton(d, (b) => {
        if (b.tipo !== "opinion") return null;
        const g = urlSegura(b.urlGoogle);
        return g && !/^https:\/\/(www\.)?(maps\.google\.[a-z.]+|google\.[a-z.]+\/maps)\/?$/i.test(g) ? g : null;
    });
    const ruta = buscarBoton(d, (b) => {
        const u = urlSegura(b.url || b.urlMaps);
        return u && /google\.[a-z.]+\/maps|maps\.app\.goo\.gl|maps\.google|goo\.gl\/maps/i.test(u) ? u : null;
    }) || (typeof d.direccion === "string" && d.direccion.trim() ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(d.direccion.trim()) : null);
    const telNum = waNumero(d.telefono);
    const wa = estado.waNegocio ? urlWA(estado.waNegocio, plantilla("Hola {negocio}, ", vars())) : null;
    if (wa) acc.push({ href: wa, icono: "chat", texto: "WhatsApp" });
    if (telNum) acc.push({ href: "tel:+" + telNum, icono: "phone", texto: "Llamar" });
    if (ruta) acc.push({ href: ruta, icono: "nav", texto: "Cómo llegar" });
    if (resena) acc.push({ href: resena, icono: "star", texto: "Reseña", principal: true });
    if (acc.length < 2) { dock.hidden = true; document.documentElement.style.setProperty("--dock-alto", "0px"); return; }
    acc.slice(0, 4).forEach((x) => {
        dock.append(h("a", { href: x.href, class: x.principal ? "principal" : null,
            target: /^https:/.test(x.href) ? "_blank" : null, rel: /^https:/.test(x.href) ? "noopener noreferrer" : null }, ico(x.icono), x.texto));
    });
    dock.hidden = false;
    document.documentElement.style.setProperty("--dock-alto", "76px");
}
function montarCompartir() {
    const b = $("btn-compartir");
    if (!navigator.share) return;
    b.textContent = ""; b.append(ico("share")); b.hidden = false;
    b.addEventListener("click", () => {
        const url = location.origin + location.pathname + "?cod=" + encodeURIComponent(estado.cod);
        navigator.share({ title: estado.negocio, text: estado.negocio, url: url }).then(() => contar("enlace")).catch(() => {});
    });
}

/* Servicio en pausa (lo activa Studio 42 si la suscripción no está al día). */
function mostrarPausa(d) {
    const menu = $("dynamic-menu");
    menu.textContent = "";
    menu.append(h("div", { class: "error-box" }, ico("clock"),
        h("p", { text: "Este espacio digital de " + String(d.nombre).trim() + " está en pausa temporalmente." }),
        h("p", { text: "Disculpa las molestias. Vuelve a intentarlo más tarde." })));
}

/* ---------- Contador anónimo: solo cliente, pieza (k) y tipo de acción ---------- */
function contar(tipo) {
    if (!CONFIG.estadisticas || estado.debug || /[?&]preview=1/.test(location.search)) return;
    try {
        const cuerpo = JSON.stringify({ accion: "ev", c: estado.cod, k: estado.llavero, t: tipo });
        const blob = new Blob([cuerpo], { type: "text/plain" });
        if (!(navigator.sendBeacon && navigator.sendBeacon(CONFIG.estadisticas, blob))) {
            fetch(CONFIG.estadisticas, { method: "POST", body: cuerpo, mode: "no-cors", keepalive: true }).catch(() => {});
        }
    } catch (e) { /* nunca debe romper la landing */ }
}
function clasificarClic(e) {
    const a = e.target.closest && e.target.closest("a[href]");
    if (!a) {
        // Botones que abren una herramienta (reserva, Bizum, calculadora, guía…): también cuentan
        const b = e.target.closest && e.target.closest("button.app-btn");
        if (b) contar("herramienta");
        return;
    }
    const u = a.getAttribute("href") || "";
    const t = /writereview|g\.page\/r|search\.google\.com\/local/.test(u) ? "resena"
        : /wa\.me|whatsapp/.test(u) ? (a.classList.contains("par-opinion") || /gerencia/i.test(a.textContent) ? "gerencia" : "whatsapp")
        : /^tel:/.test(u) ? "llamada"
        : /google\.[a-z.]+\/maps|maps\.app|maps\.google/.test(u) ? "ruta"
        : /^https?:/.test(u) ? "enlace" : "";
    if (t) contar(t);
}

/* Vista previa desde el panel de Studio 42 (?preview=1 dentro de un iframe del mismo dominio):
   el panel envía un JSON sin publicar y se pinta aquí sin tocar GitHub. */
function pintarPrevia(raw) {
    const d = normalizar(raw);
    const problema = validarRaiz(d);
    if (problema) { aviso(problema); mostrarError("config"); return; }
    estado.avisos = [];
    estado.data = d;
    estado.negocio = String(d.nombre).trim();
    estado.waNegocio = resolverWANegocio(d);
    aplicarIdentidad(d);
    renderMenu(d);
    montarDock(d);
}
if (new URLSearchParams(location.search).get("preview") === "1" && window.parent !== window) {
    window.addEventListener("message", (e) => {
        if (e.origin !== location.origin || !e.data || e.data.tipo !== "s42-preview" || !e.data.json) return;
        try { pintarPrevia(e.data.json); } catch (err) { console.warn(err); }
    });
}

document.addEventListener("DOMContentLoaded", iniciar);

})();

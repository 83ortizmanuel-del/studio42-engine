<div class="w-full flex flex-col items-center bg-white p-5 rounded-2xl border border-gray-200 shadow-sm text-center">
            <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">¿Te hemos atendido bien?</p>
            <p class="text-[11px] text-gray-400 mb-3">Valora tu experiencia con nosotros</p>
            
            <!-- LAS 5 ESTRELLAS COMPLETAS -->
            <div class="flex justify-center gap-2 text-3xl star-rating mb-2" id="escudo-estrellas">
                <i class="fa-solid fa-star star-inactive" onclick="procesarResenaReal(1)"></i>
                <i class="fa-solid fa-star star-inactive" onclick="procesarResenaReal(2)"></i>
                <i class="fa-solid fa-star star-inactive" onclick="procesarResenaReal(3)"></i>
                <i class="fa-solid fa-star star-inactive" onclick="procesarResenaReal(4)"></i>
                <i class="fa-solid fa-star star-inactive" onclick="procesarResenaReal(5)"></i>
            </div>
        </div>

    </main>

    <footer class="mt-8 text-center text-[10px] text-gray-400 font-semibold tracking-widest uppercase">
        Desarrollado por <span class="text-black font-extrabold">Studio 42</span>
    </footer>

    <script>
        const GOOGLE_REVIEW_URL = "https://search.google.com/local/writereview?placeid=TU_PLACE_ID_AQUI";
        const WHATSAPP_GERENCIA = "https://wa.me/34646546315?text=Hola,%20quisiera%20comentar%20un%20detalle%20de%20mi%20atención%20en%20Copy%20Laser";

        function procesarResenaReal(estrellas) {
            const stars = document.querySelectorAll('#escudo-estrellas i');
            stars.forEach((star, index) => {
                if (index < estrellas) {
                    star.classList.remove('star-inactive');
                    star.classList.add('star-active');
                } else {
                    star.classList.remove('star-active');
                    star.classList.add('star-inactive');
                }
            });

            setTimeout(() => {
                if (estrellas >= 4) {
                    // 4 o 5 Estrellas -> Redirige a Google
                    window.location.href = GOOGLE_REVIEW_URL;
                } else {
                    // 1, 2 o 3 Estrellas -> Abre Modal de WhatsApp
                    mostrarModalShield();
                }
            }, 300);
        }

        function mostrarModalShield() {
            const overlay = document.getElementById('modal-overlay');
            const btn = document.getElementById('modal-action-btn');
            
            overlay.style.display = 'flex';
            setTimeout(() => overlay.style.opacity = '1', 10);

            btn.onclick = function() {
                window.location.href = WHATSAPP_GERENCIA;
            };
        }
    </script>
</body>
</html>

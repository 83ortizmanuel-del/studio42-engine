<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio 42 | Phygital Art Gallery</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --color-oro: #facc15;
            --color-fondo: #050507;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--color-fondo);
            color: #ffffff;
            overflow-x: hidden;
        }

        .bg-tech-grid {
            background-image: radial-gradient(rgba(250, 204, 21, 0.05) 1px, transparent 0);
            background-size: 28px 28px;
        }

        .art-card-wrapper {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            padding: 1.5px;
            background: rgba(20, 20, 22, 0.8);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(250, 204, 21, 0.15);
        }

        .art-card-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                transparent 0%, 
                rgba(250, 204, 21, 0.6) 50%, 
                rgba(255, 255, 255, 0.8) 52%, 
                rgba(250, 204, 21, 0.6) 54%, 
                transparent 100%
            );
            animation: rotateNeon 10s linear infinite;
            z-index: 0;
        }

        @keyframes rotateNeon {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .art-content {
            position: relative;
            background: rgba(14, 14, 17, 0.96);
            border-radius: 26.5px;
            z-index: 1;
            backdrop-filter: blur(16px);
        }

        .glow-image {
            filter: drop-shadow(0 0 15px rgba(250, 204, 21, 0.25));
        }

        .btn-gold {
            background: linear-gradient(135deg, #facc15 0%, #eab308 50%, #ca8a04 100%);
            color: #000;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.3);
        }
    </style>
</head>

<body class="min-h-screen bg-tech-grid flex flex-col items-center justify-center p-4 text-white select-none">

    <div class="w-full max-w-md art-card-wrapper my-6">
        <main class="art-content p-6 text-center">
            
            <!-- BADGE DE AUTENTICIDAD DE OBRA -->
            <div class="inline-flex items-center gap-2 bg-black/80 px-3 py-1 rounded-full border border-[#FACC15]/40 mb-4">
                <i class="fa-solid fa-certificate text-[#FACC15] text-xs"></i>
                <span id="obra-edicion" class="text-[10px] font-black text-[#FACC15] uppercase tracking-widest">Sello Phygital Activo</span>
            </div>

            <!-- LIENZO / OBRA DE ARTE -->
            <div class="relative overflow-hidden rounded-2xl border border-white/10 mb-4 bg-black/50 min-h-[200px] flex items-center justify-center">
                <img id="obra-img" src="" alt="Obra Phygital Anime" class="w-full h-auto object-cover glow-image hidden" onload="this.classList.remove('hidden')">
                <span id="loader-img" class="text-xs text-gray-500 font-bold uppercase animate-pulse">Cargando Obra...</span>
            </div>

            <!-- TÍTULO Y PERSONAJE -->
            <h1 id="obra-titulo" class="text-2xl font-black uppercase text-white tracking-wider">Cargando...</h1>
            <p id="obra-artista" class="text-xs text-[#FACC15] font-bold uppercase tracking-widest mt-1 mb-4">Studio 42 Phygital Collection</p>

            <!-- REPRODUCTOR DE AUDIO / LORE NARRADO -->
            <div id="contenedor-audio" class="hidden bg-white/5 p-4 rounded-2xl border border-white/10 mb-5 text-left">
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-volume-high text-[#FACC15]"></i> Voice-Over & Lore de la Obra
                </p>
                <audio id="obra-audio" controls class="w-full h-10 accent-[#FACC15]"></audio>
            </div>

            <!-- HISTORIA DE LA OBRA -->
            <div class="bg-black/40 p-4 rounded-2xl border border-white/5 text-left mb-5">
                <h3 class="text-[10px] font-bold uppercase tracking-widest text-[#FACC15] mb-1">Historia & Lore</h3>
                <p id="obra-historia" class="text-xs text-gray-300 leading-relaxed font-medium">Cargando la historia del personaje...</p>
            </div>

            <!-- ACCIONES EXCLUSIVAS PARA EL COMPRADOR -->
            <div class="space-y-3">
                <a id="btn-wallpaper" href="#" target="_blank" class="block w-full py-3 text-center text-xs btn-gold">
                    <i class="fa-solid fa-download mr-1"></i> Descargar Wallpaper 4K Exclusivo
                </a>
            </div>

        </main>
    </div>

    <footer class="text-center text-[10px] text-gray-500 font-bold tracking-widest uppercase mb-4">
        Phygital Art Engine // Powered by <span class="text-[#FACC15]">Studio 42</span>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const obraId = urlParams.get('id') || 'vegeta-prince';

            try {
                // Obtener el JSON desde la misma carpeta /art/
                const response = await fetch(`./${obraId}.json?v=${new Date().getTime()}`);
                if (!response.ok) throw new Error("Obra no encontrada");
                
                const data = await response.json();

                document.getElementById('obra-titulo').innerText = data.titulo || "Sin Título";
                document.getElementById('obra-artista').innerText = `Artista: ${data.artista || 'Colección Privada'}`;
                document.getElementById('obra-edicion').innerText = `Certificado NFC #${data.edicion || '01/01'}`;
                
                const imgEl = document.getElementById('obra-img');
                const loaderEl = document.getElementById('loader-img');
                
                imgEl.src = data.imagen || `./${obraId}.png`;
                imgEl.onload = () => {
                    imgEl.classList.remove('hidden');
                    if(loaderEl) loaderEl.classList.add('hidden');
                };

                document.getElementById('obra-historia').innerText = data.historia || "Sin historia registrada.";

                if (data.audio) {
                    const audioEl = document.getElementById('obra-audio');
                    audioEl.src = data.audio;
                    document.getElementById('contenedor-audio').classList.remove('hidden');
                }

                if (data.wallpaper) {
                    document.getElementById('btn-wallpaper').href = data.wallpaper;
                } else {
                    document.getElementById('btn-wallpaper').classList.add('hidden');
                }

            } catch (err) {
                console.error("Error cargando la obra:", err);
                document.getElementById('obra-titulo').innerText = "Obra Phygital Desconectada";
                document.getElementById('obra-historia').innerText = "Asegúrate de que el archivo .json exista en la carpeta /art/ de GitHub.";
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio 42 | Phygital Art Gallery</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --color-primario: #3B82F6;
            --color-acento: #A855F7;
            --color-fondo: #05070F;
            --aura-neon: rgba(59, 130, 246, 0.65);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--color-fondo);
            color: #ffffff;
            overflow-x: hidden;
        }

        .bg-tech-grid {
            background-image: radial-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 0);
            background-size: 28px 28px;
        }

        .art-card-wrapper {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            padding: 1.5px;
            background: rgba(20, 20, 25, 0.8);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 35px var(--aura-neon);
        }

        .art-card-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                transparent 0%, 
                var(--color-primario) 45%, 
                #ffffff 50%, 
                var(--color-acento) 55%, 
                transparent 100%
            );
            animation: rotateNeon 8s linear infinite;
            z-index: 0;
        }

        @keyframes rotateNeon {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .art-content {
            position: relative;
            background: rgba(10, 12, 20, 0.96);
            border-radius: 26.5px;
            z-index: 1;
            backdrop-filter: blur(16px);
        }

        .glow-image {
            filter: drop-shadow(0 0 20px var(--aura-neon));
        }

        .btn-phygital {
            background: linear-gradient(135deg, var(--color-primario) 0%, var(--color-acento) 100%);
            color: #ffffff;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px;
            box-shadow: 0 0 20px var(--aura-neon);
        }
    </style>
</head>

<body class="min-h-screen bg-tech-grid flex flex-col items-center justify-center p-4 text-white select-none">

    <div class="w-full max-w-md art-card-wrapper my-6">
        <main class="art-content p-6 text-center">
            
            <!-- BADGE DE AUTENTICIDAD -->
            <div class="inline-flex items-center gap-2 bg-black/80 px-3 py-1.5 rounded-full border border-blue-500/40 mb-4 shadow-lg">
                <i class="fa-solid fa-shield-halved text-blue-400 text-xs"></i>
                <span id="obra-edicion" class="text-[9px] font-black text-blue-300 uppercase tracking-widest">Verificando Certificado...</span>
            </div>

            <!-- LIENZO / OBRA DE ARTE -->
            <div class="relative overflow-hidden rounded-2xl border border-white/10 mb-4 bg-black/60 min-h-[220px] flex items-center justify-center">
                <img id="obra-img" src="" alt="Obra Phygital Anime" class="w-full h-auto object-cover glow-image hidden">
                <span id="loader-img" class="text-xs text-blue-400 font-bold uppercase animate-pulse">Sincronizando Lienzo Phygital...</span>
            </div>

            <!-- TÍTULO Y DETALLES -->
            <h1 id="obra-titulo" class="text-xl font-black uppercase text-white tracking-wider">Cargando...</h1>
            <p id="obra-sub" class="text-xs font-bold uppercase tracking-widest mt-1 mb-4" style="color: var(--color-primario);">Studio 42 Art Division</p>

            <!-- REPRODUCTOR DE AUDIO / LORE -->
            <div id="contenedor-audio" class="hidden bg-white/5 p-4 rounded-2xl border border-white/10 mb-4 text-left">
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1 flex items-center gap-2">
                    <i class="fa-solid fa-compact-disc text-blue-400 animate-spin"></i> Track: <span id="track-nombre" class="text-white">Voice-Over</span>
                </p>
                <audio id="obra-audio" controls class="w-full h-9 mt-2 accent-blue-500"></audio>
                <p id="obra-lore" class="text-xs text-gray-300 italic font-medium mt-3 border-t border-white/10 pt-2 leading-relaxed"></p>
            </div>

            <!-- FRASES ICÓNICAS -->
            <div id="contenedor-voces" class="hidden bg-blue-950/30 p-4 rounded-2xl border border-blue-500/20 mb-4 text-center">
                <p id="frase-texto" class="text-xs font-black text-blue-200 italic">«...»</p>
            </div>

            <!-- CERTIFICADO DE VERIFICACIÓN -->
            <div class="bg-black/50 p-3 rounded-2xl border border-white/10 text-left mb-4 text-[10px] space-y-1">
                <div class="flex justify-between items-center">
                    <span class="text-gray-400 font-bold uppercase">Código Verificación:</span>
                    <span id="cert-codigo" class="text-blue-400 font-mono font-black">---</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-400 font-bold uppercase">Estado:</span>
                    <span id="cert-estado" class="text-green-400 font-bold">VERIFICADO</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-400 font-bold uppercase">Propietario:</span>
                    <span id="cert-dueno" class="text-purple-300 font-bold">---</span>
                </div>
            </div>

            <!-- ACCIONES -->
            <div class="space-y-2.5">
                <a id="btn-wallpaper" href="#" target="_blank" class="block w-full py-3 text-center text-xs btn-phygital">
                    <i class="fa-solid fa-download mr-1"></i> Descargar Wallpaper 4K Exclusivo
                </a>

                <a id="btn-whatsapp" href="#" target="_blank" class="block w-full py-3 text-center text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-black uppercase rounded-full tracking-wider shadow-lg transition-colors">
                    <i class="fa-brands fa-whatsapp mr-1"></i> Registrar Lienzo en WhatsApp VIP
                </a>
            </div>

        </main>
    </div>

    <footer class="text-center text-[10px] text-gray-500 font-bold tracking-widest uppercase mb-4">
        Phygital Art Engine // Powered by <span class="text-blue-400 font-black">Studio 42</span>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const obraId = urlParams.get('id') || 'vegeta-prince';
            const audioEl = document.getElementById('obra-audio');

            // PAUSAR AUDIO AUTOMÁTICAMENTE AL SALIR O CAMBIAR DE PESTAÑA/APP
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && audioEl) {
                    audioEl.pause();
                }
            });

            window.addEventListener('pagehide', () => {
                if (audioEl) {
                    audioEl.pause();
                }
            });

            try {
                const response = await fetch(`./${obraId}.json?v=${new Date().getTime()}`);
                if (!response.ok) throw new Error("JSON no encontrado");
                
                const data = await response.json();

                if (data.estetica) {
                    if (data.estetica.color_primario) document.documentElement.style.setProperty('--color-primario', data.estetica.color_primario);
                    if (data.estetica.color_acento) document.documentElement.style.setProperty('--color-acento', data.estetica.color_acento);
                    if (data.estetica.color_fondo) document.documentElement.style.setProperty('--color-fondo', data.estetica.color_fondo);
                    if (data.estetica.aura_neon) document.documentElement.style.setProperty('--aura-neon', data.estetica.aura_neon);
                }

                document.getElementById('obra-titulo').innerText = data.titulo_obra || "Sin Título";
                document.getElementById('obra-sub').innerText = `${data.personaje || ''} // ${data.serie_anime || ''}`;
                document.getElementById('obra-edicion').innerText = data.edicion_limitada || "Edición Única";

                const imgEl = document.getElementById('obra-img');
                const loaderEl = document.getElementById('loader-img');
                const srcImg = data.imagen_lienzo.startsWith('http') || data.imagen_lienzo.startsWith('./') 
                    ? data.imagen_lienzo 
                    : `./${data.imagen_lienzo}`;

                imgEl.src = srcImg;
                imgEl.onload = () => {
                    imgEl.classList.remove('hidden');
                    if (loaderEl) loaderEl.classList.add('hidden');
                };

                if (data.audio_experience && data.audio_experience.voice_over_url) {
                    document.getElementById('track-nombre').innerText = data.audio_experience.titulo_track || "Banda Sonora";
                    audioEl.src = data.audio_experience.voice_over_url;
                    document.getElementById('obra-lore').innerText = `"${data.audio_experience.transcripcion_lore}"`;
                    document.getElementById('contenedor-audio').classList.remove('hidden');
                }

                if (data.voces_personaje && data.voces_personaje.frase_texto) {
                    document.getElementById('frase-texto').innerText = data.voces_personaje.frase_texto;
                    document.getElementById('contenedor-voces').classList.remove('hidden');
                }

                if (data.certificado_autenticidad) {
                    document.getElementById('cert-codigo').innerText = data.certificado_autenticidad.codigo_verificacion || 'S42-NFC-VERIFIED';
                    document.getElementById('cert-estado').innerText = data.certificado_autenticidad.estado || 'VERIFICADO';
                    document.getElementById('cert-dueno').innerText = data.certificado_autenticidad.propietario_registrado || 'Sin registrar';
                }

                if (data.easter_eggs && data.easter_eggs.wallpaper_4k_download) {
                    const srcWall = data.easter_eggs.wallpaper_4k_download.startsWith('http') || data.easter_eggs.wallpaper_4k_download.startsWith('./') 
                        ? data.easter_eggs.wallpaper_4k_download 
                        : `./${data.easter_eggs.wallpaper_4k_download}`;
                    document.getElementById('btn-wallpaper').href = srcWall;
                }

                if (data.club_coleccionistas && data.club_coleccionistas.whatsapp_artista) {
                    document.getElementById('btn-whatsapp').href = data.club_coleccionistas.whatsapp_artista;
                }

            } catch (err) {
                console.error("Error cargando el JSON:", err);
            }
        });
    </script>
</body>
</html>
